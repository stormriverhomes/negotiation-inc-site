const S = {
  phase:'crew',            // crew → scope → job → sale → done
  spent: 0, holding: 0,
  condIdx: 0, targetIdx: 0,
  day: 0, jobDays: 0, paused: false, speed: 1,
  crew: null, scope: null, craftBonus: 0,
  wallsDone: false, changeOrdered: false,
  offers: [], saleDay: 0, log: [],
};

/* ── drawing ── */
function renderHouse(){
  const g = $('hc').getContext('2d');
  drawCardArt(g, { ...HOUSE, condition: LADDER[S.condIdx] });
  if (S.phase === 'job') scaffold(g);
  const c = $('cond'); c.textContent = LADDER[S.condIdx];
}
/* scaffolding: poles, planks, a dumpster. Drawn over the finished scene so
   the site reads as a SITE while the job runs. */
function scaffold(g){
  g.save();
  const cx = ART_W/2, gy = 130;
  const pole = 'rgba(122,106,78,0.96)', plank = 'rgba(158,142,108,0.98)', shade='rgba(60,52,38,0.9)';
  for (const px of [cx-58, cx-20, cx+20, cx+58]){
    g.fillStyle = pole; g.fillRect(px, 44, 2, gy-44);
    g.fillStyle = shade; g.fillRect(px+2, 44, 1, gy-44);
  }
  for (const py of [58, 86, 114]){
    g.fillStyle = plank; g.fillRect(cx-62, py, 124, 3);
    g.fillStyle = shade; g.fillRect(cx-62, py+3, 124, 1);
  }
  g.fillStyle = '#3d4650'; g.fillRect(8, gy-12, 34, 14);         // dumpster
  g.fillStyle = '#2f3740'; g.fillRect(8, gy-12, 34, 3);
  g.fillStyle = '#8a5a2a'; g.fillRect(12, gy-16, 7, 4);          // debris
  g.fillStyle = '#c8bfa8'; g.fillRect(24, gy-15, 9, 3);
  g.restore();
}
function stepCondition(){
  S.condIdx++;
  renderHouse();
  const f = $('flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const c = $('cond'); c.classList.add('up'); setTimeout(()=>c.classList.remove('up'), 900);
  if (!reduced) sparks($('hc'), 14);
  note('The place turned a corner — <b>' + LADDER[S.condIdx] + '</b> now.');
}

/* ── ui plumbing ── */
function say(who, html, tone, noteHtml){
  $('who').textContent = who;
  const l = $('line'); l.className = 'line' + (tone ? ' '+tone : ''); l.innerHTML = html;
  $('notewrap').innerHTML = noteHtml ? '<div class="note">'+noteHtml+'</div>' : '';
}
function acts(list){
  $('acts').innerHTML = '';
  list.forEach(([label, cls, cost, fn]) => {
    const b = document.createElement('button');
    b.className = 'btn ' + (cls||''); b.onclick = fn;
    b.innerHTML = label + (cost ? '<span class="k">'+cost+'</span>' : '');
    $('acts').appendChild(b);
  });
}
function hud(){
  $('worth').textContent = money(HOUSE.arv);
  $('cash').textContent = money(Bank.cash());
  const hb = $('hold'); if (hb) hb.textContent = money(HOLD);
  $('basis').textContent = money(BOUGHT + S.spent + S.holding);
}
const note = t => { S.log.unshift(t); $('log').innerHTML =
  S.log.slice(0,8).map(x=>'<div>'+x+'</div>').join(''); };
function spend(n, what){
  Bank.spend(n, 'spent');
  S.spent += n; hud();
  const el = $('cash').parentElement; el.classList.add('hit');
  setTimeout(()=>el.classList.remove('hit'), 520);
  if (what) note('Paid <b>'+money(n)+'</b> — '+what+'.');
}
function sparks(from, n=20){
  const r = from.getBoundingClientRect();
  for (let i=0;i<n;i++){
    const s = document.createElement('div'); s.className='spark';
    s.style.background = i%3 ? 'var(--gold)' : 'var(--pays)';
    s.style.left = (r.left+r.width/2)+'px'; s.style.top = (r.top+r.height*0.45)+'px';
    document.body.appendChild(s);
    const a = Math.random()*Math.PI*2, d = 60+Math.random()*140;
    s.animate([{transform:'translate(0,0) scale(1)',opacity:1},
      {transform:'translate('+(Math.cos(a)*d)+'px,'+(Math.sin(a)*d+90)+'px) scale(.3)',opacity:0}],
      {duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>s.remove();
  }
}

/* ── PHASE 1: THE CREW ───────────────────────────────────────────────────
   Three real choices, not one right answer. The cheap crew costs days, the
   fast crew costs money, and the flaky artist is genuinely the best value
   IF you can absorb a disappeared week — which is a bankroll question, so
   the right pick depends on the player, not the card. */
const crews = [0,1,2].map(i => mintPerson('contractor', 7100 + i*397));
crews[0].stats = [4,2,3,5]; crews[0].note = 'Bids it and holds it. Slow as weather.';
crews[1].stats = [2,5,3,4]; crews[1].note = 'In and out. You pay for the speed.';
crews[2].stats = [4,3,5,2]; crews[2].note = 'Finish work is beautiful. Vanishes.';
const priceMul = c => 1.28 - c.stats[0]*0.068;      // Price 5 → ×0.94, 1 → ×1.21
const paceMul  = c => 1.42 - c.stats[1]*0.11;       // Pace  5 → ×0.87
const vanishP  = c => 0.13 - c.stats[3]*0.022;      // Shows 5 → 2%/day

function pips(v){ return '<span class="pips">' +
  Array.from({length:5},(_,i)=>'<i class="'+(i<v?'on':'')+'"></i>').join('') + '</span>'; }

function phaseCrew(){
  S.phase = 'crew'; renderHouse(); hud();
  $('choices').innerHTML = '';
  crews.forEach((c) => {
    const el = document.createElement('button'); el.className = 'ch';
    el.innerHTML = '<div class="nm">'+c.name+'</div>'+
      '<div class="note2">“'+c.note+'”</div>'+
      '<div class="row"><span>Price</span>'+pips(c.stats[0])+'<u>'+c.stats[0]+'</u></div>'+
      '<div class="row"><span>Pace</span>'+pips(c.stats[1])+'<u>'+c.stats[1]+'</u></div>'+
      '<div class="row"><span>Craft</span>'+pips(c.stats[2])+'<u>'+c.stats[2]+'</u></div>'+
      '<div class="row"><span>Shows</span>'+pips(c.stats[3])+'<u>'+c.stats[3]+'</u></div>';
    el.onclick = () => { S.crew = c; S.craftBonus = Math.max(0,(c.stats[2]-3))*0.015;
      note('<b>'+c.name+'</b> is on the job.'); phaseScope(); };
    $('choices').appendChild(el);
  });
}

/* ── PHASE 2: THE SCOPE ──────────────────────────────────────────────────
   The one decision the whole flip turns on, and the middle answer is right
   for THIS street — which the game says out loud on the expensive card,
   because the lesson is not a gotcha. */
/* scope prices come off the house's own repair number: the cheap option is
   under half the bid, doing it right IS the bid, the studs are half again
   on top. Fixed dollars would be nonsense on a $1.4m house. */
const REP = HOUSE.repairs;
const SCOPES = [
  { k:'safe',  n:'Safe and clean', d:'Boards off, roof tight, everything works. Rentable, not pretty.',
    cost:Math.round(REP*0.42), days:10, target:2 },
  { k:'right', n:'Make it right',  d:'Full cosmetic and mechanical. What the buyers on this street expect.',
    cost:Math.round(REP*1.00), days:22, target:3 },
  { k:'studs', n:'To the studs',   d:'Everything new, down to the framing. The best house on the block.',
    cost:Math.round(REP*1.48), days:34, target:4,
    warn:(DNAME[HOUSE.district]||'This street') + ' caps out near ' + money(HOUSE.arv*DISTRICT_CAP) +
         ' no matter what you build. Comps do not pay you back for marble.' },
];
function phaseScope(){
  S.phase = 'scope';
  say(S.crew.name, '“Walk me through what you want done. Three ways to do this place.”');
  acts([]);
  $('choices').innerHTML = '';
  SCOPES.forEach(sc => {
    const cost = Math.round(sc.cost * priceMul(S.crew));
    const days = Math.round(sc.days * paceMul(S.crew));
    const el = document.createElement('button'); el.className = 'ch';
    el.disabled = !Bank.canAfford(cost);
    el.innerHTML = '<div class="nm">'+sc.n+'</div><div class="d">'+sc.d+'</div>'+
      '<div class="meta"><b class="money">'+money(cost)+'</b><b class="time">'+days+' days</b>'+
      '<b>→ '+LADDER[sc.target]+'</b></div>'+
      (sc.warn ? '<div class="warnline">'+sc.warn+'</div>' : '');
    el.onclick = () => startJob(sc, cost, days);
    $('choices').appendChild(el);
  });
}

/* ── PHASE 3: THE JOB — where time runs ──────────────────────────────────
   Days tick on their own once you break ground. The clock only stops when
   the site needs a decision, and every stop is a real trade: money for
   days, days for money, or scope for either. */
let timer = null;
function startJob(sc, cost, days){
  S.scope = sc; S.targetIdx = sc.target;
  S.jobDays = days; S.day = 0; S.phase = 'job';
  spend(cost, 'the contract, half up front');
  $('choices').innerHTML = '';
  $('ring').hidden = false;
  const c = $('runc'), C = 2*Math.PI*19;
  c.style.strokeDasharray = C; c.style.strokeDashoffset = C;
  say(S.crew.name, '“Crew’s there Monday, seven sharp.”', 'yes');
  acts([[ S.speed === 1 ? 'Fast-forward' : 'Real time', 'dark', '', toggleSpeed ]]);
  renderHouse();
  note('<b>Broke ground.</b> ' + sc.n + ', ' + days + ' days on the board.');
  runClock();
}
function toggleSpeed(){ S.speed = S.speed === 1 ? 3 : 1;
  acts([[ S.speed === 1 ? 'Fast-forward' : 'Real time', 'dark', '', toggleSpeed ]]); }
function runClock(){
  clearInterval(timer);
  timer = setInterval(() => { if (!S.paused) tick(); }, reduced ? 90 : 820 / S.speed);
}
function tick(){
  S.day++; S.holding += HOLD;
  Bank.spend(HOLD, 'holding', { holdingDays: (S.holding / HOLD) | 0 });
  hud();
  $('dayn').textContent = S.day;
  const C = 2*Math.PI*19;
  $('runc').style.strokeDashoffset = C * (1 - Math.min(1, S.day/S.jobDays));

  /* condition steps at even fractions of the job — the boards come off in
     the first third, and the last coat of paint is genuinely the last day */
  const steps = S.targetIdx;      // from 0 up to target
  const due = Math.floor((S.day / S.jobDays) * steps);
  if (due > S.condIdx && S.condIdx < S.targetIdx) stepCondition();

  if (S.day >= S.jobDays) return finishJob();

  /* events — each one pauses the world and asks for a call */
  if (!S.wallsDone && S.day >= Math.max(2, (S.jobDays/6)|0)){ S.wallsDone = true; return evWalls(); }
  if (S.scope.k !== 'safe' && !S.changeOrdered && S.day === ((S.jobDays*0.55)|0)) return evChangeOrder();
  if (Math.random() < vanishP(S.crew)) return evVanish();
}
function pauseWorld(){ S.paused = true; }
function resumeWorld(){ S.paused = false; say('The site', 'Work rolling.', null); acts([[ S.speed === 1 ? 'Fast-forward' : 'Real time', 'dark', '', toggleSpeed ]]); }

function evWalls(){
  pauseWorld();
  const hit = Math.round(REP * (0.07 + Math.random()*0.10) * (1 - S.craftBonus*4));
  say(S.crew.name, '“Opened the walls. You want the bad news standing up or sitting down — there’s <em>'+money(hit)+'</em> in here the bid couldn’t see.”', 'no',
    'Every wall hides something. Craft on the crew shrinks how bad it is.');
  acts([
    ['Fix it properly', 'pay', money(hit), () => { spend(hit, 'what the walls were hiding'); resumeWorld(); }],
    ['Patch over it', 'warn', 'value −'+money(6500), () => {
      S.craftBonus -= 0.02; note('<b>Patched over it.</b> The appraiser will find it. They always do.');
      resumeWorld(); }],
  ]);
}
function evChangeOrder(){
  pauseWorld();
  const kitchen = Math.round(HOUSE.arv * 0.028);
  say(S.crew.name, '“While we’re in here — I could do you a proper chef’s kitchen for <em>'+money(kitchen)+'</em>. It’d be the nicest one on the street.”', null,
    'The nicest kitchen on the street, on a street that does not pay for kitchens. This is how flips die.');
  acts([
    ['Do the kitchen', 'warn', money(kitchen)+' · +'+money(Math.round(kitchen*0.38))+' value', () => {
      S.changeOrdered = true; spend(kitchen, 'the kitchen nobody asked for');
      S.craftBonus += 0.010; resumeWorld(); }],
    ['Stick to the scope', 'pay', '', () => { S.changeOrdered = true;
      note('<b>Held the scope.</b> The plan is the plan.'); resumeWorld(); }],
  ]);
}
function evVanish(){
  pauseWorld();
  const lost = 2 + (Math.random()*3|0);
  say('The site', 'Nobody showed. Phone rings out. The neighbour says the truck hasn’t been by since Tuesday.', 'no',
    'Shows was ' + S.crew.stats[3] + ' — this is what that number means.');
  acts([
    ['Wait it out', '', lost+' days', () => { S.day += 0; S.jobDays += lost;
      note('<b>Waited.</b> '+lost+' days gone to a ghost crew.'); resumeWorld(); }],
    ['Fly in a second crew', 'pay', money(Math.round(REP*0.04)), () => { spend(Math.round(REP*0.04), 'a crew that answers the phone');
      resumeWorld(); }],
  ]);
}

/* ── PHASE 4: THE SALE ───────────────────────────────────────────────────
   Offers arrive over days against what you actually built, capped by what
   the street actually pays. Holding keeps ticking, so waiting for the big
   one is itself a bet. */
function finishJob(){
  clearInterval(timer);
  $('ring').hidden = true; S.phase = 'sale';
  while (S.condIdx < S.targetIdx) stepCondition();
  renderHouse();
  const worth = achievable();
  say('The sign is up', 'Finished, photographed, listed. The street can see the difference from the corner — now it bids.', 'yes',
    'Worth about <b>'+money(worth)+'</b> as built. Every day on market is another '+money(HOLD)+'.');
  S.saleDay = 0; S.offers = [];
  timer = setInterval(() => { if (!S.paused) saleTick(); }, reduced ? 90 : 900);
  acts([]);
}
function achievable(){
  const base = VALUE[LADDER[S.condIdx]] ?? 0.78;
  return Math.round(HOUSE.arv * Math.min(DISTRICT_CAP, base + S.craftBonus)
       + (S.changeOrdered ? Math.round(HOUSE.arv * 0.011) : 0));
}
function saleTick(){
  S.saleDay++; S.holding += HOLD;
  Bank.spend(HOLD, 'holding', { holdingDays: (S.holding / HOLD) | 0 });
  hud();
  const worth = achievable();
  const due = { 2:0.93, 5:0.965, 9:1.0 }[S.saleDay];
  if (due){
    pauseWorld();
    const o = Math.round(worth * due * (0.99 + Math.random()*0.02));
    S.offers.push(o);
    const net = o*(1-FEE) - BOUGHT - S.spent - S.holding;
    say('Offer ' + S.offers.length, '“<em>'+money(o)+'</em>, financed, thirty-day close.”',
      net > 0 ? 'yes' : 'no',
      'Nets about <b>'+money(net)+'</b> after the agent and everything in it so far.' +
      (S.saleDay < 9 ? ' Stronger offers tend to come — and holding keeps costing.' : ' This is the last one coming.'));
    acts([
      ['Take it', 'pay', 'net '+money(net), () => settle(o)],
      ['Hold out', '', money(HOLD)+'/day', () => resumeWorldSale()],
    ]);
  }
  if (S.saleDay >= 13){ pauseWorld();
    const o = Math.round(worth * 0.90);
    say('The market', 'Thirteen days, no more showings. One buyer left, and they know it.', 'no');
    acts([['Take '+money(o), 'warn', '', () => settle(o)]]);
  }
}
function resumeWorldSale(){ S.paused = false; say('The sign', 'Still up. The street is thinking.', null); acts([]); }

function settle(price){
  clearInterval(timer); S.phase = 'done'; S.paused = true;
  const fee = Math.round(price*FEE);
  const profit = price - fee - BOUGHT - S.spent - S.holding;
  Bank.earn(price - fee, 'flip', { flipAddr: HOUSE.address + ', sold' });
  Bank.keep({ address: HOUSE.address, arv: HOUSE.arv, repairs: HOUSE.repairs,
    ask: HOUSE.ask, paid: BOUGHT, rent: HOUSE.rent, made: profit,
    situation: HOUSE.situation, exit: 'flip', district: HOUSE.district,
    sky: HOUSE.sky, style: HOUSE.style, iso: Deals.todayKey(),
    dayIndex: Bank.kept().length + 1 });
  hud();
  say('Closed', 'Keys handed over on a ' + LADDER[S.condIdx] + ' house you bought boarded.', profit>0?'yes':'no');
  acts([['Run it again','', '', () => location.reload()]]);
  const line = (k,v,neg) => '<div class="r'+(neg?' neg':'')+'"><span>'+k+'</span><b>'+(neg?'−':'')+money(Math.abs(v))+'</b></div>';
  const el = document.createElement('div'); el.className='settle';
  el.innerHTML = '<h2>The settlement</h2>' +
    line('Sold', price) + line('Agent and closing', fee, 1) +
    line('Bought', BOUGHT, 1) + line('The work', S.spent, 1) +
    line('Holding, '+((S.holding/HOLD)|0)+' days', S.holding, 1) +
    '<div class="r tot'+(profit<0?' loss':'')+'"><span>'+(profit>=0?'You made':'You lost')+'</span><b id="pf">$0</b></div>';
  $('choices').innerHTML = ''; $('choices').appendChild(el);
  const pf = el.querySelector('#pf'), t0 = performance.now(), ms = 900;
  (function step(t){ const k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3);
    pf.textContent = money(profit*e); if(k<1) requestAnimationFrame(step); })(t0);
  if (profit > 0 && !reduced) sparks(el, 26);
  note('<b>Closed at '+money(price)+'.</b> ' + (profit>=0?'Made':'Lost') + ' ' + money(Math.abs(profit)) + '.');
}

/* you already own this one — the courthouse took the money before the
   screen opened, so it is charged on arrival rather than pretended away.
   sessionStorage, not local: reloading the page must not re-buy the house,
   but tomorrow's session should. */
if (!sessionStorage.getItem('ni.rehab.bought')){
  Bank.spend(BOUGHT, 'bought', { boughtName: HOUSE.address });
  sessionStorage.setItem('ni.rehab.bought', '1');
}
$('who').textContent = HOUSE.address;
$('line').innerHTML = 'Bought at the courthouse steps for <em>' + money(BOUGHT) +
  '</em>. ' + (HOUSE.situation === 'vacant' ? 'Boarded, vacant two years, and the neighbours have opinions.'
   : HOUSE.situation === 'probate' ? 'An estate sale. Nobody has lived here since the funeral.'
   : HOUSE.situation === 'preforeclose' ? 'The bank was three weeks from taking it.'
   : HOUSE.situation === 'tired' ? 'The last landlord stopped answering the phone.'
   : HOUSE.situation === 'divorce' ? 'Two names on the deed and neither wants it.'
   : 'It sat on the market all summer and nobody came.') + ' Pick your crew.';
hud(); renderHouse(); phaseCrew();
document.title = 'ready';
</script>
