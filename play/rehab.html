<style>
/* ── THE REHAB ────────────────────────────────────────────────────────────
   The flip loop, and the first one where TIME is the medium. You pick a
   crew, you pick a scope, and then the days RUN — the house on screen is
   redrawn from its actual condition state as the job advances, so the
   renovation is something you watch happen to the picture, not a bar
   filling next to it. The art engine already knows five conditions
   (derelict → rough → tired → kept → pristine); a rehab is literally the
   house walking up that ladder, boards off first, and the game pauses the
   clock only when the job needs a decision out of you.

   Mobile-first from here on: every control ≥44px tall, nothing depends on
   hover, the layout stacks under 720px, safe-area insets respected. This
   file is written as a phone game that also runs on a desktop, because
   that is the order the ports will happen in. */
:root{
  --ink:#1b2027; --mid:#5c6572; --dim:#8b939c; --line:#d9d3c4;
  --stock:#f6f3ea; --paper:#fffdf7;
  --pays:#2a6a44; --refuses:#8a3a32; --gold:#e8cf72; --goldink:#8b7440;
  --ring:#2f6a8a; --day:#3f5a6d;
  --e-out:cubic-bezier(.2,.8,.3,1); --e-pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--stock);background:#0b111b;overflow-x:hidden;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
#bg{position:fixed;top:0;left:0;right:0;z-index:0;image-rendering:pixelated;width:100%;height:auto;
  filter:saturate(.92) contrast(1.03)}
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,17,27,.88) 0%,rgba(11,17,27,.60) 9%,
    rgba(11,17,27,.34) 20%,rgba(11,17,27,.72) 30%,rgba(11,17,27,.96) 37%,#0b111b 43%,#0b111b 100%)}
.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:26px 18px 70px}
h1{font-family:Fraunces,Georgia,serif;font-size:29px;margin:0;letter-spacing:-.02em;
  text-shadow:0 2px 3px rgba(0,0,0,.9),0 4px 18px rgba(0,0,0,.8)}
.sub{color:#b9c2cc;font-size:13.5px;margin:2px 0 16px;text-shadow:0 1px 3px rgba(0,0,0,.95)}

.hud{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:118px;background:rgba(255,253,247,.96);color:var(--ink);
  border-radius:11px;padding:10px 13px;box-shadow:0 14px 30px -20px rgba(0,0,0,.9)}
.stat i{display:block;font-style:normal;font:600 8.5px/1 ui-sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.stat b{font:700 19px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.stat.pays b{color:var(--pays)} .stat.gold b{color:var(--goldink)} .stat.bad b{color:var(--refuses)}
.stat.hit b{animation:bankhit .5s var(--e-pop)}
@keyframes bankhit{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ── the site ── */
.site{display:grid;grid-template-columns:minmax(0,538px) 1fr;gap:14px;margin-bottom:14px}
@media(max-width:860px){.site{grid-template-columns:1fr}}
.house{position:relative;background:rgba(255,253,247,.10);border-radius:14px;overflow:hidden;
  box-shadow:0 22px 50px -26px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.07) inset}
.house canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.house .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.house .flash.go{animation:condflash .55s var(--e-out)}
@keyframes condflash{0%{opacity:0}18%{opacity:.55}100%{opacity:0}}
.house .cond{position:absolute;left:12px;top:11px;font:700 10px/1 ui-sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;background:rgba(11,17,27,.72);padding:6px 9px;border-radius:6px;
  transition:background .4s}
.house .cond.up{background:var(--pays)}
.house .dayring{position:absolute;right:11px;top:10px;width:46px;height:46px}
.house .dayring svg{transform:rotate(-90deg)}
.house .dayring circle{fill:none;stroke-width:4}
.house .dayring .track{stroke:rgba(255,255,255,.22)}
.house .dayring .run{stroke:var(--gold);stroke-linecap:round;
  transition:stroke-dashoffset .6s var(--e-out)}
.house .dayring span{position:absolute;inset:0;display:grid;place-items:center;
  font:700 13px/1 ui-monospace,Menlo,monospace;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}

/* ── the office (right column) ── */
.office{background:rgba(255,253,247,.97);color:var(--ink);border-radius:14px;padding:15px 16px;
  display:flex;flex-direction:column;gap:11px;box-shadow:0 18px 40px -22px rgba(0,0,0,.9);min-height:280px}
.office .who{font:600 8.5px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.office .line{font-family:Fraunces,Georgia,serif;font-size:18px;line-height:1.34;letter-spacing:-.01em}
.office .line em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.office .line.no em{color:var(--refuses)} .office .line.yes em{color:var(--pays)}
.office .note{font:500 12px/1.45 ui-sans-serif;color:var(--goldink);
  background:rgba(232,207,114,.16);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 6px 6px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}

/* physical keys, same grammar as The Assignment */
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:44px;
  font:600 13.5px/1.2 ui-sans-serif;padding:11px 15px;border-radius:9px;border:0;
  background:var(--stock);color:var(--ink);cursor:pointer;
  box-shadow:0 4px 0 0 #b9b2a0, 0 8px 16px -8px rgba(0,0,0,.75);
  transform:translateY(0);transition:transform .09s var(--e-out),box-shadow .09s var(--e-out),filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 0 #b9b2a0,0 3px 8px -6px rgba(0,0,0,.7)}
.btn .k{font:700 9px/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 6px;border-radius:5px;background:rgba(27,32,39,.10);color:var(--mid);white-space:nowrap}
.btn.pay{background:var(--pays);color:#eaf4ee;box-shadow:0 4px 0 0 #1c4b30,0 8px 16px -8px rgba(0,0,0,.75)}
.btn.pay:active{box-shadow:0 1px 0 0 #1c4b30,0 3px 8px -6px rgba(0,0,0,.7)}
.btn.pay .k{background:rgba(255,255,255,.16);color:#cfe6d8}
.btn.warn{background:#7c3a32;color:#f7e9e6;box-shadow:0 4px 0 0 #4d221c,0 8px 16px -8px rgba(0,0,0,.75)}
.btn.warn:active{box-shadow:0 1px 0 0 #4d221c,0 3px 8px -6px rgba(0,0,0,.7)}
.btn.warn .k{background:rgba(255,255,255,.14);color:#eccdc6}
.btn.dark{background:#2b3440;color:var(--stock);box-shadow:0 4px 0 0 #151b23,0 8px 16px -8px rgba(0,0,0,.75)}
.btn.dark:active{box-shadow:0 1px 0 0 #151b23,0 3px 8px -6px rgba(0,0,0,.7)}
.btn.dark .k{background:rgba(255,255,255,.12);color:#aab4c0}
.btn:disabled{opacity:.38;cursor:default;transform:translateY(3px);box-shadow:0 1px 0 0 rgba(0,0,0,.3)}

/* ── choice cards (crew, scope, offers) ── */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(216px,1fr));gap:11px}
.ch{position:relative;background:rgba(246,243,234,.97);color:var(--ink);border-radius:11px;
  padding:12px 13px;text-align:left;font:inherit;border:0;cursor:pointer;
  box-shadow:0 3px 0 0 rgba(0,0,0,.18),0 14px 26px -18px rgba(0,0,0,.9);
  transition:transform .15s var(--e-out),box-shadow .15s var(--e-out)}
.ch:hover:not(:disabled){transform:translateY(-3px);
  box-shadow:0 6px 0 0 rgba(0,0,0,.18),0 20px 34px -18px rgba(0,0,0,.9)}
.ch:active:not(:disabled){transform:translateY(0);transition-duration:.06s}
.ch:disabled{opacity:.45;cursor:default}
.ch .nm{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:600;letter-spacing:-.01em}
.ch .d{font:400 11.5px/1.4 ui-sans-serif;color:var(--mid);margin:3px 0 8px}
.ch .meta{display:flex;gap:6px;flex-wrap:wrap}
.ch .meta b{font:700 10px/1 ui-monospace,Menlo,monospace;padding:5px 7px;border-radius:5px;
  background:rgba(27,32,39,.08);color:var(--ink)}
.ch .meta b.money{color:var(--pays)} .ch .meta b.time{color:var(--ring)}
.ch .warnline{margin-top:7px;font:600 10.5px/1.35 ui-sans-serif;color:var(--refuses)}
.ch .row{display:grid;grid-template-columns:40px 1fr auto;gap:6px;align-items:center;
  font:500 8px/1 ui-sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.pips{display:flex;gap:2px}.pips i{flex:1;height:5px;border-radius:2px;background:rgba(0,0,0,.10)}
.pips i.on{background:var(--mid)}
.ch .row u{text-decoration:none;font:700 8.5px/1 ui-monospace,Menlo,monospace;color:var(--ink)}
.ch .note2{font:italic 400 11px/1.3 Georgia,serif;color:var(--mid);margin:2px 0 7px;min-height:26px}

/* settlement table */
.settle{background:rgba(255,253,247,.97);color:var(--ink);border-radius:14px;padding:16px 18px;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.9);max-width:470px}
.settle h2{font-family:Fraunces,Georgia,serif;font-size:21px;margin:0 0 10px;letter-spacing:-.015em}
.settle .r{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:13px;
  border-bottom:1px solid rgba(217,211,196,.6)}
.settle .r b{font:700 13px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.settle .r.neg b{color:var(--refuses)}
.settle .r.tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:6px;padding-top:10px}
.settle .r.tot b{font-size:22px;color:var(--pays)}
.settle .r.tot.loss b{color:var(--refuses)}
.log{margin-top:14px;font:400 12px/1.6 ui-sans-serif;color:#8f99a5}
.log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.log b{color:#cdd5de;font-weight:600}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:99}
.shake{animation:shake .34s ease-in-out}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}
  .btn:active{transform:none}.ch:hover{transform:none}}
</style>

<div class="wrap">
<h1>The Rehab</h1>
<p class="sub">You own this one. Every day it sits, it costs you — and the work only starts when you say so.</p>

<div class="hud">
  <div class="stat gold"><i>Cash</i><b id="cash">$0</b></div>
  <div class="stat"><i>Into it</i><b id="basis">$0</b></div>
  <div class="stat bad"><i>Holding / day</i><b id="hold">$130</b></div>
  <div class="stat pays"><i>Worth done</i><b id="worth">—</b></div>
</div>

<div class="site">
  <div class="house">
    <canvas id="hc" width="184" height="150"></canvas>
    <div class="flash" id="flash"></div>
    <div class="cond" id="cond">—</div>
    <div class="dayring" id="ring" hidden>
      <svg width="46" height="46"><circle class="track" cx="23" cy="23" r="19"/>
      <circle class="run" id="runc" cx="23" cy="23" r="19"/></svg><span id="dayn">0</span>
    </div>
  </div>
  <div class="office">
    <div class="who" id="who">—</div>
    <div class="line" id="line">—</div>
    <div id="notewrap"></div>
    <div class="acts" id="acts"></div>
  </div>
</div>

<div class="choices" id="choices"></div>
<div class="log" id="log"></div>
</div>
<script type="module">

/* engines inlined */
/* THE CARD FACE.
   ─────────────────────────────────────────────────────────────────────────
   Every card in THE TERRITORY is a house somebody actually bought, and this
   is where that house gets drawn. The bar set for it, verbatim: "genuinely
   beautiful and eye popping … hundreds of genuinely unique beautiful
   property cards that people want to collect."

   Two things follow from that, and they pull in opposite directions.

   UNIQUE means the art cannot be one house recoloured. It is built from
   fourteen architectural silhouettes, nine districts, ten skies, five
   condition states and a per-address seed that moves every tree, fence post,
   window and parked car. That is ~63,000 distinct faces before the numbers
   on the card are considered, and none of them is a variant of a hero asset.

   BEAUTIFUL means it cannot be procedural mush, which is what you always get
   when you multiply parameters and hope. So the randomness is fenced hard:
   the seed chooses between *authored* options, never interpolates freely.
   Every palette is a hand-picked six-tone ramp with a deliberate warm/cool
   split between lit and shadowed faces. Every silhouette is drawn, not
   generated. The seed decides which good thing you get, never how good it is.

   And one rule above the rest, inherited from the product this game is a
   door into: THE ART IS DERIVED FROM THE DEAL. A wreck looks like a wreck —
   boarded glass, a tarped roof, a dead lawn — because its repair number is
   large, not because a rarity table said "make this one ugly". A card cannot
   be prettier than the house it records. That is what makes a rare card
   worth having: it is rare because the deal was actually that good.       */

/* ── the dice, fenced ─────────────────────────────────────────────────────
   One stream per card, seeded off the address, so a given house looks the
   same on every device forever — the same guarantee the daily street makes
   about its numbers, extended to its pixels. */
function seedFrom(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed){
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];

/* ── PALETTES ─────────────────────────────────────────────────────────────
   A sky is a six-tone ramp plus a light direction and a colour for what the
   light does to a wall. The warm/cool split is the whole trick: lit faces
   pull toward the sun's hue and shadowed faces pull toward the sky's, which
   is why a dusk card reads as dusk even in a thumbnail the size of a stamp. */
const SKIES = {
  morning: { name:'Morning',      up:'#5f9ac4', mid:'#a7cfe0', low:'#e6ecd8',
             sun:'#fff6d8', sunAt:[0.22,0.22], glow:'#ffe6ab', amb:'#5c7d94',
             lit:'#f2ead8', shade:'#8fa0ae', ink:'#171d27', star:0, weather:'clouds' },
  noon:    { name:'Hard noon',    up:'#4a95c9', mid:'#8fc3de', low:'#d6e4e2',
             sun:'#ffffff', sunAt:[0.74,0.12], glow:'#ffffff', amb:'#7b8f9e',
             lit:'#fbf7ec', shade:'#7d8e9c', ink:'#141a23', star:0, weather:'shadows' },
  gold:    { name:'Golden hour',  up:'#5f7fa8', mid:'#c69a6d', low:'#e8bb84',
             sun:'#ffd894', sunAt:[0.16,0.30], glow:'#ffca7a', amb:'#7a6a6a',
             lit:'#ffdfae', shade:'#7d6b74', ink:'#1a1620', star:0, weather:'clouds' },
  dusk:    { name:'Dusk',         up:'#2e3560', mid:'#7a4f6d', low:'#c97a5c',
             sun:'#ffb46b', sunAt:[0.80,0.34], glow:'#ff9f5e', amb:'#4a4a6b',
             lit:'#e9a97e', shade:'#4b4864', ink:'#0e0f1c', star:6, weather:'clouds' },
  night:   { name:'Night',        up:'#0d1430', mid:'#16204a', low:'#243258',
             sun:'#dfe7ff', sunAt:[0.78,0.16], glow:'#9fb4e8', amb:'#25304f',
             lit:'#3d4a72', shade:'#222c4c', ink:'#05070f', star:34, weather:'clear' },
  storm:   { name:'Storm',        up:'#2b3441', mid:'#465264', low:'#77828e',
             sun:'#cdd6de', sunAt:[0.5,0.1], glow:'#aeb9c4', amb:'#414b57',
             lit:'#98a3ae', shade:'#4d5764', ink:'#0d1219', star:0, weather:'rain' },
  snow:    { name:'Snowfall',     up:'#7f95ad', mid:'#b4c6d4', low:'#e8eef2',
             sun:'#ffffff', sunAt:[0.3,0.14], glow:'#eef4f8', amb:'#8b98a5',
             lit:'#eef2f5', shade:'#94a1ad', ink:'#161c24', star:0, weather:'snow' },
  fog:     { name:'Fog',          up:'#8e97a0', mid:'#9ba3ab', low:'#adb4b9',
             sun:'#c9ced3', sunAt:[0.5,0.2], glow:'#c9ced3', amb:'#8a929a',
             lit:'#c3c9ce', shade:'#8b939b', ink:'#1b2027', star:0, weather:'fog' },
  smoke:   { name:'Wildfire sky', up:'#7a4230', mid:'#b06a3c', low:'#d99a56',
             sun:'#ff8c42', sunAt:[0.62,0.26], glow:'#ff8c42', amb:'#6d4534',
             lit:'#e5a870', shade:'#6a4740', ink:'#170e0c', star:0, weather:'ash' },
  rainbow: { name:'After the rain',up:'#3f78a8', mid:'#8fc0d2', low:'#dbe6d6',
             sun:'#fff4d2', sunAt:[0.18,0.18], glow:'#ffe9b8', amb:'#6f8496',
             lit:'#f4eddc', shade:'#8798a6', ink:'#151b24', star:0, weather:'bow' },
};

/* A district decides what the ground is made of, what grows in it, and what
   is on the horizon — the three things that make two identical houses read as
   two different places. */
const DISTRICTS = {
  oldtown:   { name:'Old Town',      grass:'#8ea472', soil:'#6f7d5c', road:'#3f4854', walk:'#8a9299',
               tree:'#4b6b46', trunk:'#4a3b2c', far:'skyline', wall:['#b8a894','#a2907c','#8d7c68'], trim:'#f0e8d8' },
  heights:   { name:'The Heights',   grass:'#9db478', soil:'#7b8a63', road:'#454e5a', walk:'#949ca3',
               tree:'#3f6340', trunk:'#453727', far:'hills',   wall:['#d8cdb8','#c2b49c','#a89880'], trim:'#ffffff' },
  flats:     { name:'The Flats',     grass:'#8b9a6b', soil:'#77704f', road:'#3b444f', walk:'#838b92',
               tree:'#5a6b42', trunk:'#463a2b', far:'water',   wall:['#9aa6ac','#87939a','#727f87'], trim:'#e6ecef' },
  mill:      { name:'Mill District', grass:'#7d8a63', soil:'#6b6349', road:'#39414b', walk:'#7d858c',
               tree:'#4d6440', trunk:'#3f3427', far:'stacks',  wall:['#a8756a','#8f5f56','#754c45'], trim:'#e2d6c6' },
  orchard:   { name:'Orchard Row',   grass:'#9cb279', soil:'#7f8a5e', road:'#424b56', walk:'#8f979e',
               tree:'#5c7a44', trunk:'#4e3d2b', far:'orchard', wall:['#e2d3ae','#cbbc96','#b0a17c'], trim:'#fdf6e4' },
  harbor:    { name:'Harbour',       grass:'#8aa07c', soil:'#6d7a63', road:'#3e4752', walk:'#88909a',
               tree:'#476b52', trunk:'#443628', far:'cranes',  wall:['#8fa9b4','#7a949f','#657e8a'], trim:'#f2f6f7' },
  ridge:     { name:'The Ridge',     grass:'#a9b477', soil:'#8b8a5e', road:'#474f59', walk:'#969ea5',
               tree:'#5d7845', trunk:'#4a3c2b', far:'mountain',wall:['#c9b79b','#b2a086','#9a8970'], trim:'#fbf3e2' },
  bottoms:   { name:'The Bottoms',   grass:'#7f9166', soil:'#665f47', road:'#363e48', walk:'#787f86',
               tree:'#42603c', trunk:'#3c3025', far:'trees',   wall:['#9c9384','#867e70','#6f685c'], trim:'#ded6c6' },
  terrace:   { name:'Sunset Terrace',grass:'#a3b276', soil:'#87895e', road:'#454d58', walk:'#939ba2',
               tree:'#527345', trunk:'#4b3c2b', far:'desert',  wall:['#e0b394','#c89b7e','#ad8467'], trim:'#fff2e0' },
};

/* ── ARCHITECTURE ─────────────────────────────────────────────────────────
   Fourteen silhouettes, authored. A style is a set of proportions and a set
   of features that are TRUE of that style — a foursquare has a hipped roof
   and a dormer because a foursquare has a hipped roof and a dormer, not
   because a die said so. The seed picks between them; it never blends them,
   because blended architecture is the exact look of generated slop. */
const STYLES = {
  bungalow:  { w:[52,62], h:[20,24], roof:'gable', pitch:0.30, floors:1, porch:'full',   chimney:1, dormer:0, cols:3 },
  craftsman: { w:[50,58], h:[22,26], roof:'gable', pitch:0.34, floors:1, porch:'tapered',chimney:1, dormer:1, cols:3 },
  ranch:     { w:[64,76], h:[18,21], roof:'hip',   pitch:0.18, floors:1, porch:'stoop',  chimney:1, dormer:0, cols:4, garage:1 },
  foursquare:{ w:[44,50], h:[34,40], roof:'hip',   pitch:0.22, floors:2, porch:'full',   chimney:1, dormer:1, cols:2 },
  colonial:  { w:[48,56], h:[36,42], roof:'gable', pitch:0.26, floors:2, porch:'stoop',  chimney:2, dormer:0, cols:3, shutters:1 },

  farmhouse: { w:[46,54], h:[34,40], roof:'gable', pitch:0.38, floors:2, porch:'wrap',   chimney:1, dormer:0, cols:2, barn:1 },
  cape:      { w:[44,52], h:[22,26], roof:'steep', pitch:0.46, floors:1, porch:'stoop',  chimney:1, dormer:2, cols:2 },
  shotgun:   { w:[28,34], h:[22,26], roof:'gablef',pitch:0.40, floors:1, porch:'stoop',  chimney:1, dormer:0, cols:1 },

  aframe:    { w:[38,46], h:[14,18], roof:'aframe',pitch:1.15, floors:1, porch:'deck',   chimney:1, dormer:0, cols:1, glass:1 },

  mill:      { w:[30,36], h:[20,24], roof:'gablef',pitch:0.42, floors:1, porch:'stoop',  chimney:1, dormer:0, cols:2 },
  minimal:   { w:[42,50], h:[18,22], roof:'gable', pitch:0.22, floors:1, porch:'stoop',  chimney:1, dormer:0, cols:2 },
  raised:    { w:[56,66], h:[26,32], roof:'gable', pitch:0.22, floors:2, porch:'stoop',  chimney:1, dormer:0, cols:3, garage:1 },
  block:     { w:[50,58], h:[16,19], roof:'flat',  pitch:0.05, floors:1, porch:'stoop',  chimney:0, dormer:0, cols:3 },
  logcabin:  { w:[42,50], h:[18,22], roof:'gable', pitch:0.34, floors:1, porch:'full',   chimney:1, dormer:0, cols:2 },

const STYLE_KEYS = Object.keys(STYLES);

/* condition is read off the repair number, so the picture cannot lie */
function conditionOf(repairShare){
  if (repairShare < 0.045) return 'pristine';
  if (repairShare < 0.09)  return 'kept';
  if (repairShare < 0.145) return 'tired';
  if (repairShare < 0.20)  return 'rough';
  return 'derelict';
}

/* ── the drawing ─────────────────────────────────────────────────────────── */
/* ── THE WINDOW GOT TALLER ────────────────────────────────────────────────
   116px of art was sized around a house this engine DREW, and a drawn house
   can be any size I want. A generated sprite cannot: PixelLab hands back a
   128-square, the house inside it is about 113 tall, and squeezing that into
   a 40px band between horizon and kerb means resampling pixel art by 0.57 —
   which is the one thing you must never do to pixel art. Every hard edge it
   has, which is the entire reason it looks good, turns to porridge.

   So the frame moves instead of the art. 150 gives the sprite its full
   height at 1:1, and the side effect is the composition a collectible card
   wanted anyway: the house is the hero, big in frame, breaking the horizon
   line, with the sky behind its roof rather than a strip above it. */
const ART_W = 184, ART_H = 150;   // 184 leaves the sprite air on both sides

/* ── SPRITE REGISTRY ──────────────────────────────────────────────────────
   A style with a hand-generated sprite uses it; a style without one falls
   back to the procedural house, and both go through the same lighting pass
   so a half-finished set never looks half-finished. */
/* Keys are 'style' or 'style:condition'. The condition form is how the rare
   art gets in without a separate rarity system bolted on the side: an
   overgrown Victorian is not a different card TYPE, it is what a Victorian
   left vacant long enough actually looks like, and the engine already knows
   both of those facts about the house. Rarity stays a consequence. */
const SPRITES = {};
function registerSprite(key, img){ SPRITES[key] = img; }
function spriteFor(card){
  const k = card.style + ':' + card.condition;
  for (const key of [k, card.style]){
    const s = SPRITES[key];
    if (s && s.complete && s.naturalWidth) return s;
  }
  return null;
}

function mixHex(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round((pa>>16)*(1-t) + (pb>>16)*t);
  const g = Math.round(((pa>>8)&255)*(1-t) + ((pb>>8)&255)*t);
  const bl= Math.round((pa&255)*(1-t) + (pb&255)*t);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}

/* Bayer dithering is what keeps a six-tone ramp from banding into stripes on
   a 168-pixel sky. It is also, not incidentally, the texture that reads as
   "made by hand" rather than "CSS gradient screenshotted". */
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
/* A proper ordered dither quantises the ramp into STEPS and scatters the
   boundary between adjacent steps. The first version compared the Bayer
   threshold against `t % (1/3) * 3 % 1`, which is not a quantity — the skies
   came out as flat washes with a faint stripe in them, which is exactly what
   they looked like. Eight steps is enough to feel like a painted sky and few
   enough to still read as pixel art. */
function ditherBand(px, y0, y1, top, bot, steps){
  const N = steps || 8;
  for (let y = y0; y < y1; y++){
    const t = (y - y0) / Math.max(1, y1 - y0 - 1);
    const s = t * (N - 1), lo = Math.floor(s), frac = s - lo;
    const c0 = mixHex(top, bot, lo / (N - 1));
    const c1 = mixHex(top, bot, Math.min(1, (lo + 1) / (N - 1)));
    for (let x = 0; x < ART_W; x++)
      px(x, y, 1, 1, (BAYER[y & 3][x & 3] + 0.5) / 16 < frac ? c1 : c0);
  }
}

function drawCardArt(g, card){
  const S = SKIES[card.sky] || SKIES.morning;
  const D = DISTRICTS[card.district] || DISTRICTS.oldtown;
  const St = STYLES[card.style] || STYLES.bungalow;
  const r = rng(card.seed >>> 0);
  const px = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x|0, y|0, w|0, h|0); };
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, ART_W, ART_H);

  /* the hero was sitting in a third of the frame with a lot of dead lawn
     around it — a card has to read at thumbnail size, so the house gets the
     room and the sky and the road get what is left */
  const horizon = 74, kerb = 132, roadTop = kerb + 6;
  /* ── THE FALLBACK HOUSE IS NOW A FALLBACK ────────────────────────────
     Every style without a hand-made sprite still has to render, and after
     the frame grew to 150 these were drawing at their old size — a small
     beige box adrift in a big lawn — with turrets, dormers and garages that
     had been tuned against the old geometry and now floated clear of the
     wall they were supposed to be attached to. 668 Hollis Lane was the
     result: a tan rectangle, a bright blue triangle nowhere near it, and a
     brown pyramid hanging off the right-hand side with no house underneath.

     The fix is not more drawing code. These are placeholders until their
     sprite exists, so they get bigger, they get clamped to the frame, and
     they lose every appendage that was capable of detaching. A plain house
     that is correct beats an ornate one that is broken, and nobody ever
     complained that a placeholder was too simple. */
  const SCALE = 1.9;

  const night = card.sky === 'night', dark = night || card.sky === 'dusk' || card.sky === 'storm';

  /* ── THE SKY IS OPTIONAL, AND IT HAS TO BE ───────────────────────────
     A card is one still frame, so its sky can live inside the frame. A
     SCROLLING street cannot: tile this scene eight times and you get eight
     suns and eight sets of stars rolling past the window, which is the one
     thing a sky can never do — it is at infinity, it has no parallax.

     So noSky punches the whole celestial layer out, not just the sun:
     gradient, stars, sun, clouds. Above the horizon the tile is left
     TRANSPARENT, and the scene that scrolls paints its own sky once,
     behind the strip, where it belongs. The far skyline still draws here,
     because a hill a mile off does move — just slowly. */
  const sky = !card.noSky;
  if (sky){
    /* ── sky, dithered through three authored stops ── */
    ditherBand(px, 0, 34, S.up, S.mid);
    ditherBand(px, 34, horizon, S.mid, S.low);

    /* stars first so everything else occludes them */
    for (let i = 0; i < S.star; i++){
      const sx = Math.floor(r()*ART_W), sy = Math.floor(r()*38);
      px(sx, sy, 1, 1, r() < 0.25 ? '#ffffff' : '#c9d4f2');
    }
  }
  if (S.sunAt && sky){
    /* a disc with a hard ring around it reads as a sticker. What sells a sun
       is the BLOOM — the sky nearest it lifting toward its colour over a long
       falloff, dithered so the falloff is texture rather than a band. */
    const cx = Math.round(S.sunAt[0]*ART_W), cy = Math.round(S.sunAt[1]*horizon);
    const rad = night ? 4 : 6, reach = night ? 11 : 17;
    for (let dy = -reach; dy <= reach; dy++){
      const yy = cy + dy; if (yy < 0 || yy >= horizon) continue;
      for (let dx = -reach; dx <= reach; dx++){
        const xx = cx + dx; if (xx < 0 || xx >= ART_W) continue;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d <= rad){ px(xx, yy, 1, 1, S.sun); continue; }
        if (d > reach) continue;
        const f = Math.pow(1 - (d - rad)/(reach - rad), 3.0);
        if ((BAYER[yy&3][xx&3] + 0.5)/16 < f) px(xx, yy, 1, 1, mixHex(S.glow, S.sun, f*0.5));
      }
    }
    if (night){ px(cx-2, cy-1, 3, 3, mixHex(S.sun, S.up, 0.35));
                px(cx+1, cy+1, 2, 2, mixHex(S.sun, S.up, 0.25)); }   // craters
  }
  if (S.weather === 'clouds' && sky){
    for (let i = 0; i < 3 + Math.floor(r()*3); i++){
      const cx = Math.floor(r()*ART_W), cy = 6 + Math.floor(r()*26), cw = 16 + Math.floor(r()*22);
      const c = mixHex(S.mid, S.lit, 0.55);
      px(cx, cy, cw, 3, c); px(cx+5, cy-3, cw-12, 3, c); px(cx+2, cy+3, cw-6, 2, mixHex(c, S.amb, 0.3));
    }
  }
  if (S.weather === 'bow' && sky){
    const bands = ['#d98a7a','#e0b183','#dcd08c','#94c093','#7fa8c9','#9c8fc4'];
    for (let i = 0; i < bands.length; i++)
      for (let a = -100; a <= 100; a++){
        const th = a/100 * Math.PI/2.4, R = 78 + i;
        const bx = Math.round(ART_W*0.62 + Math.sin(th)*R), by = Math.round(horizon + 22 - Math.cos(th)*R);
        if (by >= 0 && by < horizon && (BAYER[by&3][bx&3]/16) < 0.42) px(bx, by, 1, 1, bands[i]);
      }
  }

  /* ── the horizon: nine authored answers, one per district ─────────────
     Skipped for the same reason as the sky, one notch closer: a scrolling
     street changed its entire horizon every 168 pixels — skyline, hills,
     water, skyline — and a horizon that changes that fast is not a horizon,
     it is wallpaper. A scene that scrolls draws one continuous distance on
     its own slow layer. */
  if (!card.noFar) drawFar(px, r, D.far, horizon, S, D, dark);

  /* ── ground ── */
  ditherBand2(px, horizon, kerb, mixHex(D.grass, S.amb, dark?0.42:0.10), mixHex(D.grass, S.lit, 0.10));
  /* a flat green band is the fastest way to make a landscape look unfinished.
     Two tones of clumping plus a scatter of planting is cheap and does most
     of the work of making the yard look like somewhere. */
  for (let i = 0; i < 260; i++){
    const gx = Math.floor(r()*ART_W), gy2 = horizon + 2 + Math.floor(r()*(kerb-horizon-2));
    const t = (gy2 - horizon)/(kerb - horizon);
    px(gx, gy2, 1 + (r()<0.3?1:0), 1,
       r() < 0.5 ? mixHex(D.grass, S.lit, 0.18 - t*0.1) : mixHex(D.grass, D.tree, 0.30));
  }
  if (card.condition === 'derelict' || card.condition === 'rough'){
    for (let i = 0; i < 110; i++){
      const gx = Math.floor(r()*ART_W), gy2 = horizon + 4 + Math.floor(r()*(kerb-horizon-4));
      px(gx, gy2, 1, 1, mixHex(D.soil, '#93824f', 0.5));
    }
  } else {
    for (let i = 0; i < 5 + Math.floor(r()*5); i++){
      const bx = Math.floor(r()*ART_W), by = kerb - 4 - Math.floor(r()*10), bw = 4 + Math.floor(r()*5);
      px(bx, by, bw, 3, mixHex(D.tree, S.lit, dark?0.05:0.16));
      px(bx+1, by-1, bw-2, 1, mixHex(D.tree, S.lit, dark?0.12:0.30));
      if (r() < 0.35) px(bx + Math.floor(r()*bw), by-1, 1, 1, ['#e8cf72','#d97a8a','#f0e8d8'][Math.floor(r()*3)]);
    }
  }
  px(0, kerb, ART_W, 1, S.ink);
  px(0, kerb+1, ART_W, roadTop-kerb-1, mixHex(D.walk, dark ? S.amb : S.lit, dark?0.35:0.18));
  px(0, roadTop, ART_W, 1, S.ink);
  px(0, roadTop+1, ART_W, ART_H-roadTop-1, mixHex(D.road, S.amb, dark?0.35:0));
  for (let x = 4; x < ART_W; x += 26) px(x, roadTop + 8, 13, 2, mixHex('#d8d2c2', D.road, dark?0.5:0.12));

  /* ── yard furniture, all seed-placed, none of it required ── */
  const groundY = kerb - 2;
  let hw = Math.round((St.w[0] + Math.floor(r()*(St.w[1]-St.w[0]+1))) * SCALE);
  let hh = Math.round((St.h[0] + Math.floor(r()*(St.h[1]-St.h[0]+1))) * SCALE);
  hw = Math.min(hw, ART_W - 46);
  /* body + roof has to fit between the kerb and the top of the frame */
  const ROOM = groundY - 14;
  hh = Math.min(hh, Math.round(ROOM / (1 + St.pitch)));
  const hx = Math.round((ART_W - hw)/2 + (r()*8 - 4));

  drawTree(px, r, D, S, 8 + Math.floor(r()*6), groundY, dark, card.condition);
  if (r() < 0.6) drawTree(px, r, D, S, ART_W - 12 - Math.floor(r()*6), groundY, dark, card.condition);

  /* the path, which is what stops a house looking pasted onto a lawn */
  const doorX = hx + Math.round(hw/2);
  for (let y = groundY; y < kerb; y++){
    const wdt = 5 + Math.round((y - groundY) * 0.25);
    px(doorX - Math.round(wdt/2), y, wdt, 1, mixHex(D.walk, dark ? S.amb : S.lit, dark?0.3:0.2));
  }

  /* ── the sprite, if this style has one ───────────────────────────────
     Drawn at 1:1 and lit to match the card's sky through a source-atop pass
     on an offscreen canvas, so the tint lands on the house and nothing else.
     Without that step a noon sprite pasted into a night card is a lantern. */
  const sprite = spriteFor(card);
  if (sprite){
    const sp = sprite, sw = sp.naturalWidth, sh = sp.naturalHeight;
    const sx0 = Math.round((ART_W - sw)/2), sy0 = groundY - sh + 2;
    const oc = document.createElement('canvas'); oc.width = sw; oc.height = sh;
    const oq = oc.getContext('2d'); oq.imageSmoothingEnabled = false;
    oq.drawImage(sp, 0, 0);
    oq.globalCompositeOperation = 'source-atop';
    oq.globalAlpha = dark ? 0.46 : 0.13;
    oq.fillStyle = dark ? S.amb : S.lit;
    oq.fillRect(0, 0, sw, sh);
    /* and a lit window or two after dark, because an unlit house at night
       reads as abandoned — which is a thing this game says on purpose, so it
       may only happen when the card actually means it */
    g.drawImage(oc, sx0, sy0);
    /* Condition used to be FAKED here: plywood rectangles, a tarp patch and
       weeds stamped over a clean sprite at guessed positions. It was a
       placeholder pretending to be art and it looked like one — which is
       exactly the note it got. Real per-condition drawings exist now,
       registered as 'style:condition', and spriteFor() picks the most
       specific one that exists. This file no longer invents wear: the
       drawing IS the condition. */
    if (night && card.condition !== 'derelict'){
      for (let i = 0; i < 3; i++){
        if (r() < 0.45) continue;
        const wx = sx0 + Math.round(sw*(0.2 + r()*0.6)), wy = sy0 + Math.round(sh*(0.45 + r()*0.3));
        px(wx, wy, 3, 3, 'rgba(255,214,140,0.55)');
      }
    }
  } else {
    drawHouse(g, px, r, card, St, D, S, hx, groundY, hw, hh, dark);
  }

  /* garage and barn were separate volumes butted against the body at the old
     scale; at the new one they read as debris. They come back with sprites. */

  /* fence, mailbox, the sign that says somebody is selling */
  if (r() < 0.55) drawFence(px, r, D, S, groundY + 6, dark, doorX);
  drawSign(px, card, S, doorX - 46 - Math.floor(r()*14), kerb - 3, dark);
  if (r() < 0.5){ const mx = doorX + 40 + Math.floor(r()*14);
    px(mx, kerb-13, 2, 12, mixHex(D.trunk, S.lit, 0.1));
    px(mx-3, kerb-18, 9, 5, mixHex(D.wall[2], S.lit, 0.2)); }
  if (r() < 0.34) drawCar(px, r, S, D, 6 + Math.floor(r()*(ART_W-46)), roadTop + 4, dark);

  /* ── weather sits on top of everything, because it is between you and it ── */
  if (S.weather === 'rain'){
    for (let i = 0; i < 150; i++){
      const rx = Math.floor(r()*ART_W), ry = Math.floor(r()*ART_H);
      px(rx, ry, 1, 3, 'rgba(226,238,247,0.5)');
    }
    for (let i = 0; i < 26; i++) px(Math.floor(r()*ART_W), roadTop + 2 + Math.floor(r()*10), 3, 1, 'rgba(226,238,247,0.35)');
  }
  if (S.weather === 'snow')
    for (let i = 0; i < 110; i++) px(Math.floor(r()*ART_W), Math.floor(r()*ART_H), 1, 1, r()<0.3?'#ffffff':'#e8eef3');
  if (S.weather === 'ash')
    for (let i = 0; i < 70; i++) px(Math.floor(r()*ART_W), Math.floor(r()*ART_H), 1, 1, r()<0.4?'#f0c48a':'#8a6a58');
  if (S.weather === 'fog')
    for (let y = 30; y < ART_H; y += 2)
      for (let x = 0; x < ART_W; x++)
        if ((BAYER[y&3][x&3]/16) < 0.30 + (y/ART_H)*0.28) px(x, y, 1, 1, 'rgba(178,186,193,0.55)');
}

/* second dither helper for ground bands (top-lit rather than top-dark) */
function ditherBand2(px, y0, y1, a, b){
  for (let y = y0; y < y1; y++){
    const t = (y - y0)/Math.max(1, y1-y0-1);
    for (let x = 0; x < ART_W; x++)
      px(x, y, 1, 1, (BAYER[y&3][x&3]/16) < t ? b : a);
  }
}

/* ── the horizon, nine ways ─────────────────────────────────────────────── */
/* ── THE HORIZON IS THE VIEW ─────────────────────────────────────────────
   In a waterfront district the far band is not background, it is the reason
   the street costs what it costs — so it gets drawn properly and it gets
   traffic. Which boats are out is itself a tell about the block: a working
   port has trawlers and a barge, a nice one has a yacht at anchor doing
   nothing. Hull colours stay inside the far-haze ramp, because everything
   on that line is miles away and haze does not make exceptions. */
function drawWater(px, r, hz, S, far, dark){
  px(0, hz-9, ART_W, 9, mixHex(S.mid, '#2d5a72', dark?0.55:0.35));
  for (let i = 0; i < 26; i++)
    px(Math.floor(r()*ART_W), hz-8+Math.floor(r()*7), 3, 1, mixHex(S.lit, S.mid, 0.4));
}

function drawBoats(px, r, hz, S, far, dark, fleet){
  const hullD = mixHex(far, S.ink, 0.30), hullL = mixHex(far, S.lit, 0.20);
  const boats = 2 + Math.floor(r()*2);
  for (let b = 0; b < boats; b++){
    const bx = 12 + Math.floor(r()*(ART_W-40));
    const wl = hz - 6 - Math.floor(r()*3);            // its own waterline
    const k = r(), working = fleet === 'working';
    if (k < (working ? 0.55 : 0.42)){                  // trawler: stubby, masted
      px(bx, wl-2, 13, 3, hullD);
      px(bx+2, wl-5, 5, 3, hullL);                     // wheelhouse
      px(bx+9, wl-11, 1, 9, hullD);                    // mast
      px(bx+6, wl-10, 4, 1, hullD);                    // spar
      if (dark) px(bx+3, wl-4, 1, 1, '#f0c877');
    } else if (working){                               // barge: long, flat, loaded
      px(bx, wl-2, 26, 3, hullD);
      for (let c = 0; c < 5; c++)
        px(bx+2+c*5, wl-6, 4, 4, mixHex(far, c%2 ? S.lit : S.ink, 0.18));
      px(bx+22, wl-7, 4, 5, hullL);                    // the pusher's house
      if (dark) px(bx+23, wl-6, 1, 1, '#f0c877');
    } else if (k < 0.74){                              // sailboat: hull + triangle
      px(bx, wl-2, 10, 2, hullD);
      px(bx+5, wl-14, 1, 12, hullD);
      for (let i = 0; i < 11; i++)                     // the sail, filled
        px(bx+5-Math.round(i*0.38), wl-13+i, Math.max(1, Math.round(i*0.38)), 1, hullL);
    } else {                                           // yacht: long, low, tiered
      px(bx, wl-2, 22, 3, hullL);
      px(bx+3, wl-5, 13, 3, mixHex(hullL, S.lit, 0.25));
      px(bx+6, wl-7, 7, 2, mixHex(hullL, S.lit, 0.4));
      px(bx+9, wl-11, 1, 4, hullD);                    // radar mast
      if (dark) for (let w = 0; w < 4; w++) px(bx+4+w*3, wl-4, 1, 1, '#ffe9b0');
    }
    /* the reflection is what puts them ON the water rather than above it */
    for (let i = 1; i <= 3; i++)
      px(bx+2, wl+i, 8, 1, mixHex(S.mid, hullD, 0.22 - i*0.05));
  }
}

function drawFar(px, r, kind, hz, S, D, dark){
  const far = mixHex(S.amb, S.mid, dark ? 0.25 : 0.55);
  const far2 = mixHex(far, S.up, 0.25);
  if (kind === 'skyline'){
    let x = 0; while (x < ART_W){
      const w = 7 + Math.floor(r()*11), h = 10 + Math.floor(r()*26);
      px(x, hz-h, w, h, far);
      if (dark) for (let wy = hz-h+3; wy < hz-3; wy += 4)
        for (let wx = x+2; wx < x+w-2; wx += 3) if (r() < 0.45) px(wx, wy, 1, 2, '#f0c877');
      x += w + 1;
    }
  } else if (kind === 'hills'){
    for (let x = 0; x < ART_W; x++){
      const h = Math.round(12 + Math.sin(x/19)*7 + Math.sin(x/7)*3);
      px(x, hz-h, 1, h, far);
    }
  } else if (kind === 'mountain'){
    for (let x = 0; x < ART_W; x++){
      const h = Math.round(30 - Math.abs(x-96)*0.42 + Math.sin(x/11)*3);
      if (h > 2){ px(x, hz-h, 1, h, far2);
        if (h > 22) px(x, hz-h, 1, Math.min(6, h-20), mixHex('#f2f6f8', S.lit, 0.2)); }
      const h2 = Math.round(22 - Math.abs(x-34)*0.5 + Math.sin(x/9)*2);
      if (h2 > 2) px(x, hz-h2, 1, h2, far);
    }
  } else if (kind === 'water'){
    drawWater(px, r, hz, S, far, dark);
    drawBoats(px, r, hz, S, far, dark, 'pleasure');
  } else if (kind === 'stacks'){
    px(0, hz-14, ART_W, 14, far);
    for (let i = 0; i < 4; i++){ const sx = 14 + i*38 + Math.floor(r()*8);
      px(sx, hz-30, 4, 30, far2);
      for (let k = 0; k < 5; k++) px(sx-2+Math.floor(r()*7), hz-36-k*3, 4, 2, mixHex(far2, S.mid, 0.5));
    }
  } else if (kind === 'cranes'){
    /* A district called Harbour had no water in it — a flat grey band and
       three gantries standing in a field. The cranes are on a QUAY: water
       first, then the quay they stand on, then the working boats tied to
       it. Nothing here is a yacht; this is the end of town that loads
       containers at four in the morning. */
    drawWater(px, r, hz, S, far, dark);
    px(0, hz-9, ART_W, 2, mixHex(far, S.ink, 0.25));          // the quay edge
    for (let i = 0; i < 3; i++){ const cx = 22 + i*52 + Math.floor(r()*10);
      px(cx, hz-30, 2, 30, far2); px(cx-10, hz-30, 24, 2, far2); px(cx+12, hz-28, 1, 7, far2);
      if (dark) px(cx-10, hz-31, 1, 1, '#ff6b5e');            // aircraft light
    }
    drawBoats(px, r, hz, S, far, dark, 'working');
  } else if (kind === 'orchard'){
    /* the first pass spaced these evenly at one height and it read as a row
       of lollipops on sticks — the single ugliest thing on the sheet. Real
       rows recede, overlap and vary. */
    for (let pass = 0; pass < 2; pass++){
      const fade = pass === 0 ? 0.62 : 0.32, yOff = pass === 0 ? 5 : 0;
      for (let x = -4; x < ART_W + 6; x += 6 + Math.floor(r()*4)){
        const h = 7 + Math.floor(r()*7) - yOff, cw = 8 + Math.floor(r()*5);
        const crown = mixHex(D.tree, far, dark ? fade*0.8 + 0.10 : fade*0.55);
        px(x+Math.round(cw/2)-1, hz-h-yOff, 2, h, mixHex(D.trunk, far, fade+0.15));
        px(x, hz-h-yOff-Math.round(cw*0.55), cw, Math.round(cw*0.62), crown);
        px(x+1, hz-h-yOff-Math.round(cw*0.55), Math.round(cw*0.45), 2, mixHex(crown, S.lit, 0.22));
      }
    }
  } else if (kind === 'desert'){
    for (let x = 0; x < ART_W; x++){
      const h = Math.round(9 + Math.sin(x/23)*5 + Math.sin(x/6)*2);
      px(x, hz-h, 1, h, mixHex(far, '#b98d63', 0.4));
    }
    for (let i = 0; i < 3; i++){ const cx2 = 20 + Math.floor(r()*130);
      px(cx2, hz-16, 2, 12, mixHex(D.tree, far, 0.4)); px(cx2-3, hz-13, 3, 1, mixHex(D.tree, far, 0.4)); }
  } else {
    for (let x = -4; x < ART_W; x += 7){
      const h = 10 + Math.floor(r()*10);
      px(x, hz-h, 8, h, mixHex(D.tree, far, dark?0.55:0.42));
    }
  }
  px(0, hz, ART_W, 1, mixHex(S.ink, far, 0.45));
}

/* ── THE HOUSE ────────────────────────────────────────────────────────────
   Three tones on the walls — a lit face, a shadowed face and a trim — with
   the split placed on the side the sun is actually on. It is one extra
   variable and it is most of the difference between "pixel art" and "a
   rectangle". */
function drawHouse(g, px, r, card, St, D, S, x, gy, w, h, dark){
  const sunLeft = (S.sunAt ? S.sunAt[0] : 0.3) < 0.5;
  const base = D.wall[Math.floor(r()*D.wall.length)];
  const lit   = mixHex(base, S.lit, dark ? 0.16 : 0.30);
  /* 0.52 toward a night sky's cool shade turned the shaded half of the wall
     a different MATERIAL from the lit half — the house read as two buildings
     pushed together, which is most of why Hollis Lane looked wrong. Light
     and shade have to stay the same paint. */
  const shade = mixHex(base, S.shade, dark ? 0.30 : 0.20);
  /* every roof on the first sheet was the same brown, which flattened
     fourteen silhouettes back down to about three. Roofing material is one
     of the loudest things about a house from the kerb, so it gets its own
     authored set and its own roll. */
  /* '#3d4650' was a blue-grey that, once the night sky's cool highlight was
     mixed into its lit face, came out as a flat bright blue — a tarp, not a
     roof. Roof tones stay in the warm-neutral band where a real roof lives. */
  const ROOFS = ['#4a3b34','#3f3a36','#5c4a3a','#403f39','#6b4a3f','#33302c','#7a6a4e'];
  const roofBase = ROOFS[Math.floor(r()*ROOFS.length)];
  const roofC = mixHex(roofBase, S.ink, dark ? 0.42 : 0.10);
  const roofL = mixHex(roofC, S.lit, dark ? 0.10 : 0.22);
  const trim  = mixHex(D.trim, S.lit, dark ? -0.0 : 0.12);
  const glowC = dark ? '#ffd489' : mixHex('#9fb6c4', S.lit, 0.35);
  const glassC= dark ? mixHex('#1b2740', S.up, 0.3) : mixHex('#5c7482', S.shade, 0.3);
  const wornT = card.condition === 'rough' || card.condition === 'derelict';
  const litShare = dark ? (card.condition === 'derelict' ? 0.08 : 0.62) : 0;

  const y0 = gy - h;
  /* body: split lit/shade down the sun line */
  const splitAt = Math.round(w * (sunLeft ? 0.62 : 0.38));
  px(x, y0, splitAt, h, sunLeft ? lit : shade);
  px(x+splitAt, y0, w-splitAt, h, sunLeft ? shade : lit);

  /* siding texture — one pixel of tone every few rows, which at this scale
     reads as clapboard rather than as noise */
  for (let yy = y0+2; yy < gy; yy += 3)
    px(x, yy, w, 1, mixHex(sunLeft ? lit : shade, S.ink, 0.10));

  /* roof */
  const rh = Math.max(4, Math.round(w * St.pitch));
  const cx = x + w/2;
  if (St.roof === 'flat'){
    px(x-1, y0-3, w+2, 3, roofC);
    if (St.cornice){ px(x-2, y0-5, w+4, 2, trim); px(x-1, y0-6, w+2, 1, mixHex(trim, S.ink, 0.2)); }
  } else if (St.roof === 'aframe'){
    for (let i = 0; i < h+rh; i++){
      const hwid = Math.round((i/(h+rh)) * (w/2));
      px(Math.round(cx-hwid), gy-h-rh+i, hwid*2, 1, i < 3 ? roofL : roofC);
    }
  } else if (St.roof === 'hip'){
    for (let i = 0; i < rh; i++){
      const f = (i+1)/rh, hwid = Math.round(w*0.16 + f*(w/2 - w*0.16));
      px(Math.round(cx-hwid), y0-rh+i, hwid*2, 1, i < 2 ? roofL : roofC);
    }
  } else if (St.roof === 'gablef'){          /* gable facing the street */
    for (let i = 0; i < rh; i++){
      const hwid = Math.round(((i+1)/rh) * (w/2 + 1));
      px(Math.round(cx-hwid), y0-rh+i, hwid*2, 1, i < 2 ? roofL : roofC);
    }
    px(x-1, y0-1, w+2, 2, mixHex(roofC, S.lit, 0.2));
  } else {
    for (let i = 0; i < rh; i++){
      const hwid = Math.round(((i+1)/rh) * (w/2 + 2));
      px(Math.round(cx-hwid), y0-rh+i, hwid*2, 1, i < 2 ? roofL : roofC);
    }
  }
  /* eave line: the shadow under the roof is what lifts it off the wall */
  px(x-2, y0, w+4, 1, mixHex(roofC, S.ink, 0.3));

  if (false && St.turret){
    const tw = 11, tx = sunLeft ? x + w - tw - 1 : x + 1;
    px(tx, y0 - 12, tw, h + 12, mixHex(base, S.shade, 0.18));
    for (let i = 0; i < 9; i++){
      const hwid = Math.round(((i+1)/9)*(tw/2 + 1));
      px(Math.round(tx + tw/2 - hwid), y0 - 21 + i, hwid*2, 1, roofC);
    }
    px(tx + Math.round(tw/2), y0 - 24, 1, 3, trim);
  }
  if (false && St.dormer) for (let d = 0; d < St.dormer; d++){
    const dx = Math.round(x + w*(St.dormer===1?0.5:(0.3+d*0.4)) - 5);
    px(dx, y0-rh+2, 10, 7, sunLeft ? lit : shade);
    for (let i = 0; i < 4; i++) px(dx + 5 - (i+1), y0-rh-2+i, (i+1)*2, 1, roofC);
    px(dx+3, y0-rh+4, 4, 4, litShare > r() ? glowC : glassC);
  }
  if (St.chimney) for (let c2 = 0; c2 < St.chimney; c2++){
    const cxx = Math.round(x + w*(St.chimney===1?0.74:(0.16+c2*0.66)));
    px(cxx, y0-rh-6, 5, 8, mixHex(D.wall[2], S.ink, 0.35));
    px(cxx-1, y0-rh-7, 7, 2, mixHex(D.wall[2], S.ink, 0.5));
    if (dark && card.condition !== 'derelict' && r() < 0.6)
      for (let s2 = 0; s2 < 4; s2++) px(cxx+1+Math.floor(r()*4), y0-rh-10-s2*3, 3, 2, 'rgba(200,206,214,0.35)');
  }

  /* windows: authored grid, glow chosen per pane so a lit house has dark
     rooms in it, which is the detail that makes a night card feel inhabited */
  const floors = St.floors, cols = St.cols;
  const wW = St.glass ? 9 : 5, wH = St.glass ? 9 : 6;
  for (let f = 0; f < floors; f++){
    const fy = Math.round(y0 + (h/floors)*f + (h/floors - wH)/2);
    for (let c3 = 0; c3 < cols; c3++){
      const wx = Math.round(x + 4 + c3*((w - 8 - wW)/Math.max(1, cols-1)));
      if (f === floors-1 && Math.abs(wx + wW/2 - cx) < wW) continue;   // door's slot
      const boarded = wornT && r() < (card.condition === 'derelict' ? 0.55 : 0.22);
      if (boarded){
        px(wx-1, fy-1, wW+2, wH+2, mixHex('#8a7150', S.shade, 0.25));
        px(wx-1, fy+1, wW+2, 1, mixHex('#6d5940', S.ink, 0.2));
        px(wx-1, fy+wH-2, wW+2, 1, mixHex('#6d5940', S.ink, 0.2));
      } else {
        const on = r() < litShare;
        px(wx, fy, wW, wH, on ? glowC : glassC);
        px(wx, fy, wW, 1, mixHex(on ? glowC : glassC, S.lit, 0.35));
        if (!St.glass){ px(wx + Math.floor(wW/2), fy, 1, wH, mixHex(trim, S.ink, 0.25));
                        px(wx, fy + Math.floor(wH/2), wW, 1, mixHex(trim, S.ink, 0.25)); }
        px(wx-1, fy-1, wW+2, 1, trim); px(wx-1, fy+wH, wW+2, 1, trim);
        px(wx-1, fy-1, 1, wH+2, trim); px(wx+wW, fy-1, 1, wH+2, trim);
        if (St.shutters){ px(wx-3, fy-1, 2, wH+2, mixHex(D.tree, S.shade, 0.2));
                          px(wx+wW+1, fy-1, 2, wH+2, mixHex(D.tree, S.shade, 0.2)); }
        if (on) px(wx-1, fy+wH+1, wW+2, 1, 'rgba(255,212,137,0.30)');
      }
    }
  }

  /* door(s) */
  const dw = 6, dh = 10;
  const doors = St.twodoor ? [cx-10, cx+4] : [cx - dw/2];
  for (const dxp of doors){
    px(Math.round(dxp), gy-dh, dw, dh, mixHex(D.tree, S.ink, dark?0.3:0.05));
    px(Math.round(dxp)-1, gy-dh-1, dw+2, 1, trim);
    px(Math.round(dxp)+dw-2, gy-dh+5, 1, 1, '#e8cf72');
    if (dark) px(Math.round(dxp)-2, gy-dh-3, dw+4, 3, 'rgba(255,212,137,0.22)');
  }

  /* porch */
  if (St.porch && St.porch !== 'stoop'){
    const pw = St.porch === 'full' || St.porch === 'wrap' ? w + (St.porch === 'wrap' ? 8 : 0) : 22;
    const pxx = St.porch === 'full' || St.porch === 'wrap' ? x - (St.porch === 'wrap' ? 4 : 0) : Math.round(cx - 11);
    const pd = 5;
    px(pxx, gy-dh-4, pw, 2, roofC);
    px(pxx, gy-dh-2, pw, 1, mixHex(roofC, S.ink, 0.3));
    for (let i = 0; i <= 3; i++){
      const cxp = Math.round(pxx + (pw-2) * i/3);
      const taper = St.porch === 'tapered';
      px(cxp, gy-dh-2, taper ? 3 : 2, dh - 2, trim);
      if (taper) px(cxp, gy-dh-2, 3, 3, mixHex(D.wall[2], S.lit, 0.2));
    }
    px(pxx, gy-2, pw, 2, mixHex(D.walk, S.lit, dark?0.1:0.25));
    if (St.trimwork) for (let i = 0; i < pw; i += 4) px(pxx+i, gy-dh-6, 2, 2, trim);
  } else if (St.porch === 'stoop' || St.porch === 'deck'){
    px(Math.round(cx-7), gy-2, 14, 2, mixHex(D.walk, S.lit, dark?0.1:0.25));
    px(Math.round(cx-6), gy, 12, 1, mixHex(D.walk, S.ink, 0.2));
  }

  /* condition, applied last so it sits over everything it should */
  if (card.condition === 'rough' || card.condition === 'derelict'){
    /* ── THE ROOF TARP ───────────────────────────────────────────────────
       A blue poly tarp weighted down over a failing roof is the single most
       legible sign of deferred maintenance on any street in the country, so
       it belongs on the card. The first version covered seventy per cent of
       the roof in one flat triangle of #4f7ba6, which does not read as a
       tarp — it reads as the renderer having gone wrong, which is exactly
       what it got reported as.

       A tarp is small, it sits on ONE slope, it does not reach the ridge,
       it has folds in it, and somebody has weighted the top edge down with a
       batten. All four of those are cheap, and all four are the difference
       between a covered roof and a bug. */
    const derelict = card.condition === 'derelict';
    const tarp  = mixHex('#4a6f92', S.shade, dark ? 0.45 : 0.22);
    const fold  = mixHex(tarp, S.ink, 0.28);
    const sheen = mixHex(tarp, S.lit, 0.20);
    const i0 = Math.round(rh * (derelict ? 0.34 : 0.52));
    const i1 = Math.round(rh * (derelict ? 0.92 : 0.78));
    const onLeft = r() < 0.5;
    for (let i = i0; i < i1; i++){
      const hwid = ((i+1)/rh)*(w/2 + 2);
      const span = Math.max(3, Math.round(hwid * (derelict ? 0.62 : 0.46)));
      const xs = onLeft ? Math.round(cx - hwid) + 1 : Math.round(cx + hwid) - span - 1;
      const yy = y0 - rh + i;
      px(xs, yy, span, 1, tarp);
      if (i === i0) px(xs, yy, span, 1, sheen);                 // the fold at the top edge
      const t = (i - i0) / Math.max(1, i1 - i0);
      if (t > 0.30 && t < 0.36) px(xs, yy, span, 1, fold);      // two creases down the sheet
      if (t > 0.66 && t < 0.72) px(xs, yy, span, 1, fold);
      if (i === i1 - 1) px(xs, yy, span, 1, fold);              // and the loose bottom hem
    }
    /* the batten holding it on, because nothing stays on a roof by itself */
    {
      const hwid0 = ((i0+1)/rh)*(w/2 + 2);
      const span0 = Math.max(3, Math.round(hwid0 * (derelict ? 0.62 : 0.46)));
      const bx = onLeft ? Math.round(cx - hwid0) + 1 : Math.round(cx + hwid0) - span0 - 1;
      px(bx, y0 - rh + i0 - 1, span0, 1, mixHex('#6d5940', S.ink, dark ? 0.4 : 0.15));
    }
    for (let i = 0; i < (card.condition === 'derelict' ? 22 : 9); i++)
      px(x + Math.floor(r()*w), y0 + Math.floor(r()*h), 1, 1, mixHex(shade, S.ink, 0.35));
  }
  if (card.condition === 'derelict'){
    for (let i = 0; i < 7; i++){
      const vx = x + Math.floor(r()*w);
      px(vx, gy - 4 - Math.floor(r()*7), 1, 6, mixHex(D.tree, S.ink, 0.25));
    }
    px(x-2, gy-1, w+4, 1, mixHex(D.soil, S.ink, 0.3));
  }
  /* ground contact shadow: without this everything floats */
  px(x-2, gy, w+4, 1, S.ink);
  px(x-3, gy+1, w+6, 1, 'rgba(0,0,0,0.20)');
}

function drawGarage(px, r, D, S, x, gy, h, dark){
  const w = 20, gh = Math.round(h*0.62);
  const base = mixHex(D.wall[1], S.shade, dark?0.45:0.22);
  px(x, gy-gh, w, gh, base);
  for (let i = 0; i < 4; i++) px(x-1, gy-gh-4+i, w+2, 1, mixHex(D.wall[2], S.ink, 0.42));
  px(x+3, gy-gh+4, w-6, gh-5, mixHex(base, S.ink, 0.22));
  for (let yy = gy-gh+6; yy < gy-2; yy += 3) px(x+3, yy, w-6, 1, mixHex(base, S.ink, 0.32));
  px(x-1, gy, w+2, 1, S.ink);
}
function drawBarn(px, r, D, S, x, gy, dark){
  const w = 22, h = 16;
  const red = mixHex('#8f4a3c', S.shade, dark?0.45:0.16);
  px(x, gy-h, w, h, red);
  for (let i = 0; i < 5; i++){ const hw2 = Math.round(((i+1)/5)*(w/2+1));
    px(Math.round(x+w/2-hw2), gy-h-5+i, hw2*2, 1, mixHex('#5c3a30', S.ink, 0.2)); }
  px(x+Math.round(w/2)-3, gy-8, 6, 8, mixHex('#6d4034', S.ink, 0.2));
  px(x+2, gy-h+3, 3, 3, mixHex('#e8dcc4', S.shade, 0.3));
  px(x-1, gy, w+2, 1, S.ink);
}
/* Everything below was proportioned against a 116px frame with a house a
   third its width. The frame is 150 now and the house fills it, so a tree
   built to the old numbers reads as a shrub and the fence as a ribbon of
   dashes. Scale is not decoration: an undersized tree beside a correctly
   sized house is the fastest way to make a scene look like clip art. */
const Y = 1.42;                       // yard scale, 150/116 plus a little
function drawTree(px, r, D, S, x, gy, dark, cond){
  const bare = cond === 'derelict' && r() < 0.5;
  const h = Math.round((16 + Math.floor(r()*14)) * Y);
  const trunk = mixHex(D.trunk, dark ? S.amb : S.lit, dark?0.25:0.08);
  px(x, gy-h, 2, h, trunk);
  if (bare){
    for (let i = 0; i < 5; i++){
      const by = gy-h+2+Math.floor(r()*(h*0.5)), dir = r()<0.5 ? -1 : 1;
      px(x + (dir<0 ? -4 : 2), by, 4, 1, trunk);
    }
  } else {
    const leaf = mixHex(D.tree, dark ? S.amb : S.lit, dark?0.35:0.12);
    const leafL= mixHex(leaf, S.lit, dark?0.10:0.26);
    const cw = Math.round((13 + Math.floor(r()*8)) * Y);
    for (let i = 0; i < 4; i++){
      const ly = gy-h-6+i*6, lw = Math.round(cw * (i===0?0.7:i===3?0.6:1));
      px(x+1-Math.round(lw/2), ly, lw, 7, leaf);
      px(x+1-Math.round(lw/2), ly, Math.round(lw*0.45), 3, leafL);
    }
  }
  px(x-1, gy, 4, 1, 'rgba(0,0,0,0.18)');
}
function drawFence(px, r, D, S, y, dark, skipX){
  const c = mixHex(D.trim, S.shade, dark?0.5:0.22);
  for (let x = 2; x < ART_W-2; x += 7){
    if (Math.abs(x - skipX) < 13) continue;
    px(x, y-10, 3, 11, c); px(x, y-11, 3, 1, mixHex(c, S.lit, 0.3));
  }
  for (let x = 2; x < ART_W-2; x++){ if (Math.abs(x - skipX) < 13) continue;
    px(x, y-7, 1, 2, c); px(x, y-3, 1, 2, c); }
}
const SIGN_INK = { probate:'#6b5aa8', preforeclose:'#a1251e', tired:'#8a6a2f',
                   divorce:'#2f6a7a', stale:'#4a5a63', vacant:'#3f7a4a' };
function drawSign(px, card, S, x, y, dark){
  px(x+5, y-12, 2, 12, mixHex('#b0a894', S.shade, 0.2));
  px(x, y-23, 13, 11, mixHex('#f8f4e8', S.shade, dark?0.4:0.05));
  px(x, y-23, 13, 1, mixHex('#ffffff', S.lit, 0.2));
  const ink = SIGN_INK[card.situation] || '#a1251e';
  px(x+2, y-20, 9, 2, ink);
  px(x+2, y-16, 7, 1, mixHex(ink, '#ffffff', 0.35));
  px(x+2, y-14, 5, 1, mixHex(ink, '#ffffff', 0.5));
}
function drawCar(px, r, S, D, x, y, dark){
  const body = ['#7a3f3a','#2f4a63','#3f5a44','#6a6558','#8a8378'][Math.floor(r()*5)];
  const b = mixHex(body, dark ? S.amb : S.lit, dark?0.3:0.12);
  px(x+2, y+3, 26, 5, b); px(x+7, y, 14, 4, mixHex(b, S.ink, 0.15));
  px(x+8, y+1, 12, 2, dark ? mixHex('#1b2740', S.up, 0.35) : mixHex('#8fa8b4', S.lit, 0.2));
  px(x+5, y+8, 4, 2, '#1c222a'); px(x+21, y+8, 4, 2, '#1c222a');
  if (dark){ px(x+27, y+4, 2, 2, '#ffd489'); px(x+1, y+4, 2, 2, '#c8433a'); }
}

/* THE ROLODEX — the second collection.
   ─────────────────────────────────────────────────────────────────────────
   Houses are one binder. People are the other, and the people are the more
   interesting half, because in this business your network genuinely IS your
   edge: two investors looking at the same house get different answers
   because one of them knows a buyer who wants exactly that street.

   A person card is deliberately a DIFFERENT SHAPE from a house card —
   landscape, like the index card in an actual Rolodex — so a binder page
   never has to explain which collection you are looking at.

   The one rule that governs the whole system: EVERY PARTNER REMEMBERS.
   Trust is per-person, earned slowly, lost fast, and it is the only stat in
   the game that cannot be bought. That is what makes a Rolodex worth
   collecting rather than rolling. */

const peopleRng = seed => { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };

/* ── THE SIX ROLES ───────────────────────────────────────────────────────
   Each role is the partner for specific exits, and carries the four numbers
   that actually decide whether working with them goes well. The stat NAMES
   differ per role on purpose — a contractor does not have a "max price" and
   a buyer does not have a "crew size". Shared stat names would have been
   tidier and would have thrown away the entire point. */
const ROLES = {
  buyer: {
    n:'Cash buyer', lane:'dealmaker', exits:['wholesale','novation'],
    tag:'Buys with cash. Closes fast, pays less.',
    stats:['Ceiling','Speed','Liquid','Word'],
    help:['what they will go to','how fast they close','how often they actually have the money','whether they do what they said'],
  },
  contractor: {
    n:'Contractor', lane:'flipper', exits:['flip','wholetail','brrrr'],
    tag:'Does the work. Or says they will.',
    stats:['Price','Pace','Craft','Shows'],
    help:['how close the bid lands','how fast the job runs','how well it is finished','whether they are there on Monday'],
  },
  agent: {
    n:'Listing agent', lane:'dealmaker', exits:['novation','wholetail'],
    tag:'Lists it, markets it, and tells you the price.',
    stats:['Pricing','Reach','Fee','Straight'],
    help:['how accurate their price is','how many buyers see it','what they charge','whether they tell you what you want to hear'],
  },
  lender: {
    n:'Lender', lane:'financier', exits:['brrrr','hold','subto'],
    tag:'Lends against it. Their appraiser decides.',
    stats:['LTV','Rate','Season','Nerve'],
    help:['how much of the value they lend','what it costs','how long before they will refinance','how conservative their appraiser runs'],
  },
  tenant: {
    n:'Tenant', lane:'landlord', exits:['hold','brrrr'],
    tag:'Lives there. Pays on the first, or does not.',
    stats:['Income','Credit','History','Care'],
    help:['rent against what they earn','what the file says','how the last landlord found them','how the place looks in a year'],
  },
  planner: {
    n:'Planner', lane:'financier', exits:['land'],
    tag:'Says yes or no to what you want to build.',
    stats:['Reach','Speed','Fee','Nerve'],
    help:['what they can approve','how long the file sits','what it costs to file','how much change they will tolerate'],
  },
};

const FIRST = ['Ray','Dee','Marcus','Nadia','Ollie','Pearl','Curtis','Bev','Hector','Joyce',
  'Sal','Tam','Wes','Ingrid','Duane','Rosa','Femi','Lou','Astrid','Vic','Cleo','Amir',
  'Marge','Otis','Nia','Rudy','Fay','Gus','Lena','Bo'];
const LAST = ['Okonkwo','Vance','Delacroix','Park','Brennan','Ruiz','Whitlock','Adeyemi',
  'Kowalski','Best','Ferreira','Nakamura','Oyelaran','Strand','Mbeki','Halloran','Quist',
  'Batiste','Ng','Castellanos','Ivers','Duarte','Sowande','Rennick','Achebe','Molnar'];

/* the note line is what makes a card a person rather than four numbers, and
   it is drawn from the stats so it can never contradict them */
function noteFor(role, s, r){
  const hi = s.indexOf(Math.max(...s)), lo = s.indexOf(Math.min(...s));
  const NOTES = {
    buyer: [['Pays up for the right street.','Will not stretch. Ever.'],
            ['Closed one in nine days.','Slow. Always “next week”.'],
            ['Money is always there.','Says cash. Means a partner.'],
            ['Handshake is the contract.','Re-trades at the table.']],
    contractor: [['Bids it and holds it.','Bid is fiction. Add thirty.'],
            ['In and out. Genuinely fast.','Two weeks becomes five.'],
            ['Finish work is beautiful.','Adequate. Do not look close.'],
            ['There at seven every morning.','Vanishes. Comes back sunburnt.']],
    agent: [['Prices it right the first time.','Guesses. Loudly.'],
            ['Everyone sees the listing.','Sign in the yard and a prayer.'],
            ['Cuts the fee for volume.','Full freight, no discussion.'],
            ['Will tell you the price is wrong.','Tells you what you want to hear.']],
    lender: [['Goes higher than anyone.','Conservative to a fault.'],
            ['Rate is genuinely good.','Expensive money.'],
            ['Refinances without the wait.','Wants a full year seasoned.'],
            ['Appraiser is reasonable.','Appraiser kills deals.']],
    tenant: [['Earns four times the rent.','Rent is most of the cheque.'],
            ['File is spotless.','File has a story in it.'],
            ['Last landlord asked them to stay.','Left owing. Twice.'],
            ['Garden looks better than yours.','You will be repainting.']],
    planner: [['Can approve a lot alone.','Everything goes to the board.'],
            ['Turns files around fast.','Your file will sit.'],
            ['Filing is cheap here.','Fees on fees.'],
            ['Open to a real proposal.','By the book, always.']],
  }[role];
  return s[hi] >= 4 ? NOTES[hi][0] : s[lo] <= 2 ? NOTES[lo][1] : NOTES[hi][0];
}

/* rarity here is the same idea as on a house: it is a CONSEQUENCE. A person
   is rare because the combination of numbers is rare, not because a designer
   decided this one should be gold. */
const P_RARITY = [
  { k:'contact',  n:'Contact',  at:0,  c:'#8b939c' },
  { k:'regular',  n:'Regular',  at:12, c:'#4a7a52' },
  { k:'trusted',  n:'Trusted',  at:15, c:'#2f6a8a' },
  { k:'closer',   n:'Closer',   at:17, c:'#6b4a9a' },
  { k:'legend',   n:'The call', at:19, c:'#9d5b0c' },
];
function pRarity(total){
  let out = P_RARITY[0];
  for (const R of P_RARITY) if (total >= R.at) out = R;
  return out;
}

function mintPerson(role, seed){
  const r = peopleRng(seed >>> 0);
  const R = ROLES[role];
  /* four stats, 1–5, skewed low: a great contact should be rare because
     great contacts are rare, and the number is the whole reason you kept
     their card */
  const s = Array.from({length:4}, () => {
    const v = r() + r() + r();                    // bell, centred low-middle
    return Math.max(1, Math.min(5, Math.round(1 + v * 1.45)));
  });
  const total = s.reduce((a,b)=>a+b,0);
  return {
    role, seed,
    name: FIRST[Math.floor(r()*FIRST.length)] + ' ' + LAST[Math.floor(r()*LAST.length)],
    stats: s, total,
    rarity: pRarity(total).k,
    trust: 1,                                     // everybody starts at one
    note: noteFor(role, s, r),
    deals: 0,
  };
}

/* ── TRUST ───────────────────────────────────────────────────────────────
   Earned slowly, lost fast, capped at five. Bringing somebody a deal that
   suits them raises it; wasting their time lowers it; burning them costs
   real ground. A partner at trust 4+ takes your call first and gives you a
   little more than the numbers say — which is the mechanical payoff for
   having behaved well over forty hours of play. */
const TRUST_MAX = 5;
function afterDeal(person, outcome){
  const d = { good: +0.34, fine: +0.12, wasted: -0.5, burned: -1.6 }[outcome] ?? 0;
  const t = Math.max(0, Math.min(TRUST_MAX, person.trust + d));
  return { ...person, trust: +t.toFixed(2), deals: person.deals + (outcome==='burned'?0:1) };
}
/* what trust actually buys, per role — always a small edge, never a cheat */
function trustEdge(person){
  const t = person.trust;
  return {
    firstCall: t >= 3,                    // they answer before your competitors
    priceEdge: +(Math.max(0, t - 2) * 0.02).toFixed(3),   // up to +6%
    reliability: +(Math.max(0, t - 1) * 0.06).toFixed(3), // they flake less
  };
}

/* ── ONE WALLET ───────────────────────────────────────────────────────────
   Until now every screen kept its own money: the office had a bankroll, the
   assignment started you with $2,400 of walking-around cash, the rehab
   handed you $95,000 out of nowhere. Three wallets is three games that
   happen to share an art style — the moment a fee earned on the phone can
   fund a roof on the next screen, it becomes one game.

   Everything reads and writes ONE number in the shared save. The ledger
   entries are separate and additive, because "how much do I have" and
   "what happened today" are different questions and conflating them is how
   a save file starts lying.

   Every mutation goes through __bank_spend()/__bank_earn(): they clamp, they record, and
   they return what actually moved, so a caller can never quietly overdraw. */
const KEY = 'ni.office.v1';
const START = 150000;

function read(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; }
}
function write(st){
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){}
}

function __bank_cash(){
  const st = read();
  return typeof st.cash === 'number' ? st.cash : START;
}
function __bank_canAfford(n){ return __bank_cash() >= n; }

/* record a ledger line without moving money — for things already counted */
function __bank_note(patch){
  const st = read();
  st.today = st.today || {};
  for (const k in patch){
    st.today[k] = typeof patch[k] === 'number' ? (st.today[k] || 0) + patch[k] : patch[k];
  }
  write(st);
}

function __bank_spend(n, ledgerKey, extra){
  n = Math.max(0, Math.round(n));
  const st = read();
  const have = typeof st.cash === 'number' ? st.cash : START;
  const moved = Math.min(n, Math.max(0, have));   /* never overdraw */
  st.cash = have - moved;
  st.today = st.today || {};
  if (ledgerKey) st.today[ledgerKey] = (st.today[ledgerKey] || 0) + moved;
  if (extra) for (const k in extra) st.today[k] = extra[k];
  write(st);
  return moved;
}

function __bank_earn(n, ledgerKey, extra){
  n = Math.round(n);
  const st = read();
  st.cash = (typeof st.cash === 'number' ? st.cash : START) + n;
  st.today = st.today || {};
  if (ledgerKey) st.today[ledgerKey] = (st.today[ledgerKey] || 0) + n;
  if (extra) for (const k in extra) st.today[k] = extra[k];
  write(st);
  return n;
}

/* ── MEMORY ──────────────────────────────────────────────────────────────
   "Every partner remembers" was the design's first rule, and until this
   audit it was false: trust lived in page memory and died on reload. It
   lives here now, per person, forever. */
function __bank_rolodex(){ const st = read(); return st.rolodex || {}; }
function __bank_remember(name, trust, deals){
  const st = read();
  st.rolodex = st.rolodex || {};
  st.rolodex[name] = { trust, deals };
  write(st);
}

/* ── THE KEPT DEALS ──────────────────────────────────────────────────────
   The save stores DEALS, not cards. Cards are derived at view time by the
   same mint that runs the arcade, so rarity stays a consequence of the
   numbers — a save full of pre-rendered rarities would be a save you could
   lie in. */
function __bank_kept(){ const st = read(); return st.deals || []; }
function __bank_keep(deal){
  const st = read();
  st.deals = st.deals || [];
  st.deals.push(deal);
  write(st);
  return st.deals.length;
}

/* what the office sends to work with you */
function __bank_perks(){ const st = read(); return st.items || {}; }
function __bank_staff(){ const st = read(); return st.staff || {}; }
function __bank_tier(){ const st = read(); return st.tier || 0; }

const Bank = { cash: __bank_cash, canAfford: __bank_canAfford, note: __bank_note, spend: __bank_spend, earn: __bank_earn, perks: __bank_perks, staff: __bank_staff, tier: __bank_tier, rolodex: __bank_rolodex, remember: __bank_remember, kept: __bank_kept, keep: __bank_keep };

/* ── WHERE THE HOUSES COME FROM ───────────────────────────────────────────
   Both games shipped one hardcoded house each, which is fine for proving a
   loop and fatal for a game somebody opens twice. This is the generator,
   and it is the SAME arithmetic the economy simulation was calibrated
   against — the seller-motivation table below was solved, not typed, by
   _calibrate.mjs moving each situation until its own exits clear an
   experienced player's bar on roughly a third of houses. Every situation is
   live; none of them is scenery.

   Two ways to ask for a deal:
     __deals_todays(kind)  — the daily seed. Same house for every player on the same
                     date, which is what makes a score line worth sharing.
     __deals_fromSeed(n)   — anything else: practice, a second lead, a test.

   The tier widens the market rather than inflating it: bigger houses, and
   thinner room as a share of value, because that is what actually happens
   when your money grows. */

const __d_SITS  = ['probate','preforeclose','tired','divorce','stale','vacant'];
/* solved against a 5%-of-value bar, 40,000 houses each:
     probate 37.8% · preforeclose 34.3% · tired 34.1%
     divorce 29.9% · stale 26.1% · vacant 35.8%  */
const __d_MOTIV = { probate:.635, preforeclose:.774, tired:.778,
                divorce:.693, stale:.839, vacant:.638 };
const __d_SIT_LABEL = { probate:'Estate', preforeclose:'Foreclosure', tired:'Landlord',
                    divorce:'Divorce', stale:'Stale', vacant:'Vacant' };

const __d_STREETS = ['Marrow Lane','Kestrel Row','Vinegar Way','Bram Street','Sable Way',
  'Fenner Lane','Quill Street','Alder Street','Hollis Lane','Pike Row','Dunmore Way',
  'Ashgrove Terrace','Corbin Street','Wren Lane','Marigold Row','Sable Court'];
const __d_DISTRICTS = ['oldtown','flats','mill','harbor','orchard','terrace','heights','ridge','bottoms'];
const __d_SKIES = ['morning','golden','dusk','storm','night','snowfall','hardnoon','fog'];
const __d_STYLES = ['bungalow','craftsman','shotgun','ranch','rowhouse','aframe'];

const __d_ARV_SCALE = t => Math.pow(1.42, t);
const __d_ROOM_MUL  = t => Math.pow(0.83, t);

function __d_rng(seed){
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}
function __deals_seedOf(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function __deals_todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* the eight ceilings, in the order the design argues for them:
   novation ≥ subto > wholetail > flip > brrrr > wholesale */
function __deals_ceilings(d){
  const S = __d_ARV_SCALE(d.tier), X = {};
  X.flip      = d.arv*0.78 - d.repairs;
  X.wholesale = X.flip*0.94 - 12000*S;
  X.wholetail = d.repairs <= d.arv*0.12 ? d.arv*0.85 - d.repairs : null;
  X.brrrr     = d.arv*0.75 - d.repairs - 7000*S;
  const mpd = (r => { const m = r/12, k = (1+m)**360; return m*k/(k-1); })(0.071);
  X.hold      = Math.min((d.rent*0.6/1.25)/mpd/0.75, d.arv*0.92 - d.repairs);
  X.subto     = (d.situation === 'preforeclose' || d.situation === 'tired') ? X.flip*1.18 : null;
  X.novation  = (d.repairs >= d.arv*0.05 && d.repairs <= d.arv*0.20)
              ? d.arv*0.95 - d.repairs*0.55 - 12000*S : null;
  return X;
}

function __deals_fromSeed(seed, opts){
  const o = opts || {}, tier = o.tier || 0, r = __d_rng(seed);
  const arv  = Math.round((120000 + r()*280000) * __d_ARV_SCALE(tier));
  const wear = r();
  const repairs = Math.round(arv * (0.02 + wear*0.22));
  const rent = Math.round(arv * (0.0045 + r()*0.0035));
  const situation = __d_SITS[Math.floor(r()*__d_SITS.length)];
  const asIs = arv - repairs;
  let ask = Math.round(asIs * (__d_MOTIV[situation] + r()*0.14));

  const num = 100 + Math.floor(r()*1900);
  const d = {
    seed, tier, arv, repairs, rent, situation, wear,
    address: num + ' ' + __d_STREETS[Math.floor(r()*__d_STREETS.length)],
    district: __d_DISTRICTS[Math.floor(r()*__d_DISTRICTS.length)],
    sky: __d_SKIES[Math.floor(r()*__d_SKIES.length)],
    style: __d_STYLES[Math.floor(r()*__d_STYLES.length)],
    situationLabel: __d_SIT_LABEL[situation],
    ask,
  };
  /* condition is READ OFF the repair number, so the picture can never
     disagree with the arithmetic */
  const share = repairs / arv;
  d.condition = share < 0.045 ? 'pristine' : share < 0.09 ? 'kept'
              : share < 0.145 ? 'tired' : share < 0.20 ? 'rough' : 'derelict';

  const X = __deals_ceilings(d);
  const best = Math.max(...Object.values(X).filter(v => v != null));
  /* competition closes the gap as the market gets bigger */
  const room = best - d.ask;
  if (room > 0) d.ask = Math.round(best - room * __d_ROOM_MUL(tier));
  d.ceilings = __deals_ceilings(d);
  d.best = Math.max(...Object.values(d.ceilings).filter(v => v != null));
  return d;
}

/* ── TODAY'S LEADS ───────────────────────────────────────────────────────
   One seed per date per game, so everybody works the same two houses and a
   result line means something. A contract worth assigning is not guaranteed
   — some days the lead is thin, and that is the game. */
function __deals_todays(kind, tier){
  const base = __deals_seedOf(__deals_todayKey() + '|' + kind);
  for (let i = 0; i < 40; i++){
    const d = __deals_fromSeed((base + i * 7919) >>> 0, { tier: tier || 0 });
    const room = d.best - d.ask;
    /* a wholesale needs a spread to pass on; a rehab needs real work in it */
    /* an assignment fee is thin by nature — the wholesaler is paid for
       finding it, not for owning it. Rooms wider than about six per cent
       of value produced $48,000 fees on a $380,000 house, which is not
       what the job pays. Two to six per cent lands it at $8k–$23k. */
    if (kind === 'assignment' && room > d.arv * 0.022 && room < d.arv * 0.062) return d;
    if (kind === 'rehab' && d.repairs > d.arv * 0.10 && d.repairs < d.arv * 0.24) return d;
  }
  return __deals_fromSeed(base, { tier: tier || 0 });
}

const Deals = { seedOf: __deals_seedOf, todayKey: __deals_todayKey, ceilings: __deals_ceilings, fromSeed: __deals_fromSeed, todays: __deals_todays };



/* ── THE HOUSE, AND THE LADDER IT CLIMBS ─────────────────────────────────
   The whole point of this screen: the renovation happens to the PICTURE.
   The art engine derives boards, tarps, dead lawns and lit windows from a
   condition word, so the job is modelled as the house walking up that
   ladder, one visible step at a time. The player is not watching a
   progress bar next to a house; the house IS the progress bar. */
const LADDER = ['derelict','rough','tired','kept','pristine'];
/* ── TODAY'S REHAB ───────────────────────────────────────────────────────
   Generated like the contract, but filtered for a house with real work in
   it — a rehab with nothing to fix is not a rehab. It always opens derelict
   on screen, because that is the fantasy: you bought it boarded. */
const HOUSE = { ...Deals.todays('rehab', Bank.tier()), condition:'derelict' };
/* the courthouse discount: nobody else turned up with cash on a Tuesday */
const BOUGHT = Math.round(HOUSE.ask * 0.94), FEE = 0.08;
/* ── WHAT THE OFFICE SENDS ───────────────────────────────────────────────
   Bookkeeping is the only hire that reaches this screen, and it does what a
   bookkeeper actually does: makes the standing costs smaller while you are
   busy elsewhere. A quarter off the daily bleed, for a wage already paid
   this morning. */
const STAFF = Bank.staff();
const HOLD = STAFF.book ? Math.round(130 * 0.75) : 130;
/* what the finished house sells for, by where the ladder ends — and the
   district CAP is the overimprovement lesson: The Flats pays for clean and
   solid, it does not pay for marble. A studs-out job can build value the
   street refuses to hand back. */
const VALUE = { tired:0.78, kept:0.95, pristine:0.99 };
/* every district has a number the street will not pay past, and the cheap
   ones cap hardest — the overimprovement lesson, priced per postcode */
const CAPS = { bottoms:0.90, mill:0.92, flats:0.97, harbor:0.96, oldtown:1.00,
               orchard:1.02, terrace:1.03, ridge:1.06, heights:1.10 };
const DISTRICT_CAP = CAPS[HOUSE.district] ?? 0.97;
const DNAME = { oldtown:'Old Town', flats:'The Flats', mill:'the Mill District',
  harbor:'the Harbour', orchard:'Orchard Row', terrace:'Sunset Terrace',
  heights:'The Heights', ridge:'The Ridge', bottoms:'The Bottoms' };

const money = n => '$' + Math.round(n).toLocaleString('en-US');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const wait = ms => new Promise(r => setTimeout(r, ms));

/* street behind, site in front — same renderer for both */
/* both drawings for every style on this screen: the clean one and the

{
