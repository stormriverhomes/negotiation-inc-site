<!doctype html><meta name="robots" content="noindex"><!--ni:stage=live--><meta charset="utf-8"><title>The Assignment</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* ── THE ASSIGNMENT — v2 ──────────────────────────────────────────────────
   Three notes drove this rewrite, and they turned out to be one note:

   "every screen should feel relative to a place"  — the street is now the
   background of everything. Not decoration: it is the same drawCardArt that
   makes the cards, rendered once at 184×150 and scaled up with nearest
   neighbour, so the screen you negotiate on IS the house you are selling.

   "more controls than take it / leave it"  — six verbs on the board and five
   inside a call, each costing something different: days, money, or trust.

   "there's not really any consequences"  — every verb now has a downside
   somebody would actually feel. Blasting the list is fast and marks the deal
   as shopped. Walking it costs two days and cannot be undone. Pushing can
   burn a buyer permanently. Running the clock out loses the earnest money.

   The skill layer that ties it together is the OBJECTION: every buyer is
   holding one back, it is invisible until you ask, and asking is free. Find
   it, spend the right resource on it, and a $4,000 assignment becomes
   $14,000. That is the actual job. */
:root{
  --ink:#1b2027; --mid:#5c6572; --dim:#8b939c; --line:#d9d3c4;
  --stock:#f6f3ea; --paper:#fffdf7;
  --pays:#2a6a44; --refuses:#8a3a32; --gold:#e8cf72; --goldink:#8b7440;
  --ring:#2f6a8a; --day:#3f5a6d;
  --e-out:cubic-bezier(.2,.8,.3,1); --e-pop:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--stock);background:#0b111b;overflow-x:hidden}

/* ── THE PLACE ── */
/* A 6:1 street cover-fitted into a 1.4:1 viewport crops to a doorway — the
   third time the same mistake produced the same close-up. It is a BAND, not
   a fill: full width, natural aspect, pinned to the top, and the page fades
   out of it. You are standing on the street rather than pressed against it. */
#bg{position:fixed;top:0;left:0;right:0;z-index:0;image-rendering:pixelated;
  width:100%;height:auto;filter:saturate(.92) contrast(1.03)}
/* the scrim has one job: the street stays readable AS a street while every
   word on top of it clears contrast. Heavier at the top than the first
   version, because that is where the sky is brightest and the title sits. */
#scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,17,27,.88) 0%,rgba(11,17,27,.60) 9%,
    rgba(11,17,27,.34) 20%,rgba(11,17,27,.72) 30%,rgba(11,17,27,.96) 37%,#0b111b 43%,#0b111b 100%)}
.wrap{position:relative;z-index:2;max-width:1140px;margin:0 auto;padding:26px 20px 60px}

h1{font-family:Fraunces,Georgia,serif;font-size:29px;margin:0;letter-spacing:-.02em;
  text-shadow:0 2px 3px rgba(0,0,0,.9),0 4px 18px rgba(0,0,0,.8)}
.sub{color:#b9c2cc;font-size:13.5px;margin:2px 0 18px;text-shadow:0 1px 3px rgba(0,0,0,.95),0 3px 14px rgba(0,0,0,.8)}

/* ── the deal strip ── */
.deal{display:flex;gap:16px;align-items:center;background:rgba(255,253,247,.96);
  color:var(--ink);border-radius:12px;padding:13px 16px;margin-bottom:14px;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.deal .addr{flex:1;min-width:0}
.deal .addr b{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:600;display:block;letter-spacing:-.015em}
.deal .addr span{color:var(--mid);font-size:12px;display:flex;align-items:center;
  gap:6px;flex-wrap:wrap;margin-top:2px}
/* `.deal .addr b` is (0,2,1) and `.chip` is (0,1,0), so the address styling
   was winning and the chips rendered at 21px Fraunces — the specificity trap,
   which looks like a font bug and is actually an arithmetic one. */
.deal .addr span b.chip{font:600 9.5px/1 ui-sans-serif;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 7px;border-radius:5px;background:rgba(27,32,39,.09);color:var(--mid);white-space:nowrap}
.chip.ok{background:rgba(42,106,68,.14);color:var(--pays)}
.chip.bad{background:rgba(138,58,50,.14);color:var(--refuses)}
.fig{text-align:right;min-width:92px}
.fig i{display:block;font-style:normal;font:600 8.5px/1 ui-sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.fig b{font:700 18px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.fig.pay b{color:var(--pays)} .fig.gold b{color:var(--goldink)}
/* ── THE LINE: the spread you are working, drawn ── */
.rail{position:relative;height:30px;margin-top:12px;border-radius:6px;
  background:rgba(0,0,0,.05);overflow:visible}
.rail .seg{position:absolute;top:12px;height:6px;border-radius:3px}
.rail .seg.red{left:0;background:rgba(138,58,50,.22)}
.rail .seg.green{background:rgba(42,106,68,.30)}
.rail .mark{position:absolute;top:0;transform:translateX(-50%);text-align:center;z-index:2}
.rail .mark i{display:block;width:2.5px;height:30px;margin:0 auto;background:var(--ink);border-radius:2px}
.rail .mark.ceil i{background:transparent;border-left:2.5px dashed var(--dim);height:30px}
.rail .mark b{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;
  font:600 8.5px/1 ui-sans-serif;letter-spacing:.05em;text-transform:uppercase;
  color:var(--mid);white-space:nowrap}
.rail .mark.ceil b{color:var(--dim)}
.rail .dot{position:absolute;top:10.5px;width:9px;height:9px;border-radius:50%;
  transform:translateX(-50%);z-index:3;border:2px solid;background:transparent;
  transition:left .5s var(--e-pop)}
.rail .dot.down{border-color:var(--refuses)}
.rail .dot.up{border-color:var(--pays)}
.rail .dot.said.down{background:var(--refuses)}
.rail .dot.said.up{background:var(--pays);box-shadow:0 0 8px rgba(42,106,68,.6)}
.clock{height:6px;border-radius:4px;background:rgba(0,0,0,.10);overflow:hidden;margin-top:16px}
.clock span{display:block;height:100%;background:var(--day);border-radius:4px;
  transition:width .55s var(--e-out), background .5s linear}
.clock.warm span{background:#b8862a} .clock.late span{background:var(--refuses)}

/* ── BUTTONS: physical keys ────────────────────────────────────────────────
   The satisfying part of a real button is that it has DEPTH and the depth
   collapses. A hard bottom edge, no blur, that shrinks from 4px to 1px on
   press while the cap moves down by the same 3px — so the key travels
   instead of just tinting. Everything else here is that one trick. */
.btn{position:relative;display:inline-flex;align-items:center;gap:8px;
  font:600 13.5px/1 ui-sans-serif;padding:11px 15px;border-radius:9px;border:0;
  background:var(--stock);color:var(--ink);cursor:pointer;
  box-shadow:0 4px 0 0 #b9b2a0, 0 8px 16px -8px rgba(0,0,0,.75);
  transform:translateY(0);transition:transform .09s var(--e-out),box-shadow .09s var(--e-out),filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 0 #b9b2a0, 0 3px 8px -6px rgba(0,0,0,.7)}
.btn .k{font:700 9px/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 6px;border-radius:5px;background:rgba(27,32,39,.10);color:var(--mid);white-space:nowrap}
.btn.pay{background:var(--pays);color:#eaf4ee;box-shadow:0 4px 0 0 #1c4b30, 0 8px 16px -8px rgba(0,0,0,.75)}
.btn.pay:active{box-shadow:0 1px 0 0 #1c4b30, 0 3px 8px -6px rgba(0,0,0,.7)}
.btn.pay .k{background:rgba(255,255,255,.16);color:#cfe6d8}
.btn.dark{background:#2b3440;color:var(--stock);box-shadow:0 4px 0 0 #151b23, 0 8px 16px -8px rgba(0,0,0,.75)}
.btn.dark:active{box-shadow:0 1px 0 0 #151b23, 0 3px 8px -6px rgba(0,0,0,.7)}
.btn.dark .k{background:rgba(255,255,255,.12);color:#aab4c0}
.btn.warn{background:#7c3a32;color:#f7e9e6;box-shadow:0 4px 0 0 #4d221c, 0 8px 16px -8px rgba(0,0,0,.75)}
.btn.warn:active{box-shadow:0 1px 0 0 #4d221c, 0 3px 8px -6px rgba(0,0,0,.7)}
.btn.warn .k{background:rgba(255,255,255,.14);color:#eccdc6}
.btn:disabled{opacity:.38;cursor:default;transform:translateY(3px);
  box-shadow:0 1px 0 0 rgba(0,0,0,.3)}

/* ── the board of verbs ── */
.board{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.board .btn{flex:1;min-width:150px;justify-content:flex-start;padding:10px 13px}
.board .btn .bicon{width:30px;height:30px;image-rendering:pixelated;flex:0 0 auto;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.board .btn .bl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.board .btn:hover:not(:disabled) .bicon{animation:iconbob .4s var(--e-pop)}
@keyframes iconbob{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}

/* ── the call ── */
/* ── THE CALL IS A PERSON NOW ────────────────────────────────────────────
   A portrait in a round frame — the generated busts have four different
   backdrop treatments, and the circle crop turns that inconsistency into
   the one thing it could honestly be: a headshot. The line they say sits in
   an actual speech bubble with a tail aimed at the mouth, because the
   difference between a UI status string and a person talking to you is
   about nine pixels of triangle. */
.callbox{background:rgba(255,253,247,.97);color:var(--ink);border-radius:12px;padding:15px 16px;
  margin-bottom:14px;min-height:118px;display:flex;align-items:flex-start;gap:15px;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.9)}
.face{position:relative;width:64px;height:64px;flex:0 0 auto;margin-top:2px}
.face img{width:100%;height:100%;border-radius:50%;object-fit:cover;image-rendering:pixelated;
  border:2.5px solid var(--line);background:#ded8c8;display:none}
.face.on img{display:block}
.face.on .dial{display:none}
.face::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid transparent;
  border-top-color:var(--ring);opacity:0}
.face.ringing::after{opacity:1;animation:spin .8s linear infinite}
.face.ringing{animation:pulse .9s ease-in-out infinite}
.bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:12px;
  padding:11px 13px;margin-bottom:2px;transform-origin:14px 100%}
.bubble::after{content:'';position:absolute;left:-9px;top:22px;width:0;height:0;
  border:9px solid transparent;border-right-color:#fff;border-left:0}
.bubble::before{content:'';position:absolute;left:-11px;top:21px;width:0;height:0;
  border:10px solid transparent;border-right-color:var(--line);border-left:0}
.bubble.pop{animation:bpop .34s var(--e-pop)}
@keyframes bpop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
.dial{position:absolute;inset:0;border-radius:50%;border:3px solid var(--line);
  display:grid;place-items:center;font-size:22px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(47,106,138,.4)}50%{box-shadow:0 0 0 10px rgba(47,106,138,0)}}
.said{flex:1;min-width:0}
.said .who{font:600 8.5px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.said .line{font-family:Fraunces,Georgia,serif;font-size:18.5px;line-height:1.34;letter-spacing:-.01em}
.said .line em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:700}
.said .line.no em{color:var(--refuses)} .said .line.yes em{color:var(--pays)}
.said .obj{margin-top:7px;font:500 12.5px/1.4 ui-sans-serif;color:var(--goldink);
  background:rgba(232,207,114,.16);border-left:3px solid var(--gold);padding:7px 10px;border-radius:0 6px 6px 0}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ── buyers ── */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:11px}
.b{position:relative;background:rgba(246,243,234,.97);color:var(--ink);border-radius:10px;
  padding:11px 12px 10px;text-align:left;font:inherit;cursor:pointer;border:0;
  box-shadow:0 3px 0 0 rgba(0,0,0,.18), 0 14px 26px -18px rgba(0,0,0,.9);
  transition:transform .15s var(--e-out),box-shadow .15s var(--e-out),opacity .3s;overflow:hidden}
.b:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 6px 0 0 rgba(0,0,0,.18), 0 20px 34px -18px rgba(0,0,0,.9)}
.b:active:not(:disabled){transform:translateY(0);box-shadow:0 1px 0 0 rgba(0,0,0,.18), 0 8px 16px -14px rgba(0,0,0,.9);transition-duration:.06s}
.b.waiting{cursor:default;opacity:.74}
.b.done{cursor:default;opacity:.5;filter:saturate(.35)}
.b.done::after{content:'Called';position:absolute;top:8px;right:9px;font:700 7.5px/1 ui-sans-serif;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.b .nm{font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:center;gap:8px}
.b .nm img{width:32px;height:32px;border-radius:50%;object-fit:cover;image-rendering:pixelated;
  border:1.5px solid var(--line);background:#ded8c8}
.b .note{font:italic 400 11px/1.3 Georgia,serif;color:var(--mid);margin:2px 0 7px;min-height:28px}
.b .row{display:grid;grid-template-columns:42px 1fr auto;gap:6px;align-items:center;
  font:500 8px/1 ui-sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.pips{display:flex;gap:2px}.pips i{flex:1;height:5px;border-radius:2px;background:rgba(0,0,0,.10)}
.pips i.on{background:var(--mid)}
.b .row u{text-decoration:none;font:700 8.5px/1 ui-monospace,Menlo,monospace;color:var(--ink)}
.trust{display:flex;align-items:center;gap:5px;margin-top:7px;padding-top:6px;border-top:1px solid var(--line);
  font:600 8px/1 ui-sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--goldink)}
.trust b{display:flex;gap:3px}
.trust b i{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.12);
  transition:background .3s var(--e-pop),transform .3s var(--e-pop)}
.trust b i.on{background:var(--gold);box-shadow:0 0 0 1px rgba(157,91,12,.4) inset}
.trust b i.bump{transform:scale(1.8)}
.b .flag{position:absolute;top:8px;right:9px;font:700 7.5px/1 ui-sans-serif;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--gold);color:#5c4a10}
.b .stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.b .stamp span{font:700 12px/1 ui-sans-serif;letter-spacing:.14em;text-transform:uppercase;
  padding:6px 11px;border:2.5px solid currentColor;border-radius:5px;transform:rotate(-8deg)}
.b.stamped .stamp span{animation:thunkS .42s var(--e-pop)}
@keyframes thunkS{0%{transform:rotate(-8deg) scale(1.7);opacity:0}60%{opacity:1;transform:rotate(-8deg) scale(.92)}100%{transform:rotate(-8deg) scale(1);opacity:1}}

.bank{display:flex;align-items:baseline;gap:9px;margin-bottom:13px}
.bank i{font-style:normal;font:600 8.5px/1 ui-sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#b3bcc7;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.bank b{font:700 24px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.9)}
.bank.hit b{animation:bankhit .5s var(--e-pop)}
@keyframes bankhit{0%{transform:scale(1)}35%{transform:scale(1.24)}100%{transform:scale(1)}}
.shake{animation:shake .34s ease-in-out}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-4px)}}
.spark{position:fixed;width:7px;height:7px;border-radius:2px;pointer-events:none;z-index:99}
/* ── MONEY YOU CAN FEEL ──────────────────────────────────────────────────
   Every dollar that moves says so: a signed number leaps off the thing that
   spent or earned it, green up, red down, and drifts away. The Kept counter
   is the biggest number on the screen because it is the score. */
.fly{position:fixed;z-index:98;pointer-events:none;
  font:700 15px/1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 3px rgba(0,0,0,.55)}
.fly.up{color:#7fdba4}.fly.down{color:#f0917f}
.bank b{font-size:30px !important}
.goldflash{position:fixed;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;
  background:radial-gradient(60% 60% at 50% 42%,rgba(232,207,114,.36),rgba(11,17,27,0) 70%)}
.goldflash span{font:700 15px/1 ui-sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:#0b111b;background:var(--gold);padding:15px 26px;border-radius:12px;
  box-shadow:0 6px 0 0 #9d7c1c, 0 24px 60px -12px rgba(232,207,114,.65);
  animation:kstamp .8s var(--e-pop) both}
.goldflash span b{display:block;font:700 34px/1 ui-monospace,Menlo,monospace;
  letter-spacing:-.01em;margin-top:6px}
@keyframes kstamp{0%{transform:scale(1.8) rotate(-5deg);opacity:0}
  55%{transform:scale(.94) rotate(-2deg);opacity:1}100%{transform:scale(1) rotate(-2deg)}}
.log{margin-top:16px;font:400 12px/1.6 ui-sans-serif;color:#8f99a5}
.log div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.log b{color:#cdd5de;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}
  .btn:active{transform:none} .b:hover:not(:disabled){transform:none}}
</style>
<canvas id="bg" width="184" height="150"></canvas><div id="scrim"></div>
<div class="wrap">
<h1>The Assignment</h1>
<p class="sub">You never own it. Ten days, a phone, and whatever you can find out.</p>
<div class="bank" id="bank"><i>Kept</i><b>$0</b></div>

<div class="deal">
  <div class="addr"><b id="addr">—</b>
    <span id="meta"></span>
    <div class="rail" id="rail">
      <div class="seg red"></div><div class="seg green"></div>
      <div class="mark you" id="mkyou"><i></i><b id="mkyoulab">you’re in</b></div>
      <div class="mark ceil" id="mkceil"><i></i><b>ceiling</b></div>
    </div>
    <div class="clock" id="clock"><span style="width:100%"></span></div>
  </div>
  <div class="fig gold"><i>Cash</i><b id="cash">$2,400</b></div>
  <div class="fig"><i>Days</i><b id="days">10</b></div>
  <div class="fig pay"><i>Best</i><b id="best">—</b></div>
</div>

<div class="board" id="board"></div>

<div class="callbox"><div class="face" id="face"><img id="faceimg" alt=""><div class="dial" id="dial">☎</div></div>
  <div class="said"><div class="who" id="who">Nobody yet</div>
    <div class="bubble" id="bub"><div class="line" id="line">Six buyers. One of them wants this house — the job is finding out which, and what is stopping them.</div></div>
    <div id="objwrap"></div>
    <div class="acts" id="acts"></div></div></div>

<div class="list" id="list"></div>
<div class="log" id="log"></div>
</div>
<script type="module">

/* engines inlined */
/* THE CARD FACE.
   ─────────────────────────────────────────────────────────────────────────
   Every card in THE TERRITORY is a house somebody actually bought, and this
   is where that house gets drawn. The bar set for it, verbatim: "genuinely
   beautiful and eye popping … hundreds of genuinely unique beautiful
   property cards that people want to collect."

   Two things follow from that, and they pull in opposite directions.

   UNIQUE means the art cannot be one house recoloured. It is built from
   fourteen architectural silhouettes, nine districts, ten skies, five
   condition states and a per-address seed that moves every tree, fence post,
   window and parked car. That is ~63,000 distinct faces before the numbers
   on the card are considered, and none of them is a variant of a hero asset.

   BEAUTIFUL means it cannot be procedural mush, which is what you always get
   when you multiply parameters and hope. So the randomness is fenced hard:
   the seed chooses between *authored* options, never interpolates freely.
   Every palette is a hand-picked six-tone ramp with a deliberate warm/cool
   split between lit and shadowed faces. Every silhouette is drawn, not
   generated. The seed decides which good thing you get, never how good it is.

   And one rule above the rest, inherited from the product this game is a
   door into: THE ART IS DERIVED FROM THE DEAL. A wreck looks like a wreck —
   boarded glass, a tarped roof, a dead lawn — because its repair number is
   large, not because a rarity table said "make this one ugly". A card cannot
   be prettier than the house it records. That is what makes a rare card
   worth having: it is rare because the deal was actually that good.       */

/* ── the dice, fenced ─────────────────────────────────────────────────────
   One stream per card, seeded off the address, so a given house looks the
   same on every device forever — the same guarantee the daily street makes
   about its numbers, extended to its pixels. */
function seedFrom(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function rng(seed){
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length) % arr.length];

/* ── PALETTES ─────────────────────────────────────────────────────────────
   A sky is a six-tone ramp plus a light direction and a colour for what the
   light does to a wall. The warm/cool split is the whole trick: lit faces
   pull toward the sun's hue and shadowed faces pull toward the sky's, which
   is why a dusk card reads as dusk even in a thumbnail the size of a stamp. */
const SKIES = {
  morning: { name:'Morning',      up:'#5f9ac4', mid:'#a7cfe0', low:'#e6ecd8',
             sun:'#fff6d8', sunAt:[0.22,0.22], glow:'#ffe6ab', amb:'#5c7d94',
             lit:'#f2ead8', shade:'#8fa0ae', ink:'#171d27', star:0, weather:'clouds' },
  noon:    { name:'Hard noon',    up:'#4a95c9', mid:'#8fc3de', low:'#d6e4e2',
             sun:'#ffffff', sunAt:[0.74,0.12], glow:'#ffffff', amb:'#7b8f9e',
             lit:'#fbf7ec', shade:'#7d8e9c', ink:'#141a23', star:0, weather:'shadows' },

             lit:'#e5a870', shade:'#6a4740', ink:'#170e0c', star:0, weather:'ash' },
  rainbow: { name:'After the rain',up:'#3f78a8', mid:'#8fc0d2', low:'#dbe6d6',

/* A district decides what the ground is made of, what grows in it, and what

const DISTRICTS = {
