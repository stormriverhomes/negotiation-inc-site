<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Land Desk · Negotiation Inc</title>
<!-- ══ THE LAND DESK ═══════════════════════════════════════════════════════
     The desk prices seven exits and refuses the eighth with "it needs dirt".
     This is where that refusal sends you. One parcel, one play — buy the
     dirt, finish the lot, sell the lot — priced with the working shown, on
     the committed design: the ground is the hero, the sheet docks over it,
     and the floor is an opaque paper band the ground can never reach.

     THE GROUND, v1: the page ships FLAT — a surveyor's sketch on the dark
     ground token, no Google imagery, no Google credit (credit belongs to
     imagery, and there is none). The CesiumJS + Photorealistic 3D Tiles
     viewport slots into #ground when /api/land/config starts answering with
     a key; every state the design specifies (loading, no-coverage, quota)
     already has its markup and grammar here, so the 3D arrival is a swap,
     not a rebuild. The arithmetic never depended on the ground.

     The engine between the markers is INJECTED AT BUILD from land/engine.mjs
     — the same bytes the test suite holds to the design doc's ledger. Edit
     the module, never the copy. -->
<style>
:root{
 --ink:#0d1420; --mid:#41495a; --soft:#6b7486; --line:#e4e8ef; --line-ink:#c9d0dc;
 --wash:#f6f8fb; --blue:#1f5fd0; --blue-deep:#174aa3; --blue-soft:#eaf0fc; --blue-line:#c3d4f5;
 --green:#177a4d; --green-soft:#eaf6f0; --red:#b3372c; --red-soft:#faeeec; --red-line:#e8c4bf;
 --gold:#8a6612; --gold-soft:#fbf6e9; --gold-line:#e6d9ae;
 --r-card:18px; --r-in:12px; --r-btn:11px;
 --serif:'Fraunces',Georgia,serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 --mono:var(--sans);
 /* the dark-surface extension — five names, from the committed design, AA-
    checked there and nowhere re-derived. Paper floats on the ground reuse
    the light tokens unchanged: a card on the ground is the same card. */
 --ground:#0A0F18; --ground-ink:#E8EDF5;
 --ground-pill:rgba(13,20,32,.78); --ground-pill-line:rgba(255,255,255,.16);
 --ground-refusal:#E4685A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:15px;line-height:1.5}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.btn{font-family:var(--sans);font-size:14.5px;font-weight:650;padding:11px 20px;
 display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
 border:1px solid var(--line-ink);border-radius:var(--r-btn);background:#fff;color:var(--ink);
 cursor:pointer;transition:background .12s,border-color .12s}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-deep)}
.btn.sm{font-size:13px;padding:8px 14px}

/* ── the stage: ground + docked sheet ───────────────────────────────────── */
.stage{position:relative;height:calc(100vh - 58px);min-height:660px}
#ground{position:absolute;inset:0 0 34px 0;background:
 radial-gradient(120% 90% at 38% 42%, #16231c 0%, #101a15 34%, #0c1310 62%, var(--ground) 100%);
 overflow:hidden}
/* contour rings — a surveyor's sketch, not a picture pretending to be one */
#ground::before{content:'';position:absolute;inset:-20%;background:
 repeating-radial-gradient(circle at 40% 45%, transparent 0 54px, rgba(232,237,245,.045) 54px 55px);}
.floor{position:absolute;left:0;right:0;bottom:0;min-height:34px;background:#fff;
 border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:6px 14px;
 font-size:11px;color:var(--soft);z-index:6}
.floor b{color:var(--mid);font-weight:700}
.floor .cam{margin-left:auto;font-size:10.5px;white-space:nowrap}
/* ── GOOGLE'S CREDIT, IN OUR TYPE, ON PAPER ───────────────────────────────
   Cesium writes its credits into #credits and we do not fight it — we dress
   it. The rule from the brief holds either way: this band is opaque paper
   outside the render, so the attribution is legible over any terrain and no
   chip can enter it. What is styled here is size and colour only; the text
   and its links are Google's, unaltered. */
#credits{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-width:0;
 font-size:10.5px;line-height:1.4;color:var(--soft)}
#credits img{height:15px;width:auto;vertical-align:middle}
#credits a{color:var(--soft);text-decoration:none}
#credits a:hover{text-decoration:underline}
#credits .cesium-credit-lightbox-overlay{z-index:40}
#credits ul,#credits li{list-style:none;display:inline;margin:0;padding:0}
/* the header card — paper, floating on the ground */
.hcard{position:absolute;top:18px;left:18px;z-index:5;background:#fff;border:1px solid var(--line);
 border-radius:var(--r-card);padding:13px 17px 12px;box-shadow:0 10px 34px rgba(4,8,14,.45);max-width:420px;
 transition:max-width .18s ease,padding .18s ease}
/* ── FOLDED ───────────────────────────────────────────────────────────────
   Not hidden — folded. The address stays, because a picture of ground with
   no address on it is a screenshot of nowhere, and the control that put it
   away is the control that brings it back, in the same place. */
.hcard.fold{max-width:min(320px,52vw);padding:9px 40px 9px 13px}
.hcard.fold #hbody{display:none}
.hcard.fold .k{font-size:9px;opacity:.62}
.hcard.fold h1{font-size:14.5px;line-height:1.25;margin-top:1px;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hfold{position:absolute;top:8px;right:8px;width:30px;height:30px;display:grid;place-items:center;
 border:1px solid var(--line);border-radius:9px;background:var(--wash);cursor:pointer;padding:0}
.hfold:hover{border-color:var(--line-ink);background:#fff}
.hfold:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hfx{display:block;width:10px;height:6px;
 background:no-repeat center/10px 6px url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%234a5162' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
 transition:transform .18s ease}
.hcard.fold .hfx{transform:rotate(180deg)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.hcard .k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.hcard h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.hcard .sub{font-size:12px;color:var(--soft);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hcard .cov{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
 border:1px solid var(--line-ink);border-radius:999px;padding:3px 8px;color:var(--mid);background:var(--wash)}
.hcard input{font:inherit;font-size:13.5px;border:1px solid var(--line-ink);border-radius:9px;
 padding:7px 10px;width:100%;margin-top:9px;background:var(--wash)}
.hcard input:focus{outline:none;border-color:var(--blue);background:#fff}
/* ── A PLACEHOLDER IS NOT A FIGURE ────────────────────────────────────────
   The ledger's inputs are set in the ledger's own weight, so an empty field
   showing "298,000" read exactly like an entered one — a bold, dark number
   sitting beside a red NEEDED tag, which is the sheet contradicting itself
   in the one place it must not. Placeholders are now visibly a suggestion:
   lighter, unemphatic, and never mistakable for something somebody typed. */
input::placeholder{color:#9aa3b2;font-weight:400;opacity:1}
.lrow input::placeholder,.conc input::placeholder,.ask .big input::placeholder{font-weight:400;color:#a8b0bd}
/* the parcel sketch */
/* the sheet is docked over the right 466px of the ground, so the drawing is
   given the ground the sheet is NOT standing on. Centering it in the whole
   width would put a third of the parcel under a white card. */
#parcel{position:absolute;inset:0 466px 0 0;width:auto;height:100%;z-index:1}
@media(max-width:1000px){ #parcel{inset:0;width:100%} }
/* every stroke in the plan is a DRAWN LINE, not a scaled shape: without this
   a 1.4-unit stroke becomes thirteen pixels at desktop scale and a survey pin
   reads as a landing pad */
#plan *{vector-effect:non-scaling-stroke}
/* non-scaling-stroke: the viewBox stretches to the viewport, and without it
   the dashes stretch too — 1.6px of survey line became forty-pixel slabs */
#parcel polygon{fill:rgba(232,237,245,.03);stroke:var(--ground-ink);stroke-opacity:.55;
 stroke-width:1.6;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
#parcel .refline{stroke:var(--ground-refusal);stroke-opacity:.95;stroke-width:2.2;stroke-dasharray:4 4}
/* ══ THE RAIL ══════════════════════════════════════════════════════════════
   Sticky at the top of the sheet, because the sheet scrolls independently and
   a rail you have to scroll back to find is a rail nobody uses. It DESCRIBES
   where you are; it never decides where you may be. */
.rail2{position:sticky;top:-18px;z-index:9;background:#fff;margin:-18px -20px 4px;
 padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.rrow{display:flex;gap:6px;align-items:stretch}
.rph{flex:1;min-width:0;text-align:left;cursor:pointer;font:inherit;background:var(--wash);
 border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px;
 transition:opacity .28s ease,border-color .28s ease,background .28s ease}
.rph.on{background:var(--blue-soft);border-color:var(--blue-line)}
.rph.lat{opacity:.46}
.rph.lat.on{opacity:1}
.rph:hover{border-color:var(--line-ink)}
.rph .rn{font-size:9.5px;font-weight:800;color:var(--soft);margin-right:4px}
.rph.on .rn{color:var(--blue)}
.rph .rname{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
 color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rph.on .rname{color:var(--ink)}
.rph .rcount{display:block;font-size:11.5px;font-weight:700;color:var(--mid);
 font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rph.on .rcount{color:var(--ink)}
.rph .rtrk{display:block;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px}
.rph .rtrk i{display:block;height:100%;background:var(--line-ink);
 transition:width .38s cubic-bezier(.2,.7,.2,1)}
.rph.on .rtrk i{background:var(--blue)}
.rnext{display:flex;align-items:baseline;gap:8px;width:100%;margin-top:8px;text-align:left;
 cursor:pointer;font:inherit;background:var(--wash);border:1px solid var(--line);
 border-radius:9px;padding:7px 10px}
.rnext:hover{border-color:var(--line-ink)}
.rnext .k{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.rnext .s{font-size:12.5px;color:var(--ink);font-weight:600;overflow:hidden;
 text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rnext .a{margin-left:auto;font-size:12px;color:var(--blue);font-weight:700}
/* a region is a chapter of one document, never a screen */
.region{padding-top:14px;margin-top:12px;border-top:1px solid var(--line)}
.region:first-of-type{border-top:0;margin-top:0;padding-top:4px}
.region .rh{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
 color:var(--soft);margin-bottom:8px}
/* LATENT: present, dimmed, legible as waiting. Not hidden, not disabled —
   the rows are there and the arithmetic is what has not arrived. */
.region.latent{opacity:.46;transition:opacity .32s ease}
.region.latent:hover,.region.latent:focus-within{opacity:.72}
.ledger.dim .num{color:var(--soft)}
.clears.dimfig{color:var(--line-ink)}
.big2 .n{font-weight:650}
/* the ground answers the phase it is on */
.chip{transition:opacity .32s cubic-bezier(.2,.7,.2,1)}
.sbar{position:absolute;z-index:4;display:flex;align-items:center;gap:8px;transform:translateY(-50%);
 pointer-events:none;color:var(--ground-ink);opacity:.72;font-size:10px;font-weight:700;
 letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sbar i{display:block;height:6px;border:1px solid currentColor;border-top:0;opacity:.85}
.planwhy{margin-top:8px;font-size:11px;line-height:1.5;color:var(--soft);max-width:44ch}
.planwhy b{color:var(--ink)}
/* anchored chips: white pill on a 1px leader; the dot is the truth */
.chip{position:absolute;z-index:4;transform:translate(-50%,-100%)}
/* the spec's collision rule, v1: the dot never moves; the chip slides along
   its leader to free space. A chip anchored in the sheet's shadow keeps its
   dot on the dirt and swings its pill out to the left. */
.chip.flip{transform:translate(calc(-100% + 30px),-100%)}
.chip.flip .leader,.chip.flip .dot{left:calc(100% - 30px)}
.chip .pill{display:inline-flex;align-items:baseline;gap:7px;background:#fff;border:1px solid var(--line);
 border-radius:999px;padding:7px 12px;white-space:nowrap;box-shadow:0 6px 20px rgba(4,8,14,.4);cursor:default}
.chip .lab{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.chip .val{font-size:13px;font-weight:700}
.chip .leader{position:absolute;left:50%;top:100%;width:1px;height:26px;background:var(--ground-ink);opacity:.6}
.chip .dot{position:absolute;left:50%;top:calc(100% + 26px);width:7px;height:7px;border-radius:50%;
 background:var(--ground-ink);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(232,237,245,.18)}
.tag{font-size:8.5px;font-weight:800;letter-spacing:.12em;border-radius:999px;padding:2px 7px}
.tag.en{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line)}
.tag.es{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.tag.nd{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
/* ground controls — pills over the render, dark grammar */
.gctl{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.gctl button{font-size:12.5px;font-weight:650;color:var(--ground-ink);background:var(--ground-pill);
 border:1px solid var(--ground-pill-line);border-radius:999px;padding:8px 16px;cursor:pointer}
.gctl button[disabled]{cursor:not-allowed;opacity:.55}
/* ── THE GROUND IS A PRESS, NOT AN AMBUSH ─────────────────────────────────
   Loading Google's photorealistic tiles on arrival spent a billed session on
   every drive-by, burnt the daily cap on people who came to type numbers,
   and — worst — FAILED SILENTLY: a rate-limited visitor got the sketch with
   no explanation, which reads as "the maps thing is buggy". A button makes
   every state sayable: raising, resting, out for the day, no WebGL. And
   summoning the earth on purpose feels better than sometimes receiving it. */
.gctl .raise{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.gctl .raise:hover{background:var(--blue-deep)}
.gctl .raise[disabled]{opacity:.85;cursor:default}
/* the docked worksheet */
.sheet{position:absolute;top:18px;right:18px;bottom:52px;width:430px;z-index:5;overflow:auto;
 background:#fff;border:1px solid var(--line);border-radius:var(--r-card);
 box-shadow:0 14px 44px rgba(4,8,14,.5);padding:18px 20px}
.sheet .k{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
.ask .big{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:-.02em;display:flex;
 align-items:center;gap:10px}
/* the ask is the headline and it is typed in place — it wears the headline's
   own type, not a browser-default 13px box (which iOS would also zoom) */
.ask .big input{font:inherit;font-size:24px;width:9ch;border:1px solid transparent;border-radius:9px;
 padding:2px 7px;background:transparent;font-variant-numeric:tabular-nums;box-sizing:content-box}
.ask .big input:hover{border-color:var(--line-ink);background:var(--wash)}
.ask .big input:focus{outline:none;border-color:var(--blue);background:#fff}
.ask .sub{font-size:12px;color:var(--soft);margin-top:2px}
.play{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.clears{font-family:var(--serif);font-size:42px;font-weight:700;letter-spacing:-.02em;color:var(--green);line-height:1.05}
.clears.neg{color:var(--red)}
.clears-sub{font-size:12.5px;color:var(--mid);margin-top:3px}
.refuse{margin-top:10px;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red);
 border-radius:var(--r-in);padding:10px 13px;font-size:13px;line-height:1.55}
.refuse b{font-weight:750}
.ledger{margin-top:12px}
.lrow{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.lrow:first-child{border-top:none}
.lrow .n{color:var(--mid)}
.lrow .f{margin-left:auto;display:flex;align-items:baseline;gap:8px}
.lrow .num{font-weight:700}
.lrow input{font:inherit;font-weight:700;font-variant-numeric:tabular-nums;width:7.5ch;text-align:right;
 border:1px solid transparent;border-radius:7px;padding:2px 5px;background:transparent;box-sizing:content-box}
.lrow input:hover{border-color:var(--line-ink);background:var(--wash)}
.lrow input:focus{outline:none;border-color:var(--blue);background:#fff}
.lsub{display:flex;gap:8px;align-items:baseline;padding:0 0 8px 16px;font-size:12.5px;color:var(--soft)}
.lsub .num{margin-left:auto;font-weight:650}
.tagbtn{cursor:pointer;border:none;background:none;padding:0}
.conc{margin-top:10px;background:var(--wash);border-radius:var(--r-in);padding:10px 13px;font-size:13px}
.conc b{font-weight:750}
.conc input{font:inherit;font-weight:700;width:7ch;border:1px solid transparent;border-radius:6px;
 text-align:left;background:transparent;font-variant-numeric:tabular-nums;padding:1px 2px;box-sizing:content-box}
.conc input:hover{border-color:var(--line-ink);background:#fff}
.conc input:focus{outline:none;border-color:var(--blue);background:#fff}
/* ── the lot bench: the way in to the one figure nothing prices without ──
   Same grammar as the ledger it feeds — small rows, tags, one suggestion
   with its basis stated. Deliberately not the house workbench shrunk: five
   fields per comp, no adjusters, because the land sheet has not earned the
   knobs yet. */
.lots{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-in);background:var(--wash);padding:10px 12px}
.lots .lh{display:flex;align-items:baseline;gap:8px}
.lots .lh .k{flex:1}
.lots .lrowc{display:grid;grid-template-columns:1fr 62px 52px 52px 24px;gap:6px;margin-top:7px;align-items:center}
.lots .lrowc input{font:inherit;font-size:12.5px;border:1px solid var(--line-ink);border-radius:7px;
 padding:5px 7px;background:#fff;min-width:0}
.lots .lrowc input:focus{outline:none;border-color:var(--blue)}
.lots .lrowc .x{border:none;background:none;color:var(--soft);cursor:pointer;font-size:13px;padding:2px}
.lots .lrowc .x:hover{color:var(--red)}
.lots .lwhy{grid-column:1/-1;font-size:10.5px;color:var(--soft);margin-top:-2px;display:flex;gap:6px;align-items:baseline}
.lots .lwhy .sc{font-weight:800;font-size:10px;border-radius:999px;padding:1px 6px;background:#fff;border:1px solid var(--line-ink)}
.lots .ladd{margin-top:8px;font:inherit;font-size:12px;font-weight:650;color:var(--blue);
 border:1px dashed var(--blue-line);border-radius:8px;background:#fff;padding:6px 10px;cursor:pointer;width:100%}
.lots .lsay{margin-top:9px;font-size:12.5px;line-height:1.5;color:var(--mid)}
/* ── SITE WORK, BY LINE ───────────────────────────────────────────────────
   The land analogue of the condition panel, and deliberately NOT sliders.
   On a house, condition is a share of the finished value, so a slider says
   "how bad is it" and the dollars fall out of the ARV. A driveway costs what
   a driveway costs — it does not scale with what the finished lot sells for,
   and a slider from zero to an invented ceiling would be pretending we know
   a range we do not. So: named lines, real dollars, each one a quote you
   either have or do not. */
.sitel{display:grid;grid-template-columns:1fr 92px 20px;gap:5px 8px;align-items:center;margin-top:6px}
.sitel label{font-size:12.5px;color:var(--mid)}
.sitel input{font:inherit;font-size:12.5px;text-align:right;border:1px solid var(--line-ink);
 border-radius:7px;padding:5px 7px;background:#fff;min-width:0}
.sitel input:focus{outline:none;border-color:var(--blue)}
.sitel .e{border:none;background:none;cursor:pointer;padding:0;font-size:8.5px;font-weight:800;
 letter-spacing:.1em;color:var(--soft)}
.sitesum{display:flex;align-items:baseline;gap:8px;margin-top:9px;padding-top:8px;
 border-top:1px solid var(--line);font-size:12.5px}
.sitesum b{margin-left:auto;font-weight:750;font-variant-numeric:tabular-nums}
.lots .lsay b{font-weight:750;color:var(--ink)}
.lots .ltake{margin-top:7px;display:flex;gap:8px;align-items:center}
.lotlink{font-size:11px;font-weight:650;color:var(--blue);background:none;border:none;cursor:pointer;padding:0}
.firm{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.firm .fh{display:flex;align-items:center;gap:8px}
.firm p{font-size:12.5px;color:var(--mid);line-height:1.55;margin-top:6px}
.facts{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.facts .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:9px}
.facts label{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);display:block}
.facts input,.facts select{font:inherit;font-size:13px;width:100%;border:1px solid var(--line-ink);
 border-radius:8px;padding:9px 8px;margin-top:3px;background:#fff;min-height:40px}
.facts input:focus,.facts select:focus{outline:none;border-color:var(--blue)}
/* ── THE DROPDOWNS WERE THE ONLY BROWSER FURNITURE ON THE SHEET ────────────
   `font:inherit` sets the family, and then the platform overrides the rest:
   a <select> ships its own weight, its own line-height and a chevron drawn by
   the operating system, so four fields in the middle of a typeset ledger
   looked like they came from somewhere else. Worse, the native control does
   not shrink its text, so "Scattered trees, light brush" and "Unknown — price
   a septic" were CUT OFF mid-word.

   appearance:none takes the platform styling off, the chevron is drawn here
   in the sheet's own ink, and the right padding is the room the chevron sits
   in — so the longest option ends before it rather than under it. */
.facts select{
 -webkit-appearance:none;-moz-appearance:none;appearance:none;
 font-weight:inherit;line-height:1.35;color:var(--ink);
 padding-right:28px;text-overflow:ellipsis;
 background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%234a5162' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
 background-repeat:no-repeat;background-position:right 10px center;background-size:10px 6px}
.facts select:hover{border-color:var(--mid)}
/* Firefox keeps a focus ring on the text itself; and an option list is drawn
   by the OS, so it is told the colours rather than styled */
.facts select:-moz-focusring{color:transparent;text-shadow:0 0 0 var(--ink)}
.facts select option{font-weight:400;color:#101725;background:#fff}
/* a chosen value and an unchosen one are different states and now look it */
.facts select:invalid,.facts select.empty{color:var(--soft)}
.sfoot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.fine{font-size:11.5px;color:var(--soft);line-height:1.55;margin-top:10px}
/* the phone: ground on top, chip rail pinned to it, sheet below */
.rail{display:none}
@media(max-width:1000px){
 .stage{min-height:0;height:auto}
 .hcard{top:12px;left:12px;padding:10px 13px 9px;border-radius:14px}
 .hcard h1{font-size:16.5px}
 .hcard .sub{font-size:10.5px;gap:6px}
 /* every input holds 16px on a phone — one pixel under it and iOS Safari
    zooms the page on focus, which reads as the layout breaking */
 .hcard input,.lrow input,.conc input,.facts input,.facts select{font-size:16px}
 .hcard input{padding:5px 8px;margin-top:6px}
 .lrow input[data-k="months"]{width:38px}
 #ground{position:relative;inset:auto;height:46vh;min-height:300px}
 .floor{position:static;height:auto;padding:8px 14px}
 .sheet{position:static;width:auto;margin:0;border-radius:0;box-shadow:none;border-left:none;border-right:none}
 .chip{display:none}
 .dotn{position:absolute;z-index:4;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(232,237,245,.2)}
 .rail{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--ground);
  -webkit-overflow-scrolling:touch}
 .rail .pill{display:inline-flex;align-items:baseline;gap:7px;background:#fff;border-radius:999px;
  padding:8px 12px;white-space:nowrap;flex:0 0 auto;font-size:12.5px}
 .rail .n{font-weight:800;color:var(--soft);font-size:10.5px}
 .rail .lab{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}
 .rail .val{font-weight:700;font-size:12.5px}
 .gctl{bottom:14px}
 .hcard{max-width:calc(100% - 36px)}
 .clears{font-size:36px}
}
@media(min-width:1001px){ .dotn{display:none} }
/* ── the site-work benchmarks ──────────────────────────────────────────────
   Slate, not gold: pressing one of these is taking an ESTIMATE, and the
   product's rule is that an estimate is marked, never flagged. A refusal —
   the well, the tap — sits in the same slate, because "we will not guess this"
   is not a warning either. It is the sheet keeping its promise. */
.sbwrap{margin:-2px 0 9px;padding-left:2px}
.sbc{display:flex;flex-wrap:wrap;gap:6px}
.sbc button{display:inline-flex;align-items:baseline;gap:7px;cursor:pointer;font:inherit;
 border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;color:var(--soft);
 font-size:11.5px;text-align:left}
.sbc button:hover{border-color:var(--ink);color:var(--ink)}
.sbc button b{font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.sbcall{font-size:11.5px;line-height:1.55;color:var(--soft);background:var(--wash);
 border:1px solid var(--line);border-radius:10px;padding:8px 11px}
.sbcall b{color:var(--ink)}
.sbneed{font-size:11.5px;color:var(--soft);font-style:italic}
.sbnote{font-size:11px;line-height:1.5;color:var(--soft);margin-top:5px;max-width:52ch}
.sbmore{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-size:11px;
 font-weight:700;color:var(--soft);text-decoration:underline;text-underline-offset:2px}
.sbmore:hover{color:var(--ink)}
.sbrest{display:block;margin-top:4px}
.facts .fsay{font-size:11.5px;color:var(--soft);margin:2px 0 9px;line-height:1.5}
.facts label em{font-style:normal;font-weight:600;color:var(--soft);opacity:.75;
 display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.lwall{font-size:12px;line-height:1.55;color:var(--soft);background:var(--wash);
 border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:9px}
.lwall b{color:var(--ink)}
.lwall .btn{margin-top:9px;display:inline-flex}
.ladd .cnt{font-weight:600;color:var(--soft);font-size:11px;margin-left:6px}
.seam{background:#fff;border-top:1px solid var(--line);padding:13px 18px;font-size:12.5px;color:var(--soft)}
.seam a{font-weight:650}
</style>
</head>
<body>
<div class="stage">
 <div id="ground">
  <!-- xMidYMid meet, NOT none. Under `none` the viewBox stretches to the
       container, so one unit across is not one unit down — and a driveway
       drawn north-south would read shorter than the same driveway drawn
       east-west. That is fine for wallpaper and fatal for a scale drawing. -->
  <svg id="parcel" preserveAspectRatio="xMidYMid meet" viewBox="0 0 100 100" aria-hidden="true">
   <polygon points="26,32 62,24 84,46 66,72 34,74 22,52"/>
   <g id="plan"></g>
  </svg>
  <div id="chips"></div>
  <div class="gctl">
   <button type="button" id="raise" class="raise">Raise the 3D ground</button>
   <button type="button" disabled title="The camera arrives with the 3D ground">Orbit</button>
   <button type="button" disabled title="The camera arrives with the 3D ground">Tilt</button>
   <button type="button" disabled title="The camera arrives with the 3D ground">Reset north</button>
  </div>
  <!-- ── THE CARD HAS TO BE ABLE TO GET OUT OF THE WAY ────────────────────
       420px of white card sits over the top-left of the ground. On a sketch
       that costs a corner of a drawing we drew. Over Google's photorealistic
       tiles — which is the whole reason anyone raises the 3D ground — it
       covers the parcel you paid a session to look at.
       So: one control, always in the same place, that folds it down to its
       address line. It remembers, and raising the 3D ground folds it for you
       the first time, because at that moment you have just said what you
       want to look at. -->
  <div class="hcard" id="hcard">
   <button type="button" id="hfold" class="hfold" aria-expanded="true"
     aria-controls="hbody" title="Fold the panel away from the ground">
     <span class="hfx" aria-hidden="true"></span><span class="sr">Fold the panel</span></button>
   <div class="k">Negotiation Inc · The Land Desk</div>
   <h1 id="h-addr">A parcel, priced with the working shown</h1>
   <div id="hbody">
    <div class="sub"><span id="h-sub">Type the parcel below — one lump figure opens the play</span>
     <span class="cov" id="h-cov">Ground · sketch</span></div>
    <input id="in-addr" type="text" maxlength="90" placeholder="Address or parcel — e.g. 1847 Saddleback Pass, Wimberley TX" autocomplete="off">
    <div class="planwhy" id="planwhy"></div>
   </div>
  </div>
 </div>
 <div class="rail" id="rail"></div>
 <aside class="sheet" id="sheet"></aside>
 <div class="floor" id="floor"></div>
</div>
<div class="seam" id="seam">
 The desk prices seven exits on a house and refuses the eighth — <em>it needs dirt</em>. This is the dirt.
 <a href="desk.html">Back to the desk</a> · <a href="exits.html#land">the land lesson</a>
 <button class="btn sm" id="demo" style="margin-left:12px">Load the worked example — 1847 Saddleback Pass</button>
 <button class="btn sm" id="clear">Start clean</button>
</div>

<script>
/*__TIER_GRAMMAR__*/
/*__LAND_ENGINE__*/

/* ── the sheet's state, with the desk's three words ───────────────────────
   raw holds strings exactly as typed; est marks a figure the owner called a
   guess. Typing is ENTERED by default — pressing the tag flips it — and an
   empty figure is NEEDED, which is a state, not an absence. */
/* Declared HERE, above the first render, and not down beside the code that
   fills it in: renderGround() reads G3.on on the very first paint, and a
   `let` declared later in the file is in its temporal dead zone at that
   moment — which throws, silently, inside the function that draws the floor. */
let G3 = { on:false, viewer:null, tileset:null, center:null, orbiting:false, tiltIdx:1 };
const KEY='ni-land-v1';
let SLIDE=null;   // the price being tried — a question, not a figure, so never saved
/* near the two prices that matter, you are ON them; elsewhere, round money */
const trySnap=(v,ceil,ask)=>{ if(Math.abs(v-ceil)<=600) return ceil;
 if(ask!==null&&Math.abs(v-ask)<=600) return ask; return Math.round(v/500)*500; };
const tryLine=(m,at,askV)=>{ const c=m.clearsAt(at);
 const cls=c>=m.target?'var(--green)':c>=0?'var(--gold)':'var(--red)';
 return '<b>'+fmt(at)+'</b> → the play clears <b style="color:'+cls+'">'+fmt(c)+'</b>'
  +(at===m.ceiling?' — your ceiling, to the dollar':c>=m.target?' — clears your target'
    :c>=0?' — thinner than your $'+m.target.toLocaleString('en-US')+' target':' — you would pay to own this problem')
  +(askV!==null?'<span style="color:var(--soft)"> · their number is '+fmt(askV)+'</span>':''); };
/* ── ONE SHAPE, ONE PLACE ─────────────────────────────────────────────────
   This literal was written out three times — here, in the worked example's
   reset, and in Start clean — so every field added to the sheet had to be
   remembered three times. It was not: `lots` and `site` were missing from
   two of them, and pressing the demo left S.site undefined for the next
   keystroke to throw on. A blank sheet is one function now. */
/* ── THE FACTS EARN THEIR PLACE ────────────────────────────────────────────
   `slope` was a free-text box and `trees` did not exist, and between them they
   priced nothing: they were captions on a picture. They are bands now, because
   a band is what a benchmark can be computed from, and a benchmark you can
   press is the difference between a panel a beginner uses and one they close.
   `driveFt` and `poleFt` are here for the same reason and no other — a drive
   is priced by the foot and so is a wire, and neither can be guessed from
   acreage. Nothing is asked for on this sheet that does not move a number. */
const blank = () => ({ addr:'', raw:{}, est:{}, months:'9', sewer:'unknown', access:'unverified',
  zoning:'', slope:'', trees:'', frontage:'', fema:'', zoningEst:true, frontageEst:true,
  lots:[], lotsOpen:false, site:[], siteOpen:false, siteWhy:[] });
let S = blank();
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object') S=Object.assign(S,s); }catch(e){}
/* localStorage is writable by anything that ever ran on this origin — the
   lots are typed on the way in, the same discipline as the bankroll */
S.lots = (Array.isArray(S.lots)?S.lots:[]).slice(0,8).map(c=>({
  price:String((c&&c.price)??'').slice(0,20), acres:String((c&&c.acres)??'').slice(0,20),
  months:String((c&&c.months)??'').slice(0,20), dist:String((c&&c.dist)??'').slice(0,20) }));
S.lotsOpen = !!S.lotsOpen;
S.site = (Array.isArray(S.site)?S.site:[]).slice(0,10).map(x=>({
  id:String((x&&x.id)??'').slice(0,20), v:String((x&&x.v)??'').slice(0,20),
  est: !!(x&&x.est) }));
S.siteOpen = !!S.siteOpen;
/* folded, and whether raising the 3D ground has already folded it once — the
   automatic fold is a courtesy, so it happens the first time and then never
   overrules a person who has deliberately opened it back up */
S.hFold = !!S.hFold;
S.hFoldAuto = !!S.hFoldAuto;
S.siteWhy = (Array.isArray(S.siteWhy)?S.siteWhy:[]).slice(0,10).map(x=>String(x).slice(0,20));
const save=()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };

/* ══ THIS ROOM KNOWS WHO IS IN IT ══════════════════════════════════════════
   It did not. `grep` for tierOf, entitled or signedIn in this file returned
   nothing at all, and the page was not on the build's list of pages that get
   the account script appended — so the Land Desk was an island with no
   account, no masthead and no wall.

   That was not a cosmetic gap. plans.html promises, in a bullet somebody is
   asked to pay against: "The comp workbench — score sales yourself. Three in
   this browser, twelve a week with a free account." The sold-lot bench below
   is a comp workbench on a different asset, and it handed a stranger EIGHT,
   scored, free, while the house sheet two clicks away told the same person
   they had three. A pricing page a second room contradicts is worse than a
   missing feature: it teaches people the pricing page is decorative.

   The grammar is the shared one, injected above, so the two rooms cannot
   drift. tierOf() paints; entitled() decides; and the allowance is the SAME
   meter the house bench spends, because one promise with one number is worth
   more than two meters that each need explaining. */
function signedIn(){ try { const a = JSON.parse(localStorage.getItem('ni-account-v1'));
  return a && typeof a === 'object' && typeof a.name === 'string' && a.name ? a : null; } catch(e){ return null; } }
function previewTier(){
  if (typeof window === 'undefined' || window.NI_LIVE === true) return null;
  let v = null; try { v = localStorage.getItem('ni-preview-plan'); } catch(e){}
  if (v === null) return null;
  const k = String(v).trim().toLowerCase();
  if (!k || k === 'free') return 0;
  return TIERS[k] || 1;
}
/* there is no demo mode in this room — the worked example is a sheet you can
   type over, not a sealed showroom — so `demo` is always false here */
const tierOf   = () => tierFor(signedIn(), { demo:false, preview:previewTier() });
const premium  = () => tierOf() >= 1;
const entitled = n => entitledFor(signedIn(), n, { demo:false });

/* ceiling 8, not 24: a lot bench with two dozen rows is a spreadsheet, and
   acreage country rarely has two dozen honest comparables anyway */
const LOT_CEILING = 8;
function lotRoom(){
  return benchRoom({ paid: premium(), acct: signedIn(),
    quota: (signedIn() && typeof window.__compAllowance === 'function')
      ? window.__compAllowance() : null,
    used: (S.lots||[]).length, ceiling: LOT_CEILING });
}
/* the meter is spent when a lot is ADDED — never on a render, never on an
   edit. A meter that ticks when you look at the screen is a meter people
   learn to resent. */
function spendLot(){
  if (premium() || !signedIn()) return;
  if (typeof window.__compUse !== 'function') return;
  Promise.resolve(window.__compUse(1)).then(q => { if (q) renderSheet(); }).catch(()=>{});
}
const $=id=>document.getElementById(id);
const numOf=k=>{ const v=parseFloat(String(S.raw[k]||'').replace(/[^0-9.]/g,'')); return Number.isFinite(v)&&v>0?v:null; };
const inp=k=>{ const v=numOf(k); return v===null?null:{ v, prov:S.est[k]?'estimate':'entered' }; };
const fmt=v=>'$'+Math.round(v).toLocaleString('en-US');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* the bands, in the words the chip on the dirt uses — short enough to sit on
   a pill, specific enough to be worth choosing between */
const gradeLab = id => ({ flat:'flat to gentle', roll:'rolling · 5–12%',
  steep:'steep · 12–25%', severe:'severe · 25%+' })[id] || '—';
const treeLab  = id => ({ open:'open pasture', scatter:'scattered trees',
  wooded:'wooded', heavy:'heavy timber' })[id] || '—';
/* everything the benchmarks price from, gathered once so the panel and the
   sheet can never be looking at two different parcels */
function benchCtx(){
  const n = k => { const v = parseFloat(String(S.raw[k]||'').replace(/[^0-9.]/g,''));
    return Number.isFinite(v) && v > 0 ? v : null; };
  return { acres:n('acres'), driveFt:n('driveFt'), poleFt:n('poleFt'),
           grade:S.slope, trees:S.trees, sewer:S.sewer };
}

function model(){
 /* months and carryMo were never passed, so the engine's carry arm — tested,
    documented, correct — multiplied nothing by nothing while the ledger row
    said "site work + carry, 9 mo". A months box that changes no number is
    worse than no box: it teaches people the sheet does not mean what it says. */
 const mo = parseFloat(String(S.months).replace(/[^0-9.]/g,''));
 return landModel({
  asking:inp('asking'), acres:inp('acres'), finished:inp('finished'),
  siteLump:inp('lump'), target:inp('target'),
  /* siteCarryOf has taken an ITEMS array since the first commit — "early it
     is a LUMP, later it is ITEMS, and the moment items exist they win" — and
     no surface ever built one. This is that surface. */
  site: siteItems(),
  months:(Number.isFinite(mo)&&mo>0)?{v:mo,prov:'entered'}:null, carryMo:inp('carryMo'),
  sewer:S.sewer, access:S.access,
 });
}

/* ── the chips: the parcel's facts, anchored to the dirt they describe ────
   Hand-placed anchors on the sketch (percent coordinates). The dot is the
   truth; when the 3D ground arrives these same six ride the camera. */
const TAG=(p,t)=>'<span class="tag '+(p==='nd'?'nd':p==='es'?'es':'en')+'">'+t+'</span>';
function chipData(m){
 const acres=inp('acres');
 /* ── ANCHORS, RE-PLACED FOR A DRAWING THAT NOW MEANS SOMETHING ────────────
    These six were hand-tuned against a ground that was empty and a viewBox
    that STRETCHED — the pills could go anywhere because nothing was underneath
    them, and the dots were never really on the polygon they appeared to touch.
    Both of those changed. The sketch is a scale drawing now and the dot lands
    where the geometry is, so the anchors are placed against the two obstacles
    that do not move — the header card over the top-left, the sheet docked
    right — and against the marks they must not bury. */
 return [
  { at:[46,46], lab:'Acreage',  val:acres?acres.v+' ac':'—', tag:acres?(S.est.acres?['es','ESTIMATE']:['en','ENTERED']):['nd','NEEDED'] },
  { at:[70,28], lab:'Zoning',   val:S.zoning||'county code', tag:S.zoning?(S.zoningEst?['es','ESTIMATE']:['en','ENTERED']):['nd','NEEDED'] },
  { at:[28,56], lab:'FEMA flood', val:S.fema||'look it up',  tag:S.fema?['en','fema.gov']:['nd','NEEDED'] },
  { at:[52,66], lab:'Slope',    val:gradeLab(S.slope),       tag:S.slope?['en','ENTERED']:['nd','NEEDED'] },
  /* the dot never moves; the chip is the thing that slides to free space */
  { at:[74,52], lab:'Frontage', val:S.frontage||'—',         tag:S.frontage?(S.frontageEst?['es','ESTIMATE']:['en','ENTERED']):['nd','NEEDED'] },
  { at:[40,76], lab:'Utilities',
    val:S.sewer==='yes'?'sewer on record':S.sewer==='septic'?'septic priced':'no sewer on record',
    tag:S.sewer==='unknown'?['nd','NEEDED']:['en','ENTERED'] },
 ];
}
/* ══ THE PLAN, DRAWN TO SCALE ══════════════════════════════════════════════
   Every mark comes back from sitePlan() already at its true size, so this
   function does no arithmetic — it only paints. That split is deliberate: the
   geometry is the part that can be wrong in a way that matters, so it lives in
   the engine where the test suite can hold it to the foot. */
const PLAN_TONE = { faint:'.22', mid:'.45', strong:'.8', refusal:'.95' };
function planMark(k){
  const col = k.tone === 'refusal' ? 'var(--ground-refusal)' : 'var(--ground-ink)';
  const op  = PLAN_TONE[k.tone] || '.5';
  const common = 'stroke="'+col+'" stroke-opacity="'+op+'" stroke-width="'+(k.width||1.3)
    + '" vector-effect="non-scaling-stroke"' + (k.dash ? ' stroke-dasharray="'+k.dash+'"' : '');
  const t = '<title>'+esc(k.lab||'')+'</title>';
  if (k.kind === 'rect')
    return '<rect x="'+k.x+'" y="'+k.y+'" width="'+k.w+'" height="'+k.h+'" '+common
      + ' fill="'+col+'" fill-opacity="'+(k.tone==='faint'?'.05':k.tone==='mid'?'.12':'.09')+'">'+t+'</rect>';
  if (k.kind === 'path')
    return '<path d="'+k.d+'" fill="none" '+common+'>'+t+'</path>'
      + (k.pole ? '<circle cx="'+k.pole[0]+'" cy="'+k.pole[1]+'" r="1.4" fill="'+col
                  +'" fill-opacity="'+op+'" stroke="none"/>' : '');
  /* a run too long for the frame: a stub pointing the right way, with the
     distance in the label — never a shortened line pretending to be the run */
  if (k.kind === 'ray')
    return '<path d="'+k.d+'" fill="none" '+common+'>'+t+'</path>'
      + '<circle cx="'+k.tip[0]+'" cy="'+k.tip[1]+'" r="1.1" fill="none" stroke="'+col
      + '" stroke-opacity="'+op+'" stroke-dasharray="1.6 1.6"/>';
  if (k.kind === 'pins')
    return '<g '+common+' fill="none">'+t+k.at.map(p =>
      '<path d="M'+(p[0]-1.5)+','+p[1]+' L'+(p[0]+1.5)+','+p[1]
        +' M'+p[0]+','+(p[1]-1.5)+' L'+p[0]+','+(p[1]+1.5)+'"/>').join('')+'</g>';
  if (k.kind === 'unknown'){
    /* the only warm colour on the dirt, and it means what red means on paper:
       we will not put a confident dot where nobody knows the answer */
    const h = k.size;
    return '<g '+common+' fill="none">'+t
      + '<rect x="'+k.x+'" y="'+k.y+'" width="'+h+'" height="'+h+'" stroke-dasharray="3 3" stroke-opacity=".5"/>'
      + '<path d="M'+(k.x+h*0.28)+','+(k.y+h*0.28)+' L'+(k.x+h*0.72)+','+(k.y+h*0.72)
      + ' M'+(k.x+h*0.72)+','+(k.y+h*0.28)+' L'+(k.x+h*0.28)+','+(k.y+h*0.72)+'"/></g>';
  }
  return '';
}
/* the sketch is a SQUARE laid inside a rectangle, so a chip anchored to a
   feature has to be placed from the drawing's box rather than the container's.
   The dot is still the truth; it is now the truth about the geometry. */
function planBox(){
  /* measured off the SVG itself, never re-derived from the container — the two
     would drift the moment a media query changed one and not the other, and a
     chip whose dot has drifted off its feature is worse than no chip */
  const g = $('ground'), sv = $('parcel'); if (!g || !sv) return null;
  /* getBoundingClientRect, NOT offsetLeft/offsetTop: those are HTMLElement
     properties and an <svg> does not have them, so the arithmetic came out
     NaN and every chip was placed at left:NaN% — which the browser silently
     drops, taking all six chips off the ground with it. */
  const gr = g.getBoundingClientRect(), sr = sv.getBoundingClientRect();
  const w = gr.width, h = gr.height;
  if (!w || !h || !sr.width || !sr.height) return null;
  const S = Math.min(sr.width, sr.height);
  return { S, ox: (sr.left - gr.left) + (sr.width - S) / 2,
              oy: (sr.top - gr.top) + (sr.height - S) / 2, w, h };
}
function planPct(x, y){
  const b = planBox(); if (!b) return [x, y];
  return [ (b.ox + x / 100 * b.S) / b.w * 100, (b.oy + y / 100 * b.S) / b.h * 100 ];
}
function renderPlan(){
  const box = $('plan'); if (!box) return null;
  const ctx = benchCtx();
  const p = sitePlan({ ...ctx, priced: siteItems().map(x => x.id) });
  box.innerHTML = p.marks.map(planMark).join('');
  return p;
}

function renderGround(m){
 const C=chipData(m);
 const P=renderPlan();
 /* the chip rides the DRAWING now, not the container — so a dot that marks the
    slope sits on the same ground the slope is drawn on, at every width */
 const at=c=>planPct(c.at[0], c.at[1]);
 $('chips').innerHTML=C.map(c=>{ const [px,py]=at(c);
  return '<div class="chip'+(c.at[0]>=66?' flip':'')+'" style="left:'+px.toFixed(2)+'%;top:'+py.toFixed(2)+'%">'
  +'<span class="pill"><span class="lab">'+esc(c.lab)+'</span><span class="val">'+esc(c.val)+'</span>'
  +TAG(c.tag[0],c.tag[1])+'</span><span class="leader"></span><span class="dot"></span></div>'; }).join('')
  +C.map((c,i)=>{ const [px,py]=at({at:[c.at[0], c.at[1]+7]});
    return '<div class="dotn" style="left:'+px.toFixed(2)+'%;top:'+py.toFixed(2)+'%">'+(i+1)+'</div>'; }).join('')
  /* ── THE SCALE BAR ──────────────────────────────────────────────────────
     A drawing with a scale bar is a drawing. Without one it is a picture, and
     a picture of somebody's land that looks measured but is not would be the
     single most off-brand thing this product could put on a screen. */
  +(P && P.bar ? (()=>{ const b=planBox(); if(!b) return '';
      const len = P.bar.units / 100 * b.S;
      const [lx,ly] = planPct(24, 84);
      return '<div class="sbar" style="left:'+lx.toFixed(2)+'%;top:'+ly.toFixed(2)+'%">'
        +'<i style="width:'+len.toFixed(1)+'px"></i>'
        +'<span>'+P.bar.ft.toLocaleString('en-US')+' ft</span></div>'; })() : '');
 $('planwhy').innerHTML = P ? (P.scale
   /* the caption names what was measured. The well's refusal is the loudest
      label in the set and it is not a measurement, so it does not lead — it
      has its own mark on the dirt and its own line in the sheet. */
   ? '<b>Drawn to scale.</b> ' + esc(P.marks.filter(k=>k.tone!=='refusal')
       .map(k=>k.lab).filter(Boolean).slice(0,3).join(' · ')
       || 'the boundary, at ' + P.bar.ft + ' ft to the bar — price a line and it appears here')
   : esc(P.why)) : '';
 $('rail').innerHTML=C.map((c,i)=>
  '<span class="pill"><span class="n">'+(i+1)+'</span><span class="lab">'+esc(c.lab)+'</span>'
  +'<span class="val">'+esc(c.val)+'</span>'+TAG(c.tag[0],c.tag[1])+'</span>').join('');
 $('h-addr').textContent=S.addr||'A parcel, priced with the working shown';
 const a=inp('acres');
 $('h-sub').textContent=(a? a.v+' acres':'')+(S.addr&&a?' · ':'')+(S.addr?'as typed — the pin arrives with the 3D ground':'Type the parcel below — one lump figure opens the play');
 /* ── THE FLOOR IS NOT REDRAWN ONCE IT CARRIES ATTRIBUTION ────────────────
    This function runs on every keystroke that re-prices the sheet, and it
    used to rewrite the floor unconditionally. With the ground up, that tore
    out the credit container mid-session — the tiles kept rendering and the
    attribution vanished, which is a terms violation caused by typing in a
    text box. The floor belongs to the ground once the ground is there. */
 if (G3.on) return;
 /* no imagery, no credit — credit belongs to imagery. The strip is still the
    floor: opaque, solid to the collision system, always there. */
 $('floor').innerHTML='<b>The sheet prices without the ground.</b> This is a surveyor’s sketch — '
  +'one press below raises the photorealistic 3D parcel, and its attribution arrives with it.'
  +'<span class="cam" id="camtext">flat · sketch</span>';
}

/* ── the worksheet: the ledger IS the input form ────────────────────────── */
const rowIn=(k,ph)=>'<input inputmode="decimal" data-k="'+k+'" value="'+esc(S.raw[k]||'')+'" placeholder="'+ph+'">';
const tagFor=(k,allowNeed)=>{ const v=numOf(k);
 if(v===null) return allowNeed?TAG('nd','NEEDED'):'';
 return '<button type="button" class="tagbtn" data-tag="'+k+'" title="Entered or estimate — press to flip">'
   +(S.est[k]?TAG('es','ESTIMATE'):TAG('en','ENTERED'))+'</button>'; };


/* ══ THE WALK ══════════════════════════════════════════════════════════════
   The complaint this answers, in the founder's words: "it doesn't take you
   through the process before arriving at the number." Both halves matter, and
   the second half was the real offence — the ceiling was on screen before you
   had typed anything.

   THE LEDGER NEVER BREAKS. The house desk splits into steps because it is four
   different conversations ending in eight ranked exits. This room is ONE
   subtraction:

       finished lot − their ask − site work − carry − cost of sale = clears

   Chopping that into four screens would fix the pacing by destroying the thing
   that makes it good, which is that you can see the whole subtraction at once.
   So nothing is hidden and nothing is locked. A rail names four phases and
   paces attention down one sheet, and a row that cannot be computed yet sits
   LATENT — present, dimmed, legible as waiting rather than missing.

   LATENCY IS ARITHMETIC, NOT UI. A region is latent when the figures it needs
   do not exist, and it stops being latent the moment they do. No step is
   locked; pressing any phase goes there. The number is not a screen you reach,
   it is the bottom of the same subtraction, and it cannot resolve until the
   rows above it do. That is what fixes the complaint without a wizard. */
const PHASES = [
  /* `short` is what the rail says and `name` is what the region says. Four
     full names do not fit across a 430px sheet, and a truncated label is a
     worse map than a terse one. */
  { n:'①', key:1, short:'Parcel',  name:'The parcel',      sub:'what you are looking at' },
  { n:'②', key:2, short:'Becomes', name:'What it becomes', sub:'the ARV of dirt' },
  { n:'③', key:3, short:'Takes',   name:'What it takes',   sub:'the site work' },
  { n:'④', key:4, short:'Number',  name:'The number',      sub:'what you can pay' },
];
let PHASE = 1, phaseHold = 0;

/* what each phase has to show for itself, in the units the phase is about */
function phaseState(m){
  const facts = [inp('acres'), S.zoning, S.slope, S.trees, S.frontage, S.fema,
                 S.sewer !== 'unknown' ? 1 : null].filter(Boolean).length;
  const priced = siteItems().length;
  const fin = inp('finished');
  const done = m.refused === null;
  return [
    { pct: facts / 7 * 100, count: facts + ' of 7', latent:false },
    { pct: fin ? 100 : 0,   count: fin ? fmt(fin.v) : 'needed', latent:false },
    { pct: Math.min(100, priced / 8 * 100),
      count: priced ? priced + ' of 8 lines' : (numOf('lump') ? 'one lump' : 'needed'),
      latent: false },
    { pct: done ? 100 : 0,
      count: done ? (m.clears !== null ? fmt(m.clears) : fmt(m.ceiling)) : 'latent',
      latent: !done },
  ];
}
/* the next unfilled thing — named, so the walk always has somewhere to go
   without ever refusing to let you go somewhere else */
function nextStep(m){
  const need = k => !numOf(k);
  if (!inp('acres'))       return { p:1, say:'Acres — it sets the scale for everything below' };
  if (!S.slope)            return { p:1, say:'How the ground falls — it prices the earthwork' };
  if (!S.trees)            return { p:1, say:'What is standing on it — it prices the clearing' };
  if (!inp('finished'))    return { p:2, say:'What a finished lot sells for — nothing prices without it' };
  if (!siteItems().length && need('lump'))
    return { p:3, say:'Site work — one lump figure is enough to open the play' };
  if (need('driveFt'))     return { p:1, say:'Driveway run — the drive is priced by the foot' };
  if (need('poleFt'))      return { p:1, say:'Feet to the nearest pole — so is the wire' };
  const unpriced = SITE_LINES.find(l => siteNum(siteVal(l.id)) === null
    && (benchFor(l.id, benchCtx()).chips || []).length);
  if (unpriced)            return { p:3, say:unpriced.lab + ' — a benchmark is waiting' };
  if (!inp('asking'))      return { p:1, say:'Their asking price — or leave it, and your ceiling stands alone' };
  if (S.access === 'unverified') return { p:1, say:'Road access — a lot you cannot reach is not a lot' };
  return { p:4, say:'Nothing is waiting — the sheet is as firm as your figures are' };
}
function goPhase(k){
  PHASE = k; phaseHold = Date.now() + 700;
  const el = document.querySelector('[data-region="' + k + '"]');
  const sh = $('sheet');
  if (el && sh){
    const top = el.offsetTop - 8;
    if (typeof sh.scrollTo === 'function') sh.scrollTo({ top, behavior:'smooth' });
    else sh.scrollTop = top;
  }
  renderSheet();
}
/* the phase follows the scroll, because the sheet is one document and the rail
   describes where you ARE rather than deciding where you may be */
function phaseFromScroll(){
  if (Date.now() < phaseHold) return;
  const sh = $('sheet'); if (!sh) return;
  let p = 1;
  sh.querySelectorAll('[data-region]').forEach(el => {
    if (el.getBoundingClientRect().top - sh.getBoundingClientRect().top <= 90)
      p = +el.getAttribute('data-region');
  });
  if (p !== PHASE){ PHASE = p; railPaint(); groundPhase(); }
}
/* repaint the rail alone — re-rendering the whole sheet on a scroll tick would
   tear the thumb off the slider and reset every input's caret */
function railPaint(){
  document.querySelectorAll('[data-ph]').forEach(el => {
    const on = +el.dataset.ph === PHASE;
    el.classList.toggle('on', on);
  });
}

function railHTML(m){
  const st = phaseState(m), nx = nextStep(m);
  return '<div class="rail2">'
   + '<div class="rrow">' + PHASES.map((p,i) => {
      const s = st[i];
      return '<button type="button" class="rph' + (p.key===PHASE?' on':'') + (s.latent?' lat':'')
        + '" data-ph="' + p.key + '" data-go="' + p.key + '">'
        + '<span class="rn">' + p.n + '</span><span class="rname">' + esc(p.short) + '</span>'
        + '<span class="rcount">' + esc(s.count) + '</span>'
        + '<span class="rtrk"><i style="width:' + Math.round(s.pct) + '%"></i></span></button>';
    }).join('') + '</div>'
   + '<button type="button" class="rnext" data-go="' + nx.p + '">'
     + '<span class="k">Next</span><span class="s">' + esc(nx.say) + '</span><span class="a">→</span>'
   + '</button></div>';
}

function renderSheet(){
 const m=model();
 const priced = m.refused === null;
 let out=railHTML(m);

 /* ── ① THE PARCEL — what you are looking at ──────────────────────────────

 out+='<div class="region" data-region="1"><div class="rh">'+PHASES[0].n+' The parcel · '+PHASES[0].sub+'</div>';

 /* ── ③ WHAT IT TAKES — the site work and the time ─────────────────────── */

     : rowIn('lump','41,500')+tagFor('lump',true))+'</span></div>'

  /* carry is its own line because it is its own decision: TIME. */

  +'<span class="f"><span class="num">'+(priced&&m.carry>0?'− '+fmt(m.carry):'in site work')+'</span></span></div>'
  +(priced&&S.sewer==='unknown'
    ?'<div class="lsub">↳ inside it: septic install, unconfirmed<span class="num">$18,000</span>'+TAG('nd','NEEDED')+'</div>':'')
  +'</div>';

 /* ── ④ THE NUMBER — the bottom of the same subtraction ─────────────────
    LATENT, not hidden. The rows are there, dimmed, and the figure cannot

 out+='<div class="region'+(priced?'':' latent')+'" data-region="4"><div class="rh">'
   +PHASES[3].n+' The number · '+PHASES[3].sub+'</div>';
 if(!priced){

 } else {

  if(m.clears!==null){
   out+='<div class="clears num'+(m.clears<0?' neg':'')+'">'+fmt(m.clears)+'</div>'

   out+='<div class="firm"><div class="fh"><span class="k">Before this prices firm</span>'+TAG('nd','NEEDED')+'</div>'

 }
 out+='</div>';

 out+='<p class="fine">Every figure says where it came from — typed figures are yours, estimates widen the answer, '

 $('sheet').innerHTML=out;
 wire();
 renderGround(m);
 groundPhase();
}

/* ── THE GROUND ANSWERS THE PHASE IT IS ON ────────────────────────────────
   It does not animate progress; it accumulates information. Phase 1 the chips
   are inventory and all six are lit. Phase 2 only acreage stays lit, because
   per-acre is the basis for what the lot becomes. Phase 3 the parcel stops
   being the subject and the PLAY is — the chips fall back and the drawing is
   the thing. Phase 4 everything re-lights: the whole play is in shot as the
   figure lands. */
/* one place decides what the card looks like, so the button, the boot and the
   automatic fold cannot disagree about it */
function paintFold(){
  const c = $('hcard'), b = $('hfold'); if (!c) return;
  c.classList.toggle('fold', !!S.hFold);
  if (b){
    b.setAttribute('aria-expanded', S.hFold ? 'false' : 'true');
    b.title = S.hFold ? 'Open the panel' : 'Fold the panel away from the ground';
    const sr = b.querySelector('.sr'); if (sr) sr.textContent = S.hFold ? 'Open the panel' : 'Fold the panel';
  }
}
/* the 3D ground is the one moment where the card is definitely in the way:
   the person just spent a billed session to look at the dirt */
function foldForGround(){
  if (S.hFoldAuto) return;              // only ever once, and never again
  S.hFoldAuto = true; S.hFold = true;
  save(); paintFold();
}

function groundPhase(){
  const g = $('ground'); if (!g) return;
  g.setAttribute('data-phase', String(PHASE));
  const keep = { 1:null, 2:'Acreage', 3:null, 4:null };
  document.querySelectorAll('#chips .chip').forEach(el => {
    const lab = (el.querySelector('.lab')||{}).textContent || '';
    let op = 1;
    if (PHASE === 2) op = lab === keep[2] ? 1 : 0.34;
    else if (PHASE === 3) op = 0.2;
    el.style.opacity = String(op);
  });
}

function wire(){
 document.querySelectorAll('[data-k]').forEach(el=>{
  /* a money input is as wide as its money — the $ sits against the digits
     instead of across the room from them */
  const size=()=>{ if((el.closest('.lrow')||el.closest('.conc'))&&el.dataset.k!=='months')
    el.style.width=Math.max(6.5, (el.value||el.placeholder||'').length+0.4)+'ch'; };

  el.oninput=()=>{ if(el.dataset.k==='months'){ S.months=el.value; } else { S.raw[el.dataset.k]=el.value; } size(); save(); };
  el.onchange=()=>{ renderSheet(); };
  el.onkeydown=e=>{ if(e.key==='Enter') el.blur(); };
 });
 const tp=$('tryprice');

   const askV=inp('asking')?inp('asking').v:null;

 }
 document.querySelectorAll('[data-go]').forEach(el=>{
   el.onclick=()=>goPhase(+el.dataset.go); });
 const hf=$('hfold');
 if(hf) hf.onclick=()=>{ S.hFold=!S.hFold; save(); paintFold(); };
 paintFold();
 const st=$('site-toggle');
 if(st) st.onclick=()=>{ S.siteOpen=!S.siteOpen; save(); renderSheet(); };
 document.querySelectorAll('[data-site]').forEach(el=>{
   const commit=()=>{ const id=el.dataset.site;
     let r=(S.site||[]).find(x=>x.id===id);
     if(!r){ r={id,v:'',est:true}; S.site.push(r); }

   el.onchange=commit; el.onkeydown=e=>{ if(e.key==='Enter') el.blur(); }; });
 document.querySelectorAll('[data-siteest]').forEach(el=>{
   el.onclick=()=>{ const r=(S.site||[]).find(x=>x.id===el.dataset.siteest);
     if(r){ r.est=!r.est; save(); renderSheet(); } }; });
 const lt=$('lots-toggle');
 if(lt) lt.onclick=()=>{ S.lotsOpen=!S.lotsOpen;
   /* opening the bench seeds the first row, and that row is a comp — so it
      goes through the same door every other one does, or the wall is one

   if(S.lotsOpen&&!(S.lots||[]).length&&lotRoom().room>0){
     S.lots=[{price:'',acres:'',months:'',dist:''}]; spendLot(); }
   save(); renderSheet(); };
 const la=$('lots-add');
 if(la) la.onclick=()=>{

   S.lots.push({price:'',acres:'',months:'',dist:''}); spendLot(); save(); renderSheet(); };
 document.querySelectorAll('[data-lotx]').forEach(el=>{
   el.onclick=()=>{ S.lots.splice(+el.dataset.lotx,1); save(); renderSheet(); }; });
 document.querySelectorAll('[data-lot]').forEach(el=>{

     c[el.dataset.lot]=el.value.slice(0,20); save(); renderSheet(); };
   el.onchange=commit; el.onkeydown=e=>{ if(e.key==='Enter') el.blur(); }; });
 const tk=$('lots-take');
 if(tk) tk.onclick=()=>{

   const out=lotComps(lotRows(), acres?acres.v:null);
   if(!out.suggest) return;

    It lands as an ESTIMATE, always, and the flip is right there beside it.

   let r=(S.site||[]).find(x=>x.id===id);

/* ── SITE WORK, BY LINE ────────────────────────────────────────────────────
   siteCarryOf() has taken an items array since the first commit and no screen
   ever built one, so the sheet's largest variable stayed a single gut figure
   long after the person had quotes in hand.

   The eight lines are what a raw parcel actually has to buy to become a lot.
   They are not sliders: a site cost is a QUOTE, not a share of the finished
   value, and a slider running to an invented ceiling would be decoration
   pretending to be an estimate. Each line is a figure you have or do not,
   and each carries the same entered/estimate tag as everything else here.

   The septic line is named `septic` on purpose: the engine stops adding its
   own $18,000 allowance the moment an item with that id exists, which is
   exactly the handover from "we assumed and said so" to "you priced it". */
const SITE_LINES = [
  { id:'access',  lab:'Driveway & access' },
  { id:'clear',   lab:'Clearing & grubbing' },
  { id:'septic',  lab:'Septic or sewer tap' },
  { id:'water',   lab:'Well or water tap' },
  { id:'power',   lab:'Power drop' },
  { id:'survey',  lab:'Survey & platting' },
  { id:'permit',  lab:'Permits & engineering' },
  { id:'drain',   lab:'Drainage & erosion' },
];
const siteNum=v=>{ const x=parseFloat(String(v??'').replace(/[^0-9.]/g,'')); return Number.isFinite(x)&&x>0?x:null; };
function siteItems(){
  if (!S.siteOpen) return [];
  return (S.site||[]).map(x=>({ id:x.id, v:siteNum(x.v), prov:x.est?'estimate':'entered' }))
                     .filter(x=>x.v!==null);
}
function siteVal(id){ const r=(S.site||[]).find(x=>x.id===id); return r?r.v:''; }
function siteEst(id){ const r=(S.site||[]).find(x=>x.id===id); return !!(r&&r.est); }
function siteBench(m){
  const items = siteItems();
  const tot = items.reduce((t,x)=>t+x.v, 0);
  const ctx = benchCtx();
  /* ── THE BENCHMARK, OR THE PHONE CALL ────────────────────────────────────
     Eight empty boxes with an em-dash for a placeholder is a panel a beginner
     opens once. Each line now either carries a figure they can press — priced
     from the facts they gave, with the assumption named — or says plainly that
     it is a phone call and hands them the words to say. The refusals are not
     the weak lines here; they are the strongest. A well is unguessable and
     saying so is worth more than a confident average would be. */
  const benchHTML = l => {
    if (siteNum(siteVal(l.id)) !== null) return '';       // they have a figure; get out of the way
    const b = benchFor(l.id, ctx);
    let h = '';
    if (b.chips && b.chips.length)
      h += '<div class="sbc">'+b.chips.map((c,i)=>
        '<button type="button" data-sb="'+l.id+':'+i+'" title="'+esc(c.why)+'">'
        +'<span>'+esc(c.t)+'</span><b>'+fmt(c.v)+'</b></button>').join('')+'</div>';
    else if (b.call)
      h += '<div class="sbcall"><b>This one is a phone call.</b> '+esc(b.call.why)
        +' Ring <b>'+esc(b.call.who)+'</b> and ask '+esc(b.call.ask)+'</div>';
    else if (b.needs)
      h += '<div class="sbneed">Needs the '+esc(b.needs)+' below — then it prices itself.</div>';
    /* ── AVAILABLE, NOT IN THE WAY ───────────────────────────────────────
       Every one of these notes is load-bearing — "grubbed, not mulched" is the
       difference between a quote that works and one that leaves stumps under
       the foundation. Eight of them at once is a wall, and a wall is a panel
       nobody reads at all. So the sentence that would cost somebody money
       stays visible and the paragraph behind it opens on a press. */
    if (b.note){
      const cut = b.note.search(/[.!?]\s+[A-Z]/);
      const lead = cut > 0 ? b.note.slice(0, cut+1) : b.note;
      const rest = cut > 0 ? b.note.slice(cut+1).trim() : '';
      const open = (S.siteWhy||[]).indexOf(l.id) >= 0;
      h += '<div class="sbnote">'+esc(lead)
        + (rest ? ' <button type="button" class="sbmore" data-sw="'+l.id+'">'
            +(open?'less':'why')+'</button>'+(open?'<span class="sbrest">'+esc(rest)+'</span>':'') : '')
        + '</div>';
    }
    return h ? '<div class="sbwrap">'+h+'</div>' : '';
  };
  const rows = SITE_LINES.map(l=>
    '<div class="sitel"><label for="si-'+l.id+'">'+esc(l.lab)+'</label>'
    +'<input id="si-'+l.id+'" data-site="'+l.id+'" inputmode="decimal" placeholder="—" value="'+esc(siteVal(l.id))+'">'
    +(siteNum(siteVal(l.id))!==null
      ? '<button type="button" class="e" data-siteest="'+l.id+'" title="Entered or estimate — press to flip">'
        +(siteEst(l.id)?'<span class="tag es">E</span>':'<span class="tag en">✓</span>')+'</button>'
      : '<span></span>')
    +'</div>'+benchHTML(l)).join('');
  const say = items.length
    ? '<div class="sitesum"><span>'+items.length+' line'+(items.length===1?'':'s')+' priced — '
      +'these replace the lump above</span><b>'+fmt(tot)+'</b></div>'
      +(S.sewer==='unknown' && !items.some(x=>x.id==='septic')
        ? '<div class="lsay">No sewer on record and no septic line priced, so the sheet is still '
          +'carrying its own $18,000 allowance inside the total. Price the line and that assumption goes away.</div>'
        : '')
    : '<div class="lsay">Early on, one lump figure above is enough. When the quotes arrive, price them '
      +'here and they take over from it — a sum of quotes outranks a gut figure, the same way a '
      +'contractor\u2019s bid outranks a slider on the house sheet.</div>';
  return '<div class="lots"><div class="lh"><span class="k">Site work, by line</span></div>'+rows+say+'</div>';
}

/* ── THE LOT BENCH ─────────────────────────────────────────────────────────
   The refusal has promised this door since the first commit: "Comps for
   finished lots nearby are the way in." The engine's lotComps() carries the
   three lessons the house bench learned the hard way; this renders its rows
   and lands its suggestion on the finished figure with one press.

   n ≥ 3 sold lots land the figure as ENTERED — the same rule as the house
   bench: you derived it, so the sheet stops treating the hardest figure as a
   guess. Exactly two land it as an ESTIMATE, because two sales are a line,
   not a cluster, and the band should stay wide until a third makes it one. */
function lotRows(){
  const num=v=>{ const x=parseFloat(String(v??'').replace(/[^0-9.]/g,'')); return Number.isFinite(x)?x:null; };
  return (S.lots||[]).map(c=>({ price:num(c.price), acres:num(c.acres), months:num(c.months), dist:num(c.dist) }));
}
function lotBench(){
  const acres = inp('acres');
  const out = lotComps(lotRows(), acres ? acres.v : null);
  const row = (c,i) => {
    const r = out.rows[i] || {};
    return '<div class="lrowc">'
      +'<input data-lot="price" data-li="'+i+'" inputmode="decimal" placeholder="sold for — 300,000" value="'+esc(c.price||'')+'" aria-label="Sold price">'
      +'<input data-lot="acres" data-li="'+i+'" inputmode="decimal" placeholder="acres" value="'+esc(c.acres||'')+'" aria-label="Acres">'
      +'<input data-lot="months" data-li="'+i+'" inputmode="decimal" placeholder="mo" value="'+esc(c.months||'')+'" title="Months since it sold" aria-label="Months ago">'
      +'<input data-lot="dist" data-li="'+i+'" inputmode="decimal" placeholder="mi" value="'+esc(c.dist||'')+'" title="Miles from the subject" aria-label="Miles away">'
      +'<button type="button" class="x" data-lotx="'+i+'" title="Remove" aria-label="Remove this lot">✕</button>'
      +(r.ok ? '<span class="lwhy"><span class="sc">'+r.score+'</span>'+esc((r.why||[]).join(' · '))
          +(r.perAcre?'<span style="margin-left:auto">'+fmt(r.perAcre)+'/ac</span>':'')+'</span>'
        : r.noPrice ? '<span class="lwhy">a lot that sold for nothing did not sell — put the real price in</span>' : '')
      +'</div>';
  };
  let say='';
  if (out.suggest){
    const s2=out.suggest;
    say = '<div class="lsay">'+out.n+' sold lots, weighted by how much each deserves to be believed, say '
      +'<b>'+fmt(s2.value)+'</b>'
      +(s2.perAcre?' — '+fmt(s2.perAcre)+' an acre across your '+acres.v+' acres':' — read as whole lots; add acreages and it prices per acre')
      +'. The spread runs '+fmt(s2.lo)+' to '+fmt(s2.hi)+'.</div>'
      +'<div class="ltake"><button type="button" class="btn sm" id="lots-take">Use '+fmt(s2.value)+'</button>'
      +'<span style="font-size:11px;color:var(--soft)">'+(out.n>=3
        ? 'lands as <b>entered</b> — you derived it from sales you scored'
        : 'lands as an <b>estimate</b> — two sales are a line, not a cluster; a third firms it')+'</span></div>';
  } else if (out.n === 1){
    say = '<div class="lsay">One sold lot is a data point, not a value. A second draws the line.</div>';
  } else {
    say = '<div class="lsay">The hardest figure on this sheet is what a FINISHED lot actually sells for nearby. '
      +'County records and closed listings both carry them — two or three, priced here, beat any guess.</div>';
  }
  /* ── THE WALL SAYS WHICH WALL IT IS ────────────────────────────────────
     Three different people arrive here and the old bench treated all three
     the same — it treated them as paid. Each rung names its own number and
     its own next step, so a registered member is never told they are still a
     guest, and a guest is sent to the thing that would actually help them
     (an account) rather than to a price list. */
  const R = lotRoom();
  let add;
  if (R.room > 0){
    add = '<button type="button" class="ladd" id="lots-add">+ add a sold lot'
      + (R.rung === 'paid' ? ''
         : R.rung === 'account'
           ? ' <span class="cnt">' + (R.cap - R.used) + '/' + R.cap + ' left this week</span>'
           : ' <span class="cnt">' + (S.lots||[]).length + '/' + FREE_IN_BROWSER + '</span>')
      + '</button>';
  } else if (R.rung === 'paid'){
    add = '<div class="lsay">Eight sold lots is the bench. If you need a ninth, the answer is '
      + 'usually a tighter definition of the neighbourhood, not another sale.</div>';
  } else if (R.rung === 'account'){
    add = '<div class="lwall"><b>That is this week\u2019s ' + R.cap + ' comparable sales.</b> '
      + 'The allowance is shared with the house sheet\u2019s comp workbench \u2014 it is one '
      + 'number across the product. It resets weekly, or a plan lifts it for good.'
      + '<a class="btn sm" href="plans.html">See plans</a></div>';
  } else if (R.rung === 'account-unknown'){
    /* signed in, but the week's balance could not be read. The degrade is
       deliberate; telling a member to go and make an account is not. */
    add = '<div class="lwall"><b>Three sold lots in this browser, for now.</b> '
      + 'You are signed in, but this week\u2019s allowance could not be read just then \u2014 so the '
      + 'bench is holding to the offline limit rather than guessing in your favour. Reload and it '
      + 'will ask again; nothing you have scored goes anywhere either way.</div>';
  } else {
    add = '<div class="lwall"><b>Three sold lots in this browser.</b> '
      + 'A free account carries twelve comparable sales a week, across the house sheet and this '
      + 'one, and remembers them on every device. No card.'
      + '<a class="btn sm" href="desk.html#account">Make an account</a></div>';
  }
  return '<div class="lots"><div class="lh"><span class="k">Sold lots nearby</span></div>'
    +(S.lots||[]).map(row).join('')
    + add
    +say+'</div>';
}

(function(){ const sh=$('sheet'); if(!sh) return;
  let t=null;
  const on=()=>{ if(t) return; t=setTimeout(()=>{ t=null; phaseFromScroll(); }, 90); };
