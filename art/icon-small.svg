<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- ══ THE SAME MARK, DRAWN FOR SIXTEEN PIXELS ════════════════════════════════
     The double rule means "final total" and it is the whole idea — but at 16px
     two 0.65-pixel lines with a 1.3-pixel gap between them are three grey
     smudges, and the meaning is lost along with the crispness.

     So the small size keeps ONE rule, thicker, and gives the letter more air.
     A mark that degrades into a different, cleaner mark is a mark that was
     designed; one that degrades into mush is one that was scaled. The .ico
     carries both and the browser picks by size.
     ═══════════════════════════════════════════════════════════════════════ -->
<rect width="64" height="64" rx="13" fill="#101a2c"/>
<path fill="#f4efe2" d="
  M13 13 h10 l15 23 V13 h11 v3 h-4 v30 h-8.5 L19 21 v22 h4 v3 H13 v-3 h4 V16 h-4 Z
"/>
<rect x="13" y="51" width="38" height="5" rx="2.5" fill="#c9a227"/>
</svg>
