<!-- ══ THE LAND DESK ═══════════════════════════════════════════════════════
     The desk prices seven exits and refuses the eighth with "it needs dirt".
     This is where that refusal sends you. One parcel, one play — buy the
     dirt, finish the lot, sell the lot — priced with the working shown, on
     the committed design: the ground is the hero, the sheet docks over it,
     and the floor is an opaque paper band the ground can never reach.

     THE GROUND, v1: the page ships FLAT — a surveyor's sketch on the dark
     ground token, no Google imagery, no Google credit (credit belongs to
     imagery, and there is none). The CesiumJS + Photorealistic 3D Tiles
     viewport slots into #ground when /api/land/config starts answering with
     a key; every state the design specifies (loading, no-coverage, quota)
     already has its markup and grammar here, so the 3D arrival is a swap,
     not a rebuild. The arithmetic never depended on the ground.

     The engine between the markers is INJECTED AT BUILD from land/engine.mjs
     — the same bytes the test suite holds to the design doc's ledger. Edit
     the module, never the copy. -->
<style>
:root{
 --ink:#0d1420; --mid:#41495a; --soft:#6b7486; --line:#e4e8ef; --line-ink:#c9d0dc;
 --wash:#f6f8fb; --blue:#1f5fd0; --blue-deep:#174aa3; --blue-soft:#eaf0fc; --blue-line:#c3d4f5;
 --green:#177a4d; --green-soft:#eaf6f0; --red:#b3372c; --red-soft:#faeeec; --red-line:#e8c4bf;
 --gold:#8a6612; --gold-soft:#fbf6e9; --gold-line:#e6d9ae;
 --r-card:18px; --r-in:12px; --r-btn:11px;
 --serif:'Fraunces',Georgia,serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 --mono:var(--sans);
 /* the dark-surface extension — five names, from the committed design, AA-
    checked there and nowhere re-derived. Paper floats on the ground reuse
    the light tokens unchanged: a card on the ground is the same card. */
 --ground:#0A0F18; --ground-ink:#E8EDF5;
 --ground-pill:rgba(13,20,32,.78); --ground-pill-line:rgba(255,255,255,.16);
 --ground-refusal:#E4685A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:15px;line-height:1.5}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}
.btn{font-family:var(--sans);font-size:14.5px;font-weight:650;padding:11px 20px;
 display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
 border:1px solid var(--line-ink);border-radius:var(--r-btn);background:#fff;color:var(--ink);
 cursor:pointer;transition:background .12s,border-color .12s}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-deep)}
.btn.sm{font-size:13px;padding:8px 14px}

/* ── the stage: ground + docked sheet ───────────────────────────────────── */
.stage{position:relative;height:calc(100vh - 58px);min-height:660px}
#ground{position:absolute;inset:0 0 34px 0;background:
 radial-gradient(120% 90% at 38% 42%, #16231c 0%, #101a15 34%, #0c1310 62%, var(--ground) 100%);
 overflow:hidden}
/* contour rings — a surveyor's sketch, not a picture pretending to be one */
#ground::before{content:'';position:absolute;inset:-20%;background:
 repeating-radial-gradient(circle at 40% 45%, transparent 0 54px, rgba(232,237,245,.045) 54px 55px);}
.floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:#fff;
 border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 14px;
 font-size:11px;color:var(--soft);z-index:6}
.floor b{color:var(--mid);font-weight:700}
.floor .cam{margin-left:auto;font-size:10.5px}
/* the header card — paper, floating on the ground */
.hcard{position:absolute;top:18px;left:18px;z-index:5;background:#fff;border:1px solid var(--line);
 border-radius:var(--r-card);padding:13px 17px 12px;box-shadow:0 10px 34px rgba(4,8,14,.45);max-width:420px}
.hcard .k{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.hcard h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.hcard .sub{font-size:12px;color:var(--soft);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hcard .cov{font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
 border:1px solid var(--line-ink);border-radius:999px;padding:3px 8px;color:var(--mid);background:var(--wash)}
.hcard input{font:inherit;font-size:13.5px;border:1px solid var(--line-ink);border-radius:9px;
 padding:7px 10px;width:100%;margin-top:9px;background:var(--wash)}
.hcard input:focus{outline:none;border-color:var(--blue);background:#fff}
/* the parcel sketch */
#parcel{position:absolute;inset:0;z-index:1}
/* non-scaling-stroke: the viewBox stretches to the viewport, and without it
   the dashes stretch too — 1.6px of survey line became forty-pixel slabs */
#parcel polygon{fill:rgba(232,237,245,.03);stroke:var(--ground-ink);stroke-opacity:.55;
 stroke-width:1.6;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
#parcel .refline{stroke:var(--ground-refusal);stroke-opacity:.95;stroke-width:2.2;stroke-dasharray:4 4}
/* anchored chips: white pill on a 1px leader; the dot is the truth */
.chip{position:absolute;z-index:4;transform:translate(-50%,-100%)}
/* the spec's collision rule, v1: the dot never moves; the chip slides along
   its leader to free space. A chip anchored in the sheet's shadow keeps its
   dot on the dirt and swings its pill out to the left. */
.chip.flip{transform:translate(calc(-100% + 30px),-100%)}
.chip.flip .leader,.chip.flip .dot{left:calc(100% - 30px)}
.chip .pill{display:inline-flex;align-items:baseline;gap:7px;background:#fff;border:1px solid var(--line);
 border-radius:999px;padding:7px 12px;white-space:nowrap;box-shadow:0 6px 20px rgba(4,8,14,.4);cursor:default}
.chip .lab{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.chip .val{font-size:13px;font-weight:700}
.chip .leader{position:absolute;left:50%;top:100%;width:1px;height:26px;background:var(--ground-ink);opacity:.6}
.chip .dot{position:absolute;left:50%;top:calc(100% + 26px);width:7px;height:7px;border-radius:50%;
 background:var(--ground-ink);transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(232,237,245,.18)}
.tag{font-size:8.5px;font-weight:800;letter-spacing:.12em;border-radius:999px;padding:2px 7px}
.tag.en{background:var(--blue-soft);color:var(--blue);border:1px solid var(--blue-line)}
.tag.es{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold-line)}
.tag.nd{background:var(--red-soft);color:var(--red);border:1px solid var(--red-line)}
/* ground controls — pills over the render, dark grammar */
.gctl{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.gctl button{font-size:12.5px;font-weight:650;color:var(--ground-ink);background:var(--ground-pill);
 border:1px solid var(--ground-pill-line);border-radius:999px;padding:8px 16px;cursor:not-allowed;opacity:.75}
/* the docked worksheet */
.sheet{position:absolute;top:18px;right:18px;bottom:52px;width:430px;z-index:5;overflow:auto;
 background:#fff;border:1px solid var(--line);border-radius:var(--r-card);
 box-shadow:0 14px 44px rgba(4,8,14,.5);padding:18px 20px}
.sheet .k{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--soft)}
.ask .big{font-family:var(--serif);font-size:31px;font-weight:700;letter-spacing:-.02em;display:flex;
 align-items:center;gap:10px}
.ask .sub{font-size:12px;color:var(--soft);margin-top:2px}
.play{border-top:1px solid var(--line);margin-top:14px;padding-top:13px}
.clears{font-family:var(--serif);font-size:42px;font-weight:700;letter-spacing:-.02em;color:var(--green);line-height:1.05}
.clears.neg{color:var(--red)}
.clears-sub{font-size:12.5px;color:var(--mid);margin-top:3px}
.refuse{margin-top:10px;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red);
 border-radius:var(--r-in);padding:10px 13px;font-size:13px;line-height:1.55}
.refuse b{font-weight:750}
.ledger{margin-top:12px}
.lrow{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.lrow:first-child{border-top:none}
.lrow .n{color:var(--mid)}
.lrow .f{margin-left:auto;display:flex;align-items:baseline;gap:8px}
.lrow .num{font-weight:700}
.lrow input{font:inherit;font-weight:700;font-variant-numeric:tabular-nums;width:7.5ch;text-align:right;
 border:1px solid transparent;border-radius:7px;padding:2px 5px;background:transparent;box-sizing:content-box}
.lrow input:hover{border-color:var(--line-ink);background:var(--wash)}
.lrow input:focus{outline:none;border-color:var(--blue);background:#fff}
.lsub{display:flex;gap:8px;align-items:baseline;padding:0 0 8px 16px;font-size:12.5px;color:var(--soft)}
.lsub .num{margin-left:auto;font-weight:650}
.tagbtn{cursor:pointer;border:none;background:none;padding:0}
.conc{margin-top:10px;background:var(--wash);border-radius:var(--r-in);padding:10px 13px;font-size:13px}
.conc b{font-weight:750}
.conc input{font:inherit;font-weight:700;width:7ch;border:1px solid transparent;border-radius:6px;
 text-align:left;background:transparent;font-variant-numeric:tabular-nums;padding:1px 2px;box-sizing:content-box}
.conc input:hover{border-color:var(--line-ink);background:#fff}
.conc input:focus{outline:none;border-color:var(--blue);background:#fff}
.firm{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.firm .fh{display:flex;align-items:center;gap:8px}
.firm p{font-size:12.5px;color:var(--mid);line-height:1.55;margin-top:6px}
.facts{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.facts .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:9px}
.facts label{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--soft);display:block}
.facts input,.facts select{font:inherit;font-size:13px;width:100%;border:1px solid var(--line-ink);
 border-radius:8px;padding:6px 8px;margin-top:3px;background:#fff}
.facts input:focus,.facts select:focus{outline:none;border-color:var(--blue)}
.sfoot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.fine{font-size:11.5px;color:var(--soft);line-height:1.55;margin-top:10px}
/* the phone: ground on top, chip rail pinned to it, sheet below */
.rail{display:none}
@media(max-width:1000px){
 .stage{min-height:0;height:auto}
 .hcard{top:12px;left:12px;padding:10px 13px 9px;border-radius:14px}
 .hcard h1{font-size:16.5px}
 .hcard .sub{font-size:10.5px;gap:6px}
 .hcard input{font-size:12px;padding:5px 8px;margin-top:6px}
 #ground{position:relative;inset:auto;height:46vh;min-height:300px}
 .floor{position:static;height:auto;padding:8px 14px}
 .sheet{position:static;width:auto;margin:0;border-radius:0;box-shadow:none;border-left:none;border-right:none}
 .chip{display:none}
 .dotn{position:absolute;z-index:4;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ink);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(232,237,245,.2)}
 .rail{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--ground);
  -webkit-overflow-scrolling:touch}
 .rail .pill{display:inline-flex;align-items:baseline;gap:7px;background:#fff;border-radius:999px;
  padding:8px 12px;white-space:nowrap;flex:0 0 auto;font-size:12.5px}
 .rail .n{font-weight:800;color:var(--soft);font-size:10.5px}
 .rail .lab{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--soft)}
 .rail .val{font-weight:700;font-size:12.5px}
 .gctl{bottom:14px}
 .hcard{max-width:calc(100% - 36px)}
 .clears{font-size:36px}
}
@media(min-width:1001px){ .dotn{display:none} }
.seam{background:#fff;border-top:1px solid var(--line);padding:13px 18px;font-size:12.5px;color:var(--soft)}
.seam a{font-weight:650}
</style>

    from font-feature-settings instead, which is what they were always for.

}
