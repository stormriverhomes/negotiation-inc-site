<script>
const B = SRBoard;
const M  = n => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const MP = n => (n > 0 ? '+' : n < 0 ? '−' : '') + M(n);
const clockStr = s => Math.floor(Math.max(0,s)/60) + ':' + String(Math.max(0,Math.ceil(s))%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const TIER_OF = (() => { const m={}; for (const k of Object.keys(B.ASK_SIGNALS)) for (const s of B.ASK_SIGNALS[k]) m[s]=k; return m; })();
const TIER_WORD = { high:'Wants out badly', medium:'Would move for the right number', low:'In no hurry at all' };

let run, board, state, timer;

/* ══ THE BANKROLL ══════════════════════════════════════════════════════════
   One number, three cabinets, and it can go down.

   Until now the arcade had three incompatible currencies and not one of them
   could fall. The Exit Drill had no money at all — it scored in points and
   explained itself in "fit", a unit that exists nowhere in real estate. Daily
   Street handed you $150,000 that evaporated on refresh. Comp Run has a real
   save and offline earnings, but its bank only ever rises. A quiz that costs
   nothing is a quiz; nobody has ever felt they were learning a trade from a
   multiple-choice question with no stake.

   THE THING THE OBVIOUS DESIGN GETS WRONG. "One bankroll shared by all three"
   sounds right and breaks immediately on contact with the code. Comp Run's
   cash starts at $12, grows exponentially up an eight-rung ladder, and is
   RESET TO $12 on every prestige. Daily Street's houses cost $80,000 to
   $260,000. Wire those to the same variable and either Comp Run's first hour
   is trivial or Daily Street is unplayable. They are not the same kind of
   number and pretending otherwise would be the sort of tidy lie this product
   is built to avoid.

   SO: the bankroll is what you have taken OUT of the arcade, not what is in
   play inside it.

     · Daily Street plays WITH it. The street is where the money is at risk,
       because the street is the cabinet whose currency was already real-estate
       money. Win and it is yours; lose and it is gone, permanently.
     · The Exit Drill earns INTO it. A right read pays a finder's fee out of
       the room that exit actually had — you did not buy anything, you read it
       correctly, and reading correctly is worth a fee. Small, fast, capped
       daily. This is the lane you rebuild on after a bad street.
     · Comp Run pays INTO it at a prestige. A prestige is the moment an era's
       work is already being cashed out and reset — the natural seam, and
       taking the conversion there disturbs its balance not at all.

   Each cabinet keeps its own physics. There is still one number to care about.

   NO LOCKOUT. A player who tanks is not shut out: Daily Street already models
   leverage (bid above your capital and you pay points on the borrowed part),
   so a thin bankroll makes every deal more expensive rather than impossible.
   That is both kinder and truer than a velvet rope. The floor is zero — a
   negative bankroll is a number nobody can act on. */

const BANK_KEY   = 'ni.bank.v1';
const START      = 150000;   // what Daily Street always started a run with
const DRILL_DAY_CAP = 12000; // the rebuild lane is a lane, not a printer
const LEDGER_MAX = 40;

/* Comp Run's cash is exponential idle-game currency; its `rep` is the career
   figure that survives a prestige, and `bankable()` hands it a FRACTION —
   about 0.85 for a full climb to the top of an era, less for a quick one.

   So the rate is per unit of that fraction, pinned against the street: a full
   era banks about $42,500, which is a good street's work, and a hurried
   crossing banks proportionally less. An era of Comp Run should be worth
   roughly a good day on the street — neither cabinet should be the obvious
   way to farm the other. */
const REP_TO_CASH = 50000;

const GAMES = ['street', 'drill', 'comprun'];

const num = (v, d = 0) =>
  (typeof v === 'number' && Number.isFinite(v)) ? v : d;
const int = (v, d = 0) => Math.round(num(v, d));
const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';

function fresh(){
  return { v:1, cash: START, best: START, low: START, staked: 0, earned: 0,
           ledger: [], runs: { street:0, drill:0, comprun:0 },
           drillDay: '', drillToday: 0, opened: 0 };
}

/* Everything typed on the way in. localStorage is writable by anything that
   ever ran on this origin — including the player with a console open — and a
   bankroll is exactly what somebody would edit. Typing it here does not stop
   a determined cheat (nothing client-side can), but it does stop a corrupt or
   hand-edited value from crashing a cabinet or minting Infinity. */
function clean(d){
  const b = fresh();
  if (!d || typeof d !== 'object') return b;
  b.cash    = Math.max(0, Math.min(1e12, int(d.cash, START)));
  b.best    = Math.max(b.cash, Math.min(1e12, int(d.best, b.cash)));
  b.low     = Math.max(0, Math.min(b.best, int(d.low, b.cash)));
  b.staked  = Math.max(0, Math.min(1e12, int(d.staked, 0)));
  b.earned  = Math.max(0, Math.min(1e12, int(d.earned, 0)));
  b.opened  = Math.max(0, Math.min(1e6,  int(d.opened, 0)));
  b.drillDay   = str(d.drillDay, 10);
  b.drillToday = Math.max(0, Math.min(DRILL_DAY_CAP, int(d.drillToday, 0)));
  if (d.runs && typeof d.runs === 'object')
    for (const g of GAMES) b.runs[g] = Math.max(0, Math.min(1e6, int(d.runs[g], 0)));
  if (Array.isArray(d.ledger))
    b.ledger = d.ledger.slice(-LEDGER_MAX).filter(x => x && typeof x === 'object')
      .map(x => ({ g: GAMES.includes(x.g) ? x.g : 'street',
                   d: int(x.d, 0), t: int(x.t, 0), n: str(x.n, 90) }));
  return b;
}

/* ── the one mutation ──────────────────────────────────────────────────────
   Every change to the money goes through here, so there is exactly one place
   that can move it and exactly one place to read to know what may. Returns a
   NEW bank plus what actually happened — `applied` can differ from `delta`
   when the floor or the daily cap bites, and the caller is told rather than
   quietly given a different number than it asked for. */
function settle(bank, { game, delta, note, day, at }){
  const b = clean(bank);
  const g = GAMES.includes(game) ? game : 'street';
  let d = int(delta, 0);
  let capped = false;

  /* the drill's daily cap. It pays out, so it is the one that could be farmed
     — sixty seconds a go, all night. It stays playable and stops paying. */
  if (g === 'drill' && d > 0){
    const key = str(day, 10);
    if (b.drillDay !== key){ b.drillDay = key; b.drillToday = 0; }
    const room = Math.max(0, DRILL_DAY_CAP - b.drillToday);
    if (d > room){ d = room; capped = true; }
    b.drillToday += d;
  }

  /* the floor. A bankroll below zero is a number nobody can act on. */
  const before = b.cash;
  b.cash = Math.max(0, before + d);
  const applied = b.cash - before;

  if (applied > 0) b.earned += applied; else b.staked += -applied;
  b.best = Math.max(b.best, b.cash);
  b.low  = Math.min(b.low,  b.cash);
  /* ── A LEDGER ROW IS A RECORD OF MONEY MOVING ──────────────────────────
     This read `applied !== 0 || note`, and the drill always sends a note. So
     once the daily cap was reached — which the drill invites, it says so on
     the card: "it still plays, it stops paying until tomorrow" — every further
     answer pushed a $0 row and evicted a real one from a forty-row window.

     Sixty capped answers and the whole ledger is sixty identical "$0 · read
     the flip on 12 Elm" lines: the street you won and the era you banked are
     both gone, replaced by play that moved nothing. The arcade hub's "where
     the money went" panel is the only audit trail the arcade has.

     A note is a description OF a movement, not a reason to record one. */
  if (applied !== 0)
    b.ledger = [...b.ledger, { g, d: applied, t: int(at, 0), n: str(note, 90) }].slice(-LEDGER_MAX);
  return { bank: b, applied, capped, floored: applied !== d };
}

function noteRun(bank, game){
  const b = clean(bank);
  const g = GAMES.includes(game) ? game : 'street';
  b.runs[g] += 1;
  return b;
}

/* ── what the drill pays ───────────────────────────────────────────────────
   A right read is worth a fee, not a profit: you did not buy the house, you
   said what it was for. So the fee is a slice of the room that exit actually
   had, floored so a thin deal still pays something for being read right and
   capped so one fat deal is not the whole session.

   A wrong read costs. It costs LESS than the fee a right one pays, because
   being wrong on paper is cheap and being wrong with a cheque is not — the
   drill is where you are supposed to be wrong. */
const DRILL_FEE_PC  = 0.03;
const DRILL_FEE_MIN = 250;
const DRILL_FEE_MAX = 3000;
const DRILL_MISS    = 400;

function drillFee(room){
  const r = num(room, 0);
  if (!(r > 0)) return DRILL_FEE_MIN;
  return Math.round(Math.max(DRILL_FEE_MIN, Math.min(DRILL_FEE_MAX, r * DRILL_FEE_PC)) / 50) * 50;
}

/** What a Comp Run prestige is worth banked. `rep` is the run's contribution
 *  to the career figure, which is already what that cabinet counts as an era's
 *  work — so this converts rather than invents. */
function prestigeValue(rep){
  return Math.max(0, Math.round(num(rep, 0) * REP_TO_CASH));
}

/* ── how the number reads ──────────────────────────────────────────────────
   The arcade earns the right to mention the desk only once there is a figure
   worth mentioning. Under that, the line would be a sales pitch attached to
   nothing, which is the kind of thing that makes a person stop trusting a
   page. */
const FUNNEL_AT = 400000;

function standing(bank){
  const b = clean(bank);
  const up = b.cash - START;
  return {
    cash: b.cash, best: b.best, low: b.low, up,
    /* "through the arcade" is gross, not net — it is the honest way to say
       how much of this you have actually handled */
    through: b.earned,
    runs: b.runs.street + b.runs.drill + b.runs.comprun,
    broke: b.cash <= 0,
    thin: b.cash > 0 && b.cash < START * 0.25,
    /* earned the mention: you are up, and you are up by something real */
    funnel: b.cash >= FUNNEL_AT && up > 0,
  };
}

/* ── the only thing that touches disk ──────────────────────────────────────
   Everything above is pure, so it runs under node and is unit-tested. This is
   the browser half, guarded so the tests never reach it. One reader, one
   writer, and no cabinet is allowed its own: three games writing a shared key
   by three different routes is how a shared number stops being shared. */
/* ── AND THE THREE WAYS DISK LIES ──────────────────────────────────────────
   All three used to produce the same answer — a fresh $150,000 bankroll —
   and none of them told anybody:

     · THERE IS NO KEY. A new player. $150,000 is exactly right.
     · THERE IS A KEY AND IT WILL NOT PARSE. Somebody's money is in there and
       we cannot read it. Handing back $150,000 is a guess, and the next write
       — one drill answer, anything — overwrites the blob, so a recoverable
       corruption became unrecoverable inside one page load. A player at
       $612,000 finished the day at $150,250 and the original was gone.
     · WE CANNOT WRITE AT ALL. Private browsing, blocked site data, a full
       quota. `write` swallowed the exception and returned the bank as though
       it had persisted, so the drill's end card said "This run paid +$3,250"
       directly above "Your bankroll is $150,000", and the daily cap never
       engaged because drillToday never persisted — an unbounded lane that
       paid nothing.

   So `read` reports WHY, `write` reports WHETHER, and an unreadable blob is
   never overwritten: the money stays on disk where somebody could still get
   it back, and the cabinet says so instead of quietly starting again. */
const BANK = {
  /** { bank, why } — why is 'ok' | 'new' | 'unreadable' | 'nostore' */
  readState(){
    if (typeof localStorage === 'undefined') return { bank: fresh(), why:'nostore' };
    let raw = null;
    try { raw = localStorage.getItem(BANK_KEY); } catch(e){ return { bank: fresh(), why:'nostore' }; }
    if (!raw) return { bank: fresh(), why:'new' };
    try { return { bank: clean(JSON.parse(raw)), why:'ok' }; }
    catch(e){ return { bank: fresh(), why:'unreadable' }; }
  },
  read(){ return this.readState().bank; },
  /** true when it is actually on disk. Callers that move money must check. */
  write(b){
    if (typeof localStorage === 'undefined') return false;
    try { localStorage.setItem(BANK_KEY, JSON.stringify(b)); return true; }
    catch(e){ return false; }
  },
  /** Move the money and persist it. Returns the same shape settle() does, plus
   *  `stored`, so a caller can tell the player when the floor or the daily cap
   *  bit AND when the number on screen is not the number on disk. */
  move(o){
    const s = this.readState();
    /* refuse to write over money we could not read. A cabinet that cannot
       read the bankroll must not be the thing that destroys it. */
    if (s.why === 'unreadable')
      return { bank: s.bank, applied: 0, capped: false, floored: false,
               stored: false, why: 'unreadable' };
    const r = settle(s.bank, { at: Date.now(), day: today(), ...o });
    r.stored = this.write(r.bank);
    r.why = r.stored ? 'ok' : 'nostore';
    return r;
  },
  run(game){ const b = noteRun(this.read(), game); this.write(b); return b; },
  standing(){ return standing(this.read()); },
  /** Is the bankroll on screen the bankroll on disk? Cabinets ask at boot. */
  trouble(){ const w = this.readState().why;
    return w === 'unreadable' || w === 'nostore' ? w : null; },
  /** Opening a cabinet is not a run, but it is worth knowing somebody looked. */
  opened(){ const b = this.read(); b.opened += 1; this.write(b); return b; },
};
/* One sentence, so all three cabinets say the same thing about the same
   problem. A player whose money is not being saved is owed the reason and, in
   the unreadable case, the fact that it has NOT been thrown away. */
function troubleLine(why){
  if (why === 'unreadable')
    return 'Something is stored under this arcade’s bankroll and this browser cannot read it, '
         + 'so nothing is being saved right now. It has not been overwritten — whatever is in '
         + 'there is still in there.';
  if (why === 'nostore')
    return 'This browser is not letting the arcade save anything, so the bankroll will not '
         + 'survive a reload. Private browsing and blocked site data both do this.';
  return '';
}

function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function money(n){
  const v = Math.round(Math.abs(num(n, 0)));
  return (num(n,0) < 0 ? '−$' : '$') + v.toLocaleString('en-US');
}
function signed(n){
  const v = num(n, 0);
  return (v > 0 ? '+' : v < 0 ? '−' : '') + '$' + Math.round(Math.abs(v)).toLocaleString('en-US');
}


/* ── THE MONEY IS REAL NOW ─────────────────────────────────────────────────
   The street used to hand you $150,000 at the top of every run and take it
   back at the bottom, which meant three good streets and three catastrophic
   ones ended in exactly the same place: nowhere. Now the run is played WITH
   the bankroll. What you make is yours and what you lose is gone.

   The daily rule from the record carries over unchanged and matters more here:
   only the FIRST finish of a day moves the money. You may replay today as
   often as you like — to see the street again, to try the other house — and
   the bankroll watches the first run only. Without that, a bad day is farmed
   away in four minutes and the number stops meaning anything. */
let BANKED = false;          // has this run already moved the money?

/* ── the record ────────────────────────────────────────────────────────────
   This game had no localStorage in it anywhere. You could finish three
   streets, close the tab, and the run had never happened — which is a strange
   thing to do to a game whose whole premise is "come back tomorrow."

   What persists is the RECORD, not the run in progress. A half-played timed
   round restored from disk is a worse experience than starting it again, and
   restoring one would also hand a player a way to stop the clock. So: you may
   replay today as often as you like, and the record keeps the FIRST finish of
   the day. That is the daily-puzzle convention and people already know it. */
const REC_KEY = 'ni.street.v1';
const FRESH_REC = () => ({ v:1, days:{}, streak:0, best:null, bestDay:null, played:0, last:null });
function loadRec(){
  try {
    const r = JSON.parse(localStorage.getItem(REC_KEY) || 'null');
    if (!r || r.v !== 1 || typeof r.days !== 'object' || !r.days) return FRESH_REC();
    return Object.assign(FRESH_REC(), r);
  } catch(e){ return FRESH_REC(); }
}
function saveRec(r){ try { localStorage.setItem(REC_KEY, JSON.stringify(r)); } catch(e){} }
function prevISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1, d) - 86400000);
  return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0');
}
/* Returns the record as it stood BEFORE today, so the summary can say
   "your best" without today's run silently becoming the thing it beat. */
function recordFinish(iso, capital, bought){
  const r = loadRec();
  if (r.days[iso]) return r;                       // first finish of the day is the one that counts
  r.days[iso] = { capital: Math.round(capital), bought };
  r.played = Object.keys(r.days).length;
  r.streak = r.last === prevISO(iso) ? (r.streak || 0) + 1 : 1;
  r.last = iso;
  if (r.best == null || capital > r.best){ r.best = Math.round(capital); r.bestDay = iso; }
  saveRec(r);
  return r;
}

/* ── lifecycle ─────────────────────────────────────────────────────────── */

function newRun(){
  clearInterval(timer);
  const iso = todayISO();
  /* the opening capital IS what you have. A thin bankroll is not a lockout:
     the street already lets you bid above your cash and charges points on the
     borrowed part, so being poor makes every deal dearer rather than
     impossible — which is both kinder and truer than a velvet rope. */
  const bank = BANK.read();
  BANKED = false;
  run = { iso, plan: B.buildRun(iso), round: 0, capital: bank.cash,
          opening: bank.cash, lines: [], ledger: [], streak: 0, screen: 'hero' };
  board = null; state = null;
  render();
}
function beginRound(){
  const p = run.plan.rounds[run.round];
  board = B.boardForRound(run.iso, new Date().getFullYear(), run.plan, run.round);
  state = { clock:p.clock, timed:p.timed, looksLeft:p.looks, phase:'play', at:0, mode:'browse',
            seen:{}, looks:0, price:0, bid:null, revealed:0, settled:false, result:null, fixed:new Set(), sale:null };
  for (let i=0;i<5;i++) state.seen[i] = { walk:false, ask:false };
  run.screen = 'play';
  clearInterval(timer);
  if (p.timed) timer = setInterval(tick, 1000);
  render();
}
function tick(){
  if (!state || state.phase !== 'play' || !state.timed) return;
  state.clock -= 1;
  if (state.clock <= 0){ state.clock = 0; closeRound(); return; }
  const el = document.getElementById('clk');
  if (el){ el.textContent = clockStr(state.clock); el.className = 't' + (state.clock<=12?' warn':''); }
}

/* ── what the player knows ─────────────────────────────────────────────── */

function read(i){
  const c = board.cards[i], L = board.looks[i], s = state.seen[i];
  const each = L.comps.map(x => x.sale_price / x.sqft);
  const ppsf = each.reduce((a,b)=>a+b,0) / each.length;
  const o = { each, ppsf, value: ppsf * c.sqft, repairs:null, tier:null, factor:null, reservation:null };
  // A range, not a point. Two sales disagree; pretending otherwise is the false
  // precision that makes this feel like homework.
  const lo = Math.min(...each) * c.sqft, hi = Math.max(...each) * c.sqft;
  o.lo = lo; o.hi = hi;
  if (s.walk) o.repairs = (L.walkthrough[0] + L.walkthrough[1]) / 2;
  if (s.ask){ o.tier = TIER_OF[L.ask] || 'medium'; o.factor = B.MOTIVATION_FACTOR[o.tier]; o.reservation = o.value * o.factor; }
  o.walkAway = o.value - (o.repairs != null ? o.repairs : 0);
  o.sure = o.repairs != null;
  return o;
}
function sliderRange(i){
  const c = board.cards[i], r = read(i);
  const hi = Math.max(c.asking * 1.35, r.walkAway * 1.2);
  const lo = Math.min(c.asking * 0.5, hi * 0.4);
  return [Math.round(lo/500)*500, Math.round(hi/500)*500];
}

/* ── coach ─────────────────────────────────────────────────────────────── */

function coach(){
  if (state.phase === 'renovate'){
    if (state.estimated) return 'Tick everything <b>green</b>. Leave the rest.';
    return 'Structural work always pays. Extras never do. <b>Read the note</b> on the cosmetic ones.';
  }
  if (state.phase !== 'play') return null;
  if (state.bid) return 'Offer sealed. <b>Close the street</b> to see how everyone did.';
  if (state.mode === 'offer') return 'Drag the handle. <b>Green is your profit</b> — make it as big as you dare.';
  const s = state.seen[state.at];
  if (state.looksLeft <= 0) return 'No looks left. Pick a house and <b>make your offer</b>.';
  if (!s.walk) return 'The sales tell you what it is worth. Now check <b>what it needs</b>.';
  if (!s.ask)  return 'Find out <b>why they are selling</b> — that is what they will take.';
  return 'You know this one. <b>Make an offer</b>, or arrow across to another house.';
}

/* ── actions ───────────────────────────────────────────────────────────── */

function go(d){ if (state.phase==='play' && state.mode!=='offer'){ state.at=(state.at+d+5)%5; render(); } }
function jump(i){ if (state.phase==='play' && state.mode!=='offer'){ state.at=i; render(); } }
function doLook(kind){
  const i = state.at;
  if (state.phase!=='play' || state.seen[i][kind] || state.looksLeft<=0) return;
  state.seen[i][kind]=true; state.looks++; state.looksLeft--; render();
}
function toOffer(){
  if (state.phase!=='play' || state.bid) return;
  const i=state.at, r=read(i), range=sliderRange(i);
  const anchor = r.reservation != null ? r.reservation : board.cards[i].asking*0.82;
  state.price = Math.max(range[0], Math.min(range[1], Math.round(anchor/500)*500));
  state.mode='offer'; render();
}
function backToBrowse(){ state.mode='browse'; render(); }
function setPrice(v){ state.price=+v; paintDeal(); }
function sealOffer(){
  if (state.phase!=='play' || state.bid) return;
  state.bid={ idx:state.at, amount:state.price }; state.mode='browse'; render();
}

function dealParts(i){
  const r = read(i), p = run.plan.rounds[run.round];
  const borrowed = Math.max(0, state.price - run.capital);
  const points = Math.round(borrowed * p.financeRate);
  return { total:r.value, fix:(r.repairs!=null?r.repairs:0), pay:state.price, keep:r.walkAway-state.price-points, sure:r.sure };
}

/* ══ THE SCALE, PAINTED ════════════════════════════════════════════════════
   Everything here is derived from what the player already knows: the comp
   spread they were handed, the repair figure if and only if they walked it,
   and the asking price, which is printed on the card. Nothing consults the
   truth. A heat scale that knew the answer would be the answer. */
function paintHeat(){
  const el = document.getElementById('heat'); if (!el) return;
  const i = state.at, c = board.cards[i], r = read(i), p = run.plan.rounds[run.round];
  const rg = sliderRange(i), span = rg[1] - rg[0];
  const pos = v => Math.max(0, Math.min(100, ((v - rg[0]) / span) * 100));
  /* the walk-away is a BAND, because two sales disagree. Repairs come off both
     ends the moment they are known, which is why looking tightens it. */
  /* AND WHEN YOU HAVE NOT LOOKED, THERE IS NO LINE. The first version put the
     boundary at zero repairs, which is the most optimistic number in the room
     and would have painted a green scale under a house with a hole in the
     roof — a lie by omission, in the one product built not to tell them. With
     repairs unknown the band spans what a house of this age plausibly needs,
     3% to 15% of value, and no line is drawn at all, because you do not have
     one. Spend the look and the band collapses onto a figure you can stand on.
     That is the entire thesis of the software, played rather than explained. */
  const fix = r.repairs != null ? r.repairs : 0;
  const wLo = r.repairs != null ? r.lo - fix : r.lo - r.value * 0.15;
  const wHi = r.repairs != null ? r.hi - fix : r.hi - r.value * 0.03;
  const wMid = r.repairs != null ? r.walkAway : (wLo + wHi) / 2;
  /* borrowing moves the line: over your capital every dollar costs points, so
     break-even arrives earlier. Solved rather than approximated. */
  const be = wMid <= run.capital ? wMid
           : (wMid + run.capital * p.financeRate) / (1 + p.financeRate);
  const a = Math.max(0, pos(wLo) - 6), b = pos(be), cEnd = Math.min(100, pos(wHi) + 6);
  el.style.setProperty('--h1', 'var(--green-bg)');
  el.style.setProperty('--h2', 'rgba(154,107,31,.30)');
  el.style.setProperty('--h3', 'rgba(179,55,44,.34)');
  el.style.setProperty('--gA', a.toFixed(1) + '%');
  el.style.setProperty('--gB', b.toFixed(1) + '%');
  el.style.setProperty('--gC', cEnd.toFixed(1) + '%');
  const band = document.getElementById('hband');
  if (band){ const l = pos(wLo), w = Math.max(1.2, pos(wHi) - l);
    band.style.left = l + '%'; band.style.width = w + '%';
    /* a look does not narrow the comps, it removes the repair guess — so the
       band stays and the LINE inside it becomes something you can trust */
    band.style.opacity = r.sure ? '.45' : '1'; }
  const line = document.getElementById('hline');
  if (line){ line.style.left = 'calc(' + b.toFixed(1) + '% - 1px)';
    line.style.display = r.sure ? 'block' : 'none'; }
  const at = document.getElementById('haskt'), al = document.getElementById('haskl');
  if (at) at.style.left = pos(c.asking) + '%';
  if (al) al.style.left = pos(c.asking) + '%';
  /* the floating price label under the thumb is gone: it collided with the
     handle at every position and it was printing, one line lower and larger,
     the number "your offer" already prints. */
  const borrowed = Math.max(0, state.price - run.capital);
  const pts = Math.round(borrowed * p.financeRate);
  return { sure:r.sure, keepLo: wLo - state.price - pts, keepHi: wHi - state.price - pts };
}
/* THE NUMBER MOVES, BECAUSE THE NUMBER IS THE POINT. A figure that snaps has
   no weight; one that runs to its new value reads as a consequence of the hand
   on the slider. 180ms, transform-free, and it goes straight to the answer for
   anyone who has asked their machine to stop animating things. */
var KEEP_ANIM = null;
function setKeep(el, target){
  const fmt = v => v >= 0 ? M(v) : '−' + M(-v);
  if (matchMedia('(prefers-reduced-motion:reduce)').matches){ el.textContent = fmt(target); return; }
  const from = (typeof el.__v === 'number') ? el.__v : target;
  if (KEEP_ANIM) cancelAnimationFrame(KEEP_ANIM);
  const t0 = performance.now(), dur = 180;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    const v = from + (target - from) * e;
    el.textContent = fmt(Math.round(v / 100) * 100);
    if (k < 1) KEEP_ANIM = requestAnimationFrame(step);
    else { el.textContent = fmt(target); el.__v = target; }
  };
  el.__v = target;
  KEEP_ANIM = requestAnimationFrame(step);
}

function paintDeal(){
  const d = dealParts(state.at), pctOf = v => Math.max(0,(v/d.total)*100);
  const bar = document.getElementById('dealbar');
  if (bar){
    const pay = Math.min(100, pctOf(d.pay));
    bar.innerHTML = d.keep >= 0
      ? '<i class="pay" style="width:'+pay+'%"></i><i class="keep" style="width:'+Math.min(100-pay,pctOf(d.keep))+'%"></i>' +
        '<i class="fix" style="width:'+Math.max(0,100-pay-pctOf(d.keep))+'%"></i>'
      : '<i class="pay" style="width:'+Math.max(0,100-Math.min(40,pctOf(-d.keep)))+'%"></i><i class="over" style="width:'+Math.min(40,pctOf(-d.keep))+'%"></i>';
  }
  const hb = paintHeat();
  const kv=document.getElementById('keepv');
  if (kv){
    /* AND THE BIG NUMBER OBEYS THE SAME RULE AS THE SCALE. It was printing a
       precise green figure computed from zero repairs while the caption
       underneath admitted you had not checked what it needs — the exact shape
       of the lie the heat band was just fixed to stop telling. Until you
       look it is a RANGE, and it is slate rather than green, because green in
       this product means money that pays and a number you have not earned the
       right to is not that. */
    if (hb && !hb.sure){
      kv.textContent = M(Math.round(hb.keepLo/100)*100) + '–' + M(Math.round(hb.keepHi/100)*100);
      kv.className = 'v est'; kv.__v = null;
    } else { setKeep(kv, d.keep); kv.className='v'+(d.keep>=0?'':' bad'); }
  }
  const kn=document.getElementById('keepn');
  if (kn) kn.textContent = d.keep>=0 ? (d.sure ? 'if you win it, before the work you choose' : 'but you have not checked what it needs')
                                     : 'you would lose money on this';
  const ov=document.getElementById('offerv'); if (ov) ov.innerHTML='<b>'+M(state.price)+'</b>';
}

/* ── close / resolve / renovate ────────────────────────────────────────── */

function closeRound(){
  if (!state || state.phase!=='play') return;
  clearInterval(timer);
  state.phase='resolve';
  const opened=[];
  for (let i=0;i<5;i++){ const s=state.seen[i]; if (s.walk||s.ask) opened.push(i); }
  const p = run.plan.rounds[run.round];
  state.result = B.scoreRound(board, { opened, bid_index: state.bid?state.bid.idx:null,
    bid_amount: state.bid?state.bid.amount:null, looks: state.looks, capital: run.capital, financeRate: p.financeRate });
  state.revealed=0; render(); revealStep();
}
/* ══ THE PATTER ════════════════════════════════════════════════════════════
   Elijah asked for Claude's random-verb trick. On the desk it would have been
   a small lie in the exact place this product stakes its claim, so the desk
   got true lines about the property instead. HERE it belongs: the arcade is
   the other world and it is allowed to be funny. Every line is about the
   RITUAL — the room, the paper, the wait — and none of them claims anything
   about the board, because a joke that invents a fact is still a fact
   invented. */
var PATTER = [
  'Opening the envelopes.', 'Somebody has used a fountain pen.',
  'Counting the paper.', 'The room goes quiet.',
  'One of these is folded twice.', 'A number written and crossed out.',
  'Reading them in the order they arrived.', 'Nobody is looking at anybody.',
  'The clerk clears his throat.', 'Two of these are the same handwriting.'
];
function patter(n){ return PATTER[n % PATTER.length]; }
function revealStep(){
  if (state.revealed >= 5){
    // `settled` makes the reveal rows render already-visible. Without it the
    // next render() rebuilds the DOM, drops every .in class, and the whole
    // resolution silently fades to nothing — which is exactly what it did.
    state.settled = true;
    if (state.result.outcome === 'won'){
      state.phase = 'renovate';
      state.fixed = new Set(); state.estimated = false;
    } else {
      state.phase = 'settle';
      run.streak = 0;
    }
    render(); return;
  }
  const rows = document.querySelectorAll('.rrow');
  const i = state.revealed;
  if (rows[i]) rows[i].classList.add('in');
  /* THE CAMERA WALKS THE STREET IT WAS PLAYED ON. The reveal used to be five
     text rows fading in beside a drawing that sat still through the only
     dramatic thing that happens in this game. The marker now moves house by
     house, the sold board goes up as each one resolves, and by the end the
     street is a record of the round rather than a picture of its start. */
  const res = state.result.resolutions[i];
  if (window.__strip){
    window.__strip.at = i;
    window.__strip.sold = window.__strip.sold || {};
    if (res && res.sold_at) window.__strip.sold[i] = (res.winner === 'you') ? 'you' : 'them';
    try { paintStreetHouses(); } catch(e){}
  }
  const say = document.getElementById('rpatter');
  if (say) say.textContent = patter(i + (board.number || 0));
  state.revealed++;
  /* TIME IS FLAT. My first cut jittered every beat, on the same instinct that
     made the desk's loading uneven — but Claude Design ruled the opposite here
     and the reason is better than mine: a reveal whose pacing responds to the
     stakes is a machine deciding how excited you should be. Cold houses take
     the same 800ms whether they went for forty thousand or four hundred. The
     only thing allowed to grow with the stakes is the number itself.

     The one long beat is the house you bid on, and it is a HOLD rather than a
     flourish: 1200ms in which nothing on the screen moves at all. The hold is
     the animation. Under reduced motion it survives unchanged, because
     stillness is what somebody who turned motion off asked for. */
  const mine = state.bid && state.bid.idx === i;
  setTimeout(revealStep, mine ? 1200 : 800);
}
function buyEstimate(){
  if (state.phase!=='renovate' || state.estimated || state.looksLeft<=0) return;
  state.looksLeft--; state.estimated = true; render();
}
function toggleJob(id){
  if (state.phase!=='renovate') return;
  if (state.fixed.has(id)) state.fixed.delete(id); else state.fixed.add(id);
  render();
}
function finishReno(){
  if (state.phase!=='renovate') return;
  const p = run.plan.rounds[run.round];
  state.sale = B.finishSale(board, state.bid.idx, state.bid.amount, state.fixed, run.capital, p.financeRate);
  state.phase = 'settle';
  run.streak = state.sale.profit > 0 ? run.streak + 1 : 0;
  render();
}
function roundProfit(){ return state.sale ? state.sale.profit : 0; }
function nextRound(){
  const R = state.result, profit = roundProfit();
  run.capital += profit;
  run.lines.push({ grid: R.grid, profit });
  run.ledger.push({ grid: R.grid.join(''), profit, outcome: R.outcome,
                    where: state.bid ? board.cards[state.bid.idx].address : null });
  run.round++;
  if (run.round >= B.ROUNDS){
    /* read the record BEFORE filing today's, so "you beat your best" can
       compare against something today has not already overwritten */
    const before = loadRec();
    run.before = { best: before.best, streak: before.streak, played: before.played,
                   already: !!before.days[run.iso] };
    const firstToday = !before.days[run.iso];
    run.rec = recordFinish(run.iso, run.capital, run.ledger.filter(l=>l.outcome==='won').length);
    /* the money moves ONCE, on the first finish of the day, for the amount the
       three streets actually made or lost */
    if (firstToday && !BANKED){
      BANKED = true;
      const delta = Math.round(run.capital - run.opening);
      const bought = run.ledger.filter(l=>l.outcome==='won').length;
      const r = BANK.move({ game:'street', delta,
        note: delta === 0 ? 'three streets, nothing bought'
            : (delta > 0 ? 'made' : 'lost') + ' it on ' + (bought === 1 ? 'one flip' : bought + ' flips') });
      BANK.run('street');
      run.banked = { delta, applied: r.applied, floored: r.floored, after: r.bank.cash,
                      stored: r.stored !== false, why: r.why };
    } else {
      run.banked = null;
    }
    run.screen='summary'; clearInterval(timer); render(); return;
  }
  run.screen='card'; render();
}

/* ── render ────────────────────────────────────────────────────────────── */

function render(){
  const el = document.getElementById('board');
  /* every screen that can carry the strip repaints it, because innerHTML
     throws away a canvas's bitmap along with the canvas */
  const done = () => { try { paintStreetHouses(); } catch(e){} };
  if (run.screen==='hero'){ el.innerHTML=heroHTML(); done(); try { paintDeeds(); } catch(e){} return; }
  /* the interstitials have no scene of their own, so they are all clipboard */
  if (run.screen==='card'){ el.innerHTML=clip(cardHTML()); return; }
  if (run.screen==='summary'){ el.innerHTML=clip(summaryHTML() + shelfHTML()); try { paintDeeds(); } catch(e){} return; }
  if (state.phase==='play'){ el.innerHTML=playHTML(); done(); if (state.mode==='offer') paintDeal(); return; }
  if (state.phase==='renovate'){ el.innerHTML=statusBar()+pagerHTML()+clip(renovateHTML()); done(); return; }
  el.innerHTML = resolveHTML(); done(); try { paintDeeds(); } catch(e){}
}

/* ══ THE SHELF ═════════════════════════════════════════════════════════════
   A deed that only exists in localStorage is a deed nobody owns. Comp Run's
   register is forty slots and thirty-nine of them are empty on day one, and
   that wall of empty is the reason people come back — the pleasure of a
   collection is the shape of the hole in it.

   So the shelf shows TWELVE slots: what you have taken, newest first, and the
   empty frames after them. Twelve because three streets a day fills it in four
   days, which is long enough to be a goal and short enough to be reachable —
   and when it overflows the oldest scroll off rather than the wall growing
   forever, because a collection you cannot see the end of is a list.

   The counter is honest about the whole holding: "9 of 12 shown" when there
   are more behind. Nothing here is generated, sampled or rounded — each card
   is one house somebody actually bought on a street the whole world played. */
var SHELF = 12;
function shelfHTML(){
  var all = loadDeeds().list;
  if (!all.length) return '';
  var recent = all.slice(-SHELF).reverse();
  var foils = all.filter(function(d){ return d.tier === 'c5'; }).length;
  var h = '<div class="shelf"><div class="shhead">' +
    '<span class="k">The deeds</span>' +
    '<span class="n">' + all.length + (all.length > SHELF ? ' held · ' + SHELF + ' shown' : (all.length === 1 ? ' held' : ' held')) +
    (foils ? ' · ' + foils + ' foil' : '') + '</span></div><div class="shgrid">';
  for (var i=0; i<SHELF; i++){
    var d = recent[i];
    if (d) h += '<div class="slot ' + d.tier + (d.tier === 'c5' ? ' foil' : '') + '" ' +
      'title="' + esc(d.addr) + ' — street № ' + d.n + ', ' + MP(d.spread) + '">' +
      '<canvas class="dc" width="108" height="74" data-deed="' + d.iso + ':' + d.round + '"></canvas>' +
      '<div class="sl">' + esc(String(d.addr).split(' ')[0]) + '</div></div>';
    else h += '<div class="slot empty" aria-hidden="true"><div class="sl">—</div></div>';
  }
  return h + '</div></div>';
}

function heroHTML(){
  const r = loadRec();
  /* A returning player should be met by their own history, not by the same
     blank door they saw yesterday. A first-timer sees nothing extra. */
  let bar = '';
  if (r.played > 0){
    const bits = [];
    if (r.streak > 1) bits.push('<b>'+r.streak+'</b> days running');
    bits.push('<b>'+r.played+'</b> street'+(r.played===1?'':'s')+' walked');
    if (r.best != null) bits.push('best finish <b>'+M(r.best)+'</b>');
    bar = '<div class="rec">'+bits.join(' · ')+
      (r.days[todayISO()] ? '<div class="done">Today is already on the board at '+M(r.days[todayISO()].capital)+
        ' — you can play it again, the record keeps the first run.</div>' : '')+'</div>';
  }
  const bk = BANK.standing();
  /* the stake, stated before you play rather than after you lose it */
  const stake = '<div class="stake'+(bk.thin?' thin':'')+(bk.broke?' broke':'')+'">' +
    '<span class="l">You are playing with</span><span class="n">'+M(bk.cash)+'</span>' +
    /* ── A REPLAY DOES NOT TAKE THE STAKE, SO IT MUST NOT PROMISE ONE ──────
       nextRound only moves money when firstToday. This block branched on
       broke and thin but not on whether today was already banked — four lines
       after the record line checked exactly that — so a second run promised
       "what you lose is gone", showed the cash falling across three streets,
       and only admitted once it was over that none of it had been real. The
       reverse is worse: win $60,000 and find out at the end it did not count.
       The bankroll clause is decided first, because it decides the premise;
       the broke and thin notes still apply, because the points penalty for
       bidding on borrowed money is real on a replay too. */
    '<span class="s">'+(r.days[todayISO()]
      ? 'Today is already banked, so the bankroll does not move either way — this run is for the practice. '
        + (bk.broke ? 'Bidding above nothing still costs you points.'
          : bk.thin ? 'Bidding above what you have still costs you points.'
          : 'The score still counts, and the record keeps your first run.')
      : bk.broke
      ? 'Nothing. Every house on the street is borrowed money now, and the points come off the top. The drill pays a fee for a right read — that is the way back.'
      : bk.thin
      ? 'Thin. You can still bid above it, but the borrowed part costs you points, so the margins get tight.'
      : 'Three streets. What you make is yours and what you lose is gone.')+'</span></div>';
  /* THE TITLE SCREEN SHOWS THE STREET IT IS THE TITLE OF. It used to be 61
     words, a button, and 890 pixels of empty desk under it — the only page in
     the arcade with no picture of any kind, promising houses and showing none.
     Round one's board is deterministic from the day's seed, so drawing it here
     is the same five houses beginNow will build, not a decoration standing in
     for them. Nothing is walked and nothing is current: it is the street
     before you have been down it. Claude Design's answer to where the empty
     desk goes — nothing is added to fill it, the picture that was already
     owed simply arrives one screen earlier. */
  let strip = '';
  try {
    strip = streetStrip(B.boardForRound(run.iso, new Date().getFullYear(), run.plan, 0).cards,
                        { interactive:false });
  } catch(e){}
  return strip + clip('<div class="hero"><div class="mark">The Daily Street</div>' +
    '<h1>Buy a house for<br>less than it is <b>worth</b>.</h1>' +
    '<div class="sub">Fix what is worth fixing. Keep the difference.</div>' +
    '<div class="meta">3 streets · 3 minutes · new houses every day</div></div>' + stake + bar +
    '<div style="padding:0 18px 20px"><button class="btn go" onclick="beginRound()">'+
    (r.days[todayISO()] ? 'Play again' : 'Play')+'</button>' +
    '<a class="back" href="arcade.html">← the floor</a></div>' + shelfHTML() + helpHTML());
}

function condChip(c){

/**
 * Comps as a match table.
 *
 * The subject's own worth is deliberately NOT printed here. Handing over the
 * answer turns the most valuable habit in the game — looking at what sold and
 * forming a view — into reading a number off a card. What IS given is how well
 * each sale matches on size and bedrooms, colour-coded, so the read is available
 * at a glance without being done for you.
 */
function matchTag(comp, c){
  const d = Math.abs(comp.sqft - c.sqft) / c.sqft;
  if (d <= 0.06) return ['same','same size'];
  if (d <= 0.15) return ['near', comp.sqft > c.sqft ? 'a bit bigger' : 'a bit smaller'];
  return ['off', comp.sqft > c.sqft ? 'much bigger' : 'much smaller'];
}
function compsHTML(i){
  const c = board.cards[i], L = board.looks[i];
  let rows = '';
  for (const x of L.comps){
    const [cls,word] = matchTag(x, c);
    const bedCls = x.beds === c.beds ? 'same' : Math.abs(x.beds - c.beds) === 1 ? 'near' : 'off';
    rows += '<tr><td>'+esc(x.address)+'<div><span class="mt '+cls+'">'+word+'</span> ' +
            '<span class="mt '+bedCls+'">'+x.beds+' bed</span></div></td>' +
            '<td>'+x.sqft.toLocaleString()+'</td><td>'+M(x.sale_price)+'</td></tr>';
  }
  rows += '<tr class="you"><td>This house<div style="font-weight:400"><span class="mt">'+c.beds+' bed</span></div></td>' +
          '<td>'+c.sqft.toLocaleString()+'</td><td>asking '+M(c.asking)+'</td></tr>';
  const anySame = L.comps.some(x => matchTag(x,c)[0]==='same');
  return '<div class="comps"><div class="clab">What just sold nearby</div>' +
    '<table class="ctab"><tr><th>Address</th><th>Sqft</th><th>Sold for</th></tr>'+rows+'</table>' +
    '<div class="cnote">' + (anySame
      ? 'One of these is about the same size as this house. <b>That is your best guide.</b>'
      : 'Neither is quite the same size — scale it up or down in your head and allow yourself some room.') +
    '</div></div>';
}

/** Free colour on the property. Contains real tells, costs nothing to read. */
function detailHTML(i){
  const c = board.cards[i], L = board.looks[i];
  const size = c.sqft > 2200 ? 'It is a big one for the street.' : c.sqft < 1400 ? 'It is on the small side for the street.' : 'It is about average size for the street.';
  const cond = c.condition==='Clean' ? 'From the kerb it shows well — paint is recent and the roofline looks straight.'
    : c.condition==='Rough' ? 'From the kerb it shows badly. Gutter is hanging off one corner and the porch has a lean to it.'
    : 'From the kerb it shows its age. Nothing alarming, nothing recent either.';
  const ppsf = 'Asking works out to ' + M(c.ppsf) + ' a square foot.';
  const crowd = c.interest >= 3 ? 'There have been cars outside all week. Everyone can see this one.'
    : c.interest === 0 ? 'Nobody has been by. It has been sitting.'
    : 'A couple of people have walked it.';
  return '<details class="more"><summary>Take a closer look — free</summary><div class="mb">' +
    '<p>'+size+' '+cond+'</p><p>'+ppsf+' '+crowd+'</p></div></details>';
}

function factsHTML(i){
  const L = board.looks[i], s = state.seen[i], r = read(i), t = board.truth ? board.truth[i] : null;
  const out = state.looksLeft <= 0;
  let h = '<div class="facts">';
  if (s.walk){
    const tags = t ? t.jobs.map(j=>'<span>'+esc(j.label)+'</span>').join('') : '';
    h += '<div class="fact known bad"><span>It needs work<div class="joblist">'+tags+'</div></span><span class="v">−'+M(r.repairs)+'</span></div>';
  } else {
    h += '<button class="fact" onclick="doLook(\'walk\')" '+(out?'disabled':'')+'><span>What does it need?</span><span class="c">'+(out?'no looks':'1 look')+'</span></button>';
  }
  h += s.ask
    ? '<div class="fact known"><span>'+TIER_WORD[r.tier]+'<div class="quote">“'+esc(L.ask)+'”</div></span><span class="v">~'+M(r.reservation)+'</span></div>'
    : '<button class="fact" onclick="doLook(\'ask\')" '+(out?'disabled':'')+'><span>Why are they selling?</span><span class="c">'+(out?'no looks':'1 look')+'</span></button>';
  return h + '</div>';
}


/* ══ THE HOUSE, DRAWN ══════════════════════════════════════════════════════
   A complete beginner cannot read "$9,500 repairs walk-through" and feel
   anything. They can absolutely see a tarp on a roof. The Exit Drill already
   proved the idea — its night house boards its windows and grows weeds as the
   repair ratio climbs — and this is that idea moved to the cabinet that needed
   it most, in daylight, because you walk a street in daylight.

   THE HONESTY RULE, WHICH IS THE WHOLE DESIGN: the drawing shows ONLY what the
   card already tells you for free. Condition, size, bedroom count and how many
   other buyers have been by are printed on the card before you spend a look.
   Repairs and ARV are not, and nothing in the picture encodes them — a house
   whose roof told you its repair bill would hand over the thing the looks are
   for, and the game would be a colouring book.

   Drawn at 48x36 and scaled by whole numbers with image-rendering:pixelated,
   so a pixel is a pixel at every size. No anti-aliasing anywhere, which is
   what separates pixel art from a small drawing. */
/* ══ THE STREET ════════════════════════════════════════════════════════════
   Claude Design's sixth pass, built. Five layers, six skies, and a silhouette
   vocabulary — because the version this replaces drew five houses that were
   the same house five times, in one flat light, and Elijah's verdict was that
   it did not look like a game. It did not.

   WEATHER IS THE MODIFIER NOW. The daily seed already varies the market —
   quiet market, auction week, probate calendar, thin data, firm sellers — and
   the play screen used to print that as a sentence. It is the sky instead:
   rain on the quiet days, dusk on auction night, fog when the recorder is
   behind. A modifier you can see needs no caption, so the caption is gone.

   TWO LAWS MAKE AA SURVIVABLE ACROSS ALL SIX WITHOUT SIX SEPARATE AUDITS, and
   they are the reason this is a system rather than six pictures:
     1 · words and figures NEVER stand on sky or scene. They stand on an
         object or the ground plate, so text contrast is solved once.
     2 · scene tones are SKY VARIABLES, not constants. The daylight house
         fails 3:1 against rain, dusk and fog no matter which single value you
         pick — so every sky ships its own house tone, solved against the band
         its roofline meets. A palette is not a constant; the light is.

   AND THE HONESTY RULE SURVIVES THE MAKEOVER INTACT. Footprint is square feet,
   a second storey is the top square-foot band, wear is the card's condition,
   and the figures on the kerb are the buyer count the card already prints.
   Roof shape, porch, tree and lamp are seeded style and are keyed to nothing —
   a roof that told you the repair bill would hand over the thing the looks
   exist to sell. */
var SKIES = {
  day:    { bands:['#7d9bb0','#96b0bf','#a8bdc8'], house:'#4a5a63', roof:'#38434e', win:'#26303c', door:'#8c6a3a', grass:'#9aad82', side:'#7d8794', road:'#3e4854', far:'#8fa2b0', weather:'clouds', cloud:'#d8e2e8', tarp:'#6d94bd', board:'#8a734f' },
  noon:   { bands:['#8fa9b8','#a9c0cc','#c4d2d8'], house:'#4a5a63', roof:'#38434e', win:'#26303c', door:'#8c6a3a', grass:'#93a67c', side:'#87919d', road:'#434d59', far:'#9db0bc', weather:'shadows', shadow:'#26303c', sun:'#f2ead2', tarp:'#6d94bd', board:'#8a734f' },
  rain:   { bands:['#4e5d6b','#5a6a78','#78838c'], house:'#2e3844', roof:'#26303c', win:'#1a222c', door:'#6a5236', grass:'#6d7d5e', side:'#6d7784', road:'#333d49', far:'#65727e', weather:'rain', streak:'#eef2f5', tarp:'#5d84ad', board:'#a08050' },
  dusk:   { bands:['#3a3a5c','#8c5f57','#b8764f'], house:'#141c2b', roof:'#141c2b', win:'#141c2b', litwin:'#d9a05a', door:'#141c2b', grass:'#2e3a3e', side:'#5d6874', road:'#26303c', far:'#2e3448', weather:'dusk', sun:'#e8c27a', pool:'#8a7358', tarp:'#5d84ad', board:'#a08050' },
  winter: { bands:['#9aa8b4','#b4c2cc','#c8d2da'], house:'#4a5a63', roof:'#38434e', win:'#26303c', door:'#8c6a3a', grass:'#c2cad0', side:'#a9b2bc', road:'#5a646f', far:'#8b99a6', weather:'winter', snow:'#f2f4f6', tree:'#3a4650', tarp:'#6d94bd', board:'#8a734f' },
  fog:    { bands:['#6d7884','#6d7884','#6d7884'], house:'#1c2430', roof:'#1c2430', win:'#1c2430', door:'#1c2430', grass:'#66705e', side:'#7d8794', road:'#3e4854', far:null, weather:'fog', bar:'#79848f', tarp:'#7da0c4', board:'#a08050' }
};
/* the map from what the engine already rolled to what you can see */
var SKY_OF = { open_market:'day', firm_sellers:'noon', quiet_market:'rain',
               auction_week:'dusk', estate_week:'winter', thin_data:'fog' };
var SW = 366, SH = 170;
/* the caption died and the sky took its job — so the sky says it out loud for
   anybody who cannot see it. One string dies, one aria-label is born. */
var SKY_LABEL = {
  day:'Today\u2019s street, clear morning', noon:'Today\u2019s street, hard noon \u2014 sellers are firm',
  rain:'Today\u2019s street in the rain \u2014 a quiet market', dusk:'Today\u2019s street at dusk \u2014 auction week',
  winter:'Today\u2019s street after snow \u2014 the probate calendar', fog:'Today\u2019s street in fog \u2014 thin data'
};

var _ss = 42;
function _r(){ _ss = (_ss*1664525 + 1013904223) >>> 0; return _ss / 4294967296; }

function drawHouseP(g, S, x, gy, hp, sold){
  var px = function(a,b,c,d,e){ g.fillStyle = e; g.fillRect(a|0,b|0,c|0,d|0); };
  var w = hp.w, bh = hp.h, cx = x + w/2;
  var rh = Math.max(4, Math.round(w * (hp.roof === 'hip' ? 0.16 : 0.24)));
  px(x, gy-bh, w, bh, S.house);
  var half = function(r){ var f = (r+1)/rh;
    return hp.roof === 'hip' ? Math.round(w*0.2 + f*(w/2+1-w*0.2)) : Math.round(f*(w/2+1)); };
  for (var r=0; r<rh; r++){
    var hw = half(r);
    px(Math.round(cx-hw), gy-bh-rh+r, hw*2, 1, (S.snow && r < 2) ? S.snow : S.roof);
  }
  if (hp.storeys === 2) px(x, gy-Math.round(bh/2), w, 1, S.roof);
  var floors = hp.storeys || 1, ww = 4, wh = 5;
  var winY = []; for (var f=0; f<floors; f++) winY.push(gy - bh + Math.round(bh*(f+0.22)/floors));
  var cols = Math.max(1, Math.floor((w-8)/(ww+5)));
  var firstWin = null;
  for (var fi=0; fi<winY.length; fi++){
    for (var c2=0; c2<cols; c2++){
      var wx = Math.round(x + 4 + c2*((w-8-ww)/(Math.max(1,cols-1)||1)));
      if (fi === floors-1 && Math.abs(wx+ww/2-cx) < ww+1) continue;
      px(wx, winY[fi], ww, wh, S.litwin || S.win);
      if (!firstWin) firstWin = [wx, winY[fi]];
    }
  }
  var dw = 5, dh = 8;
  px(Math.round(cx-dw/2), gy-dh, dw, dh, (S.litwin && hp.cond !== 'rough') ? S.litwin : S.door);
  if (hp.roof === 'porch'){
    px(Math.round(cx-dw/2)-3, gy-dh-3, dw+6, 1, S.roof);
    px(Math.round(cx-dw/2)-3, gy-dh-2, 1, dh+2, S.roof);
    px(Math.round(cx+dw/2)+2, gy-dh-2, 1, dh+2, S.roof);
  }
  if (hp.cond === 'rough'){
    for (var r2=Math.round(rh*0.25); r2<rh; r2++){
      var hw2 = half(r2);
      px(Math.round(cx-hw2), gy-bh-rh+r2, Math.max(3, Math.round(hw2*0.85)), 1, S.tarp);
    }
    if (firstWin) px(firstWin[0]-1, firstWin[1]-1, ww+2, wh+2, S.board);
    for (var i2=0; i2<5; i2++) px(x-2+Math.round(_r()*(w+2)), gy-3, 1, 3, '#26303c');
  }
  px(x-1, gy, w+2, 1, '#0d1420');
  if (sold){
    px(x+3, gy-11, 2, 11, '#6a5236');
    px(x-1, gy-20, 14, 9, '#e9e2d0');
    var ink = sold === 'you' ? '#2a5f3e' : '#22201c';
    px(x, gy-18, 12, 1, ink); px(x+1, gy-16, 10, 1, ink); px(x+2, gy-14, 7, 1, ink);
  }
}

function drawStreet(cv, cards, sel, seenMap, bidIdx, sold, skyKey){
  var g = cv.getContext('2d'); if (!g) return;
  g.imageSmoothingEnabled = false;
  _ss = 42;
  var S = SKIES[skyKey || 'day'] || SKIES.day;
  var px = function(a,b,c,d,e){ g.fillStyle = e; g.fillRect(a|0,b|0,c|0,d|0); };
  var hy = 96;
  g.clearRect(0,0,SW,SH);
  px(0, 0, SW, Math.round(hy*0.5), S.bands[0]);
  px(0, Math.round(hy*0.5), SW, Math.round(hy*0.28), S.bands[1]);
  px(0, Math.round(hy*0.78), SW, hy-Math.round(hy*0.78), S.bands[2]);

  if (S.weather === 'dusk'){
    var rr = 7; for (var dy=-rr; dy<=rr; dy++){ var hw3 = Math.round(Math.sqrt(rr*rr-dy*dy));
      px(Math.round(SW*0.3)-hw3, hy-14+dy, hw3*2, 1, S.sun); }
    for (var st=0; st<10; st++) px(Math.round(_r()*SW), Math.round(_r()*hy*0.4), 1, 1, '#e8e2d4');
  }
  if (S.weather === 'shadows'){
    var sr = 5; for (var dy2=-sr; dy2<=sr; dy2++){ var hw4 = Math.round(Math.sqrt(sr*sr-dy2*dy2));
      px(Math.round(SW*0.82)-hw4, Math.round(hy*0.18)+dy2, hw4*2, 1, S.sun); }
  }
  if (S.weather === 'clouds'){
    for (var cI=0; cI<3; cI++){ var cxx = Math.round(_r()*SW*0.9), cy = Math.round(6+_r()*hy*0.3),
      cw = Math.round(16+_r()*14);
      px(cxx, cy, cw, 3, S.cloud); px(cxx+4, cy-3, cw-10, 3, S.cloud); }
  }
  if (S.far) for (var fx=0; fx<SW; fx+=7){ var fh = Math.round(3+_r()*8); px(fx, hy-fh, 7, fh, S.far); }

  var lawnH = 22, sideY = hy+lawnH, sideH = 16;
  px(0, hy, SW, lawnH, S.grass);
  px(0, sideY, SW, sideH, S.side);
  px(0, sideY+sideH, SW, SH-sideY-sideH, S.road);
  px(0, sideY, SW, 1, '#0d1420'); px(0, sideY+sideH, SW, 1, '#0d1420');
  for (var ln=0; ln<SW; ln+=22) px(ln, sideY+sideH+9, 12, 2, '#c7c2b4');

  var gy = hy + 13;
  var sq = cards.map(function(c){ return c.sqft; });
  var lo = Math.min.apply(null, sq), hi = Math.max.apply(null, sq);
  var ROOFS = ['gable','hip','porch','gable'];
  var hs = cards.map(function(c, n){
    var t = hi === lo ? 0.5 : (c.sqft - lo) / (hi - lo);
    var sd = 0, ad = c.address || ('h'+n);
    for (var j=0; j<ad.length; j++) sd = (sd*31 + ad.charCodeAt(j)) >>> 0;
    return { w: Math.round(38 + 24*t), h: Math.round(20 + 12*t),
             roof: ROOFS[sd % ROOFS.length],
             storeys: t > 0.72 ? 2 : 1,
             cond: c.condition === 'Rough' ? 'rough' : null };
  });
  var tw = hs.reduce(function(a,p){ return a + p.w; }, 0);
  var gap = Math.round((SW - tw - 16) / 4), xs = [], x = 8;
  hs.forEach(function(p){ xs.push(x); x += p.w + gap; });

  if (S.weather === 'winter'){
    var tx = xs[1] - Math.round(gap*0.5);
    px(tx, gy-16, 2, 16, S.tree); px(tx-4, gy-13, 4, 1, S.tree); px(tx+2, gy-10, 4, 1, S.tree);
  }
  hs.forEach(function(p, n){
    if (S.weather === 'shadows') px(xs[n]-1, gy+1, p.w+2, 2, S.shadow);
    drawHouseP(g, S, xs[n], gy, p, sold && sold[n]);
    /* the board out front, and the kerb figures the card already counted */
    var sx = xs[n] + 3;
    px(sx+2, gy+4, 1, 7, '#b0a894'); px(sx, gy, 8, 5, '#f8f4e8'); px(sx+1, gy+1, 6, 1, '#a1251e');
    var heads = Math.min(3, cards[n].interest || 0);
    for (var h2=0; h2<heads; h2++){
      var hx = xs[n] + p.w - 10 - h2*6;
      px(hx, sideY+3, 3, 7, '#2a3240'); px(hx, sideY-1, 3, 4, '#c9a07a');
      px(hx-1, sideY+2, 5, 1, '#2a3240');
    }
    var st2 = seenMap && seenMap[n];
    if (bidIdx === n) for (var q=0; q<p.w+gap; q+=3) px(xs[n]+q-4, sideY+sideH+2, 2, 2, '#57a878');
    else if (st2 && (st2.walk || st2.ask)) px(xs[n]-4, sideY+sideH+3, p.w+8, 1, '#8b98ac');
    if (sel === n){
      px(xs[n]-4, sideY+sideH+2, p.w+8, 2, '#a8873a');
      var mcx = xs[n] + Math.round(p.w/2);
      px(mcx-4, sideY+sideH+5, 9, 1, '#a8873a');
      px(mcx-3, sideY+sideH+6, 7, 1, '#a8873a');
      px(mcx-2, sideY+sideH+7, 5, 1, '#a8873a');
      px(mcx-1, sideY+sideH+8, 3, 1, '#a8873a');
    }
  });

  if (S.weather === 'rain'){
    for (var ri=0; ri<70; ri++){ var rx = Math.round(_r()*SW), ry = Math.round(_r()*(sideY-6));
      px(rx, ry, 1, 4, S.streak); px(rx-1, ry+4, 1, 2, S.streak); }
  }
  if (S.weather === 'fog'){
    px(0, gy-30, SW, 3, S.bar); px(0, gy-18, SW, 4, S.bar); px(0, gy-7, SW, 3, S.bar);
  }
  if (S.weather === 'dusk'){
    var lx = Math.round(SW*0.62);
    px(lx, sideY-18, 2, 18, '#1c2430'); px(lx-2, sideY-21, 6, 3, S.sun);
    px(lx-7, sideY+2, 16, 3, S.pool); px(lx-4, sideY+5, 10, 2, S.pool);
  }
}
function currentSky(){

/* ONE DRAWING, TWO CALL SITES. The strip is the street: five footprints on a
   shared groundline at one scale taken from the board itself, so five similar
   houses read as five similar houses and an outlier shows. In play it is also
   the navigation. On the title screen it is just the street — nothing walked,
   nothing current — and it is the reason that screen no longer needs to be a
   separate screen. */
function streetStrip(cards, o){
  const live = !!o.interactive;
  window.__strip = { cards: cards, at: live ? o.at : -1, seen: live ? o.seen : null,
                     bidIdx: live ? o.bidIdx : -1, sky: o.sky || currentSky(),
                     sold: (window.__strip && window.__strip.sold) || null };
  const labels = [];
  for (let i=0;i<5;i++){
    const c = cards[i];
    labels.push('<'+(live?'button':'span')+' class="lot'+(live && i===o.at ? ' on':'')+'"'
      + (live ? ' onclick="jump('+i+')"'+(o.locked?' disabled':'')
                + ' aria-label="house '+(i+1)+', '+c.sqft.toLocaleString()+' square feet, '
                + (c.condition||'').toLowerCase()+'"'+(i===o.at?' aria-current="true"':'')
              : ' aria-hidden="true"')
      + '>'+(i+1)+'</'+(live?'button':'span')+'>');
  }
  return '<div class="street'+(live?'':' still')+'">'
    + '<canvas id="streetcv" width="366" height="170" role="img" aria-label="'
    + esc(SKY_LABEL[o.sky || currentSky()] || 'the street') + '"></canvas>'
    + '<div class="lots">'+labels.join('')+'</div></div>';
}
