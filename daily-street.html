<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Street — Negotiation Inc</title>
<style>
  :root{
  /* ARCADE TOKENS, LOCAL COPY. The build injects the authoritative set (see
     ARCADE in publish.mjs) and its selectors are closer to the content, so it
     wins. These exist so this file opened straight off disk is the same page
     rather than a broken fallback of one — which is what _tvars is for, and
     what it caught the moment the tokens went in. */
  /* --sans is the build's (ARCADE injects it at :root); declared here so this
     file opened straight off disk is the same page rather than a broken
     fallback of one — which is the whole of what _tvars is for. */
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ground:#0d1420; --raise:#141c2b; --edge:#223047; --well:#101825;
  --ink:#e8e2d4; --ink-2:#aeb8c8; --ink-3:#8b98ac;
  --brass:#a8873a; --pays:#3fa06a; --refuses:#d96a5a; --desk:#4881ea;

    --paper:#e9e2d0; --stock:#f6f1e3; --stock-2:#f0e8d4; --stock-3:#eae1cb;
    --carbon:#22201c; --carbon-soft:#4a463d; --carbon-faint:#736e60;   /* was 3.3:1 on the stock — unreadable at 10px */
    --rule:#c9bfa6; --rule-soft:#ded5bd;
    --red:#b3372c; --green:#2f6b46; --amber:#9a6b1f;
    --red-bg:rgba(179,55,44,.1); --green-bg:rgba(47,107,70,.12); --amber-bg:rgba(154,107,31,.1);
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  }
  /* the board is the paper object on that dark; these are the inks solved
     against the DARKEST paper in the set (#d9c8a4) at 4.5:1, so they pass at
     any size on any of the three paper tones rather than on the lightest. */
  .on-paper{--ground:#e9e2d0;--raise:#f6f1e3;--edge:#c9bfa6;--well:#d9c8a4;
    --ink:#22201c;--ink-2:#4a4438;--ink-3:#5a5447;
    --brass:#704e17;--pays:#2a5f3e;--refuses:#a1251e;--desk:#1a50af}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  /* THE GROUND IS DARK AND THE PAPER IS AN OBJECT ON IT. This page used to
     paint a warm radial gradient edge to edge, which is the one thing the
     arcade's ground rule forbids: a paper colour that reaches the browser
     edge reads as a second, older website. The board is already 560px wide
     and centred, so it was always a document — it just had no desk to lie on.
     Now it has one, and the two dark cabinets and this one share a floor. */
  body{background:
      radial-gradient(120% 70% at 50% -10%,#16202f 0%,#0d1420 62%,#080d16 100%);
    color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;min-height:100vh;padding:0 0 50px;-webkit-text-size-adjust:100%}
  /* 732 IS NOT AN ARBITRARY WIDTH. The scene is drawn at 366 pixels across and
     scaled by whole numbers, because a pixel face and a pixel street both
     shimmer at fractional scales and shimmer reads as error in a product whose
     subject is exactness. 732 is exactly 2x. Below that the canvas takes the
     viewport and a phone lands near 1x, which is the closest thing to exact
     that a phone offers. */
  .wrap{max-width:760px;margin:0 auto;padding:0 14px}
  /* THE BOARD IS NOT A DOCUMENT ANY MORE. It used to be one cream sheet with
     the whole game printed on it — the scene, the HUD, the table and the
     buttons, all on paper, which is why Elijah's verdict was that it did not
     look like a game. It looked like a report with a picture in it.

     Now it is a desk in a dark room. The scene takes the full width and is a
     PLACE, which under the arcade's ground rule is the one thing allowed to
     reach an edge. The HUD is a machine on a dark plate. The clipboard is the
     only paper left, it is an OBJECT — finite width, one edge, one shadow —
     and it lies over the kerb rather than under the picture. */
  .board{background:none;border:none;box-shadow:none;margin-top:14px;color:var(--ink)}
  button{font-family:var(--mono);cursor:pointer}
  /* the only way out of this screen, and it was seventeen pixels tall */
  .back{display:block;text-align:center;margin-top:6px;padding:14px 8px;font-family:var(--mono);font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);text-decoration:none}
  .back:hover{color:var(--ink)}

  /* the HUD is a machine and keeps score; the clipboard is a document and
     keeps Fraunces. Same figures, two voices, and the difference between them
     is the difference between a score and a record. */
  .bar{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;
    background:var(--well);border:1px solid var(--edge);border-bottom:none;
    font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-3);font-weight:600}
  /* the HUD is a machine and counts in pixels; the clipboard is a document
     and keeps Fraunces. Same figure, two voices, and the difference is the
     difference between a score and a record. */
  .bar .m{font-family:'Pixelify',var(--sans);font-size:24px;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;color:var(--ink);font-weight:400;text-transform:none}
  .bar .t{font-family:'Pixelify',var(--sans);font-size:24px;color:var(--ink);text-transform:none;font-weight:400}
  .bar .t.warn{color:var(--refuses)}

  /* ══ THE CLIPBOARD ═══════════════════════════════════════════════════════
     Every control in this game now lives on paper, so every press is a press
     on paper: travel and a hard shadow that flattens, never a glow. The board
     overlaps the scene by fourteen pixels and casts onto it, which is the
     whole of what keeps it a thing lying on the street rather than a panel
     underneath a picture of one. */
  .clip{background:var(--stock);border:1px solid var(--rule);
    box-shadow:0 -2px 0 rgba(34,32,28,.14), 0 18px 40px rgba(0,0,0,.6);
    margin:-7px 10px 0;position:relative;z-index:2;color:var(--ink)}
  .clip .coach{margin:0}
  /* the two clips at the top, because a clipboard has them */
  .clip::before,.clip::after{content:'';position:absolute;top:-6px;width:34px;height:7px;
    background:var(--rule);border:1px solid var(--carbon-faint);border-bottom:none}
  .clip::before{left:26px} .clip::after{right:26px}
  @media(max-width:560px){ .clip{margin:-6px 4px 0} .clip::before{left:16px} .clip::after{right:16px} }

  /* ══ PAPER YOU CAN PRESS ═════════════════════════════════════════════════
     Two easings for the whole cabinet: presses use cubic-bezier(.2,.8,.4,1),
     settles use cubic-bezier(.3,1.4,.5,1) with a single 2px overshoot and
     never a bounce. Transform and box-shadow only. Claude Design's control
     spec, and the reason a flat rectangle never felt like a button: nothing
     moved, so nothing was pressed. */
  .btn{transition:transform 70ms cubic-bezier(.2,.8,.4,1),box-shadow 70ms cubic-bezier(.2,.8,.4,1)}
  .btn.go{box-shadow:0 4px 0 rgba(34,32,28,.42)}
  .btn.go:active{transform:translateY(4px);box-shadow:0 0 0 rgba(34,32,28,.42)}
  .btn.ghost{box-shadow:0 3px 0 rgba(34,32,28,.22)}
  .btn.ghost:active{transform:translateY(3px);box-shadow:0 0 0 rgba(34,32,28,.22)}
  .fact{transition:transform 70ms cubic-bezier(.2,.8,.4,1),box-shadow 70ms cubic-bezier(.2,.8,.4,1);
    box-shadow:0 3px 0 rgba(34,32,28,.20)}
  .fact:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 rgba(34,32,28,.2)}
  .estbtn{transition:transform 70ms cubic-bezier(.2,.8,.4,1),box-shadow 70ms cubic-bezier(.2,.8,.4,1);
    box-shadow:0 3px 0 rgba(34,32,28,.20)}
  .estbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 rgba(34,32,28,.2)}
  @media(prefers-reduced-motion:reduce){
    .btn,.fact,.estbtn{transition:none}
    .btn.go:active,.btn.ghost:active,.fact:active,.estbtn:active{transform:none}
  }

  .coach{display:flex;gap:9px;align-items:center;padding:11px 14px;background:var(--carbon);color:var(--stock);font-size:15px;line-height:1.3}
  .coach .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--stock);animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .coach b{color:#fff}
  @media (prefers-reduced-motion:reduce){.coach .dot{animation:none;opacity:1}}

  .hero{padding:40px 20px 24px;text-align:center}
  .hero .mark{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--carbon-faint)}
  .hero h1{font-size:33px;line-height:1.15;margin:14px 0 0;font-weight:400}
  .hero h1 b{font-weight:700}
  .hero .sub{font-size:17px;color:var(--carbon-soft);margin-top:12px}
  .hero .meta{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-faint);margin-top:18px}
  .pane{padding:22px 18px}
  .pane h1{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 4px;font-weight:400;color:var(--carbon-faint)}
  .pane h2{font-size:26px;margin:2px 0 12px;line-height:1.2}
  .lede{font-size:16px;color:var(--carbon-soft);margin-bottom:14px}

  .btn{display:block;width:100%;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--carbon);
    background:var(--carbon);color:var(--stock);padding:15px;margin-top:14px}
  .btn:hover{background:#000}
  .btn.ghost{background:transparent;color:var(--carbon)}
  .btn.ghost:hover{background:var(--carbon);color:var(--stock)}
  .btn.go{background:var(--green);border-color:var(--green);color:#fff;font-size:15px}
  .btn.go:hover{background:#25563a}
  .btn:disabled{opacity:.35;cursor:default}

  .cond{border:2px solid var(--carbon);background:var(--stock-2);padding:14px;margin-top:14px}
  .cond .cn{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
  .cond .cb{font-size:16px;color:var(--carbon-soft)}
  .dossier{border:1px solid var(--rule);background:var(--stock-2);margin-top:14px}
  .dossier .dh{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--rule);color:var(--carbon-faint)}
  .who{padding:9px 12px;border-bottom:1px solid var(--rule-soft)}
  .who:last-child{border-bottom:none}
  .who .n{font-weight:600;font-size:15px}
  .who .t{font-size:14px;color:var(--carbon-soft)}

  /* THE STREET IS THE NAVIGATION AND THE PICTURE AND THE COMPARISON. This was
     five dots and two arrows — a position indicator that told you where you
     were and nothing about where you were going — on a page that contained no
     canvas, no image and no SVG anywhere in it. One drawing replaces all
     three: five houses on one pavement at one scale, sized by their real
     square feet, worn by their real condition. */
  /* the scene is a PLACE and places take the edge — no border, no paper, no
     frame. The lots are the only chrome and they sit on the dark plate. */
  .street{padding:0;background:none;position:relative}
  .street canvas{display:block;width:100%;height:auto;image-rendering:pixelated;
    image-rendering:crisp-edges;border-left:1px solid var(--edge);border-right:1px solid var(--edge)}
  .street .lots{display:flex;background:var(--well);
    border:1px solid var(--edge);border-top:none}
  .street .lots > *{flex:1 1 0;text-align:center;padding:9px 0 17px;
    font-family:'Pixelify',var(--sans);font-size:16px;font-weight:400;
    color:var(--ink-3);background:none;border:none;
    border-right:1px solid var(--edge);cursor:pointer;
    transition:background 90ms cubic-bezier(.2,.8,.4,1),color 90ms cubic-bezier(.2,.8,.4,1)}
  .street .lots > *:last-child{border-right:none}
  .street .lots > *:hover:not(.on):not(:disabled){color:var(--ink);background:var(--raise)}
  .street .lots > *.on{color:var(--ground);background:var(--brass)}
  .street .lots > *:disabled{cursor:default}
  .street.still .lots > *{cursor:default}
  @media(prefers-reduced-motion:reduce){ .street .lots > *{transition:none} }
  .nav:disabled{opacity:.25}

  .house{padding:16px 16px 18px}
  .hname{font-size:25px;font-weight:600;line-height:1.15}
  .hmeta{font-size:15px;color:var(--carbon-soft);margin-top:3px}
  .chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  /* same reason as .mt below: "No other offers" and "Needs a lot" are one
     label each, and a border that breaks across two lines reads as two */
  .chip{display:inline-block;white-space:nowrap;font-size:13px;padding:3px 9px;border:1px solid var(--rule);color:var(--carbon-soft);background:var(--stock-2)}
  .chip.good{border-color:var(--green);color:var(--green);background:var(--green-bg)}
  .chip.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
  .chip.bad{border-color:var(--red);color:var(--red);background:var(--red-bg)}

  /* ── comps: a match table you read at a glance ── */
  .comps{margin-top:15px;border-top:1px solid var(--rule);padding-top:13px}
  .clab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon-faint);margin-bottom:10px}
  .ctab{width:100%;border-collapse:collapse}
  .ctab th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--carbon-faint);
    font-weight:400;text-align:right;padding:0 0 5px}
  .ctab th:first-child{text-align:left}
  .ctab td{padding:8px 0;border-top:1px solid var(--rule-soft);font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .ctab td:first-child{text-align:left;font-family:var(--serif);font-size:15px}
  .ctab tr.you td{border-top:2px solid var(--carbon);font-weight:700;background:var(--stock-3)}
  .ctab tr.you td:first-child{font-weight:700}
  /* "3 bed" and "much smaller" are single labels wearing a border. Without
     nowrap they break mid-chip on a phone and the border draws TWICE — "3" in
     one box and "bed" in a second box on the next line, which reads as two
     facts instead of one and looks broken. inline-block so the padding is
     honoured on the wrapped line too. */
  .mt{display:inline-block;white-space:nowrap;padding:2px 7px;border:1px solid var(--rule);font-size:13px;font-family:var(--mono)}
  .mt.same{border-color:var(--green);color:var(--green);background:var(--green-bg)}
  .mt.near{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
  .mt.off{border-color:var(--red);color:var(--red);background:var(--red-bg)}
  .cnote{font-size:14px;color:var(--carbon-soft);margin-top:10px}
  .cnote b{color:var(--carbon)}

  /* ── free detail ── */
  .more{margin-top:12px;border:1px solid var(--rule);background:var(--stock-2)}
  .more summary{padding:10px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-soft)}
  .more .mb{padding:0 12px 12px;font-size:15px;color:var(--carbon-soft)}
  .more .mb p{margin:8px 0}

  .facts{margin-top:14px;display:grid;gap:8px}
  .fact{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--rule);background:var(--stock-2);
    padding:11px 12px;font-size:15px;text-align:left;width:100%;font-family:var(--serif);color:var(--carbon)}
  .fact:hover:not(:disabled){border-color:var(--carbon);background:var(--stock-3)}
  .fact .c{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-faint);white-space:nowrap}
  .fact.known{background:var(--stock);cursor:default}
  .fact.known .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fact.known.bad .v{color:var(--red)}
  .quote{font-style:italic;color:var(--carbon-soft);font-size:14px;margin-top:3px}
  .joblist{margin-top:6px;font-size:14px;color:var(--carbon-soft)}
  .joblist span{display:inline-block;border:1px solid var(--rule);padding:1px 7px;margin:2px 4px 2px 0;font-family:var(--mono);font-size:12px}

  /* ── deal bar ── */
  .deal{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
  /* ══ THE HEAT SCALE ══════════════════════════════════════════════════════
     The whole product in one bar. Every point on this track is a price, and
     the colour under it is what that price does to you: green while you keep
     money, red past the number where you stop. The boundary is not decoration
     — it is walkAway, the figure the desk itself would print, and it is the
     one number this game exists to teach.

     AND THE BOUNDARY IS FUZZY UNTIL YOU LOOK. You are handed two comparable
     sales that disagree, so the line lives inside a band rather than on a
     pixel, and the band is drawn as a band. Spend a look on what it needs and
     the repair figure resolves and the band tightens under your hand. That is
     the provenance grammar — ENTERED outranks ESTIMATE — rendered as focus,
     and it is the most honest thing in the arcade: the software does not get
     sharper because you paid, it gets sharper because you asked. */
  /* the six below are set by paintHeat at runtime. They are declared here too
     because an undefined var() does not fall back to something close — the
     whole declaration is invalid and the background vanishes, which _tvars
     caught within a minute. The defaults are a neutral bar with no claim in
     it: correct for the half second before the first paint, and correct
     forever for anybody whose JavaScript did not run. */
  .heat{--h1:var(--stock-3);--h2:var(--stock-3);--h3:var(--stock-3);
    --gA:0%;--gB:50%;--gC:100%;
    position:relative;height:14px;margin:14px 0 0;border:1px solid var(--rule);
    background:linear-gradient(90deg,var(--h1) 0%,var(--h1) var(--gA),
      var(--h2) var(--gB),var(--h3) var(--gC),var(--h3) 100%)}
  .heat .band{position:absolute;top:0;bottom:0;
    background:repeating-linear-gradient(45deg,rgba(34,32,28,.30) 0 3px,rgba(34,32,28,0) 3px 6px);
    border-left:1px solid rgba(34,32,28,.30);border-right:1px solid rgba(34,32,28,.30)}
  .heat .line{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--carbon)}
  .heat .askt{position:absolute;top:-6px;width:1px;height:7px;background:var(--carbon-soft)}
  .heat .askl{position:absolute;top:-22px;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--carbon-faint)}
  .deal input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;
    background:none;margin:2px 0 0;display:block}
  .deal input[type=range]:focus{outline:none}
  .deal input[type=range]:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
  .deal input[type=range]::-webkit-slider-runnable-track{height:30px;background:none}
  .deal input[type=range]::-moz-range-track{height:30px;background:none}
  /* the handle is a surveyor's marker, not a dot: a stem that lands ON the
     scale above it, so the thing you are pointing at is unambiguous */
  .deal input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:18px;height:26px;margin-top:2px;cursor:grab;border:1px solid var(--carbon);
    background:linear-gradient(180deg,var(--stock) 0 55%,var(--stock-3) 55% 100%);
    box-shadow:0 1px 0 rgba(0,0,0,.25),inset 0 0 0 1px var(--stock)}
  .deal input[type=range]::-moz-range-thumb{width:18px;height:26px;cursor:grab;border-radius:0;
    border:1px solid var(--carbon);background:var(--stock);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .deal input[type=range]:active::-webkit-slider-thumb{cursor:grabbing;background:var(--stock-2)}
  .dealbar{display:flex;height:44px;border:1px solid var(--carbon);background:var(--stock-3);overflow:hidden}
  .dealbar i{height:100%;transition:width .08s linear}
  .dealbar .pay{background:var(--carbon)} .dealbar .keep{background:var(--green)}
  .dealbar .fix{background:repeating-linear-gradient(45deg,var(--rule) 0 5px,var(--stock-3) 5px 10px)}
  .dealbar .over{background:var(--red)}
  .dealkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:14px}
  .dealkey span{display:flex;align-items:center;gap:6px;color:var(--carbon-soft)}
  .sw{width:13px;height:13px;border:1px solid var(--carbon);flex:none}
  .sw.pay{background:var(--carbon)} .sw.keep{background:var(--green)} .sw.over{background:var(--red)}
  .sw.fix{background:repeating-linear-gradient(45deg,var(--rule) 0 4px,var(--stock-3) 4px 8px)}
  .keepbig{text-align:center;margin-top:14px}
  .keepbig .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--carbon-faint)}
  .keepbig .v{font-family:var(--mono);font-size:36px;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--green)}
  .keepbig .v.bad{color:var(--red)}
  .keepbig .v.est{color:var(--carbon-soft);font-size:26px}
  .heat .askl{top:-15px}
  .keepbig .n{font-size:14px;color:var(--carbon-soft);margin-top:4px}
  input[type=range]{width:100%;accent-color:var(--carbon);margin:16px 0 0}
  .offerrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--carbon-faint);margin-top:2px}
  .offerrow b{color:var(--carbon);font-size:17px}
  .rival{margin-top:12px;font-size:14px;color:var(--carbon-soft);border-left:3px solid var(--rule);padding-left:10px}
  .rival.warn{border-color:var(--amber)} .rival.bad{border-color:var(--red)}
  .stamp{border:2px solid var(--green);color:var(--green);padding:14px;font-family:var(--mono);font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;transform:rotate(-.5deg);text-align:center;background:var(--green-bg);margin:16px 0 0}

  /* ── renovation ── */
  .job{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:start;border:1px solid var(--rule);background:var(--stock-2);
    padding:12px;text-align:left;width:100%;font-family:var(--serif);font-size:16px;color:var(--carbon);margin-bottom:9px}
  .job:hover{border-color:var(--carbon)}
  .job.on{border-color:var(--green);border-width:2px;background:var(--green-bg)}
  .job .box{width:22px;height:22px;border:2px solid var(--carbon);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:15px;line-height:1;background:var(--stock)}
  .job.on .box{background:var(--green);border-color:var(--green);color:#fff}
  .job .lb{font-weight:600}
  .job .nt{font-size:14px;color:var(--carbon-soft);font-style:italic;margin-top:3px}
  .job .money{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
  .job .money .c{display:block;color:var(--carbon)}
  .job .money .a{display:block;font-size:13px;margin-top:2px}
  .job .money .a.up{color:var(--green)} .job .money .a.dn{color:var(--red)}
  .job .money .a.q{color:var(--carbon-faint)}
  .kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);
    padding:1px 5px;margin-left:6px;vertical-align:middle;font-weight:400}
  .kind.k-essential{border-color:var(--green);color:var(--green)}
  .kind.k-cosmetic{border-color:var(--amber);color:var(--amber)}
  .kind.k-vanity{border-color:var(--red);color:var(--red)}
  .estbtn{display:block;width:100%;margin-top:13px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    border:1px dashed var(--carbon);background:transparent;color:var(--carbon);padding:12px}
  .estbtn:hover:not(:disabled){background:var(--stock-3)}
  .estbtn:disabled{opacity:.4;cursor:default}
  .estnote{margin-top:13px;font-size:14px;color:var(--carbon-soft);border-left:3px solid var(--green);padding-left:10px}
  .renotot{border-top:2px solid var(--carbon);background:var(--stock-2);padding:14px;margin-top:4px}
  .renorow{display:flex;justify-content:space-between;font-size:16px;padding:3px 0}
  .renorow .n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .renorow.big{font-size:19px;font-weight:700;border-top:1px solid var(--carbon);margin-top:7px;padding-top:9px}
  .renorow.big .n.up{color:var(--green)} .renorow.big .n.dn{color:var(--red)}

  .rpat{font-family:var(--serif);font-size:13px;letter-spacing:0;text-transform:none;
    color:var(--carbon-soft);margin-top:5px;min-height:17px}
  .sharebtns{display:flex;gap:9px;padding:0 15px}
  .sharebtns .copybtn{flex:1 1 0;margin:0}

  /* ══ THE SHELF ═════════════════════════════════════════════════════════════
     Twelve frames, and the empty ones are the point. Comp Run's register is
     forty slots with thirty-nine empty on the first day, and that wall is why
     anybody opens it again — the pleasure of a collection is the shape of the
     hole in it. Rarity is carried by the frame, not by the picture, because
     the picture is a house and a house is not rare. */
  .shelf{border-top:1px solid var(--rule);background:var(--stock-2);padding:14px 15px 16px}
  .shhead{display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--carbon-faint);font-weight:600;margin-bottom:10px}
  .shgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  @media(max-width:560px){ .shgrid{grid-template-columns:repeat(4,1fr)} }
  .slot{position:relative;overflow:hidden;background:var(--stock);
    border:1px solid var(--rule);cursor:default}
  .slot .dc{display:block;width:100%;height:auto;image-rendering:pixelated}
  .slot .sl{font-family:'Pixelify',var(--sans);font-size:12px;text-align:center;
    padding:3px 0 4px;color:var(--carbon-soft);border-top:1px solid var(--rule-soft)}
  .slot.empty{background:repeating-linear-gradient(45deg,var(--stock-3) 0 4px,var(--stock-2) 4px 8px);
    border-style:dashed;min-height:52px;display:flex;align-items:flex-end}
  .slot.empty .sl{width:100%;border-top:none;color:var(--carbon-faint);opacity:.6}
  .slot.c3{border-color:#5f7048} .slot.c4{border-color:#7d3fa8}
  .slot.c5{border-color:var(--gold,#9d5b0c);border-width:2px}
  .slot.foil::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 47%,rgba(212,164,74,.38) 53%,transparent 68%);
    background-size:260% 100%;animation:sheen 3.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){ .slot.foil::after{animation:none;opacity:.35} }

  /* ══ THE DEED ══════════════════════════════════════════════════════════════
     Comp Run's rarity language, moved across the floor rather than reinvented:
     five tiers, a gold double-border on the rarest, and a slow sheen that
     crosses the top one. What is different here is that the tier is EARNED —
     it is your spread against what the best house on the street actually held,
     so a foil card means you found nearly all the money that was there. */
  .deedwrap{padding:18px 15px 20px;display:flex;justify-content:center;
    border-bottom:1px solid var(--rule);background:var(--stock-2)}
  .dcard{position:relative;overflow:hidden;width:250px;background:var(--stock);
    border:1px solid var(--rule);box-shadow:0 8px 20px rgba(0,0,0,.35);
    animation:dealin .34s cubic-bezier(.3,1.4,.5,1) both}
  @keyframes dealin{from{transform:translateY(10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
  .dcard .dc{display:block;width:100%;height:auto;image-rendering:pixelated;
    border-bottom:1px solid var(--rule)}
  .dbody{padding:11px 13px 13px}
  .dnm{font-size:17px;font-weight:700;line-height:1.15}
  .dmeta{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;
    font-family:var(--sans);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--carbon-faint);font-weight:600}
  .dsp{font-family:'Pixelify',var(--sans);font-size:26px;margin-top:8px;color:var(--green);
    font-variant-numeric:tabular-nums}
  .dpc{font-size:12.5px;color:var(--carbon-soft);margin-top:2px}
  .dcard.c3{border-color:#5f7048} .dcard.c3 .dr{color:#5f7048}
  .dcard.c4{border-color:#7d3fa8;background:linear-gradient(180deg,#f3ecf8,var(--stock))}
  .dcard.c4 .dr{color:#7d3fa8}
  .dcard.c5{border-color:var(--gold,#9d5b0c);border-width:2px;
    background:linear-gradient(180deg,#fbf1d8,var(--stock))}
  .dcard.c5 .dr{color:var(--gold,#9d5b0c);font-weight:700}
  .dcard.foil::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 46%,rgba(212,164,74,.4) 52%,transparent 68%);
    background-size:260% 100%;animation:sheen 3.6s ease-in-out infinite}
  @keyframes sheen{0%{background-position:130% 0}60%,100%{background-position:-40% 0}}
  @media(prefers-reduced-motion:reduce){
    .dcard{animation:none} .dcard.foil::after{animation:none;opacity:.35} }

  /* ══ THE GAP ═══════════════════════════════════════════════════════════════
     Claude Design's verdict from the first pass, finally cashed: the drama is
     not the size of the number, it is the gap between the number you chose and
     the number the engine had all along. That gap was already computed and was
     being printed as a clause in a sentence in the middle of a paragraph. It
     is the largest thing on the screen now, because it is the only thing on
     the screen the player will remember. */
  .gap{padding:20px 15px 18px;text-align:center;border-bottom:1px solid var(--rule);
    background:var(--stock-2)}
  .gap .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--carbon-faint)}
  /* SET IN INK, NOT IN RED — Claude Design's ruling, and it corrects the
     version I shipped an hour earlier. --refuses means the engine declining
     with a reason. Losing an auction is not a refusal, it is a fact, and a
     seller holding out for their floor is a fact about a seller rather than
     the software saying no. Red here would have been the fourth meaning that
     colour has ever carried, which is how a palette stops meaning anything. */
  .gap .v{font-family:var(--serif);font-size:44px;line-height:1.02;font-weight:700;
    font-variant-numeric:tabular-nums;margin-top:5px;color:var(--carbon)}
  .gap.won .v{color:var(--green)}
  .gap .n{font-size:14px;color:var(--carbon-soft);margin-top:7px}
  @media(max-width:420px){ .gap .v{font-size:36px} }
  .rhead{padding:12px 15px;border-bottom:2px solid var(--carbon);background:var(--stock-2);font-family:var(--mono);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .rrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 15px;border-bottom:1px solid var(--rule-soft);align-items:baseline;
    opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s}
  .rrow.in{opacity:1;transform:none}
  .rrow .a{font-size:17px;font-weight:600}
  .rrow .who2{font-size:14px;color:var(--carbon-soft);margin-top:2px}
  .rrow .amt{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .rrow.mine{background:var(--green-bg)} .rrow.lost{background:var(--red-bg)}
  .oops{color:var(--red);font-size:13px;font-style:italic;margin-top:3px}

  .sheet{margin:15px;border:1px solid var(--carbon);background:#fffdf6;box-shadow:2px 3px 0 rgba(0,0,0,.07)}
  .sheet .sh{border-bottom:2px solid var(--carbon);padding:12px 15px;background:var(--stock-2)}
  .sheet .sh .t{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--carbon-faint)}
  .sheet .sh .a{font-size:19px;font-weight:600;margin-top:1px}
  .sl{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 15px;font-size:16px;align-items:baseline}
  .sl .n{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sl.rule{border-top:1px solid var(--carbon);padding-top:10px}
  .sl.sub{color:var(--carbon-soft);font-size:15px} .sl.sub .n{font-size:15px}
  .sl.tot{border-top:2px solid var(--carbon);background:var(--stock-2);padding:14px 15px}
  .sl.tot .l{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .sl.tot .n{font-size:28px;font-weight:700}
  .sl.tot.win .n{color:var(--green)} .sl.tot.lose .n{color:var(--red)}
  .nodeal{padding:18px 15px;text-align:center}
  .nodeal .big{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .nodeal .sm{margin-top:8px;font-size:15px;color:var(--carbon-soft)}
  .streak{margin:0 15px;padding:11px 14px;background:var(--green);color:#fff;text-align:center;font-family:var(--mono);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .said{padding:14px 15px;font-size:16px;font-style:italic;color:var(--carbon-soft);border-top:1px solid var(--rule)}

  /* THE READ — the counterfactual, in dollars.
     The board has always known which house was the play and what it was worth;
     it just never said. A round that ends in "wrong" teaches nothing. A round
     that ends in "the play was the brick one on the corner and it had $19,000
     in it — you found $6,200" teaches the whole trade.
     The gold is deliberate: this money did not pay, it is what was ON THE TABLE.
     Green here would be a lie. */
  .read{margin:15px;border:1px solid var(--carbon);background:var(--stock-2)}
  .read .rh{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    padding:10px 14px;border-bottom:1px solid var(--rule);color:var(--carbon-faint)}
  .read .rb{padding:13px 14px}
  .read .hl{font-size:17px;line-height:1.45}
  .read .hl b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
  .read .left{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-soft);
    display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline}
  .read .left .l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--carbon-faint)}
  .read .left .n{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--amber)}
  .read.perfect .left .n{color:var(--green)}
  .read .note{margin-top:9px;font-size:14px;color:var(--carbon-soft)}

  .grid7{font-family:var(--mono);font-size:25px;line-height:1.4;letter-spacing:.08em;text-align:center;padding:16px;white-space:pre-line}
  .runtot{text-align:center;padding:4px 15px 16px}
  .runtot .big{font-family:var(--mono);font-size:45px;font-variant-numeric:tabular-nums;line-height:1}
  .runtot .big.up{color:var(--green)} .runtot .big.dn{color:var(--red)}
  .runtot .cap{font-size:15px;color:var(--carbon-soft);margin-top:6px}
  .runtot .cap.rl{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule-soft);font-size:14px}
  /* THE STAKE. Stated before you play rather than after you lose it — the
     whole point of money that can go down is that you knew it could. */
  .stake{margin:0 18px 14px;padding:12px 14px;border:1px solid var(--carbon);background:var(--stock-2);
    display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
  .stake .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon-faint)}
  .stake .n{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;grid-row:span 2}
  .stake .s{grid-column:1;font-size:13.5px;color:var(--carbon-soft);line-height:1.45}
  .stake.thin{border-color:var(--amber)} .stake.thin .n{color:var(--amber)}
  .stake.broke{border-color:var(--red)}  .stake.broke .n{color:var(--red)}
  /* and what it did, at the end */
  .bankline{margin:14px 15px 0;padding:12px 14px;border:1px solid var(--carbon);background:var(--stock-2);
    display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
  .bankline .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon-faint)}
  .bankline .n{font-family:var(--mono);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;grid-row:span 2}
  .bankline .s{grid-column:1;font-size:13.5px;color:var(--carbon-soft);line-height:1.45}
  /* the bankroll did not reach the disk. GOLD, not red: nothing was refused
     and nothing is wrong with the deal — the browser will not keep it. */
  .bankline.warn{grid-template-columns:1fr;border-color:var(--gold,#a8873a)}
  .bankline.warn .s{color:var(--gold,#a8873a)}
  .bankline.up .n{color:var(--green)} .bankline.dn .n{color:var(--red)}
  /* ── the sentence under the bankroll needs the whole width on a phone ────
     Both of these boxes put the big number in a column of its own that spans
     two rows, which leaves the explaining sentence in a 55%-wide gutter with
     dead space beside it — three cramped lines against an empty half-box.
     On a phone the number gets its row and the sentence gets the width. */
  @media (max-width:560px){
    .stake .n, .bankline .n{grid-row:auto}
    .stake .s, .bankline .s{grid-column:1 / -1}
  }
  .rec{margin:0 18px 16px;padding:10px 13px;border:1px solid var(--rule);background:var(--stock-2);
    font-size:14px;color:var(--carbon-soft);text-align:center}
  .rec b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--carbon)}
  .rec .done{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--carbon-faint)}
  .ledger{margin:0 15px}
  .lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:14px;align-items:baseline}
  .lrow .g{font-family:var(--mono);font-size:15px;letter-spacing:.05em}
  .lrow .m{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .lrow .m.up{color:var(--green)} .lrow .m.dn{color:var(--red)}
  .legend{margin:13px 15px 0;display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:14px;color:var(--carbon-soft)}
  .legend b{font-style:normal;font-size:16px;margin-right:6px}
  .share{margin:13px 15px 0;background:var(--stock-3);border:1px solid var(--rule);padding:14px;font-family:var(--mono);font-size:14px;white-space:pre-line;line-height:1.6}
  .copybtn{margin:12px 15px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--carbon);
    background:transparent;color:var(--carbon);padding:12px 15px;width:calc(100% - 30px)}
  .copybtn.done{background:var(--green);color:#fff;border-color:var(--green)}
  .filter{padding:15px;font-size:15px;color:var(--carbon-soft);border-top:1px solid var(--rule);margin-top:14px}
  .filter a{color:var(--carbon);text-decoration:none;border-bottom:1px solid var(--carbon);font-family:var(--mono);font-size:12px}
  .foot{text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);margin-top:16px;line-height:1.9}
  .help{margin:0 15px 15px;border:1px solid var(--rule);background:var(--stock-2);font-size:15px}
  .help summary{padding:11px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--carbon-soft)}
  .help .hb{padding:0 12px 12px;color:var(--carbon-soft)}
  .help p{margin:9px 0}
</style>

<style>
/* Fraunces ships its "wonk" letterforms on by default — the single-storey f
   and its friends. They read as a novelty at body sizes and Elijah clipped
   them immediately. WONK 0 keeps the face and drops the party trick. */
@font-face{font-family:'Fraunces';src:url('fonts/fraunces.woff2') format('woff2-variations');
 font-weight:100 900;font-style:normal;font-display:swap;
 font-variation-settings:'WONK' 0}
:root{
 --serif:'Fraunces',Georgia,'Iowan Old Style',serif !important;
 /* NO MONOSPACE ANYWHERE IN THE SOFTWARE. Small letterspaced caps set in a
    monospace face is the single most recognisable "an AI made this" tell on
    the internet right now, and it was on every label we shipped. The eyebrows
    keep their letterspacing; they lose the typewriter. Tabular figures come
    from font-feature-settings instead, which is what they were always for.
    (The arcade keeps its own type. It is a different world on purpose.) */
 --mono:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif !important;
}
.mono,.num,[class*="fig"],[class*="num"]{font-variant-numeric:tabular-nums}
h1,h2,h3,.app h1,.app h2{font-family:var(--serif);font-variation-settings:'WONK' 0}
</style>
<style>
/* AND THE FACE IS JERSEY 10, NOT PIXELIFY, BECAUSE PIXELIFY CANNOT WRITE A 5.
   Claude Design named Pixelify first and Jersey 10 as the licensed alternate.
   Vendored Pixelify, shipped it, and the HUD printed $150,000 as $180,000. I
   assumed synthetic bolding — the face was declared 400-700 and only the 400
   file was shipped — fixed that, and it still read $180,000. So I rendered
   both faces' digits at 24 and 36 side by side, which is the test that should
   have come first: Pixelify's 5 is indistinguishable from its 8 at EVERY size,
   and $58,300 reads as $98,300. In a game whose entire subject is money
   figures that is not a taste problem, it is a defect.

   Jersey 10 was clean where Pixelify was not, and Elijah then said its 2 and 5
   looked squeezed — which was right. Jersey 10 is the condensed cut: the 2's
   diagonal is nearly vertical and the 5's bowl is small, so both survive but
