<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Daily Street — Negotiation Inc</title>
<style>
  :root{
    --paper:#e9e2d0; --stock:#f6f1e3; --stock-2:#f0e8d4; --stock-3:#eae1cb;
    --carbon:#22201c; --carbon-soft:#4a463d; --carbon-faint:#736e60;   /* was 3.3:1 on the stock — unreadable at 10px */
    --rule:#c9bfa6; --rule-soft:#ded5bd;
    --red:#b3372c; --green:#2f6b46; --amber:#9a6b1f;
    --red-bg:rgba(179,55,44,.1); --green-bg:rgba(47,107,70,.12); --amber-bg:rgba(154,107,31,.1);
    --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 1px,transparent 1px 3px),
      radial-gradient(120% 80% at 50% 0%,#efe8d7 0%,var(--paper) 60%,#ded5bf 100%);
    color:var(--carbon);font-family:var(--serif);font-size:16px;line-height:1.5;min-height:100vh;padding:0 0 50px;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  .board{background:var(--stock);border:1px solid var(--rule);box-shadow:2px 3px 0 rgba(0,0,0,.06);margin-top:16px}
  button{font-family:var(--mono);cursor:pointer}
  /* the only way out of this screen, and it was seventeen pixels tall */
  .back{display:block;text-align:center;margin-top:6px;padding:14px 8px;font-family:var(--mono);font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-faint);text-decoration:none}
  .back:hover{color:var(--carbon)}

  .bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rule);
    background:var(--stock-2);font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--carbon-soft)}
  .bar .m{font-size:14px;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--carbon)}
  .bar .t.warn{color:var(--red)}

  .coach{display:flex;gap:9px;align-items:center;padding:11px 14px;background:var(--carbon);color:var(--stock);font-size:15px;line-height:1.3}
  .coach .dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--stock);animation:pulse 1.7s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
  .coach b{color:#fff}
  @media (prefers-reduced-motion:reduce){.coach .dot{animation:none;opacity:1}}

  .hero{padding:40px 20px 24px;text-align:center}
  .hero .mark{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--carbon-faint)}
  .hero h1{font-size:33px;line-height:1.15;margin:14px 0 0;font-weight:400}
  .hero h1 b{font-weight:700}
  .hero .sub{font-size:17px;color:var(--carbon-soft);margin-top:12px}
  .hero .meta{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-faint);margin-top:18px}
  .pane{padding:22px 18px}
  .pane h1{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 4px;font-weight:400;color:var(--carbon-faint)}
  .pane h2{font-size:26px;margin:2px 0 12px;line-height:1.2}
  .lede{font-size:16px;color:var(--carbon-soft);margin-bottom:14px}

  .btn{display:block;width:100%;font-size:13px;letter-spacing:.15em;text-transform:uppercase;border:1px solid var(--carbon);
    background:var(--carbon);color:var(--stock);padding:15px;margin-top:14px}
  .btn:hover{background:#000}
  .btn.ghost{background:transparent;color:var(--carbon)}
  .btn.ghost:hover{background:var(--carbon);color:var(--stock)}
  .btn.go{background:var(--green);border-color:var(--green);color:#fff;font-size:15px}
  .btn.go:hover{background:#25563a}
  .btn:disabled{opacity:.35;cursor:default}

  .cond{border:2px solid var(--carbon);background:var(--stock-2);padding:14px;margin-top:14px}
  .cond .cn{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:4px}
  .cond .cb{font-size:16px;color:var(--carbon-soft)}
  .dossier{border:1px solid var(--rule);background:var(--stock-2);margin-top:14px}
  .dossier .dh{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--rule);color:var(--carbon-faint)}
  .who{padding:9px 12px;border-bottom:1px solid var(--rule-soft)}
  .who:last-child{border-bottom:none}
  .who .n{font-weight:600;font-size:15px}
  .who .t{font-size:14px;color:var(--carbon-soft)}

  .pager{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--rule-soft)}
  .pager .p{width:34px;height:5px;background:var(--rule);border:none;padding:0}
  .pager .p.on{background:var(--carbon)}
  .pager .p.bought{background:var(--green)}
  .pager .p.seen{background:var(--carbon-faint)}
  .nav{background:none;border:none;color:var(--carbon-soft);font-size:19px;padding:0 6px;line-height:1}
  .nav:disabled{opacity:.25}

  .house{padding:16px 16px 18px}
  .hname{font-size:25px;font-weight:600;line-height:1.15}
  .hmeta{font-size:15px;color:var(--carbon-soft);margin-top:3px}
  .chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:13px;padding:3px 9px;border:1px solid var(--rule);color:var(--carbon-soft);background:var(--stock-2)}
  .chip.good{border-color:var(--green);color:var(--green);background:var(--green-bg)}
  .chip.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
  .chip.bad{border-color:var(--red);color:var(--red);background:var(--red-bg)}

  /* ── comps: a match table you read at a glance ── */
  .comps{margin-top:15px;border-top:1px solid var(--rule);padding-top:13px}
  .clab{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon-faint);margin-bottom:10px}
  .ctab{width:100%;border-collapse:collapse}
  .ctab th{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--carbon-faint);
    font-weight:400;text-align:right;padding:0 0 5px}
  .ctab th:first-child{text-align:left}
  .ctab td{padding:8px 0;border-top:1px solid var(--rule-soft);font-size:15px;text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
  .ctab td:first-child{text-align:left;font-family:var(--serif);font-size:15px}
  .ctab tr.you td{border-top:2px solid var(--carbon);font-weight:700;background:var(--stock-3)}
  .ctab tr.you td:first-child{font-weight:700}
  .mt{padding:2px 7px;border:1px solid var(--rule);font-size:13px;font-family:var(--mono)}
  .mt.same{border-color:var(--green);color:var(--green);background:var(--green-bg)}
  .mt.near{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
  .mt.off{border-color:var(--red);color:var(--red);background:var(--red-bg)}
  .cnote{font-size:14px;color:var(--carbon-soft);margin-top:10px}
  .cnote b{color:var(--carbon)}

  /* ── free detail ── */
  .more{margin-top:12px;border:1px solid var(--rule);background:var(--stock-2)}
  .more summary{padding:10px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-soft)}
  .more .mb{padding:0 12px 12px;font-size:15px;color:var(--carbon-soft)}
  .more .mb p{margin:8px 0}

  .facts{margin-top:14px;display:grid;gap:8px}
  .fact{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--rule);background:var(--stock-2);
    padding:11px 12px;font-size:15px;text-align:left;width:100%;font-family:var(--serif);color:var(--carbon)}
  .fact:hover:not(:disabled){border-color:var(--carbon);background:var(--stock-3)}
  .fact .c{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--carbon-faint);white-space:nowrap}
  .fact.known{background:var(--stock);cursor:default}
  .fact.known .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fact.known.bad .v{color:var(--red)}
  .quote{font-style:italic;color:var(--carbon-soft);font-size:14px;margin-top:3px}
  .joblist{margin-top:6px;font-size:14px;color:var(--carbon-soft)}
  .joblist span{display:inline-block;border:1px solid var(--rule);padding:1px 7px;margin:2px 4px 2px 0;font-family:var(--mono);font-size:12px}

  /* ── deal bar ── */
  .deal{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
  .dealbar{display:flex;height:44px;border:1px solid var(--carbon);background:var(--stock-3);overflow:hidden}
  .dealbar i{height:100%;transition:width .08s linear}
  .dealbar .pay{background:var(--carbon)} .dealbar .keep{background:var(--green)}
  .dealbar .fix{background:repeating-linear-gradient(45deg,var(--rule) 0 5px,var(--stock-3) 5px 10px)}
  .dealbar .over{background:var(--red)}
  .dealkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:14px}
  .dealkey span{display:flex;align-items:center;gap:6px;color:var(--carbon-soft)}
  .sw{width:13px;height:13px;border:1px solid var(--carbon);flex:none}
  .sw.pay{background:var(--carbon)} .sw.keep{background:var(--green)} .sw.over{background:var(--red)}
  .sw.fix{background:repeating-linear-gradient(45deg,var(--rule) 0 4px,var(--stock-3) 4px 8px)}
  .keepbig{text-align:center;margin-top:14px}
  .keepbig .k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--carbon-faint)}
  .keepbig .v{font-family:var(--mono);font-size:36px;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--green)}
  .keepbig .v.bad{color:var(--red)}
  .keepbig .n{font-size:14px;color:var(--carbon-soft);margin-top:4px}
  input[type=range]{width:100%;accent-color:var(--carbon);margin:16px 0 0}
  .offerrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--carbon-faint);margin-top:2px}
  .offerrow b{color:var(--carbon);font-size:17px}
  .rival{margin-top:12px;font-size:14px;color:var(--carbon-soft);border-left:3px solid var(--rule);padding-left:10px}
  .rival.warn{border-color:var(--amber)} .rival.bad{border-color:var(--red)}
  .stamp{border:2px solid var(--green);color:var(--green);padding:14px;font-family:var(--mono);font-size:13px;letter-spacing:.1em;
    text-transform:uppercase;transform:rotate(-.5deg);text-align:center;background:var(--green-bg);margin:16px 0 0}

  /* ── renovation ── */
  .job{display:grid;grid-template-columns:26px 1fr auto;gap:11px;align-items:start;border:1px solid var(--rule);background:var(--stock-2);
    padding:12px;text-align:left;width:100%;font-family:var(--serif);font-size:16px;color:var(--carbon);margin-bottom:9px}
  .job:hover{border-color:var(--carbon)}
  .job.on{border-color:var(--green);border-width:2px;background:var(--green-bg)}
  .job .box{width:22px;height:22px;border:2px solid var(--carbon);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:15px;line-height:1;background:var(--stock)}
  .job.on .box{background:var(--green);border-color:var(--green);color:#fff}
  .job .lb{font-weight:600}
  .job .nt{font-size:14px;color:var(--carbon-soft);font-style:italic;margin-top:3px}
  .job .money{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
  .job .money .c{display:block;color:var(--carbon)}
  .job .money .a{display:block;font-size:13px;margin-top:2px}
  .job .money .a.up{color:var(--green)} .job .money .a.dn{color:var(--red)}
  .job .money .a.q{color:var(--carbon-faint)}
  .kind{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--rule);
    padding:1px 5px;margin-left:6px;vertical-align:middle;font-weight:400}
  .kind.k-essential{border-color:var(--green);color:var(--green)}
  .kind.k-cosmetic{border-color:var(--amber);color:var(--amber)}
  .kind.k-vanity{border-color:var(--red);color:var(--red)}
  .estbtn{display:block;width:100%;margin-top:13px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    border:1px dashed var(--carbon);background:transparent;color:var(--carbon);padding:12px}
  .estbtn:hover:not(:disabled){background:var(--stock-3)}
  .estbtn:disabled{opacity:.4;cursor:default}
  .estnote{margin-top:13px;font-size:14px;color:var(--carbon-soft);border-left:3px solid var(--green);padding-left:10px}
  .renotot{border-top:2px solid var(--carbon);background:var(--stock-2);padding:14px;margin-top:4px}
  .renorow{display:flex;justify-content:space-between;font-size:16px;padding:3px 0}
  .renorow .n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .renorow.big{font-size:19px;font-weight:700;border-top:1px solid var(--carbon);margin-top:7px;padding-top:9px}
  .renorow.big .n.up{color:var(--green)} .renorow.big .n.dn{color:var(--red)}

  .rhead{padding:12px 15px;border-bottom:2px solid var(--carbon);background:var(--stock-2);font-family:var(--mono);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase}
  .rrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 15px;border-bottom:1px solid var(--rule-soft);align-items:baseline;
    opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s}
  .rrow.in{opacity:1;transform:none}
  .rrow .a{font-size:17px;font-weight:600}
  .rrow .who2{font-size:14px;color:var(--carbon-soft);margin-top:2px}
  .rrow .amt{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .rrow.mine{background:var(--green-bg)} .rrow.lost{background:var(--red-bg)}
  .oops{color:var(--red);font-size:13px;font-style:italic;margin-top:3px}

  .sheet{margin:15px;border:1px solid var(--carbon);background:#fffdf6;box-shadow:2px 3px 0 rgba(0,0,0,.07)}
  .sheet .sh{border-bottom:2px solid var(--carbon);padding:12px 15px;background:var(--stock-2)}
  .sheet .sh .t{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--carbon-faint)}
  .sheet .sh .a{font-size:19px;font-weight:600;margin-top:1px}
  .sl{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 15px;font-size:16px;align-items:baseline}
  .sl .n{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .sl.rule{border-top:1px solid var(--carbon);padding-top:10px}
  .sl.sub{color:var(--carbon-soft);font-size:15px} .sl.sub .n{font-size:15px}
  .sl.tot{border-top:2px solid var(--carbon);background:var(--stock-2);padding:14px 15px}
  .sl.tot .l{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .sl.tot .n{font-size:28px;font-weight:700}
  .sl.tot.win .n{color:var(--green)} .sl.tot.lose .n{color:var(--red)}
  .nodeal{padding:18px 15px;text-align:center}
  .nodeal .big{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
  .nodeal .sm{margin-top:8px;font-size:15px;color:var(--carbon-soft)}
  .streak{margin:0 15px;padding:11px 14px;background:var(--green);color:#fff;text-align:center;font-family:var(--mono);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .said{padding:14px 15px;font-size:16px;font-style:italic;color:var(--carbon-soft);border-top:1px solid var(--rule)}

  /* THE READ — the counterfactual, in dollars.
     The board has always known which house was the play and what it was worth;
     it just never said. A round that ends in "wrong" teaches nothing. A round
     that ends in "the play was the brick one on the corner and it had $19,000
     in it — you found $6,200" teaches the whole trade.
     The gold is deliberate: this money did not pay, it is what was ON THE TABLE.
     Green here would be a lie. */
  .read{margin:15px;border:1px solid var(--carbon);background:var(--stock-2)}
  .read .rh{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
    padding:10px 14px;border-bottom:1px solid var(--rule);color:var(--carbon-faint)}
  .read .rb{padding:13px 14px}
  .read .hl{font-size:17px;line-height:1.45}
  .read .hl b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
  .read .left{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-soft);
    display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline}
  .read .left .l{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--carbon-faint)}
  .read .left .n{font-family:var(--mono);font-size:26px;font-variant-numeric:tabular-nums;font-weight:700;color:var(--amber)}
  .read.perfect .left .n{color:var(--green)}
  .read .note{margin-top:9px;font-size:14px;color:var(--carbon-soft)}

  .grid7{font-family:var(--mono);font-size:25px;line-height:1.4;letter-spacing:.08em;text-align:center;padding:16px;white-space:pre-line}
  .runtot{text-align:center;padding:4px 15px 16px}
  .runtot .big{font-family:var(--mono);font-size:45px;font-variant-numeric:tabular-nums;line-height:1}
  .runtot .big.up{color:var(--green)} .runtot .big.dn{color:var(--red)}
  .runtot .cap{font-size:15px;color:var(--carbon-soft);margin-top:6px}
  .runtot .cap.rl{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule-soft);font-size:14px}
  /* THE STAKE. Stated before you play rather than after you lose it — the
     whole point of money that can go down is that you knew it could. */
  .stake{margin:0 18px 14px;padding:12px 14px;border:1px solid var(--carbon);background:var(--stock-2);
    display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
  .stake .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon-faint)}
  .stake .n{font-family:var(--mono);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;grid-row:span 2}
  .stake .s{grid-column:1;font-size:13.5px;color:var(--carbon-soft);line-height:1.45}
  .stake.thin{border-color:var(--amber)} .stake.thin .n{color:var(--amber)}
  .stake.broke{border-color:var(--red)}  .stake.broke .n{color:var(--red)}
  /* and what it did, at the end */
  .bankline{margin:14px 15px 0;padding:12px 14px;border:1px solid var(--carbon);background:var(--stock-2);
    display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
  .bankline .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--carbon-faint)}
  .bankline .n{font-family:var(--mono);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;grid-row:span 2}
  .bankline .s{grid-column:1;font-size:13.5px;color:var(--carbon-soft);line-height:1.45}
  .bankline.up .n{color:var(--green)} .bankline.dn .n{color:var(--red)}
  .rec{margin:0 18px 16px;padding:10px 13px;border:1px solid var(--rule);background:var(--stock-2);
    font-size:14px;color:var(--carbon-soft);text-align:center}
  .rec b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--carbon)}
  .rec .done{margin-top:6px;padding-top:6px;border-top:1px solid var(--rule-soft);font-size:13px;color:var(--carbon-faint)}
  .ledger{margin:0 15px}
  .lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:14px;align-items:baseline}
  .lrow .g{font-family:var(--mono);font-size:15px;letter-spacing:.05em}
  .lrow .m{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
  .lrow .m.up{color:var(--green)} .lrow .m.dn{color:var(--red)}
  .legend{margin:13px 15px 0;display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;font-size:14px;color:var(--carbon-soft)}
  .legend b{font-style:normal;font-size:16px;margin-right:6px}
  .share{margin:13px 15px 0;background:var(--stock-3);border:1px solid var(--rule);padding:14px;font-family:var(--mono);font-size:14px;white-space:pre-line;line-height:1.6}
  .copybtn{margin:12px 15px 0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--carbon);
    background:transparent;color:var(--carbon);padding:12px 15px;width:calc(100% - 30px)}

<script>
const B = SRBoard;
const M  = n => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const MP = n => (n > 0 ? '+' : n < 0 ? '−' : '') + M(n);
const clockStr = s => Math.floor(Math.max(0,s)/60) + ':' + String(Math.max(0,Math.ceil(s))%60).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

const TIER_OF = (() => { const m={}; for (const k of Object.keys(B.ASK_SIGNALS)) for (const s of B.ASK_SIGNALS[k]) m[s]=k; return m; })();
const TIER_WORD = { high:'Wants out badly', medium:'Would move for the right number', low:'In no hurry at all' };

let run, board, state, timer;

/* ══ THE BANKROLL ══════════════════════════════════════════════════════════
   One number, three cabinets, and it can go down.

   Until now the arcade had three incompatible currencies and not one of them
   could fall. The Exit Drill had no money at all — it scored in points and
   explained itself in "fit", a unit that exists nowhere in real estate. Daily
   Street handed you $150,000 that evaporated on refresh. Comp Run has a real
   save and offline earnings, but its bank only ever rises. A quiz that costs
   nothing is a quiz; nobody has ever felt they were learning a trade from a
   multiple-choice question with no stake.

   THE THING THE OBVIOUS DESIGN GETS WRONG. "One bankroll shared by all three"
   sounds right and breaks immediately on contact with the code. Comp Run's
   cash starts at $12, grows exponentially up an eight-rung ladder, and is
   RESET TO $12 on every prestige. Daily Street's houses cost $80,000 to
   $260,000. Wire those to the same variable and either Comp Run's first hour
   is trivial or Daily Street is unplayable. They are not the same kind of
   number and pretending otherwise would be the sort of tidy lie this product
   is built to avoid.

   SO: the bankroll is what you have taken OUT of the arcade, not what is in
   play inside it.

     · Daily Street plays WITH it. The street is where the money is at risk,
       because the street is the cabinet whose currency was already real-estate
       money. Win and it is yours; lose and it is gone, permanently.
     · The Exit Drill earns INTO it. A right read pays a finder's fee out of
       the room that exit actually had — you did not buy anything, you read it
       correctly, and reading correctly is worth a fee. Small, fast, capped
       daily. This is the lane you rebuild on after a bad street.
     · Comp Run pays INTO it at a prestige. A prestige is the moment an era's
       work is already being cashed out and reset — the natural seam, and
       taking the conversion there disturbs its balance not at all.

   Each cabinet keeps its own physics. There is still one number to care about.

   NO LOCKOUT. A player who tanks is not shut out: Daily Street already models
   leverage (bid above your capital and you pay points on the borrowed part),
   so a thin bankroll makes every deal more expensive rather than impossible.
   That is both kinder and truer than a velvet rope. The floor is zero — a
   negative bankroll is a number nobody can act on. */

const BANK_KEY   = 'ni.bank.v1';
const START      = 150000;   // what Daily Street always started a run with
const DRILL_DAY_CAP = 12000; // the rebuild lane is a lane, not a printer
const LEDGER_MAX = 40;

/* Comp Run's cash is exponential idle-game currency; its `rep` is the career
   figure that survives a prestige, and `bankable()` hands it a FRACTION —
   about 0.85 for a full climb to the top of an era, less for a quick one.

   So the rate is per unit of that fraction, pinned against the street: a full
   era banks about $42,500, which is a good street's work, and a hurried
   crossing banks proportionally less. An era of Comp Run should be worth
   roughly a good day on the street — neither cabinet should be the obvious
   way to farm the other. */
const REP_TO_CASH = 50000;

const GAMES = ['street', 'drill', 'comprun'];

const num = (v, d = 0) =>
  (typeof v === 'number' && Number.isFinite(v)) ? v : d;
const int = (v, d = 0) => Math.round(num(v, d));
const str = (v, n) => typeof v === 'string' ? v.slice(0, n) : '';

function fresh(){
  return { v:1, cash: START, best: START, low: START, staked: 0, earned: 0,
           ledger: [], runs: { street:0, drill:0, comprun:0 },
           drillDay: '', drillToday: 0, opened: 0 };
}

/* Everything typed on the way in. localStorage is writable by anything that
   ever ran on this origin — including the player with a console open — and a
   bankroll is exactly what somebody would edit. Typing it here does not stop
   a determined cheat (nothing client-side can), but it does stop a corrupt or
   hand-edited value from crashing a cabinet or minting Infinity. */
function clean(d){
  const b = fresh();
  if (!d || typeof d !== 'object') return b;
  b.cash    = Math.max(0, Math.min(1e12, int(d.cash, START)));
  b.best    = Math.max(b.cash, Math.min(1e12, int(d.best, b.cash)));
  b.low     = Math.max(0, Math.min(b.best, int(d.low, b.cash)));
  b.staked  = Math.max(0, Math.min(1e12, int(d.staked, 0)));
  b.earned  = Math.max(0, Math.min(1e12, int(d.earned, 0)));
  b.opened  = Math.max(0, Math.min(1e6,  int(d.opened, 0)));
  b.drillDay   = str(d.drillDay, 10);
  b.drillToday = Math.max(0, Math.min(DRILL_DAY_CAP, int(d.drillToday, 0)));
  if (d.runs && typeof d.runs === 'object')
    for (const g of GAMES) b.runs[g] = Math.max(0, Math.min(1e6, int(d.runs[g], 0)));
  if (Array.isArray(d.ledger))
    b.ledger = d.ledger.slice(-LEDGER_MAX).filter(x => x && typeof x === 'object')
      .map(x => ({ g: GAMES.includes(x.g) ? x.g : 'street',
                   d: int(x.d, 0), t: int(x.t, 0), n: str(x.n, 90) }));
  return b;
}

/* ── the one mutation ──────────────────────────────────────────────────────
   Every change to the money goes through here, so there is exactly one place
   that can move it and exactly one place to read to know what may. Returns a
   NEW bank plus what actually happened — `applied` can differ from `delta`
   when the floor or the daily cap bites, and the caller is told rather than
   quietly given a different number than it asked for. */
function settle(bank, { game, delta, note, day, at }){
  const b = clean(bank);
  const g = GAMES.includes(game) ? game : 'street';
  let d = int(delta, 0);
  let capped = false;

  /* the drill's daily cap. It pays out, so it is the one that could be farmed
     — sixty seconds a go, all night. It stays playable and stops paying. */
  if (g === 'drill' && d > 0){
    const key = str(day, 10);
    if (b.drillDay !== key){ b.drillDay = key; b.drillToday = 0; }
    const room = Math.max(0, DRILL_DAY_CAP - b.drillToday);
    if (d > room){ d = room; capped = true; }
    b.drillToday += d;
  }

  /* the floor. A bankroll below zero is a number nobody can act on. */
  const before = b.cash;
  b.cash = Math.max(0, before + d);
  const applied = b.cash - before;

  if (applied > 0) b.earned += applied; else b.staked += -applied;
  b.best = Math.max(b.best, b.cash);
  b.low  = Math.min(b.low,  b.cash);
  if (applied !== 0 || note)
    b.ledger = [...b.ledger, { g, d: applied, t: int(at, 0), n: str(note, 90) }].slice(-LEDGER_MAX);
  return { bank: b, applied, capped, floored: applied !== d };
}

function noteRun(bank, game){
  const b = clean(bank);
  const g = GAMES.includes(game) ? game : 'street';
  b.runs[g] += 1;
  return b;
}

/* ── what the drill pays ───────────────────────────────────────────────────
   A right read is worth a fee, not a profit: you did not buy the house, you
   said what it was for. So the fee is a slice of the room that exit actually
   had, floored so a thin deal still pays something for being read right and
   capped so one fat deal is not the whole session.

   A wrong read costs. It costs LESS than the fee a right one pays, because
   being wrong on paper is cheap and being wrong with a cheque is not — the
   drill is where you are supposed to be wrong. */
const DRILL_FEE_PC  = 0.03;
const DRILL_FEE_MIN = 250;
const DRILL_FEE_MAX = 3000;
const DRILL_MISS    = 400;

function drillFee(room){
  const r = num(room, 0);
  if (!(r > 0)) return DRILL_FEE_MIN;
  return Math.round(Math.max(DRILL_FEE_MIN, Math.min(DRILL_FEE_MAX, r * DRILL_FEE_PC)) / 50) * 50;
}

/** What a Comp Run prestige is worth banked. `rep` is the run's contribution
 *  to the career figure, which is already what that cabinet counts as an era's
 *  work — so this converts rather than invents. */
function prestigeValue(rep){
  return Math.max(0, Math.round(num(rep, 0) * REP_TO_CASH));
}

/* ── how the number reads ──────────────────────────────────────────────────
   The arcade earns the right to mention the desk only once there is a figure
   worth mentioning. Under that, the line would be a sales pitch attached to
   nothing, which is the kind of thing that makes a person stop trusting a
   page. */
const FUNNEL_AT = 400000;

function standing(bank){
  const b = clean(bank);
  const up = b.cash - START;
  return {
    cash: b.cash, best: b.best, low: b.low, up,
    /* "through the arcade" is gross, not net — it is the honest way to say
       how much of this you have actually handled */
    through: b.earned,
    runs: b.runs.street + b.runs.drill + b.runs.comprun,
    broke: b.cash <= 0,
    thin: b.cash > 0 && b.cash < START * 0.25,
    /* earned the mention: you are up, and you are up by something real */
    funnel: b.cash >= FUNNEL_AT && up > 0,
  };
}

/* ── the only thing that touches disk ──────────────────────────────────────
   Everything above is pure, so it runs under node and is unit-tested. This is
   the browser half, guarded so the tests never reach it. One reader, one
   writer, and no cabinet is allowed its own: three games writing a shared key
   by three different routes is how a shared number stops being shared. */
const BANK = {
  read(){
    if (typeof localStorage === 'undefined') return fresh();
    let raw = null; try { raw = localStorage.getItem(BANK_KEY); } catch(e){ return fresh(); }
    if (!raw) return fresh();
    try { return clean(JSON.parse(raw)); } catch(e){ return fresh(); }
  },
  write(b){
    if (typeof localStorage !== 'undefined')
      try { localStorage.setItem(BANK_KEY, JSON.stringify(b)); } catch(e){}
    return b;
  },
  /** Move the money and persist it. Returns the same shape settle() does, so a
   *  caller can tell the player when the floor or the daily cap bit. */
  move(o){
    const r = settle(this.read(), { at: Date.now(), day: today(), ...o });
    this.write(r.bank);
    return r;
  },
  run(game){ return this.write(noteRun(this.read(), game)); },
  standing(){ return standing(this.read()); },
  /** Opening a cabinet is not a run, but it is worth knowing somebody looked. */
  opened(){ const b = this.read(); b.opened += 1; return this.write(b); },
};
function today(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function money(n){
  const v = Math.round(Math.abs(num(n, 0)));
  return (num(n,0) < 0 ? '−$' : '$') + v.toLocaleString('en-US');
}
function signed(n){
  const v = num(n, 0);
  return (v > 0 ? '+' : v < 0 ? '−' : '') + '$' + Math.round(Math.abs(v)).toLocaleString('en-US');
}


/* ── THE MONEY IS REAL NOW ─────────────────────────────────────────────────
   The street used to hand you $150,000 at the top of every run and take it
   back at the bottom, which meant three good streets and three catastrophic
   ones ended in exactly the same place: nowhere. Now the run is played WITH
   the bankroll. What you make is yours and what you lose is gone.

   The daily rule from the record carries over unchanged and matters more here:
   only the FIRST finish of a day moves the money. You may replay today as
   often as you like — to see the street again, to try the other house — and
   the bankroll watches the first run only. Without that, a bad day is farmed
   away in four minutes and the number stops meaning anything. */
let BANKED = false;          // has this run already moved the money?

/* ── the record ────────────────────────────────────────────────────────────
   This game had no localStorage in it anywhere. You could finish three
   streets, close the tab, and the run had never happened — which is a strange
   thing to do to a game whose whole premise is "come back tomorrow."

   What persists is the RECORD, not the run in progress. A half-played timed
   round restored from disk is a worse experience than starting it again, and
   restoring one would also hand a player a way to stop the clock. So: you may
   replay today as often as you like, and the record keeps the FIRST finish of
   the day. That is the daily-puzzle convention and people already know it. */
const REC_KEY = 'ni.street.v1';
const FRESH_REC = () => ({ v:1, days:{}, streak:0, best:null, bestDay:null, played:0, last:null });
function loadRec(){
  try {
    const r = JSON.parse(localStorage.getItem(REC_KEY) || 'null');
    if (!r || r.v !== 1 || typeof r.days !== 'object' || !r.days) return FRESH_REC();
    return Object.assign(FRESH_REC(), r);
  } catch(e){ return FRESH_REC(); }
}
function saveRec(r){ try { localStorage.setItem(REC_KEY, JSON.stringify(r)); } catch(e){} }
function prevISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(Date.UTC(y, m-1, d) - 86400000);
  return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')+'-'+String(t.getUTCDate()).padStart(2,'0');
}
/* Returns the record as it stood BEFORE today, so the summary can say
   "your best" without today's run silently becoming the thing it beat. */
function recordFinish(iso, capital, bought){
  const r = loadRec();
  if (r.days[iso]) return r;                       // first finish of the day is the one that counts
  r.days[iso] = { capital: Math.round(capital), bought };
  r.played = Object.keys(r.days).length;
  r.streak = r.last === prevISO(iso) ? (r.streak || 0) + 1 : 1;
  r.last = iso;
  if (r.best == null || capital > r.best){ r.best = Math.round(capital); r.bestDay = iso; }
  saveRec(r);
  return r;
}

/* ── lifecycle ─────────────────────────────────────────────────────────── */

function newRun(){
  clearInterval(timer);
  const iso = todayISO();
  /* the opening capital IS what you have. A thin bankroll is not a lockout:
     the street already lets you bid above your cash and charges points on the
     borrowed part, so being poor makes every deal dearer rather than
     impossible — which is both kinder and truer than a velvet rope. */
  const bank = BANK.read();
  BANKED = false;
  run = { iso, plan: B.buildRun(iso), round: 0, capital: bank.cash,
          opening: bank.cash, lines: [], ledger: [], streak: 0, screen: 'hero' };
  board = null; state = null;
  render();
}
function beginRound(){
  const p = run.plan.rounds[run.round];
  board = B.boardForRound(run.iso, new Date().getFullYear(), run.plan, run.round);
  state = { clock:p.clock, timed:p.timed, looksLeft:p.looks, phase:'play', at:0, mode:'browse',
            seen:{}, looks:0, price:0, bid:null, revealed:0, settled:false, result:null, fixed:new Set(), sale:null };
  for (let i=0;i<5;i++) state.seen[i] = { walk:false, ask:false };
  run.screen = 'play';
  clearInterval(timer);
  if (p.timed) timer = setInterval(tick, 1000);
  render();
}
function tick(){
  if (!state || state.phase !== 'play' || !state.timed) return;
  state.clock -= 1;
  if (state.clock <= 0){ state.clock = 0; closeRound(); return; }
  const el = document.getElementById('clk');
  if (el){ el.textContent = clockStr(state.clock); el.className = 't' + (state.clock<=12?' warn':''); }
}

/* ── what the player knows ─────────────────────────────────────────────── */

function read(i){
  const c = board.cards[i], L = board.looks[i], s = state.seen[i];
  const each = L.comps.map(x => x.sale_price / x.sqft);
  const ppsf = each.reduce((a,b)=>a+b,0) / each.length;
  const o = { each, ppsf, value: ppsf * c.sqft, repairs:null, tier:null, factor:null, reservation:null };
  // A range, not a point. Two sales disagree; pretending otherwise is the false
  // precision that makes this feel like homework.
  const lo = Math.min(...each) * c.sqft, hi = Math.max(...each) * c.sqft;
  o.lo = lo; o.hi = hi;
  if (s.walk) o.repairs = (L.walkthrough[0] + L.walkthrough[1]) / 2;
  if (s.ask){ o.tier = TIER_OF[L.ask] || 'medium'; o.factor = B.MOTIVATION_FACTOR[o.tier]; o.reservation = o.value * o.factor; }
  o.walkAway = o.value - (o.repairs != null ? o.repairs : 0);
  o.sure = o.repairs != null;
  return o;
}
function sliderRange(i){
  const c = board.cards[i], r = read(i);
  const hi = Math.max(c.asking * 1.35, r.walkAway * 1.2);
  const lo = Math.min(c.asking * 0.5, hi * 0.4);
  return [Math.round(lo/500)*500, Math.round(hi/500)*500];
}

/* ── coach ─────────────────────────────────────────────────────────────── */

function coach(){
  if (state.phase === 'renovate'){
    if (state.estimated) return 'Tick everything <b>green</b>. Leave the rest.';
    return 'Structural work always pays. Extras never do. <b>Read the note</b> on the cosmetic ones.';
  }
  if (state.phase !== 'play') return null;
  if (state.bid) return 'Offer sealed. <b>Close the street</b> to see how everyone did.';
  if (state.mode === 'offer') return 'Drag the handle. <b>Green is your profit</b> — make it as big as you dare.';
  const s = state.seen[state.at];
  if (state.looksLeft <= 0) return 'No looks left. Pick a house and <b>make your offer</b>.';
  if (!s.walk) return 'The sales tell you what it is worth. Now check <b>what it needs</b>.';
  if (!s.ask)  return 'Find out <b>why they are selling</b> — that is what they will take.';
  return 'You know this one. <b>Make an offer</b>, or arrow across to another house.';
}

/* ── actions ───────────────────────────────────────────────────────────── */

function go(d){ if (state.phase==='play' && state.mode!=='offer'){ state.at=(state.at+d+5)%5; render(); } }
function jump(i){ if (state.phase==='play' && state.mode!=='offer'){ state.at=i; render(); } }
function doLook(kind){
  const i = state.at;
  if (state.phase!=='play' || state.seen[i][kind] || state.looksLeft<=0) return;
  state.seen[i][kind]=true; state.looks++; state.looksLeft--; render();
}
function toOffer(){
  if (state.phase!=='play' || state.bid) return;
  const i=state.at, r=read(i), range=sliderRange(i);
  const anchor = r.reservation != null ? r.reservation : board.cards[i].asking*0.82;
  state.price = Math.max(range[0], Math.min(range[1], Math.round(anchor/500)*500));
  state.mode='offer'; render();
}
function backToBrowse(){ state.mode='browse'; render(); }
function setPrice(v){ state.price=+v; paintDeal(); }
function sealOffer(){
  if (state.phase!=='play' || state.bid) return;
  state.bid={ idx:state.at, amount:state.price }; state.mode='browse'; render();
}

function dealParts(i){
  const r = read(i), p = run.plan.rounds[run.round];
  const borrowed = Math.max(0, state.price - run.capital);
  const points = Math.round(borrowed * p.financeRate);
  return { total:r.value, fix:(r.repairs!=null?r.repairs:0), pay:state.price, keep:r.walkAway-state.price-points, sure:r.sure };
}
function paintDeal(){
  const d = dealParts(state.at), pctOf = v => Math.max(0,(v/d.total)*100);
  const bar = document.getElementById('dealbar');
  if (bar){
    const pay = Math.min(100, pctOf(d.pay));
    bar.innerHTML = d.keep >= 0
      ? '<i class="pay" style="width:'+pay+'%"></i><i class="keep" style="width:'+Math.min(100-pay,pctOf(d.keep))+'%"></i>' +
        '<i class="fix" style="width:'+Math.max(0,100-pay-pctOf(d.keep))+'%"></i>'
      : '<i class="pay" style="width:'+Math.max(0,100-Math.min(40,pctOf(-d.keep)))+'%"></i><i class="over" style="width:'+Math.min(40,pctOf(-d.keep))+'%"></i>';
  }
  const kv=document.getElementById('keepv');
  if (kv){ kv.textContent = d.keep>=0 ? M(d.keep) : '−'+M(-d.keep); kv.className='v'+(d.keep>=0?'':' bad'); }
  const kn=document.getElementById('keepn');
  if (kn) kn.textContent = d.keep>=0 ? (d.sure ? 'if you win it, before the work you choose' : 'but you have not checked what it needs')
                                     : 'you would lose money on this';
  const ov=document.getElementById('offerv'); if (ov) ov.innerHTML='<b>'+M(state.price)+'</b>';
}

/* ── close / resolve / renovate ────────────────────────────────────────── */

function closeRound(){
  if (!state || state.phase!=='play') return;
  clearInterval(timer);
  state.phase='resolve';
  const opened=[];
  for (let i=0;i<5;i++){ const s=state.seen[i]; if (s.walk||s.ask) opened.push(i); }
  const p = run.plan.rounds[run.round];
  state.result = B.scoreRound(board, { opened, bid_index: state.bid?state.bid.idx:null,
    bid_amount: state.bid?state.bid.amount:null, looks: state.looks, capital: run.capital, financeRate: p.financeRate });
  state.revealed=0; render(); revealStep();
}
function revealStep(){
  if (state.revealed >= 5){
    // `settled` makes the reveal rows render already-visible. Without it the
    // next render() rebuilds the DOM, drops every .in class, and the whole
    // resolution silently fades to nothing — which is exactly what it did.
    state.settled = true;
    if (state.result.outcome === 'won'){
      state.phase = 'renovate';
      state.fixed = new Set(); state.estimated = false;
    } else {
      state.phase = 'settle';
      run.streak = 0;
    }
    render(); return;
  }
  const rows = document.querySelectorAll('.rrow');
  if (rows[state.revealed]) rows[state.revealed].classList.add('in');
  state.revealed++;
  setTimeout(revealStep, 340);
}
function buyEstimate(){
  if (state.phase!=='renovate' || state.estimated || state.looksLeft<=0) return;
  state.looksLeft--; state.estimated = true; render();
}
function toggleJob(id){
  if (state.phase!=='renovate') return;
  if (state.fixed.has(id)) state.fixed.delete(id); else state.fixed.add(id);
  render();
}
function finishReno(){
  if (state.phase!=='renovate') return;
  const p = run.plan.rounds[run.round];
  state.sale = B.finishSale(board, state.bid.idx, state.bid.amount, state.fixed, run.capital, p.financeRate);
  state.phase = 'settle';
  run.streak = state.sale.profit > 0 ? run.streak + 1 : 0;
  render();
}
function roundProfit(){ return state.sale ? state.sale.profit : 0; }
function nextRound(){
  const R = state.result, profit = roundProfit();
  run.capital += profit;
  run.lines.push({ grid: R.grid, profit });
  run.ledger.push({ grid: R.grid.join(''), profit, outcome: R.outcome,
                    where: state.bid ? board.cards[state.bid.idx].address : null });
  run.round++;
  if (run.round >= B.ROUNDS){
    /* read the record BEFORE filing today's, so "you beat your best" can
       compare against something today has not already overwritten */
    const before = loadRec();
    run.before = { best: before.best, streak: before.streak, played: before.played,
                   already: !!before.days[run.iso] };
    const firstToday = !before.days[run.iso];
    run.rec = recordFinish(run.iso, run.capital, run.ledger.filter(l=>l.outcome==='won').length);
    /* the money moves ONCE, on the first finish of the day, for the amount the
       three streets actually made or lost */
    if (firstToday && !BANKED){
      BANKED = true;
      const delta = Math.round(run.capital - run.opening);
      const bought = run.ledger.filter(l=>l.outcome==='won').length;
      const r = BANK.move({ game:'street', delta,
        note: delta === 0 ? 'three streets, nothing bought'
            : (delta > 0 ? 'made' : 'lost') + ' it on ' + (bought === 1 ? 'one flip' : bought + ' flips') });
      BANK.run('street');
      run.banked = { delta, applied: r.applied, floored: r.floored, after: r.bank.cash };
    } else {
      run.banked = null;
    }
    run.screen='summary'; clearInterval(timer); render(); return;
  }
  run.screen='card'; render();
}

/* ── render ────────────────────────────────────────────────────────────── */

function render(){
  const el = document.getElementById('board');
  if (run.screen==='hero'){ el.innerHTML=heroHTML(); return; }
  if (run.screen==='card'){ el.innerHTML=cardHTML(); return; }
  if (run.screen==='summary'){ el.innerHTML=summaryHTML(); return; }
  if (state.phase==='play'){ el.innerHTML=playHTML(); if (state.mode==='offer') paintDeal(); return; }
  if (state.phase==='renovate'){ el.innerHTML=renovateHTML(); return; }
  el.innerHTML = resolveHTML();
}

function heroHTML(){
  const r = loadRec();
  /* A returning player should be met by their own history, not by the same
     blank door they saw yesterday. A first-timer sees nothing extra. */
  let bar = '';
  if (r.played > 0){
    const bits = [];
    if (r.streak > 1) bits.push('<b>'+r.streak+'</b> days running');
    bits.push('<b>'+r.played+'</b> street'+(r.played===1?'':'s')+' walked');
    if (r.best != null) bits.push('best finish <b>'+M(r.best)+'</b>');
    bar = '<div class="rec">'+bits.join(' · ')+
      (r.days[todayISO()] ? '<div class="done">Today is already on the board at '+M(r.days[todayISO()].capital)+
        ' — you can play it again, the record keeps the first run.</div>' : '')+'</div>';
  }
  const bk = BANK.standing();
  /* the stake, stated before you play rather than after you lose it */
  const stake = '<div class="stake'+(bk.thin?' thin':'')+(bk.broke?' broke':'')+'">' +
    '<span class="l">You are playing with</span><span class="n">'+M(bk.cash)+'</span>' +
    '<span class="s">'+(bk.broke
      ? 'Nothing. Every house on the street is borrowed money now, and the points come off the top. The drill pays a fee for a right read — that is the way back.'
      : bk.thin
      ? 'Thin. You can still bid above it, but the borrowed part costs you points, so the margins get tight.'
      : 'Three streets. What you make is yours and what you lose is gone.')+'</span></div>';
  return '<div class="hero"><div class="mark">The Daily Street</div>' +
    '<h1>Buy a house for<br>less than it is <b>worth</b>.</h1>' +
    '<div class="sub">Fix what is worth fixing. Keep the difference.</div>' +
    '<div class="meta">3 streets · 3 minutes · new houses every day</div></div>' + stake + bar +
    '<div style="padding:0 18px 20px"><button class="btn go" onclick="beginRound()">'+
    (r.days[todayISO()] ? 'Play again' : 'Play')+'</button>' +
    '<a class="back" href="arcade.html">← the arcade</a></div>' + helpHTML();
}

function statusBar(){
  const p = run.plan.rounds[run.round];
  const timed = state ? state.timed : p.timed;
  return '<div class="bar">' +
    '<span>Street <span class="m">'+(run.round+1)+'/'+B.ROUNDS+'</span></span>' +
    '<span>Cash <span class="m">'+M(run.capital)+'</span></span>' +
    '<span>Looks <span class="m">'+(state?state.looksLeft:p.looks)+'</span></span>' +
    (timed ? '<span class="t" id="clk">'+clockStr(state?state.clock:p.clock)+'</span>' : '<span>no clock</span>') + '</div>';
}

function cardHTML(){
  const p = run.plan.rounds[run.round];
  const last = run.ledger[run.ledger.length-1];
  let recap='';
  if (last){
    const what = last.outcome==='won'
      ? 'You flipped '+esc(last.where)+' for '+(last.profit>=0?'<b>'+MP(last.profit)+'</b>.':'a <b>'+M(-last.profit)+'</b> loss.')
      : last.outcome==='no_bid' ? 'You did not make an offer.'
      : last.outcome==='refused' ? 'The seller would not take your number.' : 'You were outbid.';
    recap = '<div class="lede">'+what+'</div>';
  }
  const firstTime = run.round===1;
  const dossier = firstTime ? '<div class="dossier"><div class="dh">Who else is bidding — the same faces all run</div>' +
    run.plan.cast.map(r=>'<div class="who"><div class="n">'+esc(r.name)+'</div><div class="t">'+esc(r.tell)+'</div></div>').join('')+'</div>' : '';
  const clockNote = firstTime ? '<div class="lede" style="margin-top:14px">From here there is a clock — '+clockStr(p.clock)+' a street.</div>' : '';
  return '<div class="pane"><h1>Street '+(run.round+1)+' of '+B.ROUNDS+'</h1>' +
    '<h2>'+esc(p.modifier.name)+'</h2>'+recap +
    '<div class="cond"><div class="cn">What is different here</div><div class="cb">'+esc(p.modifier.blurb)+'</div></div>' +
    clockNote + dossier +
    '<button class="btn go" onclick="beginRound()">'+(p.timed?'Start the clock':'Walk the street')+'</button></div>' + helpHTML();
}

function helpHTML(){
  return '<details class="help"><summary>How it works</summary><div class="hb">' +
    '<p>Every house shows you <b>what similar homes just sold for</b>. Closer match, better guide. Those sales are public, so they cost nothing.</p>' +
    '<p>What you dig for is <b>what it needs</b> and <b>why they are selling</b>. Each costs a look, and looks are short.</p>' +
    '<p>Make <b>one sealed offer</b>. Other buyers already made theirs. Too little and they take it; too much and there is nothing left.</p>' +
    '<p style="margin-bottom:0">Then you <b>fix it up and sell it</b>. Some jobs pay back more than they cost. Some really do not.</p></div></details>';
}

function condChip(c){
  const cls = c==='Clean'?'good':c==='Rough'?'bad':'';
  return '<span class="chip '+cls+'">'+(c==='Clean'?'Good shape':c==='Rough'?'Needs a lot':'Dated')+'</span>';
}
function heatChip(n){
  const cls = n<=1?'good':n===2?'warn':'bad';
  return '<span class="chip '+cls+'">'+(n===0?'No other offers':n===1?'1 other buyer':n+' other buyers')+'</span>';
}

/**
 * Comps as a match table.
 *
 * The subject's own worth is deliberately NOT printed here. Handing over the
 * answer turns the most valuable habit in the game — looking at what sold and
 * forming a view — into reading a number off a card. What IS given is how well
 * each sale matches on size and bedrooms, colour-coded, so the read is available
 * at a glance without being done for you.
 */
function matchTag(comp, c){
  const d = Math.abs(comp.sqft - c.sqft) / c.sqft;
  if (d <= 0.06) return ['same','same size'];
  if (d <= 0.15) return ['near', comp.sqft > c.sqft ? 'a bit bigger' : 'a bit smaller'];
  return ['off', comp.sqft > c.sqft ? 'much bigger' : 'much smaller'];
}
function compsHTML(i){
  const c = board.cards[i], L = board.looks[i];
  let rows = '';
  for (const x of L.comps){
    const [cls,word] = matchTag(x, c);
    const bedCls = x.beds === c.beds ? 'same' : Math.abs(x.beds - c.beds) === 1 ? 'near' : 'off';
    rows += '<tr><td>'+esc(x.address)+'<div><span class="mt '+cls+'">'+word+'</span> ' +
            '<span class="mt '+bedCls+'">'+x.beds+' bed</span></div></td>' +
            '<td>'+x.sqft.toLocaleString()+'</td><td>'+M(x.sale_price)+'</td></tr>';
  }
  rows += '<tr class="you"><td>This house<div style="font-weight:400"><span class="mt">'+c.beds+' bed</span></div></td>' +
          '<td>'+c.sqft.toLocaleString()+'</td><td>asking '+M(c.asking)+'</td></tr>';
  const anySame = L.comps.some(x => matchTag(x,c)[0]==='same');
  return '<div class="comps"><div class="clab">What just sold nearby</div>' +
    '<table class="ctab"><tr><th>Address</th><th>Sqft</th><th>Sold for</th></tr>'+rows+'</table>' +
    '<div class="cnote">' + (anySame
      ? 'One of these is about the same size as this house. <b>That is your best guide.</b>'
      : 'Neither is quite the same size — scale it up or down in your head and allow yourself some room.') +
    '</div></div>';
}

/** Free colour on the property. Contains real tells, costs nothing to read. */
function detailHTML(i){
  const c = board.cards[i], L = board.looks[i];
  const size = c.sqft > 2200 ? 'It is a big one for the street.' : c.sqft < 1400 ? 'It is on the small side for the street.' : 'It is about average size for the street.';
  const cond = c.condition==='Clean' ? 'From the kerb it shows well — paint is recent and the roofline looks straight.'
    : c.condition==='Rough' ? 'From the kerb it shows badly. Gutter is hanging off one corner and the porch has a lean to it.'
    : 'From the kerb it shows its age. Nothing alarming, nothing recent either.';
  const ppsf = 'Asking works out to ' + M(c.ppsf) + ' a square foot.';
  const crowd = c.interest >= 3 ? 'There have been cars outside all week. Everyone can see this one.'
    : c.interest === 0 ? 'Nobody has been by. It has been sitting.'
    : 'A couple of people have walked it.';
  return '<details class="more"><summary>Take a closer look — free</summary><div class="mb">' +
    '<p>'+size+' '+cond+'</p><p>'+ppsf+' '+crowd+'</p></div></details>';
}

function factsHTML(i){
  const L = board.looks[i], s = state.seen[i], r = read(i), t = board.truth ? board.truth[i] : null;
  const out = state.looksLeft <= 0;
  let h = '<div class="facts">';
  if (s.walk){
    const tags = t ? t.jobs.map(j=>'<span>'+esc(j.label)+'</span>').join('') : '';
    h += '<div class="fact known bad"><span>It needs work<div class="joblist">'+tags+'</div></span><span class="v">−'+M(r.repairs)+'</span></div>';
  } else {
    h += '<button class="fact" onclick="doLook(\'walk\')" '+(out?'disabled':'')+'><span>What does it need?</span><span class="c">'+(out?'no looks':'1 look')+'</span></button>';
  }
  h += s.ask
    ? '<div class="fact known"><span>'+TIER_WORD[r.tier]+'<div class="quote">“'+esc(L.ask)+'”</div></span><span class="v">~'+M(r.reservation)+'</span></div>'
    : '<button class="fact" onclick="doLook(\'ask\')" '+(out?'disabled':'')+'><span>Why are they selling?</span><span class="c">'+(out?'no looks':'1 look')+'</span></button>';
  return h + '</div>';
}

function pagerHTML(){
  let h = '<div class="pager"><button class="nav" onclick="go(-1)" '+(state.mode==='offer'?'disabled':'')+'>◀</button>';
  for (let i=0;i<5;i++){
    const s=state.seen[i];
    const cls = (state.bid&&state.bid.idx===i)?'bought':(i===state.at?'on':(s.walk||s.ask?'seen':''));
    h += '<button class="p '+cls+'" onclick="jump('+i+')" aria-label="house '+(i+1)+'"></button>';
  }
  return h + '<button class="nav" onclick="go(1)" '+(state.mode==='offer'?'disabled':'')+'>▶</button></div>';
}

function browseHTML(){
  const i=state.at, c=board.cards[i], sealed = state.bid && state.bid.idx===i;
  return '<div class="house">' +
    '<div class="hname">'+esc(c.address)+'</div>' +
    '<div class="hmeta">'+c.beds+' bed · '+c.sqft.toLocaleString()+' sqft · asking '+M(c.asking)+'</div>' +
    '<div class="chips">'+condChip(c.condition)+heatChip(c.interest)+'</div>' +
    compsHTML(i) + detailHTML(i) + factsHTML(i) +
    (sealed ? '<div class="stamp">Your offer — '+M(state.bid.amount)+' · sealed</div>'
     : state.bid ? '' : '<button class="btn go" onclick="toOffer()">Make an offer on this one</button>') +
  '</div>';
}

function offerHTML(){
  const i=state.at, c=board.cards[i], range=sliderRange(i), n=c.interest;
  const hint = n===0 ? ['','Nobody else has offered here. Only the seller is in your way.']
    : n===1 ? ['warn','One other buyer is already in, so the seller’s lowest number will not be enough.']
    : ['bad', n+' other buyers are already in. This one goes to whoever leaves the least on the table.'];
  return '<div class="house"><div class="hname">'+esc(c.address)+'</div>' +
    '<div class="hmeta">Your one offer. Sealed until the street closes.</div>' +
    '<div class="deal"><div class="dealbar" id="dealbar"></div>' +
      '<div class="dealkey"><span><i class="sw pay"></i>you pay</span><span><i class="sw keep"></i>you keep</span><span><i class="sw fix"></i>repairs</span></div>' +
      '<div class="keepbig"><div class="k">You keep</div><div class="v" id="keepv"></div><div class="n" id="keepn"></div></div>' +
      '<input type="range" min="'+range[0]+'" max="'+range[1]+'" step="500" value="'+state.price+'" oninput="setPrice(this.value)">' +
      '<div class="offerrow"><span>your offer <span id="offerv"></span></span><span>asking '+M(c.asking)+'</span></div>' +
      '<div class="rival '+hint[0]+'">'+hint[1]+'</div>' +
      '<button class="btn go" onclick="sealOffer()">Seal this offer</button>' +
      '<button class="btn ghost" onclick="backToBrowse()">Back</button></div></div>';
}

function playHTML(){
  let h = statusBar() + '<div class="coach"><span class="dot"></span><span>'+coach()+'</span></div>' + pagerHTML();
  if (state.mode==='offer') return h + offerHTML();
  h += browseHTML();
  return h + '<div style="padding:13px 15px;border-top:1px solid var(--rule);background:var(--stock-2)">' +
    '<button class="btn'+(state.bid?' go':' ghost')+'" style="margin:0" onclick="closeRound()">' +
    (state.bid ? 'Close the street →' : 'Skip this street') + '</button></div>';
}

/* ── the renovation ────────────────────────────────────────────────────── */

function renovateHTML(){
  const i = state.bid.idx, t = board.truth[i], c = board.cards[i];
  let spent = 0;
  for (const j of t.jobs) if (state.fixed.has(j.id)) spent += j.cost;
  const skipped = t.jobs.filter(j => !state.fixed.has(j.id)).reduce((s,j)=>s+j.adds,0);
  const sellFor = t.value_mid - skipped;
  const p = run.plan.rounds[run.round];
  const borrowed = Math.max(0, state.bid.amount + spent - run.capital);
  const points = Math.round(borrowed * p.financeRate);
  const profit = sellFor - state.bid.amount - spent - points;

  const KIND = { essential:'Structural', cosmetic:'Cosmetic', vanity:'Extra' };
  let jobs = '';
  for (const j of t.jobs){
    const on = state.fixed.has(j.id);
    // The payback is a JUDGEMENT, not a quote. Hidden until bought or sold.
    const money = state.estimated
      ? '<span class="c">' + M(j.cost) + '</span><span class="a ' + (j.adds > j.cost ? 'up' : 'dn') + '">adds ' + M(j.adds) + '</span>'
      : '<span class="c">' + M(j.cost) + '</span><span class="a q">adds ?</span>';
    jobs += '<button class="job'+(on?' on':'')+'" onclick="toggleJob(\''+j.id+'\')">' +
      '<span class="box">'+(on?'✓':'')+'</span>' +
      '<span><span class="lb">'+esc(j.label)+' <span class="kind k-'+j.kind+'">'+KIND[j.kind]+'</span></span>' +
      '<span class="nt">'+esc(j.note)+'</span></span>' +
      '<span class="money">'+money+'</span></button>';
  }

  const est = state.estimated
    ? '<div class="estnote">An agent walked it with you and priced the work. Green pays back more than it costs.</div>'
    : '<button class="estbtn" onclick="buyEstimate()" '+(state.looksLeft<=0?'disabled':'')+'>' +
      (state.looksLeft>0
        ? 'Ask an agent what each job is worth — 1 look ('+state.looksLeft+' left)'
        : 'No looks left — go on what you can see') + '</button>';

  return statusBar() + '<div class="coach"><span class="dot"></span><span>'+coach()+'</span></div>' +
    '<div class="house"><div class="hname">You bought '+esc(c.address)+'</div>' +
    '<div class="hmeta">Fix what is worth fixing. Every job costs money and adds to what it sells for — but not always more than it costs.</div>' +
    est + '<div style="margin-top:14px">'+jobs+'</div></div>' +
    '<div class="renotot">' +
      '<div class="renorow"><span>You paid</span><span class="n">−'+M(state.bid.amount)+'</span></div>' +
      '<div class="renorow"><span>The work you picked</span><span class="n">−'+M(spent)+'</span></div>' +
      (points>0 ? '<div class="renorow"><span>Lender’s points</span><span class="n">−'+M(points)+'</span></div>' : '') +
      (state.estimated
        ? '<div class="renorow"><span>It should sell for</span><span class="n">'+M(sellFor)+'</span></div>' +
          '<div class="renorow big"><span>You would clear</span><span class="n '+(profit>=0?'up':'dn')+'">'+MP(profit)+'</span></div>'
        : '<div class="renorow big"><span>Sells for</span><span class="n" style="color:var(--carbon-faint)">you will find out</span></div>') +
    '</div>' +
    '<div style="padding:14px 15px"><button class="btn go" style="margin:0" onclick="finishReno()">Do the work and sell it</button></div>';
}

const ACHE = {
  won:'You did the arithmetic and you held your nerve.',
  outbid:'You read it right. You just would not pay for it.',
  refused:'That was not an offer. That was a wish with a number on it.',
  no_bid:'Three streets. You cannot buy a house on none of them.',
};
const STREAK = ['','','Two in a row.','Three for three. A perfect run.'];

function resolveHTML(){
  const R = state.result;
  let h = statusBar() + '<div class="rhead">Offers opened — '+esc(board.name)+'</div>';
  R.resolutions.forEach(function(res,i){
    const c=board.cards[i], mine=state.bid&&state.bid.idx===i, won=res.winner==='you';
    const t = board.truth ? board.truth[i] : null;
    let who='', oops='';
    if (!res.sold_at) who='Nobody met the seller’s number. Still for sale.';
    else if (won) who='<b>You bought it.</b>';
    else {
      who = esc(res.winner)+' bought it.';
      if (t && res.sold_at > t.walk_away)
        oops = '<div class="oops">They paid '+M(res.sold_at-t.walk_away)+' more than it is worth. That one hurts in the morning.</div>';
    }
    // `settled` keeps these visible for good once the reveal has finished.
    h += '<div class="rrow'+(state.settled?' in':'')+(won?' mine':mine?' lost':'')+'">' +
      '<div><div class="a">'+esc(c.address)+'</div><div class="who2">' +
      (res.offers===1?'1 offer':res.offers+' offers')+' · '+who+'</div>'+oops+'</div>' +
      '<div class="amt">'+(res.sold_at?M(res.sold_at):'—')+'</div></div>';
  });
  if (state.phase!=='settle') return h;
  const streak = run.streak>=2 ? '<div class="streak">'+STREAK[Math.min(run.streak,3)]+'</div>' : '';
  return h + settlementHTML() + theReadHTML() + streak + '<div class="said">'+ACHE[R.outcome]+'</div>' +
    '<div style="padding:14px 15px;border-top:1px solid var(--rule)">' +
    '<button class="btn go" style="margin:0" onclick="nextRound()">' +
    (run.round+1>=B.ROUNDS ? 'See how the run went →' : 'Next street →')+'</button></div>';
}

/* ── the read: what the street was actually worth ──────────────────────────
   scoreRound() has always returned best_index, best_spread and achievable[].
   Nothing rendered them, so every round ended in a verb ("outbid", "refused")
   instead of a number. This is the teaching moment: the same units on both
   sides — room at the buy, walk-away minus what it took to win — so the two
   figures are honestly comparable. Renovation profit is a different quantity
   and lives in the settlement above; it is never mixed in here. */
function theReadHTML(){
  const R = state.result;
  const bi = R.best_index, best = R.best_spread;
  if (bi == null || !(best > 0)) return '';
  const where = esc(board.cards[bi].address);
  const tookIt = state.bid && state.bid.idx === bi && R.outcome === 'won';
  const mine = R.outcome === 'won' ? R.your_spread : 0;
  const left = Math.max(0, best - mine);

  let hl, note;
  if (tookIt){
    hl = 'The play on this street was <b>'+where+'</b>. You took it.';
    note = mine >= best
      ? 'You bought it at or under the price it would have taken. That is the whole job.'
      : 'You had the right house. You paid '+M(best - mine)+' more than it would have taken to win it.';
  } else if (R.outcome === 'won'){
    hl = 'You bought <b>'+esc(board.cards[state.bid.idx].address)+'</b>. The play was <b>'+where+'</b>.';
    note = 'Not a wasted round — you own a house. But the money was on the other one.';
  } else if (R.outcome === 'no_bid'){
    hl = 'The play was <b>'+where+'</b>, and you never made an offer on it.';
    note = R.looks ? 'You looked at '+R.looks+' thing'+(R.looks===1?'':'s')+' and walked. Sometimes right. Not today.'
                   : 'You cannot buy what you did not look at.';
  } else {
    hl = 'The play was <b>'+where+'</b>.';
    note = state.bid && state.bid.idx === bi
      ? 'You were on the right house. You were '+M(R.needed - state.bid.amount)+' short of owning it.'
      : 'You were bidding on a different house.';
  }
  return '<div class="read'+(tookIt && mine >= best ? ' perfect' : '')+'">' +
    '<div class="rh">The read</div><div class="rb">' +
    '<div class="hl">'+hl+'</div>' +
    '<div class="left"><span class="l">'+(left > 0 ? 'Left on the table' : 'Room you captured')+'</span>' +
      '<span class="n">'+M(left > 0 ? left : best)+'</span></div>' +
    '<div class="note">There was '+M(best)+' of room in '+where+' at the price it would have taken to win it'+
      (R.outcome === 'won' ? ', and '+M(mine)+' in the one you bought.' : '.') + ' ' + note + '</div>' +
    '</div></div>';
}

function settlementHTML(){
  const R = state.result;
  if (R.outcome!=='won'){
    const why = R.outcome==='no_bid' ? 'You did not make an offer on this street.'
      : R.outcome==='refused' ? 'You offered '+M(state.bid.amount)+'. The seller would not go below '+M(R.floor)+', and it took '+M(R.needed)+' to actually get it.'
      : 'You offered '+M(state.bid.amount)+'. Someone else offered '+M(R.needed)+'.';
    return '<div class="sheet"><div class="sh"><div class="t">Settlement</div><div class="a">Nothing bought</div></div>' +
      '<div class="nodeal"><div class="big">You go home empty on this street</div><div class="sm">'+why+'</div></div>' +
      '<div class="sl tot"><span class="l">Your cash</span><span class="n">'+M(run.capital)+'</span></div></div>';
  }
  const s = state.sale, i = state.bid.idx;
  const skipped = s.jobs.filter(j => !s.fixed.includes(j.id));
  const win = s.profit >= 0;
  const swingWord = s.swing > 0.005 ? 'The market was kind this month.' : s.swing < -0.005 ? 'The market softened this month.' : '';
  return '<div class="sheet">' +
    '<div class="sh"><div class="t">Settlement</div><div class="a">'+esc(board.cards[i].address)+'</div></div>' +
    '<div class="sl"><span>It sold for</span><span class="n">'+M(s.sold_for)+'</span></div>' +
    (skipped.length ? '<div class="sl sub"><span>You left '+skipped.map(j=>esc(j.label.toLowerCase())).join(', ')+' undone</span><span class="n">−'+M(skipped.reduce((a,j)=>a+j.adds,0))+'</span></div>' : '') +
    (swingWord ? '<div class="sl sub"><span>'+swingWord+'</span><span class="n">'+(s.swing>0?'+':'−')+Math.abs(s.swing*100).toFixed(1)+'%</span></div>' : '') +
    '<div class="sl rule"><span>You paid for it</span><span class="n">−'+M(s.paid)+'</span></div>' +
    '<div class="sl"><span>The work you did</span><span class="n">−'+M(s.spent)+'</span></div>' +
    (s.finance_cost>0 ? '<div class="sl sub"><span>Lender’s points</span><span class="n">−'+M(s.finance_cost)+'</span></div>' : '') +
    '<div class="sl tot '+(win?'win':'lose')+'"><span class="l">'+(win?'You made':'You lost')+'</span><span class="n">'+MP(s.profit)+'</span></div>' +
    '<div class="sl sub"><span>Fixing everything would have paid '+MP(s.profit_if_fix_all)+
      (s.profit >= s.profit_if_perfect ? '. You picked perfectly.' : '. The best possible was '+MP(s.profit_if_perfect)+'.') +
      '</span><span class="n"></span></div>' +
  '</div>';
}

function summaryHTML(){
  const start=run.opening ?? B.START_CAPITAL, end=run.capital, delta=end-start;
  const grid = run.lines.map(l=>l.grid.join('')).join('\n');
  const bought = run.ledger.filter(l=>l.outcome==='won').length;
  const share = B.runShareString(run.plan.number, run.lines, end);
  const ledger = run.ledger.map(l=>'<div class="lrow"><span class="g">'+l.grid+'</span>' +
    '<span>'+(l.outcome==='won'?esc(l.where):l.outcome==='outbid'?'outbid':l.outcome==='refused'?'refused':'no offer')+'</span>' +
    '<span class="m '+(l.profit>0?'up':l.profit<0?'dn':'')+'">'+(l.profit?MP(l.profit):'—')+'</span></div>').join('');
  /* The record line. run.before is the record as it stood before today was
     filed, so "you beat it" is measured against something real. */
  const bf = run.before || {}, rc = run.rec || loadRec();
  let recline = '';
  if (bf.already){
    recline = 'Today was already on the board at '+M(rc.days[run.iso].capital)+'. The record keeps the first run.';
  } else if (bf.best != null && end > bf.best){
    recline = 'Your best finish was '+M(bf.best)+'. This one beats it.';
  } else if (bf.best != null){
    recline = 'Your best finish is still '+M(bf.best)+'.';
  } else {
    recline = 'That is your first street on the board. Come back tomorrow — new houses, same questions.';
  }
  if (rc.streak > 1) recline += ' <b>'+rc.streak+' days running.</b>';

  /* what the money did, said plainly. A run that did not move the bankroll has
     to say so out loud — a player who thinks they just lost $40,000 and did
     not is a player who stops believing the number. */
  let bankline = '';
  if (run.banked){
    const bk = run.banked;
    bankline = '<div class="bankline'+(bk.applied>0?' up':bk.applied<0?' dn':'')+'">' +
      '<span class="l">Your bankroll</span>' +
      '<span class="n">'+M(bk.after)+'</span>' +
      '<span class="s">'+(bk.applied === 0 ? 'Unchanged — you finished level.'
        : (bk.applied>0?'Up ':'Down ')+'<b>'+M(Math.abs(bk.applied))+'</b> on this run, and it is banked.') +
        (bk.floored ? ' You could not lose more than you had.' : '')+'</span></div>';
  } else {
    bankline = '<div class="bankline"><span class="l">Your bankroll</span>' +
      '<span class="n">'+M(BANK.read().cash)+'</span>' +
      '<span class="s">Today is already banked, so this run was for the practice. ' +
        'The first finish of the day is the one that counts.</span></div>';
  }

  return '<div class="rhead">Run '+run.plan.number+' — three streets</div>' +
    '<div class="runtot"><div class="grid7">'+grid+'</div>' +
      '<div class="big '+(delta>0?'up':delta<0?'dn':'')+'">'+M(end)+'</div>' +
      '<div class="cap">Started with '+M(start)+', finished with '+M(end)+' — '+(delta>=0?'up':'down')+
      ' <b>'+M(delta)+'</b> across '+bought+' flip'+(bought===1?'':'s')+'.</div>' +
      '<div class="cap rl">'+recline+'</div></div>' + bankline +
    '<div class="ledger">'+ledger+'</div>' +
    '<div class="legend"><span><b>🟩</b> you bought it</span><span><b>🟥</b> you offered and lost</span>' +
      '<span><b>🟨</b> you looked</span><span><b>⬜</b> you never looked</span></div>' +
    '<div class="share">'+esc(share)+'</div>' +
    '<button class="copybtn" id="cp" onclick="copyShare()">Copy result</button>' +
    '<div class="filter">This is a game. The real version asks the same questions — what is it worth, what does it need, what will they take, who else is bidding — except the houses are real. <a href="#" onclick="return false">Run a real address →</a></div>' +
    '<button class="btn ghost" style="margin:14px 15px;width:calc(100% - 30px)" onclick="newRun()">Play again</button>';
}

function copyShare(){
  const txt = B.runShareString(run.plan.number, run.lines, run.capital);
  const done = () => { const b=document.getElementById('cp'); if(b){ b.textContent='Copied'; b.className='copybtn done'; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
  else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
         try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done(); }
}

newRun();
</script>
</body>
</html>
