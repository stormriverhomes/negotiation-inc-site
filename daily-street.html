/* ── the renovation ────────────────────────────────────────────────────── */

function renovateHTML(){
  const i = state.bid.idx, t = board.truth[i], c = board.cards[i];
  let spent = 0;
  for (const j of t.jobs) if (state.fixed.has(j.id)) spent += j.cost;
  const skipped = t.jobs.filter(j => !state.fixed.has(j.id)).reduce((s,j)=>s+j.adds,0);
  const sellFor = t.value_mid - skipped;
  const p = run.plan.rounds[run.round];
  const borrowed = Math.max(0, state.bid.amount + spent - run.capital);
  const points = Math.round(borrowed * p.financeRate);
  const profit = sellFor - state.bid.amount - spent - points;

  const KIND = { essential:'Structural', cosmetic:'Cosmetic', vanity:'Extra' };
  let jobs = '';
  for (const j of t.jobs){
    const on = state.fixed.has(j.id);
    // The payback is a JUDGEMENT, not a quote. Hidden until bought or sold.
    const money = state.estimated
      ? '<span class="c">' + M(j.cost) + '</span><span class="a ' + (j.adds > j.cost ? 'up' : 'dn') + '">adds ' + M(j.adds) + '</span>'
      : '<span class="c">' + M(j.cost) + '</span><span class="a q">adds ?</span>';
    jobs += '<button class="job'+(on?' on':'')+'" onclick="toggleJob(\''+j.id+'\')">' +
      '<span class="box">'+(on?'✓':'')+'</span>' +
      '<span><span class="lb">'+esc(j.label)+' <span class="kind k-'+j.kind+'">'+KIND[j.kind]+'</span></span>' +
      '<span class="nt">'+esc(j.note)+'</span></span>' +
      '<span class="money">'+money+'</span></button>';
  }

  const est = state.estimated
    ? '<div class="estnote">An agent walked it with you and priced the work. Green pays back more than it costs.</div>'
    : '<button class="estbtn" onclick="buyEstimate()" '+(state.looksLeft<=0?'disabled':'')+'>' +
      (state.looksLeft>0
        ? 'Ask an agent what each job is worth — 1 look ('+state.looksLeft+' left)'
        : 'No looks left — go on what you can see') + '</button>';

  return statusBar() + '<div class="coach"><span class="dot"></span><span>'+coach()+'</span></div>' +
    '<div class="house"><div class="hname">You bought '+esc(c.address)+'</div>' +
    '<div class="hmeta">Fix what is worth fixing. Every job costs money and adds to what it sells for — but not always more than it costs.</div>' +
    est + '<div style="margin-top:14px">'+jobs+'</div></div>' +
    '<div class="renotot">' +
      '<div class="renorow"><span>You paid</span><span class="n">−'+M(state.bid.amount)+'</span></div>' +
      '<div class="renorow"><span>The work you picked</span><span class="n">−'+M(spent)+'</span></div>' +
      (points>0 ? '<div class="renorow"><span>Lender’s points</span><span class="n">−'+M(points)+'</span></div>' : '') +
      (state.estimated
        ? '<div class="renorow"><span>It should sell for</span><span class="n">'+M(sellFor)+'</span></div>' +
          '<div class="renorow big"><span>You would clear</span><span class="n '+(profit>=0?'up':'dn')+'">'+MP(profit)+'</span></div>'
        : '<div class="renorow big"><span>Sells for</span><span class="n" style="color:var(--carbon-faint)">you will find out</span></div>') +
    '</div>' +
    '<div style="padding:14px 15px"><button class="btn go" style="margin:0" onclick="finishReno()">Do the work and sell it</button></div>';
}

const ACHE = {
  won:'You did the arithmetic and you held your nerve.',
  outbid:'You read it right. You just would not pay for it.',
  refused:'That was not an offer. That was a wish with a number on it.',
  no_bid:'Three streets. You cannot buy a house on none of them.',
};
const STREAK = ['','','Two in a row.','Three for three. A perfect run.'];

function resolveHTML(){
  const R = state.result;
  const top = statusBar() + pagerHTML();
  let h = '<div class="rhead">Offers opened — '+esc(board.name)+
    '<div class="rpat" id="rpatter">'+(state.settled?'':patter(board.number||0))+'</div></div>';
  R.resolutions.forEach(function(res,i){
    const c=board.cards[i], mine=state.bid&&state.bid.idx===i, won=res.winner==='you';
    const t = board.truth ? board.truth[i] : null;
    let who='', oops='';
    if (!res.sold_at) who='Nobody met the seller’s number. Still for sale.';
    else if (won) who='<b>You bought it.</b>';
    else {
      who = esc(res.winner)+' bought it.';
      if (t && res.sold_at > t.walk_away)
        oops = '<div class="oops">They paid '+M(res.sold_at-t.walk_away)+' more than it is worth. That one hurts in the morning.</div>';
    }
    // `settled` keeps these visible for good once the reveal has finished.
    h += '<div class="rrow'+(state.settled?' in':'')+(won?' mine':mine?' lost':'')+'">' +
      '<div><div class="a">'+esc(c.address)+'</div><div class="who2">' +
      (res.offers===1?'1 offer':res.offers+' offers')+' · '+who+'</div>'+oops+'</div>' +
      '<div class="amt">'+(res.sold_at?M(res.sold_at):'—')+'</div></div>';
  });
  if (state.phase!=='settle') return top + clip(h);
  h += gapHTML();
  /* the deed is minted once, at the moment the street settles */
  let deed = '';
  if (state.result.outcome === 'won' && state.bid){
    const d = deedFromWin();
    window.__lastDeed = d; saveDeed(d);
    deed = deedHTML(d);
  }
  h += deed;
  const streak = run.streak>=2 ? '<div class="streak">'+STREAK[Math.min(run.streak,3)]+'</div>' : '';
  return top + clip(h + settlementHTML() + theReadHTML() + streak +
    '<div class="said">'+ACHE[R.outcome]+'</div>' +
    '<div style="padding:14px 15px;border-top:1px solid var(--rule)">' +
    '<button class="btn go" style="margin:0" onclick="nextRound()">' +
    (run.round+1>=B.ROUNDS ? 'See how the run went →' : 'Next street →')+'</button></div>');
}

/* THE ONE NUMBER THE PLAYER WILL REMEMBER. Every figure here is scoreRound's
   own: `needed` is price_to_win, the number that would have taken the house,
   and it is the engine's arithmetic rather than a dramatisation of it. A miss
   by nine hundred dollars is a better teacher than any sentence, and it is
   free — we already computed it and were burying it. */
function gapHTML(){
  const R = state.result;
  if (R.outcome === 'won'){
    return '<div class="gap won"><div class="k">You made</div><div class="v">' +
      MP(R.your_spread) + '</div><div class="n">' +
      (R.best_index === (state.bid ? state.bid.idx : -1)
        ? 'and that was the best house on the street'
        : 'the best on this street was ' + MP(R.best_spread)) + '</div></div>';
  }
  if (R.needed != null && state.bid){
    /* THE HEADLINE HAS TO BE THE DISTANCE TO THE THING THE LABEL NAMES. First
       version printed price_to_win under both outcomes, so a refusal said
       "the seller would not take it — $41,000" while the line underneath gave
       their floor as $23,500 away. Two true numbers making one false
       impression is the same failure as a rounded estimate wearing a precise
       figure's clothes. Refused measures to the FLOOR; outbid measures to the
       number that would have won. */
    const short = (R.outcome === 'refused' && R.floor != null)
      ? R.floor - state.bid.amount
      : R.needed - state.bid.amount;
    return '<div class="gap"><div class="k">' +
      (R.outcome === 'refused' ? 'The seller needed another' : 'You were outbid by') +
      '</div><div class="v">' + M(Math.max(0, short)) + '</div><div class="n">' +
      (R.outcome === 'refused'
        ? 'their floor was ' + M(R.floor) + '. You offered ' + M(state.bid.amount) +
          '. It took ' + M(R.needed) + ' to actually get it.'
        : M(R.needed) + ' would have taken it. You offered ' + M(state.bid.amount) + '.') +
      '</div></div>';
  }
  return '<div class="gap"><div class="k">You did not bid</div><div class="v">' +
    MP(R.best_spread) + '</div><div class="n">that is what the best house on this street had in it</div></div>';
}

/* ── the read: what the street was actually worth ──────────────────────────
   scoreRound() has always returned best_index, best_spread and achievable[].
   Nothing rendered them, so every round ended in a verb ("outbid", "refused")
   instead of a number. This is the teaching moment: the same units on both
   sides — room at the buy, walk-away minus what it took to win — so the two
   figures are honestly comparable. Renovation profit is a different quantity
   and lives in the settlement above; it is never mixed in here. */
function theReadHTML(){
  const R = state.result;
  const bi = R.best_index, best = R.best_spread;
  if (bi == null || !(best > 0)) return '';
  const where = esc(board.cards[bi].address);
  const tookIt = state.bid && state.bid.idx === bi && R.outcome === 'won';
  const mine = R.outcome === 'won' ? R.your_spread : 0;
  const left = Math.max(0, best - mine);

  let hl, note;
  if (tookIt){
    hl = 'The play on this street was <b>'+where+'</b>. You took it.';
    note = mine >= best
      ? 'You bought it at or under the price it would have taken. That is the whole job.'
      : 'You had the right house. You paid '+M(best - mine)+' more than it would have taken to win it.';
  } else if (R.outcome === 'won'){
    hl = 'You bought <b>'+esc(board.cards[state.bid.idx].address)+'</b>. The play was <b>'+where+'</b>.';
    note = 'Not a wasted round — you own a house. But the money was on the other one.';
  } else if (R.outcome === 'no_bid'){
    hl = 'The play was <b>'+where+'</b>, and you never made an offer on it.';
    note = R.looks ? 'You looked at '+R.looks+' thing'+(R.looks===1?'':'s')+' and walked. Sometimes right. Not today.'
                   : 'You cannot buy what you did not look at.';
  } else {
    hl = 'The play was <b>'+where+'</b>.';
    note = state.bid && state.bid.idx === bi
      ? 'You were on the right house. You were '+M(R.needed - state.bid.amount)+' short of owning it.'
      : 'You were bidding on a different house.';
  }
  return '<div class="read'+(tookIt && mine >= best ? ' perfect' : '')+'">' +
    '<div class="rh">The read</div><div class="rb">' +
    '<div class="hl">'+hl+'</div>' +
    '<div class="left"><span class="l">'+(left > 0 ? 'Left on the table' : 'Room you captured')+'</span>' +
      '<span class="n">'+M(left > 0 ? left : best)+'</span></div>' +
    '<div class="note">There was '+M(best)+' of room in '+where+' at the price it would have taken to win it'+
      (R.outcome === 'won' ? ', and '+M(mine)+' in the one you bought.' : '.') + ' ' + note + '</div>' +
    '</div></div>';
}

/* ══ THE DEED ══════════════════════════════════════════════════════════════
   THIS CABINET GENERATED FIFTEEN HOUSES A DAY, FOREVER, AND KEPT NOTHING. You
   won one, the run ended, and it was gone — which is a strange thing to do to
   a game whose premise is come back tomorrow.

   Comp Run already solved this and nobody moved the solution across the floor:
   it has five rarity tiers, gold double-borders on the rarest and an animated
   foil sheen on the top two. So the house you actually buy becomes a deed you
   keep — its street, its date, the sky it sold under, the spread you took out
   of it — drawn in the same pixels the street is drawn in.

   AND THE RARITY IS EARNED RATHER THAN ROLLED, which is the part that matters
   and the part a normal collectible game cannot do. scoreRound already returns
   `pct`: your spread against what the BEST house on that street actually held.
   The card is not luck. It is a record of how much of the day's available
   money you were good enough to find, and the foil ones say you found nearly
   all of it. Nothing here is generated to flatter — a bad read makes a common
   card and the card says so. */
var DEED_KEY = 'ni.deeds.v1';
var TIERS = [
  { k:'c2', n:'Common',   at:0  },
  { k:'c3', n:'Uncommon', at:40 },
  { k:'c4', n:'Rare',     at:65 },
  { k:'c5', n:'Foil',     at:85 }
];
function tierOfPct(p){ var t = TIERS[0];
  for (var i=0;i<TIERS.length;i++) if (p >= TIERS[i].at) t = TIERS[i];
  return t; }
function loadDeeds(){
  try { var d = JSON.parse(localStorage.getItem(DEED_KEY) || 'null');
    return (d && d.v === 1 && Array.isArray(d.list)) ? d : { v:1, list:[] }; }
  catch(e){ return { v:1, list:[] }; }
}
function saveDeed(d){
  try { var all = loadDeeds();
    /* one deed per street per day — a replay does not mint a second copy, for
       the same reason a replay does not bank money twice */
    var key = d.iso + ':' + d.round;
    if (all.list.some(function(x){ return x.iso + ':' + x.round === key; })) return;
    all.list.push(d);
    if (all.list.length > 200) all.list = all.list.slice(-200);
    localStorage.setItem(DEED_KEY, JSON.stringify(all));
  } catch(e){}
}
/* the card face: the house you bought, under the sky it sold under */
function drawDeed(cv, d){
  var g = cv.getContext('2d'); if (!g) return;
  g.imageSmoothingEnabled = false;
  var W = 108, H = 74, S = SKIES[d.sky] || SKIES.day;
  var px = function(a,b,c,e,f){ g.fillStyle = f; g.fillRect(a|0,b|0,c|0,e|0); };
  _ss = (d.seed || 7) >>> 0;
  var hy = 40;
  px(0,0,W,20,S.bands[0]); px(0,20,W,10,S.bands[1]); px(0,30,W,hy-30,S.bands[2]);
  if (S.far) for (var fx=0; fx<W; fx+=6) px(fx, hy-Math.round(2+_r()*5), 6, 6, S.far);
  px(0,hy,W,14,S.grass); px(0,hy+14,W,5,S.side); px(0,hy+19,W,H-hy-19,S.road);
  px(0,hy+14,W,1,'#0d1420');
  var hp = { w:Math.round(38+18*(d.size||0.5)), h:Math.round(20+8*(d.size||0.5)),
             roof:d.roof||'gable', storeys:d.storeys||1, cond:d.cond||null };
  /* no SOLD board on the card: the board is how the STREET says a house went,
     and a card in your hand has already said it. At card scale it also draws
     half the width of the house, which is the giveaway that it does not
     belong here. */
  drawHouseP(g, S, Math.round((W-hp.w)/2), hy+9, hp, false);
}
function deedFromWin(){
  var R = state.result, i = state.bid.idx, c = board.cards[i];
  var sq = board.cards.map(function(x){ return x.sqft; });
  var lo = Math.min.apply(null,sq), hi = Math.max.apply(null,sq);
  var sd = 0, ad = c.address || '';
  for (var j=0;j<ad.length;j++) sd = (sd*31 + ad.charCodeAt(j)) >>> 0;
  var ROOFS = ['gable','hip','porch','gable'];
  var t = hi === lo ? 0.5 : (c.sqft - lo)/(hi - lo);
  return { iso: run.iso, round: run.round, n: board.number || 0,
           addr: c.address, sqft: c.sqft, sky: currentSky(),
           spread: R.your_spread, pct: R.pct, tier: tierOfPct(R.pct).k,
           size: t, roof: ROOFS[sd % ROOFS.length], storeys: t > 0.72 ? 2 : 1,
           cond: c.condition === 'Rough' ? 'rough' : null, seed: sd };
}
function deedHTML(d){
  var T = TIERS.filter(function(x){ return x.k === d.tier; })[0] || TIERS[0];
  return '<div class="deedwrap"><div class="dcard ' + d.tier +
    (d.tier === 'c5' ? ' foil' : '') + '">' +
    '<canvas class="dc" width="108" height="74" data-deed="' + d.iso + ':' + d.round + '"></canvas>' +
    '<div class="dbody"><div class="dnm">' + esc(d.addr) + '</div>' +
    '<div class="dmeta"><span>Street Nº ' + d.n + '</span><span class="dr">' + T.n + '</span></div>' +
    '<div class="dsp">' + MP(d.spread) + '</div>' +
    '<div class="dpc">' + d.pct + '% of what the street had in it</div></div></div></div>';
}
function paintDeeds(){
  var list = document.querySelectorAll('canvas.dc');
  var all = loadDeeds().list;
  for (var i=0;i<list.length;i++){
    var key = list[i].getAttribute('data-deed');
    var d = all.filter(function(x){ return x.iso + ':' + x.round === key; })[0];
    if (!d && window.__lastDeed && (window.__lastDeed.iso + ':' + window.__lastDeed.round) === key)
      d = window.__lastDeed;
    if (d) drawDeed(list[i], d);
  }
}

function settlementHTML(){
  const R = state.result;
  if (R.outcome!=='won'){
    const why = R.outcome==='no_bid' ? 'You did not make an offer on this street.'
      : R.outcome==='refused' ? 'You offered '+M(state.bid.amount)+'. The seller would not go below '+M(R.floor)+', and it took '+M(R.needed)+' to actually get it.'
      : 'You offered '+M(state.bid.amount)+'. Someone else offered '+M(R.needed)+'.';
    return '<div class="sheet"><div class="sh"><div class="t">Settlement</div><div class="a">Nothing bought</div></div>' +
      '<div class="nodeal"><div class="big">You go home empty on this street</div><div class="sm">'+why+'</div></div>' +
      '<div class="sl tot"><span class="l">Your cash</span><span class="n">'+M(run.capital)+'</span></div></div>';
  }
  const s = state.sale, i = state.bid.idx;
  const skipped = s.jobs.filter(j => !s.fixed.includes(j.id));
  const win = s.profit >= 0;
  const swingWord = s.swing > 0.005 ? 'The market was kind this month.' : s.swing < -0.005 ? 'The market softened this month.' : '';
  return '<div class="sheet">' +
    '<div class="sh"><div class="t">Settlement</div><div class="a">'+esc(board.cards[i].address)+'</div></div>' +
    '<div class="sl"><span>It sold for</span><span class="n">'+M(s.sold_for)+'</span></div>' +
    (skipped.length ? '<div class="sl sub"><span>You left '+skipped.map(j=>esc(j.label.toLowerCase())).join(', ')+' undone</span><span class="n">−'+M(skipped.reduce((a,j)=>a+j.adds,0))+'</span></div>' : '') +
    (swingWord ? '<div class="sl sub"><span>'+swingWord+'</span><span class="n">'+(s.swing>0?'+':'−')+Math.abs(s.swing*100).toFixed(1)+'%</span></div>' : '') +
    '<div class="sl rule"><span>You paid for it</span><span class="n">−'+M(s.paid)+'</span></div>' +
    '<div class="sl"><span>The work you did</span><span class="n">−'+M(s.spent)+'</span></div>' +
    (s.finance_cost>0 ? '<div class="sl sub"><span>Lender’s points</span><span class="n">−'+M(s.finance_cost)+'</span></div>' : '') +
    '<div class="sl tot '+(win?'win':'lose')+'"><span class="l">'+(win?'You made':'You lost')+'</span><span class="n">'+MP(s.profit)+'</span></div>' +
    '<div class="sl sub"><span>Fixing everything would have paid '+MP(s.profit_if_fix_all)+
      (s.profit >= s.profit_if_perfect ? '. You picked perfectly.' : '. The best possible was '+MP(s.profit_if_perfect)+'.') +
      '</span><span class="n"></span></div>' +
  '</div>';
}

function summaryHTML(){
  const start=run.opening ?? B.START_CAPITAL, end=run.capital, delta=end-start;
  const grid = run.lines.map(l=>l.grid.join('')).join('\n');
  const bought = run.ledger.filter(l=>l.outcome==='won').length;
  const share = B.runShareString(run.plan.number, run.lines, end);
  const ledger = run.ledger.map(l=>'<div class="lrow"><span class="g">'+l.grid+'</span>' +
    '<span>'+(l.outcome==='won'?esc(l.where):l.outcome==='outbid'?'outbid':l.outcome==='refused'?'refused':'no offer')+'</span>' +
    '<span class="m '+(l.profit>0?'up':l.profit<0?'dn':'')+'">'+(l.profit?MP(l.profit):'—')+'</span></div>').join('');
  /* The record line. run.before is the record as it stood before today was
     filed, so "you beat it" is measured against something real. */
  const bf = run.before || {}, rc = run.rec || loadRec();
  let recline = '';
  if (bf.already){
    recline = 'Today was already on the board at '+M(rc.days[run.iso].capital)+'. The record keeps the first run.';
  } else if (bf.best != null && end > bf.best){
    recline = 'Your best finish was '+M(bf.best)+'. This one beats it.';
  } else if (bf.best != null){
    recline = 'Your best finish is still '+M(bf.best)+'.';
  } else {
    recline = 'That is your first street on the board. Come back tomorrow — new houses, same questions.';
  }
  if (rc.streak > 1) recline += ' <b>'+rc.streak+' days running.</b>';

  /* what the money did, said plainly. A run that did not move the bankroll has
     to say so out loud — a player who thinks they just lost $40,000 and did
     not is a player who stops believing the number. */
  let bankline = '';
  if (run.banked){
    const bk = run.banked;
    bankline = '<div class="bankline'+(bk.applied>0?' up':bk.applied<0?' dn':'')+'">' +
      '<span class="l">Your bankroll</span>' +
      '<span class="n">'+M(bk.after)+'</span>' +
      '<span class="s">'+(bk.applied === 0 ? 'Unchanged — you finished level.'
        : (bk.applied>0?'Up ':'Down ')+'<b>'+M(Math.abs(bk.applied))+'</b> on this run'
          + (bk.stored === false ? ', and it did not save.' : ', and it is banked.')) +
        (bk.floored ? ' You could not lose more than you had.' : '')+'</span></div>' +
      /* and if it did not actually reach the disk, the sentence above is a
         claim we cannot make. Saying "it is banked" over a failed write is
         the one thing this panel must never do. */
      (bk.stored === false ? '<div class="bankline warn"><span class="s">' +
        troubleLine(bk.why || 'nostore') + '</span></div>' : '');
  } else {
    bankline = '<div class="bankline"><span class="l">Your bankroll</span>' +
      '<span class="n">'+M(BANK.read().cash)+'</span>' +
      '<span class="s">Today is already banked, so this run was for the practice. ' +
        'The first finish of the day is the one that counts.</span></div>';
  }

  return '<div class="rhead">Run '+run.plan.number+' — three streets</div>' +
    '<div class="runtot"><div class="grid7">'+grid+'</div>' +
      '<div class="big '+(delta>0?'up':delta<0?'dn':'')+'">'+M(end)+'</div>' +
      '<div class="cap">Started with '+M(start)+', finished with '+M(end)+' — '+(delta>=0?'up':'down')+
      ' <b>'+M(delta)+'</b> across '+bought+' flip'+(bought===1?'':'s')+'.</div>' +
      '<div class="cap rl">'+recline+'</div></div>' + bankline +
    '<div class="ledger">'+ledger+'</div>' +
    '<div class="legend"><span><b>🟩</b> you bought it</span><span><b>🟥</b> you offered and lost</span>' +
      '<span><b>🟨</b> you looked</span><span><b>⬜</b> you never looked</span></div>' +
    '<div class="share">'+esc(share)+'</div>' +
    '<div class="sharebtns"><button class="copybtn" id="cp" onclick="copyShare()">Copy result</button>' +
    '<button class="copybtn" id="cardbtn" onclick="shareCard()">Copy the card</button></div>' +
    '<div class="filter">This is a game. The real version asks the same questions — what is it worth, what does it need, what will they take, who else is bidding — except the houses are real. <a href="#" onclick="return false">Run a real address →</a></div>' +
    '<button class="btn ghost" style="margin:14px 15px;width:calc(100% - 30px)" onclick="newRun()">Play again</button>';
}

/* ══ THE CARD ══════════════════════════════════════════════════════════════
   The run already had a share string — the emoji grid, Wordle's trick — and it
   is good and it stays. What it could not do is show anybody what the street
   LOOKED like, and the street is now the reason to look.

   So: 1200x630, one canvas, the arcade's own art. The day's real sky, the
   day's real five silhouettes, the house you took wearing its board. Drawn at
   400x210 and scaled by three, because whole numbers are the only way a pixel
   stays a pixel, and 1200x630 is what every link preview on the internet
   expects.

   TYPE NEVER STANDS ON SKY. Claude Design's first law, and the reason this one
   card survives all six weathers without six separate contrast audits: the
   plate takes the lower band, every figure sits on the plate, and the sky is
   left to be weather. A loss card is the same card — the street as it sold,
   the gap where the spread would be — because a share image that only exists
   when you win is an advertisement, and this is a record. */
function buildShareCard(){
  var cv = document.createElement('canvas');
  cv.width = 1200; cv.height = 630;
  var g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  var scene = document.createElement('canvas'); scene.width = SW; scene.height = SH;
  var last = window.__lastDeed;
  var soldMap = null;
  if (last && typeof last.round === 'number' && run.lines && run.lines.length){
    soldMap = {};
  }
  drawStreet(scene, board.cards, -1, null, -1, (window.__strip && window.__strip.sold) || null, currentSky());
  /* the scene fills the top; 1200/366 is not whole, so it is drawn at 3x from
     a 400-wide crop of the same street rather than stretched */
  g.fillStyle = '#0d1420'; g.fillRect(0,0,1200,630);
  g.drawImage(scene, 0, 8, SW, 132, 0, 96, 1200, Math.round(132 * (1200/SW)));
  var plateY = 630 - 168;
  g.fillStyle = '#0d1420'; g.fillRect(0, plateY, 1200, 168);
  g.fillStyle = '#223047'; g.fillRect(0, plateY, 1200, 2);

  var end = run.capital, start = run.opening != null ? run.opening : B.START_CAPITAL;
  var delta = end - start, up = delta >= 0;
  var pill = function(t, x, y, s, col){ g.fillStyle = col; g.font = s; g.textBaseline = 'alphabetic';
    g.fillText(t, x, y); return g.measureText(t).width; };
  var SANS = '-apple-system, "Segoe UI", Roboto, sans-serif';

  /* AND I BROKE THE LAW THREE LINES AFTER WRITING IT. The first version set
     the title straight onto the sky, where it was invisible on a clear morning
     and would have been worse in fog. Type never stands on sky — so the header
     gets its own plate, exactly like the footer, and the card now survives all
     six weathers for the reason the law says it will. */
  g.fillStyle = '#0d1420'; g.fillRect(0, 0, 1200, 96);
  g.fillStyle = '#223047'; g.fillRect(0, 94, 1200, 2);
  g.textAlign = 'left';
  pill('THE DAILY STREET', 60, 60, '600 20px ' + SANS, '#8b98ac');
  g.textAlign = 'right';
  pill('No. ' + (board.number || run.plan.number || 0), 1140, 64, '400 34px Jersey, ' + SANS, '#e8e2d4');

  g.textAlign = 'left';
  pill(up ? 'TOOK HOME' : 'WENT HOME DOWN', 60, plateY + 52, '600 20px ' + SANS, '#8b98ac');
  pill((up ? '+' : '−') + '$' + Math.abs(delta).toLocaleString('en-US'),
       60, plateY + 118, '400 76px Jersey, ' + SANS, up ? '#57a878' : '#e8e2d4');

  g.textAlign = 'right';
  var deeds = loadDeeds().list, foils = deeds.filter(function(d){ return d.tier === 'c5'; }).length;
  pill(deeds.length + ' deed' + (deeds.length === 1 ? '' : 's') + (foils ? ' · ' + foils + ' foil' : ''),
       1140, plateY + 52, '400 24px ' + SANS, '#aeb8c8');
  pill('negotiationinc.com · a new street tomorrow', 1140, plateY + 118, '400 24px ' + SANS, '#8b98ac');
  return cv;
}
function shareCard(){
  var btn = document.getElementById('cardbtn');
  var say = function(t, cls){ if (btn){ btn.textContent = t; btn.className = 'copybtn' + (cls||''); } };
  var cv;
  try { cv = buildShareCard(); } catch(e){ say('Could not draw it'); return; }
  cv.toBlob(function(blob){
    if (!blob) return say('Could not draw it');
    /* clipboard first — one tap into a post is the whole point. Safari and
       Firefox refuse image writes, so the download is not a fallback for
       failure, it is the other half of the feature. */
    var done = function(){ say('Copied ✓', ' done'); };
    var save = function(){
      try {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'daily-street-' + (board.number || 0) + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
        say('Saved ✓', ' done');
      } catch(e){ say('Could not save it'); }
    };
    if (navigator.clipboard && window.ClipboardItem){
      try {
        navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(done, save);
        return;
      } catch(e){}
    }
    save();
  }, 'image/png');
}

function copyShare(){
  const txt = B.runShareString(run.plan.number, run.lines, run.capital);
  const done = () => { const b=document.getElementById('cp'); if(b){ b.textContent='Copied'; b.className='copybtn done'; } };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
  else { const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
         try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta); done(); }
}

newRun();
</script>
